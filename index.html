<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쏘플파티룸 운영 대시보드</title>
<meta name="description" content="쏘플파티룸 백엔드·대시보드 구축 기획서 Ver 1.1 구현 — 130개 지점 운영 관제">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ============================================================
   SSOPLE Dashboard — style.css
   배경: 연한 무채색(#F6F5F3) · 카드: 흰색 · 포인트: 브랜드 레드 #E83217
   버튼 radius 12 · 카드 radius 16 · 숫자는 전부 tabular-nums
   ============================================================ */
:root{
  --paper:#F6F5F3; --paper2:#EFEDEA; --card:#FFFFFF;
  --ink:#221D1A; --sub:#6B6560; --line:#E7E3DF;
  --red:#E83217; --red-deep:#B92408; --red-soft:#FDECE7;
  --ok:#157A45; --ok-soft:#E9F4EE;
  --warn:#C2410C; --warn-soft:#FBEADF;
  --hold:#8A857F;
  --r-btn:12px; --r-card:16px;
  --shadow:0 1px 2px rgba(34,29,26,.05), 0 8px 24px -18px rgba(34,29,26,.25);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.mono,.num{font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.mono{font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Malgun Gothic",monospace; font-size:.92em}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
input,select,textarea{
  font:inherit; color:var(--ink); background:#fff;
  border:1px solid var(--line); border-radius:10px; padding:8px 10px;
}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{
  outline:2px solid var(--red); outline-offset:2px; border-radius:10px;
}
textarea{width:100%; resize:vertical}
a{color:inherit; text-decoration:none}
h1,h2,h3,h4{margin:0; font-weight:700; letter-spacing:-.02em}
.sub{color:var(--sub); font-size:12.5px}
.center{text-align:center}
.grow{flex:1}
.gap{display:inline-flex; gap:6px}
.full{grid-column:1/-1}

/* ── 상단바 ── */
.wrap-w{max-width:1240px; margin:0 auto; padding:0 20px}
.topbar{position:sticky; top:0; z-index:40; background:#fff; border-bottom:1px solid var(--line)}
.ident{display:flex; align-items:center; gap:14px; height:56px}
.logo{font-size:15px; letter-spacing:-.01em; white-space:nowrap}
.logo b{color:var(--red); font-weight:800; letter-spacing:.04em}
.nav{display:flex; gap:2px; overflow-x:auto}
.nav-b{padding:8px 12px; border-radius:var(--r-btn); font-weight:600; color:var(--sub); white-space:nowrap}
.nav-b:hover{background:var(--paper)}
.nav-b.on{color:var(--red-deep); background:var(--red-soft)}
.sel{border-radius:var(--r-btn); padding:7px 10px; max-width:220px; font-size:13px}
.asof{color:var(--sub); font-size:12px; white-space:nowrap}

/* ── 시그니처: 데이터 출처 레일 (12.3 source) ── */
.rail{background:#FFFDFC; border-bottom:1px solid var(--line)}
.rail-in{display:flex; align-items:center; gap:18px; height:34px; font-size:12px; color:var(--sub); overflow-x:auto; white-space:nowrap}
.src{display:inline-flex; align-items:center; gap:8px}
.dot-sep{width:3px; height:3px; border-radius:50%; background:var(--line); display:inline-block}
.rail-item{display:inline-flex; align-items:center; gap:8px}
.stage-mini{display:inline-flex; gap:3px}
.stage-mini .sd{width:7px; height:7px; border-radius:50%; background:var(--line); display:inline-block}
.stage-mini .sd.done{background:#C9C4BF}
.stage-mini .sd.now{background:var(--red)}
.sigbtn{padding:3px 10px; border-radius:999px; border:1px solid var(--line); font-weight:600}
.sigbtn.hot{background:var(--red-soft); border-color:var(--red); color:var(--red-deep)}
.sigbtn.hot::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--red); display:inline-block; margin-right:6px}

/* ── 본문 ── */
.wrap{padding:22px 20px 40px}
.view{display:flex; flex-direction:column; gap:16px}
.page-head h1{font-size:21px}
.page-head .sub{margin:4px 0 0}
.foot{border-top:1px solid var(--line); margin-top:30px; padding:14px 20px 26px;
  display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--sub)}

/* ── 아침 루틴 스트립 (16.1 — 순서가 실제 절차) ── */
.routine{display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  background:#fff; border:1px solid var(--line); border-radius:var(--r-card); padding:10px 14px}
.r-step{display:inline-flex; align-items:center; gap:7px; padding:5px 11px 5px 6px;
  border-radius:999px; font-size:12.5px; font-weight:600; color:var(--sub)}
.r-step:hover{background:var(--paper)}
.r-step b{width:19px; height:19px; border-radius:50%; background:var(--red); color:#fff;
  display:inline-flex; align-items:center; justify-content:center; font-size:11px}
.r-cap{margin-left:auto; font-size:12px; color:var(--sub)}

/* ── KPI ── */
.kpi-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:10px}
.kpi-grid.four{grid-template-columns:repeat(4,1fr)}
.kpi{background:var(--card); border:1px solid var(--line); border-radius:var(--r-card);
  padding:14px 16px; text-align:left; display:flex; flex-direction:column; gap:4px;
  box-shadow:var(--shadow); transition:border-color .15s, transform .15s}
.kpi:not(:disabled):hover{border-color:var(--red); transform:translateY(-1px)}
.kpi:disabled{cursor:default}
.k-label{font-size:12px; color:var(--sub); font-weight:600}
.k-val{font-size:21px; letter-spacing:-.02em}
.k-sub{font-size:11.5px; color:var(--sub)}

/* ── 카드 ── */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-card);
  padding:16px 18px; box-shadow:var(--shadow)}
.card.wide{overflow-x:auto}
.card.filter{padding:12px 14px}
.card.table-card{padding:6px 6px 10px; overflow-x:auto}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start}
.sec-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:10px}
.sec-head h2{font-size:15px}
.sec-head .sub{margin-top:2px}

/* ── 처리할 일 ── */
.task-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.task{width:100%; display:flex; align-items:center; gap:12px; padding:10px 6px;
  border-radius:10px; text-align:left}
.task:hover{background:var(--paper)}
.task + .task, .task-list li + li{border-top:1px solid var(--line)}
.t-n{min-width:34px; font-size:19px; text-align:center; color:var(--ink)}
.t-n.hot{color:var(--red-deep)}
.t-body{display:flex; flex-direction:column}
.t-body small{color:var(--sub); font-size:11.5px}
.t-go{margin-left:auto; color:var(--sub); font-size:18px}

/* ── 신호 ── */
.sig-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.sig{border-left:3px solid var(--warn); background:var(--warn-soft);
  border-radius:10px; padding:9px 12px; display:flex; flex-direction:column; gap:2px}
.sig.hot{border-left-color:var(--red); background:var(--red-soft)}
.sig-kind{font-weight:700; font-size:12.5px}
.sig.hot .sig-kind{color:var(--red-deep)}
.sig.warn .sig-kind{color:var(--warn)}
.sig-text{font-size:12.5px; color:var(--ink)}
.empty{padding:26px 10px; text-align:center; color:var(--sub); font-size:13px}
.empty.ok{color:var(--ok); font-weight:700}

/* ── 차트 ── */
.chart{width:100%; height:auto; min-width:560px}
.chart .bar{fill:#E4DFDA}
.chart .bar.today{fill:var(--red)}
.chart .line{fill:none; stroke:var(--red-deep); stroke-width:2}
.chart .dot{fill:var(--red-deep)}
.chart .ax{fill:var(--sub); font-size:10px}
.mini{width:100%; height:auto}
.mini .bar{fill:#E4DFDA}
.mini .bar.today{fill:var(--red)}
.big-num{font-size:42px; font-weight:800; letter-spacing:-.03em; padding:6px 0 2px}

/* ── 지점 현황 ── */
.bb-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px}
.bb-col h4{font-size:12.5px; color:var(--sub); margin-bottom:6px}
.bb-col ol{margin:0; padding:0 0 0 18px; display:flex; flex-direction:column; gap:2px}
.blink{width:100%; display:flex; justify-content:space-between; gap:8px; padding:4px 6px; border-radius:8px; text-align:left}
.blink:hover{background:var(--paper); color:var(--red-deep)}

/* ── 필터 ── */
.f-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.f-row + .f-row{margin-top:10px}
.f-cap{font-size:12px; color:var(--sub); font-weight:600; margin:0 2px 0 6px; display:inline-block}
label > .f-cap{display:block; margin:0 0 4px}
.seg{display:inline-flex; background:var(--paper2); border-radius:var(--r-btn); padding:3px; gap:2px; flex-wrap:wrap}
.seg-b{padding:6px 12px; border-radius:9px; font-weight:600; font-size:12.5px; color:var(--sub)}
.seg-b.on{background:#fff; color:var(--red-deep); box-shadow:0 1px 2px rgba(34,29,26,.12)}
.quick{display:inline-flex; gap:4px}
.chips{display:inline-flex; gap:6px; flex-wrap:wrap}
.chip{display:inline-flex; align-items:center; padding:3px 10px; border-radius:999px;
  font-size:12px; font-weight:600; background:var(--paper2); color:var(--sub)}
.chip.f{border:1px solid var(--line); background:#fff}
.chip.f.on,.chip.on{background:var(--red-soft); color:var(--red-deep); border:1px solid var(--red)}
.ch-own{background:var(--red-soft); color:var(--red-deep)}
.ch-naver{background:#E7F5EC; color:#0B7A3E}
.ch-spacecloud{background:#EAF0FB; color:#2B5FB8}
.ch-phone,.ch-etc{background:var(--paper2); color:var(--sub)}

/* ── 버튼 ── */
.btn{background:var(--red); color:#fff; font-weight:700; padding:8px 14px;
  border-radius:var(--r-btn); font-size:13px; transition:background .15s}
.btn:hover{background:var(--red-deep)}
.btn.ghost{background:#fff; color:var(--ink); border:1px solid var(--line); font-weight:600}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger{background:var(--red-deep)}
.btn.danger-ghost{background:#fff; color:var(--red-deep); border:1px solid var(--red)}
.btn.danger-ghost:hover{background:var(--red-soft)}
.btn.tiny{padding:4px 10px; font-size:12px; border-radius:9px}
.btn:disabled{opacity:.45; cursor:not-allowed}
.icon-btn{width:30px; height:30px; border-radius:9px; color:var(--sub); font-size:14px}
.icon-btn:hover{background:var(--paper)}

/* ── 테이블 ── */
table.grid{width:100%; border-collapse:collapse; font-size:13px}
.grid th{position:sticky; top:0; background:#fff; text-align:left; font-size:11.5px; color:var(--sub);
  font-weight:700; padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap}
.grid td{padding:9px 10px; border-bottom:1px solid var(--paper2); vertical-align:middle; white-space:nowrap}
.grid tbody tr:hover{background:#FBFAF8}
.grid tbody tr[tabindex]{cursor:pointer}
.grid tr.low{background:color-mix(in srgb, var(--red) 5%, #fff)}
.grid tr.total td{border-top:2px solid var(--ink); font-weight:800; font-size:14px}
.grid.tight td,.grid.tight th{padding:6px 8px}
td.clip{max-width:150px; overflow:hidden; text-overflow:ellipsis}
td.strong{font-weight:800}
.sortable{cursor:pointer; user-select:none}
.sortable:hover{color:var(--red-deep)}
.num-f{font-family:ui-monospace,Consolas,monospace; font-size:12px}
.pager{display:flex; align-items:center; gap:8px; justify-content:flex-end; padding:10px 8px 2px}
.pinfo{font-size:12px; color:var(--sub); margin-right:auto}

/* ── 배지 ── */
.badge{display:inline-flex; align-items:center; padding:2px 9px; border-radius:999px;
  font-size:11.5px; font-weight:700; white-space:nowrap; margin-right:4px}
.st-hold{background:var(--paper2); color:var(--hold)}
.st-conf{background:var(--ok-soft); color:var(--ok)}
.st-done{background:#ECEAE7; color:var(--ink)}
.st-cxl{background:#F4F2F0; color:#A29B94}
.st-nos{background:var(--warn-soft); color:var(--warn)}
.st-refund{background:var(--red-soft); color:var(--red-deep); border:1px solid var(--red)}
.st-due{background:#FFF6E8; color:#9A6008; border:1px dashed #D9A441}

/* ── 행 라인 ── */
.row-line{display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:9px 4px; border-bottom:1px solid var(--paper2); font-size:13px}
.row-line:last-child{border-bottom:0}
.row-line.hot,.row-line.hotline{background:var(--red-soft); border-radius:10px; padding:9px 10px; border-bottom:0; margin-bottom:4px}
.plain{list-style:none; margin:0; padding:0}
.rank{margin:0; padding:0 0 0 20px; display:flex; flex-direction:column; gap:4px}
.rank li{display:flex; justify-content:space-between; gap:10px}
.note{font-size:12px; color:var(--sub); background:var(--paper);
  border-radius:10px; padding:8px 11px; margin:10px 0 0}
.reject{background:var(--red-soft); border:1px solid var(--red); color:var(--red-deep);
  border-radius:10px; padding:10px 12px; font-size:13px; margin-top:10px}
.reject b{display:block; margin-bottom:2px}
.reject p{margin:2px 0}
.accept,.okmsg{background:var(--ok-soft); color:var(--ok); border-radius:10px; padding:10px 12px; font-size:13px; margin-top:10px}
.conf-msg:empty{display:none}

/* ── 모달 · 드로어 ── */
.modal-back,.drawer-back{position:fixed; inset:0; background:rgba(34,29,26,.34); z-index:60;
  display:flex; align-items:center; justify-content:center; padding:20px}
.drawer-back{justify-content:flex-end; padding:0}
.modal{background:#fff; border-radius:var(--r-card); width:min(480px,100%);
  max-height:88vh; overflow:auto; box-shadow:0 24px 60px -20px rgba(34,29,26,.4)}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line)}
.modal-head h3{font-size:15px}
.modal-body{padding:16px}
.modal-body label{display:block; margin-bottom:10px}
.modal-foot{display:flex; justify-content:flex-end; gap:8px; padding:12px 16px; border-top:1px solid var(--line)}
.drawer{background:#fff; width:min(460px,94vw); height:100%; overflow:auto;
  box-shadow:-16px 0 44px -22px rgba(34,29,26,.4); animation:slidein .2s ease}
@keyframes slidein{from{transform:translateX(24px); opacity:.4} to{transform:none; opacity:1}}
.drawer-head{display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:14px 16px; border-bottom:1px solid var(--line); position:sticky; top:0; background:#fff}
.drawer-head h3{font-size:15px; display:inline}
.drawer-body{padding:14px 16px 24px}
.d-line{display:flex; gap:12px; padding:6px 0; font-size:13px}
.d-k{width:86px; flex:none; color:var(--sub); font-size:12px; padding-top:1px}
.d-v{flex:1}
.d-acts{display:flex; gap:6px; flex-wrap:wrap; margin:14px 0 4px}
.d-sub{font-size:12.5px; color:var(--sub); margin:16px 0 6px}
.audit{list-style:none; margin:0; padding:0; font-size:12px; display:flex; flex-direction:column; gap:4px}
.stepper{display:flex; align-items:center; gap:14px; justify-content:center; padding:8px 0}
.stepper b{font-size:18px; min-width:110px; text-align:center}
.wrapseg{flex-wrap:wrap}

/* ── 토스트 ── */
.toasts{position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
  display:flex; flex-direction:column; gap:8px; z-index:80; align-items:center}
.toast{background:var(--ink); color:#fff; padding:9px 16px; border-radius:999px;
  font-size:13px; font-weight:600; box-shadow:0 10px 30px -10px rgba(34,29,26,.5);
  animation:pop .18s ease; max-width:90vw}
.toast.warn{background:var(--red-deep)}
.toast.out{opacity:0; transition:opacity .3s}
@keyframes pop{from{transform:translateY(8px); opacity:0} to{transform:none; opacity:1}}

/* ── 빈 시간 찾기 ── */
.vac-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px}
.vac-card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 14px;
  display:flex; flex-direction:column; gap:5px; box-shadow:var(--shadow)}
.vac-card .btn{align-self:flex-start; margin-top:4px}

/* ── 정산 보드 ── */
.stage-track{list-style:none; margin:4px 0 10px; padding:0; display:flex; gap:0}
.stage-track li{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; position:relative; color:var(--sub); font-size:12px}
.stage-track li::before{content:""; position:absolute; top:13px; left:-50%; width:100%; height:2px; background:var(--line); z-index:0}
.stage-track li:first-child::before{display:none}
.stage-track li b{width:27px; height:27px; border-radius:50%; background:#fff; border:2px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:12px; z-index:1}
.stage-track li.done b{background:var(--paper2); border-color:#C9C4BF; color:var(--sub)}
.stage-track li.done::before{background:#C9C4BF}
.stage-track li.now b{background:var(--red); border-color:var(--red); color:#fff}
.stage-track li.now{color:var(--red-deep); font-weight:700}
.dist{display:flex; gap:10px}
.dist-i{flex:1; background:var(--paper); border-radius:12px; padding:12px; text-align:center}
.dist-i b{display:block; font-size:22px}
.dist-i.warn{background:var(--warn-soft); color:var(--warn)}
.dist-i.hot{background:var(--red-soft); color:var(--red-deep)}
.check{display:flex; align-items:center; justify-content:space-between; border-radius:12px; padding:14px 16px; font-weight:800}
.check.ok{background:var(--ok-soft); color:var(--ok)}
.check.hot{background:var(--red-soft); color:var(--red-deep)}
.stmt-line{display:flex; justify-content:space-between; padding:9px 2px; border-bottom:1px solid var(--paper2); font-size:14px}
.stmt-line.sub{color:var(--sub); font-size:13px}
.stmt-line.total{border-top:2px solid var(--ink); border-bottom:0; font-weight:800; font-size:16px; margin-top:2px}

/* ── 통계 ── */
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; min-width:560px}
.cal-h{text-align:center; font-size:11.5px; color:var(--sub); padding-bottom:2px}
.hcell{border-radius:8px; min-height:26px; display:flex; align-items:center; justify-content:center;
  font-size:11.5px; font-weight:600}
.cal-c{min-height:44px; cursor:pointer}
.cal-c:hover{outline:2px solid var(--red); outline-offset:-2px}
.cal-c.today{box-shadow:inset 0 0 0 2px var(--red-deep)}
.hm{display:grid; grid-template-columns:40px repeat(13,1fr); gap:4px; min-width:640px}
.hm-h{font-size:11px; color:var(--sub); display:flex; align-items:center; justify-content:center}

/* ── 점주 ── */
.form-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.form-grid label{display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--sub); font-weight:600}
.form-grid .span2{grid-column:span 2}
.ow-tasks{display:flex; flex-direction:column}
.tl,.tline{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.tl li,.tline li{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--paper2); cursor:pointer; flex-wrap:wrap}
.tl li:hover,.tline li:hover{background:var(--paper)}
.tl-t,.t-time{color:var(--sub); font-size:12.5px; min-width:96px}
.tl-b,.t-main{flex:1; min-width:160px}

/* ── 반응형 ── */
@media (max-width:1080px){
  .kpi-grid{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:860px){
  .two-col{grid-template-columns:1fr}
  .kpi-grid,.kpi-grid.four{grid-template-columns:repeat(2,1fr)}
  .bb-grid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr 1fr}
  .ident{height:auto; padding:8px 0; flex-wrap:wrap}
  .d-k{width:72px}
}

<script>
/* ===== rules.js ===== */
/* ============================================================
   SSOPLE Dashboard — rules.js

window.SP = window.SP || {};

SP.rules = (() => {
  /* ── 상태 5종 (기획서 4.1) ── */
  const STATUS = {

  const PAY = {

    /* 이관 전용 코드 (기획서 14.2) — 신규 예약에는 나타나지 않음 */
    legacy_bank:  "무통장입금(이관)",
    legacy_site:  "현장결제(이관)"
  };

  /* ── 운영 정책 (전 화면 공통) ── */
  const POLICY = {
    deposit: 80000,                 // 예약금
    ownerShare: 0.8,                // 점주 80 / 본사 20
    refundFreeDays: 7,              // 이용 7일 전까지 전액 환불
    noshowWaitMin: 60,              // 노쇼 판정 대기 [확정 필요 8번 — 60분 권장]
    linkTtlHours: 24,               // 결제링크 수명 (4.4절)
    holdTtlMin: 10,                 // 일반 홀드 수명
    extraFee: 10000,                // 추가 인원 1인당
    basePeople: 4
  };

  /* ── 정산 5단계 (기획서 9.1) — 일자로 판정 ── */
  function settlementStage(dayOfMonth){
    if (dayOfMonth === 1)  return { no:1, key:"aggregating", label:"집계 중",       range:"1일 새벽" };
    if (dayOfMonth <= 5)   return { no:2, key:"dispute",     label:"이의신청 접수", range:"1일 ~ 5일" };
    if (dayOfMonth <= 9)   return { no:3, key:"adjust",      label:"조정 · 확정",   range:"6일 ~ 9일" };
    if (dayOfMonth === 10) return { no:4, key:"payout",      label:"지급",          range:"10일" };
    return                 { no:5, key:"closed",      label:"마감",          range:"지급 후" };
  }
  const STAGE_SEQ = ["집계 중","이의신청 접수","조정 · 확정","지급","마감"];

  /* ── 권한 매트릭스 (기획서 12.5) ──
     role: hq_admin(총괄) · hq_staff(운영팀) · owner(점주) · staff(스태프) */
  const ROLES = {
    hq_admin: { key:"hq_admin", label:"총괄 관리자" },
    hq_staff: { key:"hq_staff", label:"운영팀" },
    owner:    { key:"owner",    label:"점주" },
    staff:    { key:"staff",    label:"스태프" }
  };
  const PERM = {
    viewStats:      r => r==="hq_admin"||r==="hq_staff"||r==="owner",
    scopeAll:       r => r==="hq_admin"||r==="hq_staff",
    viewMoney:      r => r!=="staff",                      // 스태프: 금액 비노출 (API 단계 차단을 모사)
    viewPhoneFull:  r => r==="hq_admin"||r==="hq_staff",   // 점주는 이용 당일 건만 (별도 검사)
    proxyBooking:   r => r==="hq_admin"||r==="hq_staff",
    forceChange:    r => r==="hq_admin"||r==="hq_staff",
    noshowJudge:    r => r==="owner",
    settleBoard:    r => r==="hq_admin"||r==="hq_staff",
    settleAdjust:   r => r==="hq_admin"||r==="hq_staff",
    payoutFile:     r => r==="hq_admin",                   // 지급 파일은 총괄만
    manualNotify:   r => r==="hq_admin"||r==="hq_staff",
    settings:       r => r==="hq_admin",
    spaceEdit:      r => r==="hq_admin"||r==="hq_staff",   // 공간 정보 수정
    msgView:        r => r==="hq_admin"||r==="hq_staff",   // 메시지 발송현황
    notes:          r => r==="hq_admin"||r==="hq_staff",   // 업무 노트
    feeRate:        r => r==="hq_admin"                    // 수수료율 기본값 변경
  };

  /* ── 취소 사유 분류 (취소·환불 분석의 축) ── */
  const CANCEL_REASONS = ["단순 변심","일정 변경","컴플레인","시설 문제","기타"];

  /* ── 알림 메시지 템플릿 (11장 — 승인 템플릿만 사용) ── */
  const MSG_TPL = {
    confirm:     { label:"예약 확정 안내",        to:"customer" },
    remind:      { label:"이용 전일 리마인드",     to:"customer" },
    paylink:     { label:"결제링크 안내",          to:"customer" },
    change:      { label:"예약 변경 안내",         to:"customer" },
    cancel:      { label:"취소 · 환불 안내",       to:"customer" },

    host_settle: { label:"[호스트] 정산 지급 완료", to:"host" }
  };

  /* ── 포맷터 ── */
  const fmtWon = n => (n==null ? "—" : "₩" + Math.round(n).toLocaleString("ko-KR"));
  const fmtNum = n => (n==null ? "—" : Math.round(n).toLocaleString("ko-KR"));
  const fmtPct = (n,d=1) => (n==null ? "—" : (n*100).toFixed(d) + "%");
  const pad2 = n => String(n).padStart(2,"0");
  const fmtDate = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  const fmtMD   = d => `${d.getMonth()+1}/${d.getDate()}`;
  const fmtTime = h => `${pad2(h)}:00`;
  const WD = ["일","월","화","수","목","금","토"];
  const fmtDateK = d => `${d.getMonth()+1}월 ${d.getDate()}일(${WD[d.getDay()]})`;

  /* 인원 병기 — 구 솔루션 표기 습관 계승 (기획서 6.2) */
  const fmtPeople = (base, extra) => extra>0 ? `${base}명(+${extra}명)` : `${base}명`;

  /* 연락처 마스킹 (기획서 6.2) */
  const maskPhone = p => p.replace(/(\d{3})-(\d{3,4})-(\d{4})/, "$1-****-$3");

  /* 환불 규정 판정 — 이용 7일 전까지 전액 (4.5절) */
  function refundable(useDate, whenDate){
    const diff = Math.floor((useDate - whenDate) / 86400000);
    return diff >= POLICY.refundFreeDays;
  }

  const fmtDT = d => `${d.getMonth()+1}/${d.getDate()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;

  return { STATUS, CHANNELS, PAY, POLICY, ROLES, PERM, CANCEL_REASONS, MSG_TPL,
           settlementStage, STAGE_SEQ,
           fmtWon, fmtNum, fmtPct, fmtDate, fmtMD, fmtTime, fmtDateK, fmtDT,
           fmtPeople, maskPhone, refundable, pad2, WD };
})();


/* ===== data.js ===== */
/* ============================================================
   SSOPLE Dashboard — data.js
   원장 생성(130개 지점, 약 120일) → 요약 테이블 집계
   기획서 12.1의 파이프라인을 브라우저 안에서 그대로 재현:
   화면은 원장을 훑지 않고 요약(statsDaily·statsSlots)만 읽는다.
   ============================================================ */
SP.data = (() => {
  const R = SP.rules, P = R.POLICY;

  /* ── 결정적 난수 ── */
  function mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0;
    let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296; }; }
  const rnd = mulberry32(20260801);
  const pick = arr => arr[Math.floor(rnd()*arr.length)];
  const chance = p => rnd() < p;
  function weighted(pairs){ const s=pairs.reduce((a,[,w])=>a+w,0); let x=rnd()*s;
    for(const [v,w] of pairs){ x-=w; if(x<=0) return v; } return pairs[0][0]; }

  /* ── 시간 기준 ── */
  const NOW = new Date();
  const TODAY = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
  const dayMs = 86400000;
  const addDays = (d,n) => new Date(d.getTime() + n*dayMs);
  const keyOf = d => R.fmtDate(d);
  const PAST_DAYS = 92, FUTURE_DAYS = 30;

  /* ── 130개 지점 ── */
  const AREAS = [
    ["서울","강남"],["서울","역삼"],["서울","신논현"],["서울","선릉"],["서울","삼성"],["서울","교대"],["서울","서초"],["서울","사당"],
    ["서울","홍대"],["서울","합정"],["서울","연남"],["서울","망원"],["서울","신촌"],["서울","이대"],["서울","공덕"],
    ["서울","건대"],["서울","성수"],["서울","왕십리"],["서울","혜화"],["서울","종로"],["서울","을지로"],["서울","동대문"],
    ["서울","잠실"],["서울","송파"],["서울","천호"],["서울","강동"],["서울","가락"],
    ["서울","노원"],["서울","수유"],["서울","미아"],["서울","창동"],
    ["서울","여의도"],["서울","영등포"],["서울","구로"],["서울","신림"],["서울","목동"],["서울","마곡"],["서울","발산"],
    ["경기","수원인계"],["경기","수원영통"],["경기","광교"],["경기","성남"],["경기","분당"],["경기","판교"],["경기","야탑"],
    ["경기","안양"],["경기","평촌"],["경기","부천"],["경기","일산"],["경기","일산라페"],["경기","파주운정"],["경기","의정부"],
    ["경기","구리"],["경기","남양주"],["경기","하남미사"],["경기","광명"],["경기","안산"],["경기","시흥"],["경기","동탄"],
    ["경기","용인수지"],["경기","용인기흥"],["경기","평택"],["경기","과천문원"],["경기","군포"],["경기","김포"],
    ["인천","구월"],["인천","부평"],["인천","송도"],["인천","계양"],["인천","청라"],
    ["부산","서면"],["부산","남포"],["부산","해운대"],["부산","센텀"],["부산","부산대"],["부산","사상"],["부산","광안"],
    ["대구","동성로"],["대구","수성"],["대구","동대구"],["대구","계명대"],
    ["대전","둔산"],["대전","유성"],["대전","은행동"],
    ["광주","상무"],["광주","충장로"],["광주","첨단"],
    ["울산","삼산"],["울산","성남동"],
    ["세종","나성"],["충북","청주성안"],["충북","청주율량"],
    ["충남","천안신부"],["충남","천안두정"],["충남","아산"],
    ["전북","전주효자"],["전북","전주객사"],["전북","익산"],
    ["전남","여수"],["전남","순천"],["전남","목포"],
    ["경남","창원"],["경남","김해"],["경남","양산"],["경남","진주"],
    ["경북","포항"],["경북","구미"],["경북","경산"],
    ["강원","춘천"],["강원","원주"],["강원","강릉"],
    ["제주","제주시"],["제주","서귀포"]
  ];
  const ROOM_NAMES = ["그레이스톤","클레이","테라코타","샌드","아이보리","차콜","세이지","오크","린넨","코튼","모카","앰버"];

  const branches = [];
  (function makeBranches(){
    let i = 0;
    while (branches.length < 130) {
      const [region, area] = AREAS[i % AREAS.length];
      const nth = Math.floor(i / AREAS.length);           // 두 바퀴째는 2호점
      const name = area + (nth ? `${nth+1}호` : "") + "점";
      const tier = weighted([[1,3],[2,5],[3,4]]);          // 1 프리미엄 ~ 3 스탠다드
      const roomCnt = weighted([[1,6],[2,4]]);
      const rooms = [];
      for (let r=0;r<roomCnt;r++) rooms.push({ id:`S${branches.length+1}-${r+1}`, name: pick(ROOM_NAMES), visible:true });
      // 지점 고유의 수요 체력 — 순위·가동률이 실제처럼 갈리게 함
      const demand = 0.55 + rnd()*0.75;
      branches.push({ id:"B"+String(branches.length+1).padStart(3,"0"),
        name, region, tier, rooms, demand,
        owner: pick(["김","이","박","최","정","조","윤","장","임","한"]) + pick(["민수","서연","지훈","현우","수빈","예은","도윤","하준","지아","시우"]),
        openH:11, closeH:24 });
      i++;
    }
  })();
  const branchById = Object.fromEntries(branches.map(b=>[b.id,b]));

  /* ── 가격표 ── */
  const PRICE = { 1:{day:139000, night:189000}, 2:{day:119000, night:159000}, 3:{day:99000, night:139000} };
  function priceOf(b, slot, hours, extra){
    const base = slot==="day" ? PRICE[b.tier].day : PRICE[b.tier].night;
    const perH = Math.round(base/ (slot==="day"?5:5));
    const t = (hours===5? base : perH*hours);
    return t + extra*P.extraFee;
  }

  /* 공간 상세 — 홈페이지 노출 정보 (공간 관리 화면에서 수정, 수정분이 신규 수기 예약 금액에 반영) */
  const ROOM_HUE={그레이스톤:"#8E8B86",클레이:"#C96F4A",테라코타:"#B9552F",샌드:"#D8C29A",아이보리:"#E4DCCB",
    차콜:"#4A4642",세이지:"#9AAB8F",오크:"#A97E4F",린넨:"#D9CFC0",코튼:"#E8E4DC",모카:"#8A6248",앰버:"#D99A3D"};
  branches.forEach(b=>b.rooms.forEach(room=>{
    room.priceDay=PRICE[b.tier].day; room.priceNight=PRICE[b.tier].night;
    room.baseP=P.basePeople; room.maxP=weighted([[8,3],[10,4],[12,3],[16,1]]);
    room.desc=`${room.name} 톤의 프라이빗 파티룸 — 기준 ${P.basePeople}인, 추가 인원은 1인 1만원`;
    room.hue=ROOM_HUE[room.name]||"#C9C4BF"; room.photo=""; room.active=true;
  }));
  function roomPrice(b, room, slot, hours, extra){
    const base = slot==="day" ? (room.priceDay||PRICE[b.tier].day) : (room.priceNight||PRICE[b.tier].night);
    const perH = Math.round(base/5);
    return (hours===5? base : perH*hours) + extra*P.extraFee;
  }
  const hostPhone = b => `010-7${b.id.slice(1)}-1${b.id.slice(1)}`;

  /* ── 이름·연락처 ── */
  const LAST=["김","이","박","최","정","강","조","윤","장","임","한","오","서","신","권","황","안","송","류","홍"];
  const FIRST=["서준","하윤","지호","민서","도현","수아","예준","지우","시윤","하린","은우","서아","준우","다은","건우","소율","유준","채원","현서","가은","지안","윤서","태오","나윤"];
  const mkName = () => pick(LAST)+pick(FIRST);
  const mkPhone = () => `010-${String(2000+Math.floor(rnd()*8000))}-${String(1000+Math.floor(rnd()*9000))}`;

  /* ── 원장 생성 ── */
  const reservations = [];
  let seq = 100001;
  const wdWeight = [1.5, .55, .6, .7, .85, 1.35, 1.7];   // 일~토 — 주말 파티 수요

  function makeRes(b, room, useDate, forceToday){
    const slot = weighted([["day",4],["night",6]]);
    let sh, eh;
    if (slot==="day"){ sh=weighted([[11,2],[12,5],[13,3]]); eh=Math.min(sh+weighted([[4,3],[5,6],[6,1]]),17); }
    else { sh=weighted([[17,2],[18,6],[19,3]]); eh=Math.min(sh+weighted([[4,2],[5,6],[6,2]]),24); }
    const extra = weighted([[0,5],[2,3],[4,2],[6,1],[8,.5]]);
    const amount = priceOf(b, slot, eh-sh, extra);
    const lead = weighted([[1,1],[2,2],[3,3],[5,3],[7,3],[10,2],[14,2],[21,1],[30,.6],[45,.3]]);
    let created = addDays(useDate, -lead);
    if (created > NOW) created = new Date(NOW.getTime() - (1 + Math.floor(rnd()*70)) * 3600000);   // 신청은 언제나 과거
    const channel = weighted([["own",55],["naver",18],["spacecloud",14],["phone",9],["etc",3]]);
    const pay = channel==="phone" ? "link"
              : channel==="naver"||channel==="spacecloud" ? "channel"
              : weighted([["card",46],["kakao",24],["naverpay",20],["transfer",10]]);
    const r = {
      id: "R" + (seq++),
      branchId: b.id, roomId: room.id, roomName: room.name,
      name: mkName(), phone: mkPhone(),
      createdAt: created, useDate, sh, eh, slot,
      base: P.basePeople, extra, amount,
      channel, pay,
      channelNo: channel==="naver" ? "NV-"+(300000+Math.floor(rnd()*699999))
               : channel==="spacecloud" ? "SC-"+(100000+Math.floor(rnd()*899999)) : "",
      status: "CONFIRMED",
      deposit: chance(.5) ? "수취" : "-",     // 보증금 [확정 필요 1번] — 일부 지점만 운영 가정
      memo: "", intIssue:"", ownIssue:"",
      options: chance(.3) ? pick(["빔프로젝터","생일 세트","노래방 마이크","보드게임"]) : "",
      checkin: false, refund: null, noshowAt: null, amountDue: 0,
      audit: []
    };
    /* 상태 시나리오 */
    const past = useDate < TODAY;
    if (past){
      if (chance(.055) && !forceToday){                      // 규정 내 취소 (7일 전)
        r.status="CANCELLED";
        const cAt = addDays(useDate, -(P.refundFreeDays + Math.floor(rnd()*6)));
        r.cancelAt = cAt < created ? created : cAt;
        r.cancelReason = { tag: weighted([["단순 변심",5],["일정 변경",3],["컴플레인",1],["시설 문제",.6],["기타",.6]]), note:"" };
        r.refund = { amt:r.amount, state:"완료", at:r.cancelAt, kind:"규정" };
      } else if (chance(.014)){                              // 노쇼 (환불 불가 구간 — 매출 유지)
        r.status="NO_SHOW"; r.noshowAt = new Date(useDate.getTime()+(r.sh+2)*3600000);
      } else { r.status="COMPLETED"; r.checkin=true; }
    }
    return r;
  }

  branches.forEach(b => {
    for (let d=-PAST_DAYS; d<=FUTURE_DAYS; d++){
      const date = addDays(TODAY, d);
      const season = 1 + 0.18*Math.sin((date.getMonth()+1)/12*Math.PI*2);   // 연중 계절성
      const lam = b.demand * wdWeight[date.getDay()] * b.rooms.length * season;
      let n = Math.floor(lam) + (chance(lam%1)?1:0);
      if (d>14) n = Math.round(n*0.45);                     // 먼 미래는 아직 덜 참
      const used = {};                                       // 방·시간 중복 방지(간이)
      for (let k=0;k<n;k++){
        const room = pick(b.rooms);
        const r = makeRes(b, room, date);
        const key = room.id + r.slot;
        if (used[key]) continue;
        used[key]=1; reservations.push(r);
      }
    }
  });

  /* ── 오늘의 살아있는 시나리오 주입 ── */
  const todays = reservations.filter(r=>keyOf(r.useDate)===keyOf(TODAY) && r.status==="CONFIRMED");
  const nowH = NOW.getHours() + NOW.getMinutes()/60;
  todays.forEach(r=>{
    if (r.sh + 1 <= nowH){                                   // 시작 후 60분 경과
      if (chance(.86)) r.checkin = true;                     // 나머지는 노쇼 후보 (4.3절)
    }
  });
  /* 환불 처리 중 배지 1건 (4.5절) */
  (function(){
    const c = reservations.find(r=>r.status==="CANCELLED" && r.refund);
    if (c){ c.refund.state="처리 중"; c.refund.at=NOW; }
  })();
  /* 컴플레인 예외 환불 — 규정 밖(7일 이내) 취소지만 관리자 승인으로 환불된 건 */
  for (let i=0;i<3;i++){
    const b = pick(branches), room = pick(b.rooms);
    const useDate = addDays(TODAY, -(3+i*5));
    const r = makeRes(b, room, useDate, true);
    r.status="CANCELLED"; r.checkin=false;
    r.cancelAt = addDays(useDate, -2);
    r.cancelReason = { tag:"컴플레인",
      note: ["에어컨 고장 사전 고지 누락","옆 호실 공사 소음 — 이용 불가 수준","예약 시간 중복 안내 착오"][i] };
    const partial = i===1;
    r.refund = { amt: partial? Math.round(r.amount*0.5) : r.amount, state:"완료", at:r.cancelAt,
      kind: partial? "예외(부분)" : "예외(전액)" };
    r.audit.push({ at:r.cancelAt, who:"운영팀", act:`강제 취소 — ${r.cancelReason.note} · ${r.refund.kind} 환불` });
    reservations.push(r);
  }
  /* 결제링크 — 대기 3건 + 24시간 초과 2건 (4.4절 → 처리할 일) */
  const links = [];
  for (let i=0;i<5;i++){
    const b = pick(branches), room = pick(b.rooms);
    const useDate = addDays(TODAY, 2+Math.floor(rnd()*6));
    const r = makeRes(b, room, useDate);
    r.status="HOLD"; r.channel="phone"; r.pay="link"; r.channelNo="";
    r.linkAt = new Date(NOW.getTime() - (i<2 ? (26+i*5) : (2+i))*3600000);
    r.audit.push({at:r.linkAt, who:"운영팀", act:"대리 예약 생성 · 결제링크 발송"});
    reservations.push(r); links.push(r);
  }
  /* 외부 채널 충돌 거절 이력 1건 (8.1절 → 신호) */
  const conflictLog = [];
  (function(){
    const t = todays.find(r=>r.channel==="own") || todays[0];
    if (t){ conflictLog.push({ at:new Date(NOW.getTime()-42*60000), branchId:t.branchId,
      date:keyOf(t.useDate), range:`${R.fmtTime(t.sh)}~${R.fmtTime(t.eh)}`,
      channel:"naver", refused:true, against:t.id }); }
  })();

  reservations.sort((a,b)=>b.createdAt - a.createdAt);

  /* ── 관리자 · 매니저 계정 (본인 ID 로그인 — 모든 입력·변경에 기록) ── */
  const accounts = [
    { id:"choi",    pw:"1234", name:"최시준", role:"hq_admin", pos:"총괄 관리자" },
    { id:"seoyeon", pw:"1234", name:"김서연", role:"hq_staff", pos:"매니저" },
    { id:"jihoon",  pw:"1234", name:"박지훈", role:"hq_staff", pos:"매니저" },
    { id:"haneul",  pw:"1234", name:"이하늘", role:"hq_staff", pos:"매니저" },
    { id:"host01",  pw:"1234", name:branches[0].owner, role:"owner", pos:branches[0].name+" 호스트", branchId:branches[0].id },
    { id:"staff01", pw:"1234", name:"조수아", role:"staff",  pos:branches[0].name+" 스태프", branchId:branches[0].id }
  ];

  /* ── 운영 설정 · 조정 저장소 · 전역 변경 이력 ── */
  const settings = { feeRate: 0.20 };                 // 수수료율 기본 20% — 관리자 변경 가능
  const hostAdj  = {};                                // `${branchId}-${YYYY-MM}` → {other, cost, rate}
  const auditLog = [];                                // {at, user:{id,name}, action, target}

  /* ── 업무 노트 (공지 · 인수인계 · 전달 — 특정 매니저 태그 가능) ── */
  const notices = [
    { id:"N1", at:new Date(NOW.getTime()-2*3600000),  author:"choi",    authorName:"최시준", kind:"공지",
      text:"8월 성수기 운영 — 주말 밤타임은 자사 우선, 채널 오픈은 히트맵 하위 시간대만. 문의 응대 시 환불 규정(이용 7일 전 전액) 안내 철저히 부탁드립니다.",
      tags:"all", reads:{} },
    { id:"N2", at:new Date(NOW.getTime()-5*3600000),  author:"seoyeon", authorName:"김서연", kind:"인수인계",
      text:"부평점 소음 컴플레인 고객 — 1차 통화 완료, 사과 및 재발 방지 안내. 재발 시 부분 환불 검토 필요. 다음 이용일 확인 후 후속 응대 부탁드립니다.",
      tags:["jihoon"], reads:{} },
    { id:"N3", at:new Date(NOW.getTime()-26*3600000), author:"choi",    authorName:"최시준", kind:"전달",
      text:"이번 지급 파일은 제가 직접 처리합니다. 이의 조정만 목요일까지 마감해 주세요.",
      tags:["seoyeon","haneul"], reads:{ seoyeon:true } }
  ];

  /* ── 알림 메시지 발송 이력 (11장 — 알림톡 우선, 실패 시 문자 대체) ── */
  const messages = []; let mseq = 50001;
  function pushMsg(o){
    const m = Object.assign({ id:"M"+(mseq++), status:"성공", by:"시스템", method:"알림톡" }, o);
    messages.unshift(m); return m;                     // 최신이 위로
  }
  reservations.forEach(r=>{
    if (r.status==="HOLD") return;
    const b = branchById[r.branchId];
    const cAge = (NOW - r.createdAt)/dayMs;
    if (cAge>=0 && cAge<3 && chance(.8)){
      pushMsg({ at:new Date(r.createdAt.getTime()+2*60000), tpl:"confirm", to:"customer",
        name:r.name, phone:r.phone, resId:r.id, branchId:r.branchId });
      pushMsg({ at:new Date(r.createdAt.getTime()+3*60000), tpl:"host_new", to:"host",
        name:b.owner, phone:hostPhone(b), resId:r.id, branchId:r.branchId });
    }
    const uAge = (TODAY - r.useDate)/dayMs;
    if ((r.status==="COMPLETED"||r.status==="CONFIRMED") && uAge<=1 && uAge>=0 && chance(.85))   // 이미 발송된 것만
      pushMsg({ at:new Date(r.useDate.getTime()-6*3600000), tpl:"remind", to:"customer",
        name:r.name, phone:r.phone, resId:r.id, branchId:r.branchId });
    if (r.status==="CANCELLED" && r.cancelAt && (NOW - r.cancelAt)/dayMs < 7 && chance(.9)){
      pushMsg({ at:new Date(r.cancelAt.getTime()+60000), tpl:"cancel", to:"customer",
        name:r.name, phone:r.phone, resId:r.id, branchId:r.branchId });
      pushMsg({ at:new Date(r.cancelAt.getTime()+2*60000), tpl:"host_cancel", to:"host",
        name:b.owner, phone:hostPhone(b), resId:r.id, branchId:r.branchId });
    }
  });
  messages.sort((a,b)=>b.at - a.at);

  /* ── 회원 가입 (일별) ── */
  const membersDaily = {};
  for (let d=-PAST_DAYS; d<=0; d++){
    const date = addDays(TODAY,d);
    membersDaily[keyOf(date)] = 18 + Math.floor(rnd()*30) + (date.getDay()===6?8:0);
  }

  /* ============================================================
     요약 테이블 — 새벽 배치가 만든다고 가정 (12.1)
     ============================================================ */
  const statsDaily = {};          // key: date → {byBranch:{}, tot:{}}
  function slotDaily(dateKey){
    if(!statsDaily[dateKey]) statsDaily[dateKey]={ byBranch:{}, tot:blank() };
    return statsDaily[dateKey];
  }
  function blank(){ return { useCnt:0, sales:0, refund:0, cancel:0, noshow:0,
                             cntOwn:0, cntNaver:0, cntSc:0 }; }
  function bump(row, f, v=1){ row[f]+=v; }

  reservations.forEach(r=>{
    const ck = keyOf(r.createdAt), uk = keyOf(r.useDate);
    /* 매출은 결제 승인일(=신청일) 기준, 이용 건수는 이용일 기준 — 5.2 계산식 */
    const cd = slotDaily(ck); const cb = cd.byBranch[r.branchId] ||= blank();
    if (r.status!=="HOLD"){ bump(cb,"sales",r.amount); bump(cd.tot,"sales",r.amount); }
    const ud = slotDaily(uk); const ub = ud.byBranch[r.branchId] ||= blank();
    if (r.status==="CONFIRMED"||r.status==="COMPLETED"||r.status==="NO_SHOW"){
      bump(ub,"useCnt"); bump(ud.tot,"useCnt");
      const cf = r.channel==="own"?"cntOwn": r.channel==="naver"?"cntNaver": r.channel==="spacecloud"?"cntSc":null;
      if (cf){ bump(ub,cf); bump(ud.tot,cf); }
    }
    if (r.status==="CANCELLED"){
      const xk = keyOf(r.cancelAt||r.createdAt);
      const xd = slotDaily(xk); const xb = xd.byBranch[r.branchId] ||= blank();
      bump(xb,"cancel"); bump(xd.tot,"cancel");
      if (r.refund){ bump(xb,"refund",r.refund.amt); bump(xd.tot,"refund",r.refund.amt); }
    }
    if (r.status==="NO_SHOW"){ bump(ub,"noshow"); bump(ud.tot,"noshow"); }
  });

  /* statsSlots — 최근 28일 요일×시간 판매율 + 최근 7일 지점 가동률 */
  const heat = Array.from({length:7},()=>Array(13).fill(0));       // [wd][h-11]
  const heatDen = Array.from({length:7},()=>Array(13).fill(0));
  const occ7 = {};                                                  // branch → soldH
  branches.forEach(b=>occ7[b.id]=0);
  reservations.forEach(r=>{
    if (!(r.status==="COMPLETED"||r.status==="CONFIRMED"||r.status==="NO_SHOW")) return;
    const dd = Math.floor((TODAY - r.useDate)/dayMs);
    if (dd>=0 && dd<28){
      const wd=r.useDate.getDay();
      for(let h=r.sh; h<r.eh; h++){ if(h>=11&&h<24) heat[wd][h-11]++; }
    }
    if (dd>=1 && dd<=7) occ7[r.branchId] += (r.eh-r.sh);
  });
  for(let d=1; d<=28; d++){
    const wd = addDays(TODAY,-d).getDay();
    for(let h=0;h<13;h++) heatDen[wd][h] += branches.reduce((a,b)=>a+b.rooms.length,0);
  }
  const occRate = {};
  branches.forEach(b=>{ occRate[b.id] = occ7[b.id] / (b.rooms.length*13*7); });

  /* ── 재방문 (회원 계정 기준 — 여기서는 연락처를 계정 대용으로) ── */
  const revisit = (()=>{
    const seen = {}; let repeat=0, uniq=0;
    reservations.filter(r=>r.status==="COMPLETED").forEach(r=>{
      if(seen[r.phone]){ if(seen[r.phone]===1) repeat++; seen[r.phone]++; }
      else { seen[r.phone]=1; uniq++; }
    });
    /* 코호트 — 가입월(=첫 이용월) × 경과월 이용 지속 */
    const cohort = [];
    for(let m=3;m>=1;m--){
      const row=[]; let v=100;
      for(let k=0;k<=3;k++){ row.push(k===0?100:Math.round(v)); v*= (0.34+rnd()*0.1)* (k===0?1:1); }
      cohort.push({month:m,row});
    }
    return { rate: repeat/Math.max(uniq,1), cohort };
  })();

  /* ── 전월 정산 (기획서 9장) ── */
  const prevMonth = new Date(TODAY.getFullYear(), TODAY.getMonth()-1, 1);
  const prevKey = `${prevMonth.getFullYear()}-${R.pad2(prevMonth.getMonth()+1)}`;
  const settlement = { month: prevKey, rows: [], disputes: [] };
  branches.forEach(b=>{
    let sales=0, refund=0;
    reservations.forEach(r=>{
      if (r.branchId!==b.id) return;
      const u=r.useDate;
      if (u.getFullYear()===prevMonth.getFullYear() && u.getMonth()===prevMonth.getMonth()){
        if (r.status==="COMPLETED"||r.status==="NO_SHOW") sales += r.amount;
      }
      if (r.status==="CANCELLED" && r.cancelAt &&
          r.cancelAt.getFullYear()===prevMonth.getFullYear() && r.cancelAt.getMonth()===prevMonth.getMonth() && r.refund){
        refund += 0; /* 환불은 고객 몫 반환 — 점주 정산에서 매출 차감은 이용월 기준으로 이미 제외 */
      }
    });
    const fee = Math.round(sales * (1-P.ownerShare));
    settlement.rows.push({ branchId:b.id, sales, fee, refund, adj:0, payout: sales-fee-refund,
                           state:"확정" });
  });
  /* 이의신청 시드 — 현재 단계에 맞는 상태 분포 */
  (function(){
    const stage = R.settlementStage(TODAY.getDate());
    const picks = [];
    while (picks.length<7){ const b=pick(branches); if(!picks.includes(b)) picks.push(b); }
    picks.forEach((b,i)=>{
      const row = settlement.rows.find(x=>x.branchId===b.id);
      const amt = 30000 + Math.floor(rnd()*12)*10000;
      const open = stage.no<=2 ? true : i<2;               // 조정 단계 이후엔 대부분 처리됨
      const d = { id:"DP"+(101+i), branchId:b.id, amt,
        reason: pick(["노쇼 건 매출 누락 확인 요청","환불 차감 이중 반영 의심","옵션 추가금 미반영","채널 예약 매출 분류 오류"]),
        state: open ? "접수" : "조정 완료",
        at: addDays(new Date(TODAY.getFullYear(),TODAY.getMonth(),Math.min(TODAY.getDate(),4)), -Math.floor(rnd()*2)) };
      if (!open){ row.adj = (i%2? amt : -Math.round(amt/2)); row.payout = row.sales-row.fee-row.refund+row.adj; row.state = "확정"; d.adjApplied=row.adj; }
      else row.state = "이의 처리 중";
      settlement.disputes.push(d);
    });
    /* 보류 지점 소수 */
    settlement.rows.filter(r=>r.state==="확정").slice(0,3).forEach((r,i)=>{ if(i<2) r.state="보류"; });
  })();

  /* ── 승인 대기·기타 작업 시드 (5.3) ── */
  const pendingChanges = [];
  (function(){
    const kinds=[
      { kind:"요금표 변경",     mk:(room)=>({field:"priceNight", from:room.priceNight, to:room.priceNight+10000, label:"밤타임 요금"}) },
      { kind:"공간 소개글 수정", mk:(room)=>({field:"desc", from:room.desc, to:room.desc+" 무선 마이크 2대 추가 비치.", label:"소개글"}) },
      { kind:"대표 이미지 교체", mk:(room)=>({field:"hue", from:room.hue, to:"#D99A3D", label:"대표 사진"}) },
      { kind:"운영 노출 변경",   mk:(room)=>({field:"active", from:true, to:false, label:"노출 상태"}) }
    ];
    for(let i=0;i<8;i++){
      const b=pick(branches), room=b.rooms[0];
      const k=kinds[i%kinds.length];
      pendingChanges.push({ id:"CH"+(201+i), branchId:b.id, roomId:room.id,
        kind:k.kind, payload:k.mk(room),
        at: addDays(TODAY, -(i<2? 3+i : Math.floor(rnd()*2))),   // 2건은 영업일 2일 초과
        over: i<2 });
    }
  })();
  const notifFails = [
    { id:"NF1", what:"예약 확정 알림톡", to:"010-****-4821", tried:"알림톡→문자", at:addDays(NOW,-0) },
    { id:"NF2", what:"환불 완료 안내",   to:"010-****-9930", tried:"알림톡→문자", at:addDays(NOW,-0) }
  ];
  /* 발송 이력의 최종 실패 2건 — 처리할 일과 연동 */
  (function(){
    const failPick = messages.filter(m=>m.to==="customer" && m.tpl==="confirm").slice(-2);
    failPick.forEach((m,i)=>{ m.status="실패"; m.method="알림톡→문자"; if(notifFails[i]) notifFails[i].msgId=m.id; });
  })();
  const chatbotOpen = [
    { id:"CB1", q:"주차 지원되는 지점만 모아볼 수 있나요?", at:NOW },
    { id:"CB2", q:"보증금은 언제 돌려주나요?", at:NOW },
    { id:"CB3", q:"단체 40명도 가능한 곳이 있나요?", at:NOW }
  ];

  /* ── 외부 채널 등록 (OW-04) ── */
  const extRegs = reservations.filter(r=>r.channel==="naver"||r.channel==="spacecloud");

  /* ── 조회 헬퍼 ── */
  function inRange(d, from, to){ return d>=from && d<=to; }
  function weekRange(base){
    const wd=(base.getDay()+6)%7;                    // 월=0
    const from=addDays(base,-wd); return [from, addDays(from,6)];
  }
  function monthKey(d){ return `${d.getFullYear()}-${R.pad2(d.getMonth()+1)}`; }

  /* 빈 시간 찾기 (6.4) — 고객 가용성 로직과 동일 계산 */
  function vacancy({date, region, people}){
    const need = people||4;
    const out=[];
    const dayRes = reservations.filter(r=> keyOf(r.useDate)===keyOf(date) &&
      (r.status==="CONFIRMED"||r.status==="HOLD"||r.status==="COMPLETED"));
    branches.forEach(b=>{
      if (region && b.region!==region) return;
      b.rooms.forEach(room=>{
        const busy = dayRes.filter(r=>r.roomId===room.id).map(r=>[r.sh,r.eh]).sort((a,c)=>a[0]-c[0]);
        let cur=b.openH; const free=[];
        busy.forEach(([s,e])=>{ if(s-cur>=2) free.push([cur,s]); cur=Math.max(cur,e); });
        if (b.closeH-cur>=2) free.push([cur,b.closeH]);
        free.forEach(([s,e])=>{
          out.push({ branch:b, room, s, e,
            price: priceOf(b, s<17?"day":"night", Math.min(e-s,5), Math.max(0,need-P.basePeople)) });
        });
      });
    });
    out.sort((a,c)=> a.branch.region===c.branch.region ? a.branch.name.localeCompare(c.branch.name,"ko") : a.branch.region.localeCompare(c.branch.region,"ko"));
    return out;
  }

  /* 외부 등록 충돌 검사 (8.1) */
  function channelConflict(branchId, date, sh, eh){
    return reservations.find(r=> r.branchId===branchId && keyOf(r.useDate)===keyOf(date) &&
      r.channel==="own" && (r.status==="CONFIRMED"||r.status==="HOLD") &&
      Math.max(r.sh,sh) < Math.min(r.eh,eh)) || null;
  }

  /* ============================================================
     v2 통합 계층 — 감사 헬퍼 · 메시지 메타 · 메모 스레드 · 노트 헬퍼
     · 호스트 정산 계산 · 점유 인덱스 (계정·설정·messages·notices는 위에 정의)
     ============================================================ */

  /* 전역 변경 이력 헬퍼 — 모든 입력·변경은 로그인 계정으로 기록 */
  function logAudit(area, target, act, whoOverride){
    const u = whoOverride || (SP.auth && SP.auth.user
      ? {id:SP.auth.user.id, name:SP.auth.user.name} : {id:"sys", name:"시스템"});
    auditLog.unshift({ at:new Date(), user:u, area, target, act });
  }
  (function seedAudit(){
    const mg=[{id:"seoyeon",name:"김서연"},{id:"jihoon",name:"박지훈"},{id:"haneul",name:"이하늘"},{id:"choi",name:"최시준"}];
    const rows=[
      ["공간","강남점 · 그레이스톤","밤타임 요금 159,000 → 169,000"],
      ["알림","R100244","고객 리마인더 수동 발송"],
      ["예약","R100318","메모 추가 — 주차 2대 요청, 경비실 등록 완료"],
      ["정산","6월분 · 홍대점","이의 조정 +40,000 (노쇼 매출 인정)"],
      ["공간","성수점 · 클레이","소개글 수정"],
      ["예약","R100501","수기 예약 등록 — 계좌이체 입금 확인"],
      ["설정","수수료율","20% 유지 확인"],
      ["노트","공지","8월 성수기 운영 지침 등록"]
    ];
    for(let i=0;i<24;i++){ const r=rows[i%rows.length];
      auditLog.push({ at:new Date(NOW.getTime()-(i*7+3)*3600000), user:mg[i%4],
        area:r[0], target:r[1], act:r[2] }); }
  })();

  /* 메시지 템플릿 메타 — 발송 UI · 현황 화면 공용 */
  const TPL = {
    confirm:     { label:"예약 확정 안내",        to:"customer" },
    remind:      { label:"이용 전날 리마인더",     to:"customer" },
    change:      { label:"예약 변경 안내",        to:"customer" },
    cancel:      { label:"취소 · 환불 완료 안내",  to:"customer" },
    paylink:     { label:"결제링크 안내",         to:"customer" },
    host_new:    { label:"신규 예약 알림",        to:"host" },
    host_cancel: { label:"예약 취소 알림",        to:"host" },
    host_today:  { label:"오늘 예약 브리핑",      to:"host" },
    custom:      { label:"기타 안내 (승인 문구)", to:"any" }
  };
  const CXL_TAGS = ["단순 변심","일정 변경","컴플레인","시설 문제","기타"];

  /* 예약 메모 스레드 — 특이사항은 담당자 이름 · 시각과 함께 쌓인다 */
  reservations.forEach(r=>{ r.memos = r.memo ? [{at:r.createdAt, by:"이관", text:r.memo}] : []; });
  (function seedMemos(){
    const mg=["김서연","박지훈","이하늘"];
    const texts=["생일파티 — 케이크 반입 예정, 초 지참",
      "단체 회식 — 21시 이후 소음 주의 안내함",
      "휠체어 이용 고객 — 1층 진입 동선 안내 완료",
      "촬영 목적 — 삼각대 반입 승인"];
    reservations.filter(r=>r.status==="CONFIRMED"&&r.useDate>TODAY).slice(0,12)
      .forEach((r,i)=>{ if(i%3===0){ const t=texts[i%4];
        r.memos.push({at:new Date(r.createdAt.getTime()+3600000), by:mg[i%3], text:t});
        r.memo=t; } });
  })();

  /* 업무 노트 헬퍼 */
  let noteSeq = 100;
  function addNote({kind,text,tags}){
    const u = SP.auth && SP.auth.user ? SP.auth.user : {id:"sys",name:"시스템"};
    const n = { id:"N"+(noteSeq++), at:new Date(), author:u.id, authorName:u.name,
      kind, text, tags, reads:{} };
    notices.unshift(n);
    logAudit("노트", kind, (Array.isArray(tags)?("@"+tags.join(" @")+" · "):"")+text.slice(0,28)+(text.length>28?"…":""));
    return n;
  }
  function unreadNotesFor(uid){
    return notices.filter(n=>{
      const target = n.tags==="all" || (Array.isArray(n.tags) && n.tags.includes(uid));
      return target && n.author!==uid && !n.reads[uid];
    });
  }

  /* 호스트별 정산 계산 — 월 선택형, 수수료율은 settings.feeRate */
  function monthLabel(k){ const [y,m]=k.split("-"); return `${y}년 ${+m}월`; }
  function availMonths(){
    const out=[];
    for(let i=1;i<=2;i++){
      const d=new Date(TODAY.getFullYear(), TODAY.getMonth()-i, 1);
      const k=`${d.getFullYear()}-${R.pad2(d.getMonth()+1)}`;
      out.push({ key:k, label:monthLabel(k) });
    }
    return out;
  }
  function settlementFor(mKey, branchId){
    const [y,m]=mKey.split("-").map(Number);
    let sales=0, cnt=0, excRefund=0; const items=[];
    reservations.forEach(r=>{
      if(r.branchId!==branchId) return;
      if((r.status==="COMPLETED"||r.status==="NO_SHOW") &&
         r.useDate.getFullYear()===y && r.useDate.getMonth()===m-1){
        sales+=r.amount; cnt++; items.push(r);
      }
      if(r.status==="CANCELLED" && r.refund && r.refund.kind && r.refund.kind.startsWith("예외") &&
         r.cancelAt && r.cancelAt.getFullYear()===y && r.cancelAt.getMonth()===m-1){
        excRefund += r.refund.amt;
      }
    });
    return { sales, cnt, excRefund, items: items.sort((a,b)=>a.useDate-b.useDate) };
  }

  /* 점유 인덱스 — 현황판 (지점 × 날짜 → 활성 예약) */
  let occIdx=null;
  function buildOccIdx(){
    occIdx={};
    reservations.forEach(r=>{
      if(r.status==="CANCELLED") return;
      const k=r.branchId+"|"+keyOf(r.useDate);
      (occIdx[k] ||= []).push(r);
    });
  }
  function occFor(branchId, dateKey){
    if(!occIdx) buildOccIdx();
    return occIdx[branchId+"|"+dateKey]||[];
  }
  function occInvalidate(){ occIdx=null; }

  /* 같은 공간 시간 겹침 — 수기 예약 서버측 재검사 */
  function conflictAny(roomId, date, sh, eh){
    const dk=keyOf(date);
    return reservations.find(r=> r.roomId===roomId && keyOf(r.useDate)===dk &&
      (r.status==="CONFIRMED"||r.status==="HOLD") &&
      Math.max(r.sh,sh)<Math.min(r.eh,eh)) || null;
  }

  const batchAt = new Date(TODAY.getTime()+3*3600000);       // 오늘 03:00 집계

  return { NOW, TODAY, addDays, keyOf, dayMs,
    branches, branchById, reservations, links, conflictLog,
    membersDaily, statsDaily, heat, heatDen, occRate,
    revisit, settlement, pendingChanges, notifFails, chatbotOpen, extRegs,
    weekRange, monthKey, vacancy, channelConflict, priceOf, roomPrice, hostPhone, batchAt,
    accounts, settings, hostAdj, auditLog, logAudit,
    notices, addNote, unreadNotesFor,
    messages, pushMsg, TPL, CXL_TAGS, ROOM_HUE,
    availMonths, monthLabel, settlementFor,
    occFor, occInvalidate, conflictAny };
})();


/* ===== auth.js ===== */
/* ============================================================
   SSOPLE Dashboard — auth.js
   관리자 · 매니저 개별 계정 로그인. 계정 원본은 data.accounts 하나뿐이며,
   모든 입력 · 변경은 로그인 계정 이름으로 기록된다.
   (데모: 브라우저 저장을 쓰지 않으므로 새로고침 시 재로그인)
   ============================================================ */
SP.auth = (() => {
  const D = SP.data;
  let user = null;

  function login(id, pw){
    const a = D.accounts.find(x => x.id === id && x.pw === pw);
    if (!a) return false;
    user = a;
    SP.state.role = a.role;
    if (a.branchId) SP.state.branchId = a.branchId;
    D.logAudit("계정", a.id, "로그인");
    return true;
  }
  function logout(){
    if (user) D.logAudit("계정", user.id, "로그아웃");
    user = null;
  }
  const managers = () => D.accounts.filter(a => a.role==="hq_admin" || a.role==="hq_staff");
  const byId = id => D.accounts.find(a => a.id === id);
  const who = () => user ? user.name : "시스템";

  return { login, logout, managers, byId, who,
           get user(){ return user; },
           get accounts(){ return D.accounts; } };
})();


/* ===== metrics.js ===== */
/* ============================================================
   SSOPLE Dashboard — metrics.js
   KPI · 처리할 일 · 신호는 전부 여기서 계산한다.
   화면은 이 값을 그리기만 한다 — "모든 숫자는 출처가 있다"(3장 원칙 둘)
   ============================================================ */
SP.q = (() => {
  const R = SP.rules, D = SP.data;
  const k = D.keyOf, T = D.TODAY;

  const daily = key => D.statsDaily[key] || { byBranch:{}, tot:{useCnt:0,sales:0,refund:0,cancel:0,noshow:0,cntOwn:0,cntNaver:0,cntSc:0} };
  const scope = (row, branchId) => branchId ? (row.byBranch[branchId]||{useCnt:0,sales:0,refund:0,cancel:0,noshow:0,cntOwn:0,cntNaver:0,cntSc:0}) : row.tot;

  /* ── KPI 6종 (5.2 계산식 그대로) ── */
  function kpis(branchId){
    const todayKey = k(T);
    const tUse = scope(daily(todayKey), branchId);
    const todayRes = tUse.useCnt;
    const todaySales = tUse.sales - tUse.refund;

    const [wf, wt] = D.weekRange(T);
    let weekRes = 0;
    for(let d=new Date(wf); d<=wt; d=D.addDays(d,1)) weekRes += scope(daily(k(d)),branchId).useCnt;

    let monthSales = 0;                       // 이용 완료 기준 — 정산과 같은 잣대
    D.reservations.forEach(r=>{
      if (branchId && r.branchId!==branchId) return;
      if ((r.status==="COMPLETED"||r.status==="NO_SHOW") &&
          r.useDate.getMonth()===T.getMonth() && r.useDate.getFullYear()===T.getFullYear())
        monthSales += r.amount;
    });

    let cxl=0, conf=0;
    for(let d=0; d<30; d++){
      const row = scope(daily(k(D.addDays(T,-d))), branchId);
      cxl += row.cancel;
    }
    D.reservations.forEach(r=>{
      if (branchId && r.branchId!==branchId) return;
      const dd = Math.floor((T-r.createdAt)/D.dayMs);
      if (dd>=0 && dd<30 && r.status!=="HOLD") conf++;
    });
    const cancelRate = conf ? cxl/conf : 0;

    const nmToday = D.membersDaily[todayKey]||0;
    let nmWeek=0; for(let d=new Date(wf); d<=T; d=D.addDays(d,1)) nmWeek += D.membersDaily[k(d)]||0;

    return { todayRes, todaySales, weekRes, monthSales, cancelRate, nmToday, nmWeek };
  }

  /* ── 4주 추이 ── */
  function trend28(branchId){
    const out=[];
    for(let d=27; d>=0; d--){
      const date=D.addDays(T,-d), row=scope(daily(k(date)),branchId);
      out.push({ label:R.fmtMD(date), cnt:row.useCnt, sales:row.sales, today:d===0 });
    }
    return out;
  }

  /* ── 처리할 일 5종 (5.3) ── */
  function tasks(){
    const overdueLinks = D.reservations.filter(r=>r.status==="HOLD" && r.linkAt &&
      (D.NOW - r.linkAt) > R.POLICY.linkTtlHours*3600000);
    return {
      approvals: D.pendingChanges,
      approvalsOver: D.pendingChanges.filter(p=>p.over),
      disputes: D.settlement.disputes.filter(d=>d.state==="접수"||d.state==="이의 처리 중"),
      notifFails: D.notifFails,
      chatbot: D.chatbotOpen,
      links: overdueLinks
    };
  }

  /* ── 확인이 필요한 신호 6종 (5.4) — 데이터에서 실제 감지 ── */
  function signals(){
    const out=[];
    D.conflictLog.forEach(c=>{
      out.push({ kind:"외부 예약 충돌", level:"hot",
        text:`${D.branchById[c.branchId].name} ${c.date} ${c.range} — 채널 등록 시도를 거절 (자사 ${c.against} 선점)`,
        at:c.at });
    });
    /* 지점 취소율 급등 — 30일 평균의 2배 초과를 실제 계산 */
    const per={}; let allC=0, allT=0;
    D.reservations.forEach(r=>{
      const dd=Math.floor((T-r.createdAt)/D.dayMs);
      if(dd<0||dd>=30||r.status==="HOLD") return;
      per[r.branchId] ||= {c:0,t:0};
      per[r.branchId].t++; allT++;
      if(r.status==="CANCELLED"){ per[r.branchId].c++; allC++; }
    });
    const avg = allT? allC/allT : 0;
    Object.entries(per).forEach(([bid,v])=>{
      if (v.t>=14 && v.c/v.t > avg*2 && v.c>=4)
        out.push({ kind:"지점 취소율 급등", level:"warn",
          text:`${D.branchById[bid].name} 취소율 ${R.fmtPct(v.c/v.t)} — 30일 전사 평균(${R.fmtPct(avg)})의 2배 초과`, at:D.NOW });
    });
    const refunding = D.reservations.find(r=>r.refund && r.refund.state==="처리 중");
    if (refunding) out.push({ kind:"PG 환불 재시도", level:"warn",
      text:`${refunding.id} 환불 처리 중 — PG 응답 지연, 자동 재시도 대기`, at:D.NOW });
    /* 세 숫자 검산 (9.4) — 불일치 시에만 신호 */
    const chk = threeWayCheck();
    if (!chk.ok) out.push({ kind:"정산 · 통계 불일치", level:"hot",
      text:`전월 정산 합계와 월 리포트가 ${R.fmtWon(Math.abs(chk.diff))} 차이 — 지급 보류`, at:D.NOW });
    return out;
  }

  /* ── 지점 현황 (5.5) ── */
  function branchBoard(){
    const [wf] = D.weekRange(T);
    const per = D.branches.map(b=>{
      let cnt=0;
      for(let d=new Date(wf); d<=T; d=D.addDays(d,1)) cnt += scope(daily(k(d)),b.id).useCnt;
      return { b, cnt, occ: D.occRate[b.id]||0 };
    });
    const byCnt=[...per].sort((a,c)=>c.cnt-a.cnt);
    const byOcc=[...per].sort((a,c)=>a.occ-c.occ);
    return { top: byCnt.slice(0,5), low: byCnt.slice(-5).reverse(), occLow: byOcc.slice(0,5) };
  }

  /* ── 세 숫자 일치 (9.4) — 정산 = 월 리포트 = 이달(전월) 매출 ── */
  function threeWayCheck(){
    const settleSum = D.settlement.rows.reduce((a,r)=>a+r.sales,0);
    let report=0;
    const pm = new Date(T.getFullYear(), T.getMonth()-1, 1);
    D.reservations.forEach(r=>{
      if ((r.status==="COMPLETED"||r.status==="NO_SHOW") &&
          r.useDate.getFullYear()===pm.getFullYear() && r.useDate.getMonth()===pm.getMonth())
        report += r.amount;
    });
    return { ok: settleSum===report, settleSum, report, diff: settleSum-report };
  }

  /* ── 노쇼 후보 (4.3) ── */
  function noshowCandidates(branchId){
    const nowH = D.NOW.getHours() + D.NOW.getMinutes()/60;
    return D.reservations.filter(r=>
      (!branchId || r.branchId===branchId) &&
      r.status==="CONFIRMED" && k(r.useDate)===k(T) &&
      !r.checkin && (r.sh + R.POLICY.noshowWaitMin/60) <= nowH);
  }

  /* ── 채널 마감 확인 (8.1 — 자사 확정 → 점주 리마인더) ── */
  function channelCloseReminders(branchId){
    return D.reservations.filter(r=>
      r.branchId===branchId && r.channel==="own" && r.status==="CONFIRMED" &&
      r.useDate>=T && Math.floor((D.NOW-r.createdAt)/3600000)<48 && !r.chClosed);
  }

  /* ── 지점 KPI 표 (10.3) ── */
  function branchKpiRows(){
    const pm={};
    D.reservations.forEach(r=>{
      const key=r.branchId;
      pm[key] ||= { sales:0, done:0, cxl:0, tot:0, ns:0, chN:0, chS:0, chAll:0, lead:0, leadN:0 };
      const m=pm[key];
      const inMonth = r.useDate.getMonth()===T.getMonth() && r.useDate.getFullYear()===T.getFullYear();
      if (inMonth && (r.status==="COMPLETED"||r.status==="NO_SHOW")){ m.sales+=r.amount; m.done++; }
      const dd=Math.floor((T-r.createdAt)/D.dayMs);
      if (dd>=0&&dd<30&&r.status!=="HOLD"){ m.tot++; if(r.status==="CANCELLED")m.cxl++; }
      if (inMonth && r.status!=="HOLD" && r.status!=="CANCELLED"){
        m.chAll++; if(r.channel==="naver")m.chN++; if(r.channel==="spacecloud")m.chS++;
        m.lead += Math.max(0,Math.floor((r.useDate-r.createdAt)/D.dayMs)); m.leadN++;
      }
      if (inMonth && r.status==="NO_SHOW") m.ns++;
    });
    return D.branches.map(b=>{
      const m=pm[b.id]||{sales:0,done:0,cxl:0,tot:0,ns:0,chN:0,chS:0,chAll:0,lead:0,leadN:0};
      return { b,
        occ: D.occRate[b.id]||0,
        sales: m.sales,
        avg: m.done? m.sales/m.done : 0,
        cxl: m.tot? m.cxl/m.tot : 0,
        ns: m.done? m.ns/m.done : 0,
        chN: m.chAll? m.chN/m.chAll:0, chS: m.chAll? m.chS/m.chAll:0,
        lead: m.leadN? m.lead/m.leadN : 0 };
    });
  }

  /* ── 채널 통계 (12.3 /stats/channels) ── */
  function channelStats(){
    const out={ own:{c:0,s:0}, naver:{c:0,s:0}, spacecloud:{c:0,s:0}, phone:{c:0,s:0}, etc:{c:0,s:0} };
    D.reservations.forEach(r=>{
      if (r.status==="HOLD"||r.status==="CANCELLED") return;
      const dd=Math.floor((T-r.useDate)/D.dayMs);
      if (dd<0||dd>=28) return;
      out[r.channel].c++; out[r.channel].s+=r.amount;
    });
    return out;
  }

  /* ── 공간 현황판 — 일간 (시간칸 단위) ── */
  function occupancyDay(date){
    const dk = k(date);
    const dayRes = D.reservations.filter(r=> k(r.useDate)===dk &&
      (r.status==="CONFIRMED"||r.status==="COMPLETED"||r.status==="NO_SHOW"||r.status==="HOLD"));
    const byRoom = {};
    dayRes.forEach(r=>{ (byRoom[r.roomId] ||= []).push(r); });
    const rows = [];
    D.branches.forEach(b=>b.rooms.forEach(room=>{
      const cells=[]; let sold=0, hold=0;
      for(let h=11; h<24; h++){
        const r=(byRoom[room.id]||[]).find(x=>x.sh<=h && h<x.eh);
        if(r){ cells.push({h, r, hold:r.status==="HOLD"}); r.status==="HOLD"? hold++ : sold++; }
        else cells.push({h});
      }
      rows.push({ b, room, cells, sold, hold, free:13-sold-hold });
    }));
    return rows;
  }

  /* ── 공간 현황판 — 기간 (일 단위 점유율) ── */
  function occupancyRange(from, to){
    const days=[]; for(let d=new Date(from); d<=to; d=D.addDays(d,1)) days.push(new Date(d));
    const idx={}; days.forEach((d,i)=>idx[k(d)]=i);
    const map={};
    D.reservations.forEach(r=>{
      const i=idx[k(r.useDate)]; if(i==null) return;
      if(!(r.status==="CONFIRMED"||r.status==="COMPLETED"||r.status==="NO_SHOW")) return;
      (map[r.roomId] ||= days.map(()=>({cnt:0,h:0})));
      map[r.roomId][i].cnt++; map[r.roomId][i].h += (r.eh-r.sh);
    });
    const rows=[];
    D.branches.forEach(b=>b.rooms.forEach(room=>{
      const cells=(map[room.id]||days.map(()=>({cnt:0,h:0}))).map(c=>({cnt:c.cnt, ratio:Math.min(1,c.h/13)}));
      rows.push({ b, room, cells, tot:cells.reduce((a,c)=>a+c.cnt,0) });
    }));
    return { days, rows };
  }

  /* ── 취소 · 환불 분석 (운영 개선 자료) ── */
  function cancelAnalysis(from, to){
    const toEnd = D.addDays(to,1);
    const list = D.reservations.filter(r=>{
      if(r.status!=="CANCELLED") return false;
      const at=r.cancelAt||r.createdAt; return at>=from && at<toEnd;
    }).sort((a,b)=>(b.cancelAt||b.createdAt)-(a.cancelAt||a.createdAt));
    let amt=0, refundCnt=0, refundAmt=0, exceptCnt=0, exceptAmt=0;
    const reasonDist={}, byBranch={};
    list.forEach(r=>{
      amt+=r.amount;
      const tag=(r.cancelReason&&r.cancelReason.tag)||"기타";
      reasonDist[tag]=(reasonDist[tag]||0)+1;
      byBranch[r.branchId]=(byBranch[r.branchId]||0)+1;
      if(r.refund){ refundCnt++; refundAmt+=r.refund.amt;
        if((r.refund.kind||"").startsWith("예외")){ exceptCnt++; exceptAmt+=r.refund.amt; } }
    });
    const topBranch=Object.entries(byBranch).sort((a,b)=>b[1]-a[1]).slice(0,5)
      .map(([bid,c])=>({b:D.branchById[bid], c}));
    return { list, cnt:list.length, amt, refundCnt, refundAmt, exceptCnt, exceptAmt, reasonDist, topBranch };
  }

  /* ── 공간(파티룸) KPI — 기간 · 공간 · 낮/밤/기타 선택 ── */
  function spaceKpi(o){
    const toEnd = D.addDays(o.to,1);
    const inScope = r => {
      if(o.branchSet && o.branchSet.size && !o.branchSet.has(r.branchId)) return false;
      if(o.roomSet && o.roomSet.size && !o.roomSet.has(r.roomId)) return false;
      if(o.region && D.branchById[r.branchId].region!==o.region) return false;
      return true;
    };
    const slotOk = r => o.slot==="all" ? true
      : o.slot==="etc" ? (r.slot!=="day" && r.slot!=="night") : r.slot===o.slot;
    const per={}, phones={};
    let cnt=0, sales=0, people=0, cxl=0, cxlAmt=0;
    D.reservations.forEach(r=>{
      if(!(r.useDate>=o.from && r.useDate<toEnd)) return;
      if(!inScope(r) || !slotOk(r)) return;
      const b=D.branchById[r.branchId];
      per[r.roomId] ||= { b, room:b.rooms.find(x=>x.id===r.roomId)||{name:r.roomName},
        cnt:0, sales:0, people:0, cxl:0, cxlAmt:0, phones:{} };
      const m=per[r.roomId];
      if(r.status==="CANCELLED"){ cxl++; cxlAmt+=r.amount; m.cxl++; m.cxlAmt+=r.amount; return; }
      if(r.status==="HOLD") return;
      cnt++; sales+=r.amount; people+=r.base+r.extra;
      m.cnt++; m.sales+=r.amount; m.people+=r.base+r.extra;
      phones[r.phone]=(phones[r.phone]||0)+1;
      m.phones[r.phone]=(m.phones[r.phone]||0)+1;
    });
    const days=Math.max(1, Math.round((o.to-o.from)/D.dayMs)+1);
    const spaceCnt = o.roomSet && o.roomSet.size ? o.roomSet.size
      : o.branchSet && o.branchSet.size
      ? [...o.branchSet].reduce((a,bid)=>a+D.branchById[bid].rooms.length,0)
      : o.region ? D.branches.filter(b=>b.region===o.region).reduce((a,b)=>a+b.rooms.length,0)
      : D.branches.reduce((a,b)=>a+b.rooms.length,0);
    const slotsPerDay = o.slot==="all" ? 2 : o.slot==="etc" ? 0 : 1;
    const cap = days*spaceCnt*slotsPerDay;
    const uniq=Object.keys(phones).length;
    const rep=Object.values(phones).filter(v=>v>1).length;
    const rows=Object.values(per).map(m=>{
      const u=Object.keys(m.phones).length;
      return Object.assign(m,{
        rate: slotsPerDay? m.cnt/(days*slotsPerDay) : 0,
        cxlRate: (m.cnt+m.cxl)? m.cxl/(m.cnt+m.cxl) : 0,
        revisit: u? Object.values(m.phones).filter(v=>v>1).length/u : 0 });
    }).sort((a,b)=>b.sales-a.sales);
    return { cnt, sales, people, cxl, cxlAmt,
      cxlRate:(cnt+cxl)? cxl/(cnt+cxl) : 0,
      bookRate: cap? cnt/cap : 0, cap, days, spaceCnt,
      revisit: uniq? rep/uniq : 0, rows };
  }

  /* ── 호스트별 정산 — 총매출 − 수수료 + 기타수익 − 기타비용 = 정산금액 ── */
  function hostSettle(bid, ym){
    const key=bid+"-"+ym;
    const adj = D.hostAdj[key] ||= { other:0, cost:0, rate:null };
    const [y,m]=ym.split("-").map(Number);
    const items = D.reservations.filter(r=> r.branchId===bid &&
      (r.status==="COMPLETED"||r.status==="NO_SHOW") &&
      r.useDate.getFullYear()===y && r.useDate.getMonth()===m-1)
      .sort((a,b)=>a.useDate-b.useDate);
    const fixed = ym===D.settlement.month ? D.settlement.rows.find(r=>r.branchId===bid) : null;
    if (fixed) return { fixed:true, sales:fixed.sales, rate:0.20, fee:fixed.fee,
      refund:fixed.refund, adj:fixed.adj, payout:fixed.payout, state:fixed.state, items };
    const sales = items.reduce((a,r)=>a+r.amount,0);
    const rate = adj.rate!=null ? adj.rate : D.settings.feeRate;
    const fee = Math.round(sales*rate);
    const payout = sales - fee + adj.other - adj.cost;
    return { fixed:false, sales, rate, fee, other:adj.other, cost:adj.cost, payout, items, adjKey:key };
  }
  function hostMonths(){
    const cur=D.monthKey(T);
    return [ { ym:cur, label:`${T.getMonth()+1}월 (당월 · 추정)` },
             { ym:D.settlement.month, label:`${+D.settlement.month.split("-")[1]}월 (확정)` } ];
  }

  /* ── 메시지 발송 통계 ── */
  function msgStats(){
    const tk=D.keyOf(T);
    let today=0, okC=0, tot=0, fail=0;
    D.messages.forEach(m=>{
      tot++;
      if(D.keyOf(m.at)===tk) today++;
      if(m.status==="성공"||m.status==="재발송 완료") okC++;
      if(m.status==="실패") fail++;
    });
    return { today, rate: tot? okC/tot : 1, fail, tot };
  }

  return { kpis, trend28, tasks, signals, branchBoard, threeWayCheck,
           noshowCandidates, channelCloseReminders, branchKpiRows, channelStats,
           occupancyDay, occupancyRange, cancelAnalysis, spaceKpi, hostSettle, hostMonths,
           msgStats,
           daily, scope };
})();

/* ============================================================
   SSOPLE Dashboard — components.js
   ============================================================ */
SP.ui = (() => {
  const R = SP.rules;

  /* ── DOM ── */
  function el(tag, attrs={}, ...kids){
    const n = document.createElement(tag);
    for (const [k,v] of Object.entries(attrs||{})){
      if (k==="class") n.className=v;
      else if (k==="html") n.innerHTML=v;
      else if (k.startsWith("on") && typeof v==="function") n.addEventListener(k.slice(2), v);
      else if (v!==false && v!=null) n.setAttribute(k, v===true?"":v);
    }
    kids.flat(9).forEach(c=>{ if(c==null||c===false) return;
      n.appendChild(typeof c==="string"||typeof c==="number" ? document.createTextNode(c) : c); });
    return n;
  }
  const frag = (...kids)=>{ const f=document.createDocumentFragment(); kids.flat(9).forEach(k=>k&&f.appendChild(k)); return f; };

  /* ── 배지 ── */
  const stBadge = st => el("span",{class:"badge "+R.STATUS[st].cls}, R.STATUS[st].label);
  const chBadge = ch => el("span",{class:"chip ch-"+ch}, R.CHANNELS[ch].label);
  const refundBadge = () => el("span",{class:"badge st-refund"},"환불 처리 중");
  const dueBadge = () => el("span",{class:"badge st-due"},"차액 결제 대기");

  /* ── 토스트 ── */
  let toastBox;
  function toast(msg, kind){
    if(!toastBox || !toastBox.isConnected){ toastBox=el("div",{class:"toasts"}); document.body.appendChild(toastBox); }
    const t = el("div",{class:"toast"+(kind?" "+kind:"")}, msg);
    toastBox.appendChild(t);
    setTimeout(()=>{ t.classList.add("out"); setTimeout(()=>t.remove(),300); }, 2600);
  }

  /* ── 모달 ── */
  function modal(title, bodyNode, actions){
    const back = el("div",{class:"modal-back", onclick:e=>{ if(e.target===back) close(); }});
    const closeBtn = el("button",{class:"icon-btn", onclick:()=>close(), "aria-label":"닫기"},"✕");
    const foot = el("div",{class:"modal-foot"});
    (actions||[]).forEach(a=>{
      foot.appendChild(el("button",{class:"btn "+(a.kind||"ghost"),
        onclick:()=>{ if(a.onClick(close)!==false){} }}, a.label));
    });
    const box = el("div",{class:"modal", role:"dialog", "aria-modal":"true"},
      el("div",{class:"modal-head"}, el("h3",{},title), closeBtn),
      el("div",{class:"modal-body"}, bodyNode),
      actions&&actions.length? foot : null);
    back.appendChild(box); document.body.appendChild(back);
    function close(){ back.remove(); }
    return { close };
  }

  /* ── 우측 드로어 (예약 상세) ── */
  function drawer(titleNode, bodyNode){
    const back = el("div",{class:"drawer-back", onclick:e=>{ if(e.target===back) close(); }});
    const box = el("aside",{class:"drawer"},
      el("div",{class:"drawer-head"}, titleNode,
        el("button",{class:"icon-btn", onclick:()=>close(),"aria-label":"닫기"},"✕")),
      el("div",{class:"drawer-body"}, bodyNode));
    back.appendChild(box); document.body.appendChild(back);
    function close(){ back.remove(); }
    return { close, box };
  }

  /* ── 카드 ── */
  const card = (cls, ...kids) => el("section",{class:"card "+(cls||"")}, ...kids);
  const secHead = (t, sub, right) => el("div",{class:"sec-head"},
      el("div",{}, el("h2",{},t), sub?el("p",{class:"sub"},sub):null),
      right?el("div",{class:"sec-right"},right):null);

  /* ── SVG 콤보 차트 (막대=건수, 선=매출) ── */
  function comboChart(days, W=760, H=190){
    const padL=6, padR=6, padB=20, padT=8;
    const iw=W-padL-padR, ih=H-padT-padB;
    const maxC=Math.max(...days.map(d=>d.cnt),1), maxS=Math.max(...days.map(d=>d.sales),1);
    const bw = iw/days.length*0.62;
    const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.setAttribute("class","chart");
    const mk=(t,a)=>{ const n=document.createElementNS("http://www.w3.org/2000/svg",t);
      for(const[k,v]of Object.entries(a))n.setAttribute(k,v); return n; };
    days.forEach((d,i)=>{
      const x=padL+iw*(i+0.5)/days.length;
      const h=ih*(d.cnt/maxC);
      svg.appendChild(mk("rect",{x:x-bw/2,y:padT+ih-h,width:bw,height:Math.max(h,1),rx:2,class:"bar"+(d.today?" today":"")}));
      if(i%7===0||d.today) svg.appendChild(Object.assign(mk("text",{x, y:H-5, "text-anchor":"middle", class:"ax"}),{textContent:d.label}));
    });
    let path="";
    days.forEach((d,i)=>{
      const x=padL+iw*(i+0.5)/days.length, y=padT+ih*(1-d.sales/maxS);
      path += (i? " L":"M")+x.toFixed(1)+" "+y.toFixed(1);
    });
    svg.appendChild(mk("path",{d:path,class:"line"}));
    const last=days[days.length-1];
    const lx=padL+iw*(days.length-0.5)/days.length, ly=padT+ih*(1-last.sales/maxS);
    svg.appendChild(mk("circle",{cx:lx,cy:ly,r:3.4,class:"dot"}));
    return svg;
  }

  /* ── 미니 주간 막대 ── */
  function miniBars(vals, W=280, H=64){
    const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.setAttribute("class","mini");
    const max=Math.max(...vals,1), bw=W/vals.length*0.56;
    vals.forEach((v,i)=>{
      const x=W*(i+0.5)/vals.length, h=(H-14)*(v/max);
      const r=document.createElementNS("http://www.w3.org/2000/svg","rect");
      r.setAttribute("x",x-bw/2); r.setAttribute("y",H-h-2); r.setAttribute("width",bw);
      r.setAttribute("height",Math.max(h,1)); r.setAttribute("rx",2);
      r.setAttribute("class","bar"+(i===vals.length-1?" today":""));
      svg.appendChild(r);
    });
    return svg;
  }

  /* ── 히트 셀 ── */
  function heatCell(ratio, label){
    const a = Math.min(1, Math.max(0, ratio));
    const c = el("div",{class:"hcell", title:label||""});
    c.style.background = a===0 ? "var(--paper2)" :
      `color-mix(in srgb, var(--red) ${Math.round(8+a*80)}%, white)`;
    if(a>0.55) c.style.color="#fff";
    return c;
  }

  /* ── 페이지네이션 (50건 — 12.4) ── */
  function pager(total, page, per, onGo){
    const pages = Math.max(1, Math.ceil(total/per));
    const box = el("div",{class:"pager"},
      el("span",{class:"pinfo"},`${R.fmtNum(total)}건 · ${page+1}/${pages}`),
      el("button",{class:"btn tiny ghost", disabled:page===0, onclick:()=>onGo(page-1)},"이전"),
      el("button",{class:"btn tiny ghost", disabled:page>=pages-1, onclick:()=>onGo(page+1)},"다음"));
    return box;
  }

  /* ── CSV ── */
  function downloadCSV(name, rows){
    try{
      const csv = "\uFEFF"+rows.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\n");
      const url = URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
      const a = el("a",{href:url, download:name}); document.body.appendChild(a); a.click();
      setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },400);
      toast(name+" 내려받기 시작");
    }catch(e){ toast("이 환경에서는 파일 저장이 지원되지 않습니다","warn"); }
  }

  /* ── KPI 카드 ── */
  function kpi({label, value, sub, tip, onClick}){
    const c = el("button",{class:"kpi", onclick:onClick||null, title:tip||""},
      el("span",{class:"k-label"},label),
      el("strong",{class:"k-val num"},value),
      sub?el("span",{class:"k-sub"},sub):null);
    if(!onClick) c.disabled=true;
    return c;
  }

  return { el, frag, stBadge, chBadge, refundBadge, dueBadge, toast, modal, drawer,
           card, secHead, comboChart, miniBars, heatCell, pager, downloadCSV, kpi };
})();

      el("div",{class:"bb-grid"},
        bList("예약 상위 5", bb.top, x=>x.cnt+"건"),

        bList("가동률 하위 5 (최근 7일)", bb.occLow, x=>R.fmtPct(x.occ,0))));

    /* 업무 노트 — 나를 기다리는 확인 (10번 요구) */
    const uid=(SP.auth&&SP.auth.user)?SP.auth.user.id:"";

    const notesCard=U.card("", U.secHead("업무 노트",
        unread.length? `나를 기다리는 확인 ${unread.length}건` : "미확인 노트가 없습니다",
        el("button",{class:"btn tiny ghost", onclick:()=>SP.app.go("notes")},"노트 열기")),
      unread.length

              el("span",{class:"clip"}, n.text.length>46? n.text.slice(0,46)+"…" : n.text)))))

    root.append(routine, kpiRow, el("div",{class:"two-col"}, taskCard, sigCard),
