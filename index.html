/* ===== auth.js ===== */
/* ============================================================
   SSOPLE Dashboard — auth.js
   관리자 · 매니저 개별 계정 로그인. 계정 원본은 data.accounts 하나뿐이며,
   모든 입력 · 변경은 로그인 계정 이름으로 기록된다.
   (데모: 브라우저 저장을 쓰지 않으므로 새로고침 시 재로그인)
   ============================================================ */
SP.auth = (() => {
  const D = SP.data;
  let user = null;

  function login(id, pw){
    const a = D.accounts.find(x => x.id === id && x.pw === pw);
    if (!a) return false;
    user = a;
    SP.state.role = a.role;
    if (a.branchId) SP.state.branchId = a.branchId;
    D.logAudit("계정", a.id, "로그인");
    return true;
  }
  function logout(){
    if (user) D.logAudit("계정", user.id, "로그아웃");
    user = null;
  }
  const managers = () => D.accounts.filter(a => a.role==="hq_admin" || a.role==="hq_staff");
  const byId = id => D.accounts.find(a => a.id === id);
  const who = () => user ? user.name : "시스템";

  return { login, logout, managers, byId, who,
           get user(){ return user; },
           get accounts(){ return D.accounts; } };
})();


/* ===== persist.js ===== */
/* ============================================================
   SSOPLE Dashboard — persist.js v2
   저장 우선순위: D1 공유(/api/dash-sync) → 이 브라우저 → 세션.
   D1 모드에서는 변경분을 행 단위로 올리고 15초마다 다른 직원의
   변경을 받아온다. 같은 항목을 동시에 고치면 마지막 저장이 이긴다.
   ============================================================ */
SP.persist = (() => {
  const D = SP.data;
  const KEY = "ssople-dash-v1";
  const API = "/api/dash-sync";
  let mode = "memory";                     // remote | local | memory
  let mem = null, since = 0, pushing = false, timer = null;

  let lsOK = false;
  try { localStorage.setItem("__ss_t","1"); localStorage.removeItem("__ss_t"); lsOK = true; } catch(e){}

  const addedIds = new Set();
  const touched  = new Set();
  const branchEd = new Set();
  const dirty = { added:new Set(), patch:new Set(), branch:new Set() };
  const seedNotes = D.notices.length;

  const dN = v => v instanceof Date ? +v : v;
  const hD = v => (typeof v === "number" && v > 10000000) ? new Date(v) : v;
  const DATE_F  = ["useDate","createdAt","cancelAt","noshowAt","linkAt"];
  const PATCH_F = ["status","checkin","noshowAt","cancelAt","cancelReason","refund",
                   "pay","amountDue","memo","intIssue","ownIssue","chClosed","linkAt"];

  /* ── 직렬화 ── */
  function dehydRes(r){
    const c = {...r};
    DATE_F.forEach(k => { if (c[k]) c[k] = dN(c[k]); });
    if (c.refund) c.refund = {...c.refund, at: dN(c.refund.at)};
    c.memos = (r.memos||[]).map(m => ({...m, at: dN(m.at)}));
    c.audit = (r.audit||[]).slice(-12).map(a => ({...a, at: dN(a.at)}));
    return c;
  }
  function hydRes(o){
    const r = {...o};
    DATE_F.forEach(k => { if (r[k]) r[k] = hD(r[k]); });
    if (r.refund) r.refund = {...r.refund, at: hD(r.refund.at)};
    r.memos = (o.memos||[]).map(m => ({...m, at: hD(m.at)}));
    r.audit = (o.audit||[]).map(a => ({...a, at: hD(a.at)}));
    return r;
  }
  function patchOf(r){
    const p = {};
    PATCH_F.forEach(k => {
      if (k === "refund") p.refund = r.refund ? {...r.refund, at: dN(r.refund.at)} : null;
      else if (k==="noshowAt"||k==="cancelAt"||k==="linkAt") p[k] = r[k] ? dN(r[k]) : null;
      else p[k] = r[k];
    });
    p.memos = (r.memos||[]).map(m => ({...m, at: dN(m.at)}));
    p.audit = (r.audit||[]).slice(-12).map(a => ({...a, at: dN(a.at)}));
    return p;
  }
  function branchOf(code){
    const b = D.branches.find(x => x.code === code); if (!b) return null;
    const room = b.rooms[0];
    return { photo: room.photo||"", desc: room.desc, active: room.active!==false, hue: room.hue,
      priceDay: b.priceDay.slice(), priceNight: b.priceNight.slice(),
      pkgs: b.pkgs.map(p => ({k:p.k, p:p.p.slice(), url:p.url})) };
  }
  function mergeById(dst, inc, cap){
    const seen=new Set(dst.map(x=>x.id));
    (inc||[]).forEach(x=>{ if(x && x.id && !seen.has(x.id)){ dst.push({...x, at:hD(x.at)}); seen.add(x.id); } });
    dst.sort((a,b)=> (b.at&&a.at? b.at-a.at : 0));
    if (cap && dst.length>cap) dst.length=cap;
  }
  function kvAll(){
    const notes = D.notices.slice(0, Math.max(0, D.notices.length - seedNotes))
      .map(n => ({...n, at: dN(n.at), reads: {...n.reads}}));
    const reads = {};
    D.notices.forEach(n => { if (Object.keys(n.reads).length) reads[n.id] = {...n.reads}; });
    const dSer=a=>a.map(x=>({...x, at:dN(x.at), resolvedAt:x.resolvedAt?dN(x.resolvedAt):undefined}));
    return { settings:JSON.parse(JSON.stringify(D.settings)), hostAdj:D.hostAdj, notes, reads,
      batches:D.batches.slice(0,20).map(b=>({ id:b.id, at:dN(b.at), by:b.by, src:b.src,
        state:b.state, up:b.up, appliedIds:b.appliedIds,
        rows: b.state==="STAGED"? b.rows.slice(0,300):[], idx:b.idx,
        report: b.report? { at:dN(b.report.at), okN:b.report.okN, dupN:b.report.dupN,
          errN:b.report.errN, verdicts: b.state==="STAGED"? b.report.verdicts.slice(0,300):[] } : null })),
      slotLocks:D.slotLocks.map(l=>({...l, at:dN(l.at)})),
      taskAssign:{...D.taskAssign},
      payHold:{...D.payHold},
      reviews:D.reviews.filter(v=>v.up).map(v=>({...v, at:dN(v.at), replyAt:v.replyAt?dN(v.replyAt):null})),
      inquiries:D.inquiries.filter(q=>q.up).map(q=>({...q, at:dN(q.at), closedAt:q.closedAt?dN(q.closedAt):undefined})),
      orders:D.orders.filter(o=>o.up).map(o=>({...o, at:dN(o.at)})),
      partners:D.partners.filter(x=>x.up).map(x=>({...x})),
      leads:D.leads.slice(0,60).map(L=>({...L, at:dN(L.at)})),
      points:D.points.slice(0,300).map(t=>({...t, at:dN(t.at)})),
      incidents:D.incidents.slice(0,200).map(x=>({...x, at:dN(x.at),
        disputeUntil:dN(x.disputeUntil),
        disputedAt:x.disputedAt?dN(x.disputedAt):undefined,
        confirmedAt:x.confirmedAt?dN(x.confirmedAt):undefined,
        withdrawnAt:x.withdrawnAt?dN(x.withdrawnAt):undefined})),
      events:dSer(D.events.slice(0,250)), ledger:dSer(D.ledger.slice(0,400)),
      recon:dSer(D.reconQueue.slice(0,120)) };
  }

  /* ── 적용 (서버 · 브라우저 공용) ── */
  function applyBranch(code, e, register){
    const b = D.branches.find(x => x.code === code); if (!b || !e) return;
    const room = b.rooms[0];
    room.photo = e.photo||""; if (e.desc) room.desc = e.desc;
    room.active = e.active !== false; if (e.hue) room.hue = e.hue;
    (e.priceDay||[]).forEach((v,i)=>{ if(v!=null) b.priceDay[i]=v; });
    (e.priceNight||[]).forEach((v,i)=>{ if(v!=null) b.priceNight[i]=v; });
    room.priceDay = b.priceDay[0]; room.priceNight = b.priceNight[0];
    (e.pkgs||[]).forEach(pe => { const p = b.pkgs.find(x=>x.k===pe.k);
      if (p){ (pe.p||[]).forEach((v,i)=>p.p[i]=v); p.url = pe.url; } });
    if (register) branchEd.add(code);
  }
  function applyAdded(o, register){
    const i = D.reservations.findIndex(x => x.id === o.id);
    const r = hydRes(o);
    if (i >= 0) D.reservations[i] = r; else D.reservations.unshift(r);
    if (register) addedIds.add(o.id);
  }
  function applyPatch(id, p, register){
    const r = D.reservations.find(x => x.id === id); if (!r || !p) return;
    PATCH_F.forEach(k => {
      if (!(k in p)) return;
      if (k === "refund") r.refund = p.refund ? {...p.refund, at: hD(p.refund.at)} : null;
      else if (k==="noshowAt"||k==="cancelAt"||k==="linkAt") r[k] = p[k] ? hD(p[k]) : null;
      else r[k] = p[k];
    });
    if (p.memos) r.memos = p.memos.map(m => ({...m, at: hD(m.at)}));
    if (p.audit) r.audit = p.audit.map(a => ({...a, at: hD(a.at)}));
    if (register) touched.add(id);
  }
  function applyKv(k, v){
    if (!v) return;
    if (k === "settings" && v && typeof v==="object"){
      if (typeof v.feeRate==="number") D.settings.feeRate=v.feeRate;
      ["deposit","refundFullDays","disputeDays","inspectHours"].forEach(kk=>{
        if(typeof v[kk]==="number") D.settings[kk]=v[kk]; });
      if (v.deduct) Object.entries(v.deduct).forEach(([kk,vv])=>{
        if(D.settings.deduct[kk]) Object.assign(D.settings.deduct[kk], vv); });
      if (v.point) Object.assign(D.settings.point, v.point);
      if (v.anomaly) Object.assign(D.settings.anomaly, v.anomaly);
    }
    if (k === "hostAdj") Object.entries(v).forEach(([kk,vv]) => D.hostAdj[kk]=vv);
    if (k === "notes") (v||[]).slice().reverse().forEach(n => {
      if (!D.notices.some(x => x.id === n.id)) D.notices.unshift({...n, at: hD(n.at)});
    });
    if (k === "reads") Object.entries(v).forEach(([id,m]) => {
      const n = D.notices.find(x => x.id === id); if (n) Object.assign(n.reads, m);
    });
    if (k === "batches") (v||[]).forEach(iv=>{
      const loc=D.batches.find(x=>x.id===iv.id);
      if(!loc) D.batches.push({...iv, at:hD(iv.at),
        report: iv.report? {...iv.report, at:hD(iv.report.at)}:null});
      else if((iv.up||0)>(loc.up||0)){
        loc.state=iv.state; loc.appliedIds=iv.appliedIds||loc.appliedIds; loc.up=iv.up;
        if(iv.report) loc.report={...iv.report, at:hD(iv.report.at),
          verdicts: iv.report.verdicts&&iv.report.verdicts.length? iv.report.verdicts : (loc.report?loc.report.verdicts:[])};
      }
    });
    if (k === "slotLocks") mergeById(D.slotLocks, v, 60);
    if (k === "taskAssign") Object.entries(v||{}).forEach(([kk,vv])=>{
      const cur=D.taskAssign[kk];
      if(!cur || (vv.at||0)>(cur.at||0)) D.taskAssign[kk]=vv;
    });
    if (k === "payHold") Object.assign(D.payHold, v||{});
    if (k === "reviews") (v||[]).forEach(iv=>{
      const loc=D.reviews.find(x=>x.id===iv.id);
      if(loc && (iv.up||0)>(loc.up||0))
        Object.assign(loc,{reply:iv.reply, replyBy:iv.replyBy,
          replyAt:iv.replyAt?hD(iv.replyAt):null, state:iv.state, up:iv.up});
    });
    if (k === "inquiries") (v||[]).forEach(iv=>{
      const loc=D.inquiries.find(x=>x.id===iv.id);
      if(loc && (iv.up||0)>(loc.up||0))
        Object.assign(loc,{state:iv.state, assignee:iv.assignee, answer:iv.answer,
          closedAt:iv.closedAt?hD(iv.closedAt):loc.closedAt, up:iv.up});
    });
    if (k === "orders") (v||[]).forEach(iv=>{
      const loc=D.orders.find(x=>x.id===iv.id);
      if(loc){ if((iv.up||0)>(loc.up||0)) Object.assign(loc,{state:iv.state, up:iv.up}); }
      else D.orders.unshift({...iv, at:hD(iv.at)});
    });
    if (k === "partners") (v||[]).forEach(iv=>{
      const loc=D.partners.find(x=>x.id===iv.id);
      if(loc && (iv.up||0)>(loc.up||0)) Object.assign(loc,{state:iv.state, fee:iv.fee, up:iv.up});
    });
    if (k === "leads") (v||[]).forEach(iv=>{
      const loc=D.leads.find(x=>x.id===iv.id);
      if(!loc) D.leads.unshift({...iv, at:hD(iv.at)});
      else if((iv.up||0)>(loc.up||0)) Object.assign(loc,{stage:iv.stage, memo:iv.memo, up:iv.up});
    });
    if (k === "points") mergeById(D.points, (v||[]).map(x=>({...x})), 400);
    if (k === "incidents"){
      const RANK={PROPOSED:1,DISPUTED:2,WITHDRAWN:3,CONFIRMED:3};
      mergeById(D.incidents, (v||[]).map(x=>({...x,
        disputeUntil:hD(x.disputeUntil), disputedAt:x.disputedAt?hD(x.disputedAt):undefined,
        confirmedAt:x.confirmedAt?hD(x.confirmedAt):undefined,
        withdrawnAt:x.withdrawnAt?hD(x.withdrawnAt):undefined})), 200);
      (v||[]).forEach(iv=>{ const ic=D.incidents.find(x=>x.id===iv.id);
        if(ic && RANK[iv.state]>RANK[ic.state]){
          Object.assign(ic,{state:iv.state,
            disputedAt:iv.disputedAt?hD(iv.disputedAt):ic.disputedAt,
            confirmedAt:iv.confirmedAt?hD(iv.confirmedAt):ic.confirmedAt, confirmedBy:iv.confirmedBy,
            withdrawnAt:iv.withdrawnAt?hD(iv.withdrawnAt):ic.withdrawnAt}); } });
    }
    if (k === "events") mergeById(D.events, v, 400);
    if (k === "ledger") mergeById(D.ledger, v, 600);
    if (k === "recon"){
      mergeById(D.reconQueue, v, 200);
      (v||[]).forEach(iv=>{ const q=D.reconQueue.find(x=>x.id===iv.id);
        if(q && iv.state==="RESOLVED" && q.state!=="RESOLVED"){
          q.state="RESOLVED"; q.resolvedAt=hD(iv.resolvedAt); q.resolvedBy=iv.resolvedBy; q.resolveMemo=iv.resolveMemo; } });
    }
  }

  /* ── 브라우저 저장 (원격 실패 시) ── */
  function lsSnapshot(){
    const added = []; addedIds.forEach(id => {
      const r = D.reservations.find(x=>x.id===id); if (r) added.push(dehydRes(r)); });
    const patch = {}; touched.forEach(id => {
      if (addedIds.has(id)) return;
      const r = D.reservations.find(x=>x.id===id); if (r) patch[id] = patchOf(r); });
    const branch = {}; branchEd.forEach(c => { const e = branchOf(c); if (e) branch[c] = e; });
    return { v:1, at:Date.now(), added, patch, branch, ...kvAll() };
  }
  function lsSave(){
    try {
      const s = JSON.stringify(lsSnapshot());
      if (lsOK) localStorage.setItem(KEY, s); else mem = s;
    } catch(e){}
  }
  function lsLoad(){
    let s = null;
    try { s = lsOK ? localStorage.getItem(KEY) : mem; } catch(e){}
    if (!s) return;
    let o; try { o = JSON.parse(s); } catch(e){ return; }
    Object.entries(o.branch||{}).forEach(([c,e]) => applyBranch(c, e, true));
    (o.added||[]).forEach(a => applyAdded(a, true));
    Object.entries(o.patch||{}).forEach(([id,p]) => applyPatch(id, p, true));
    applyKv("settings", o.settings); applyKv("hostAdj", o.hostAdj);
    applyKv("notes", o.notes); applyKv("reads", o.reads);
    D.occInvalidate();
  }

  /* ── D1 공유 ── */
  const canFetch = () => typeof fetch === "function";
  async function remoteBoot(){
    if (!canFetch()) return false;
    try {
      let signal;
      try { const c = new AbortController(); setTimeout(()=>c.abort(), 3500); signal = c.signal; } catch(e){}
      const res = await fetch(API, { signal, headers:{accept:"application/json"} });
      if (!res || !res.ok) return false;
      const j = await res.json();
      if (!j || j.ok !== true) return false;
      (j.branch||[]).forEach(r => { try{ applyBranch(r.k, JSON.parse(r.v), true); }catch(e){} });
      (j.added ||[]).forEach(r => { try{ applyAdded(JSON.parse(r.v), true); }catch(e){} });
      (j.patch ||[]).forEach(r => { try{ applyPatch(r.k, JSON.parse(r.v), true); }catch(e){} });
      (j.kv    ||[]).forEach(r => { try{ applyKv(r.k, JSON.parse(r.v)); }catch(e){} });
      since = j.now || Date.now();
      D.occInvalidate();
      mode = "remote";
      setInterval(poll, 15000);
      return true;
    } catch(e){ return false; }
  }
  async function poll(){
    if (mode !== "remote" || pushing || !canFetch()) return;
    try {
      const res = await fetch(API + "?since=" + since);
      if (!res || !res.ok) return;
      const j = await res.json(); if (!j || !j.ok) return;
      let changed = 0;
      (j.branch||[]).forEach(r => { if (dirty.branch.has(r.k)) return;
        try{ applyBranch(r.k, JSON.parse(r.v), true); changed++; }catch(e){} });
      (j.added ||[]).forEach(r => { if (dirty.added.has(r.k)) return;
        try{ applyAdded(JSON.parse(r.v), true); changed++; }catch(e){} });
      (j.patch ||[]).forEach(r => { if (dirty.patch.has(r.k)) return;
        try{ applyPatch(r.k, JSON.parse(r.v), true); changed++; }catch(e){} });
      (j.kv    ||[]).forEach(r => { try{ applyKv(r.k, JSON.parse(r.v)); }catch(e){} });
      since = j.now || since;
      if (changed){
        D.occInvalidate();
        if (D.runTriggers) D.runTriggers();
        if (SP.app && !document.querySelector(".modal-back") && !document.querySelector(".drawer"))
          SP.app.render();
      }
    } catch(e){}
  }
  async function push(){
    if (pushing || !canFetch()) return;
    pushing = true;
    try {
      const body = { by:(SP.auth && SP.auth.user && SP.auth.user.name) || "",
        added:{}, patch:{}, branch:{}, kv:{} };
      dirty.added.forEach(id => { const r = D.reservations.find(x=>x.id===id);
        if (r) body.added[id] = JSON.stringify(dehydRes(r)); });
      dirty.patch.forEach(id => { const r = D.reservations.find(x=>x.id===id);
        if (r) body.patch[id] = JSON.stringify(patchOf(r)); });
      dirty.branch.forEach(c => { const e = branchOf(c); if (e) body.branch[c] = JSON.stringify(e); });
      const kv = kvAll();
      Object.keys(kv).forEach(k => body.kv[k] = JSON.stringify(kv[k]));
      const res = await fetch(API, { method:"PUT",
        headers:{ "content-type":"application/json" }, body: JSON.stringify(body) });
      if (res && res.ok){
        const j = await res.json();
        if (j && j.ok){ dirty.added.clear(); dirty.patch.clear(); dirty.branch.clear();
          since = j.now || since; }
      }
    } catch(e){}
    pushing = false;
  }

  function flush(){ if (mode === "remote") return push(); lsSave(); return Promise.resolve(); }
  function ping(){ clearTimeout(timer); timer = setTimeout(flush, 400); }

  /* 대부분의 변경은 logAudit · addNote를 지나간다 */
  const _la = D.logAudit;
  D.logAudit = function(){ _la.apply(null, arguments); ping(); };
  const _an = D.addNote;
  D.addNote = function(o){ const n = _an(o); ping(); return n; };

  function reset(){
    try { if (lsOK) localStorage.removeItem(KEY); } catch(e){}
    mem = null;
    if (mode !== "remote"){ addedIds.clear(); touched.clear(); branchEd.clear(); }
  }

  /* 부팅: 서버 먼저, 안 되면 브라우저 저장 */
  let _ready;
  const ready = new Promise(r => { _ready = r; });
  (async () => {
    const ok = await remoteBoot();
    if (!ok){ mode = lsOK ? "local" : "memory"; lsLoad(); }
    _ready();
  })();

  return {
    get mode(){ return mode; },
    ready, ping, reset,
    save: flush,
    addRes: id => { addedIds.add(id); dirty.added.add(id); ping(); },
    touch:  r  => { if (addedIds.has(r.id)) dirty.added.add(r.id);
                    else { touched.add(r.id); dirty.patch.add(r.id); } ping(); },
    branch: c  => { branchEd.add(c); dirty.branch.add(c); ping(); },
    _poll: poll, _push: push,
    _debug: () => ({ mode, added:[...addedIds], touched:touched.size,
                     branch:[...branchEd], dirty:{a:dirty.added.size,p:dirty.patch.size,b:dirty.branch.size} })
  };
})();


/* ===== metrics.js ===== */
/* ============================================================
   SSOPLE Dashboard — metrics.js
   KPI · 처리할 일 · 신호는 전부 여기서 계산한다.
   화면은 이 값을 그리기만 한다 — "모든 숫자는 출처가 있다"(3장 원칙 둘)
   ============================================================ */
SP.q = (() => {
  const R = SP.rules, D = SP.data;
  const k = D.keyOf, T = D.TODAY;

  const daily = key => D.statsDaily[key] || { byBranch:{}, tot:{useCnt:0,sales:0,refund:0,cancel:0,noshow:0,cntOwn:0,cntNaver:0,cntSc:0} };
  const scope = (row, branchId) => branchId ? (row.byBranch[branchId]||{useCnt:0,sales:0,refund:0,cancel:0,noshow:0,cntOwn:0,cntNaver:0,cntSc:0}) : row.tot;

  /* ── KPI 6종 (5.2 계산식 그대로) ── */
  function kpis(branchId){
    const todayKey = k(T);
    const tUse = scope(daily(todayKey), branchId);
    const todayRes = tUse.useCnt;
    const todaySales = tUse.sales - tUse.refund;

    const [wf, wt] = D.weekRange(T);
    let weekRes = 0;
    for(let d=new Date(wf); d<=wt; d=D.addDays(d,1)) weekRes += scope(daily(k(d)),branchId).useCnt;

    let monthSales = 0;                       // 이용 완료 기준 — 정산과 같은 잣대
    D.reservations.forEach(r=>{
      if (branchId && r.branchId!==branchId) return;
      if ((r.status==="COMPLETED"||r.status==="NO_SHOW") &&
          r.useDate.getMonth()===T.getMonth() && r.useDate.getFullYear()===T.getFullYear())
        monthSales += r.amount;
    });

    let cxl=0, conf=0;
    for(let d=0; d<30; d++){
      const row = scope(daily(k(D.addDays(T,-d))), branchId);
      cxl += row.cancel;
    }
    D.reservations.forEach(r=>{
      if (branchId && r.branchId!==branchId) return;
      const dd = Math.floor((T-r.createdAt)/D.dayMs);
      if (dd>=0 && dd<30 && r.status!=="HOLD") conf++;
    });
    const cancelRate = conf ? cxl/conf : 0;

    const nmToday = D.membersDaily[todayKey]||0;
    let nmWeek=0; for(let d=new Date(wf); d<=T; d=D.addDays(d,1)) nmWeek += D.membersDaily[k(d)]||0;

    return { todayRes, todaySales, weekRes, monthSales, cancelRate, nmToday, nmWeek };
  }

  /* ── 4주 추이 ── */
  function trend28(branchId){
    const out=[];
    for(let d=27; d>=0; d--){
      const date=D.addDays(T,-d), row=scope(daily(k(date)),branchId);
      out.push({ label:R.fmtMD(date), cnt:row.useCnt, sales:row.sales, today:d===0 });
    }
    return out;
  }

  /* ── 처리할 일 5종 (5.3) ── */
  function tasks(){
    const overdueLinks = D.reservations.filter(r=>r.status==="HOLD" && r.linkAt &&
      (D.NOW - r.linkAt) > R.POLICY.linkTtlHours*3600000);
    return {
      approvals: D.pendingChanges,
      approvalsOver: D.pendingChanges.filter(p=>p.over),
      disputes: D.settlement.disputes.filter(d=>d.state==="접수"||d.state==="이의 처리 중"),
      notifFails: D.notifFails,
      chatbot: D.chatbotOpen,
      links: overdueLinks
    };
  }

  /* ── 확인이 필요한 신호 6종 (5.4) — 데이터에서 실제 감지 ── */
  function signals(){
    const out=[];
    D.conflictLog.forEach(c=>{
      out.push({ kind:"외부 예약 충돌", level:"hot",
        text:`${D.branchById[c.branchId].name} ${c.date} ${c.range} — 채널 등록 시도를 거절 (자사 ${c.against} 선점)`,
        at:c.at });
    });
    /* 지점 취소율 급등 — 30일 평균의 2배 초과를 실제 계산 */
    const per={}; let allC=0, allT=0;
    D.reservations.forEach(r=>{
      const dd=Math.floor((T-r.createdAt)/D.dayMs);
      if(dd<0||dd>=30||r.status==="HOLD") return;
      per[r.branchId] ||= {c:0,t:0};
      per[r.branchId].t++; allT++;
      if(r.status==="CANCELLED"){ per[r.branchId].c++; allC++; }
    });
    const avg = allT? allC/allT : 0;
    Object.entries(per).forEach(([bid,v])=>{
      if (v.t>=14 && v.c/v.t > avg*2 && v.c>=4)
        out.push({ kind:"지점 취소율 급등", level:"warn",
          text:`${D.branchById[bid].name} 취소율 ${R.fmtPct(v.c/v.t)} — 30일 전사 평균(${R.fmtPct(avg)})의 2배 초과`, at:D.NOW });
    });
    const refunding = D.reservations.find(r=>r.refund && r.refund.state==="처리 중");
    if (refunding) out.push({ kind:"PG 환불 재시도", level:"warn",
      text:`${refunding.id} 환불 처리 중 — PG 응답 지연, 자동 재시도 대기`, at:D.NOW });
    /* 세 숫자 검산 (9.4) — 불일치 시에만 신호 */
    const chk = threeWayCheck();
    if (!chk.ok) out.push({ kind:"정산 · 통계 불일치", level:"hot",
      text:`전월 정산 합계와 월 리포트가 ${R.fmtWon(Math.abs(chk.diff))} 차이 — 지급 보류`, at:D.NOW });
    return out;
  }

  /* ── 지점 현황 (5.5) ── */
  function branchBoard(){
    const [wf] = D.weekRange(T);
    const per = D.branches.map(b=>{
      let cnt=0;
      for(let d=new Date(wf); d<=T; d=D.addDays(d,1)) cnt += scope(daily(k(d)),b.id).useCnt;
      return { b, cnt, occ: D.occRate[b.id]||0 };
    });
    const byCnt=[...per].sort((a,c)=>c.cnt-a.cnt);
    const byOcc=[...per].sort((a,c)=>a.occ-c.occ);
    return { top: byCnt.slice(0,5), low: byCnt.slice(-5).reverse(), occLow: byOcc.slice(0,5) };
  }

  /* ── 세 숫자 일치 (9.4) — 정산 = 월 리포트 = 이달(전월) 매출 ── */
  function threeWayCheck(){
    const settleSum = D.settlement.rows.reduce((a,r)=>a+r.sales,0);
    let report=0;
    const pm = new Date(T.getFullYear(), T.getMonth()-1, 1);
    D.reservations.forEach(r=>{
      if ((r.status==="COMPLETED"||r.status==="NO_SHOW") &&
          r.useDate.getFullYear()===pm.getFullYear() && r.useDate.getMonth()===pm.getMonth())
        report += r.amount;
    });
    return { ok: settleSum===report, settleSum, report, diff: settleSum-report };
  }

  /* ── 노쇼 후보 (4.3) ── */
  function noshowCandidates(branchId){
    const nowH = D.NOW.getHours() + D.NOW.getMinutes()/60;
    return D.reservations.filter(r=>
      (!branchId || r.branchId===branchId) &&
      r.status==="CONFIRMED" && k(r.useDate)===k(T) &&
      !r.checkin && (r.sh + R.POLICY.noshowWaitMin/60) <= nowH);
  }

  /* ── 채널 마감 확인 (8.1 — 자사 확정 → 점주 리마인더) ── */
  function channelCloseReminders(branchId){
    return D.reservations.filter(r=>
      r.branchId===branchId && r.channel==="own" && r.status==="CONFIRMED" &&
      r.useDate>=T && Math.floor((D.NOW-r.createdAt)/3600000)<48 && !r.chClosed);
  }

  /* ── 지점 KPI 표 (10.3) ── */
  function branchKpiRows(){
    const pm={};
    D.reservations.forEach(r=>{
      const key=r.branchId;
      pm[key] ||= { sales:0, done:0, cxl:0, tot:0, ns:0, chN:0, chS:0, chAll:0, lead:0, leadN:0 };
      const m=pm[key];
      const inMonth = r.useDate.getMonth()===T.getMonth() && r.useDate.getFullYear()===T.getFullYear();
      if (inMonth && (r.status==="COMPLETED"||r.status==="NO_SHOW")){ m.sales+=r.amount; m.done++; }
      const dd=Math.floor((T-r.createdAt)/D.dayMs);
      if (dd>=0&&dd<30&&r.status!=="HOLD"){ m.tot++; if(r.status==="CANCELLED")m.cxl++; }
      if (inMonth && r.status!=="HOLD" && r.status!=="CANCELLED"){
        m.chAll++; if(r.channel==="naver")m.chN++; if(r.channel==="spacecloud")m.chS++;
        m.lead += Math.max(0,Math.floor((r.useDate-r.createdAt)/D.dayMs)); m.leadN++;
      }
      if (inMonth && r.status==="NO_SHOW") m.ns++;
    });
    return D.branches.map(b=>{
      const m=pm[b.id]||{sales:0,done:0,cxl:0,tot:0,ns:0,chN:0,chS:0,chAll:0,lead:0,leadN:0};
      return { b,
        occ: D.occRate[b.id]||0,
        sales: m.sales,
        avg: m.done? m.sales/m.done : 0,
        cxl: m.tot? m.cxl/m.tot : 0,
        ns: m.done? m.ns/m.done : 0,
        chN: m.chAll? m.chN/m.chAll:0, chS: m.chAll? m.chS/m.chAll:0,
        lead: m.leadN? m.lead/m.leadN : 0 };
    });
  }

  /* ── 채널 통계 (12.3 /stats/channels) ── */
  function channelStats(){
    const out={ own:{c:0,s:0}, naver:{c:0,s:0}, spacecloud:{c:0,s:0}, phone:{c:0,s:0}, etc:{c:0,s:0} };
    D.reservations.forEach(r=>{
      if (r.status==="HOLD"||r.status==="CANCELLED") return;
      const dd=Math.floor((T-r.useDate)/D.dayMs);
      if (dd<0||dd>=28) return;
      out[r.channel].c++; out[r.channel].s+=r.amount;
    });
    return out;
  }

  /* ── 공간 현황판 — 일간 (시간칸 단위) ── */
  function occupancyDay(date){
    const dk = k(date);
    const dayRes = D.reservations.filter(r=> k(r.useDate)===dk &&
      (r.status==="CONFIRMED"||r.status==="COMPLETED"||r.status==="NO_SHOW"||r.status==="HOLD"));
    const byRoom = {};
    dayRes.forEach(r=>{ (byRoom[r.roomId] ||= []).push(r); });
    const rows = [];
    D.branches.forEach(b=>b.rooms.forEach(room=>{
      const cells=[]; let sold=0, hold=0;
      for(let h=11; h<24; h++){
        const r=(byRoom[room.id]||[]).find(x=>x.sh<=h && h<x.eh);
        if(r){ cells.push({h, r, hold:r.status==="HOLD"}); r.status==="HOLD"? hold++ : sold++; }
        else cells.push({h});
      }
      rows.push({ b, room, cells, sold, hold, free:13-sold-hold });
    }));
    return rows;
  }

  /* ── 공간 현황판 — 기간 (일 단위 점유율) ── */
  function occupancyRange(from, to){
    const days=[]; for(let d=new Date(from); d<=to; d=D.addDays(d,1)) days.push(new Date(d));
    const idx={}; days.forEach((d,i)=>idx[k(d)]=i);
    const map={};
    D.reservations.forEach(r=>{
      const i=idx[k(r.useDate)]; if(i==null) return;
      if(!(r.status==="CONFIRMED"||r.status==="COMPLETED"||r.status==="NO_SHOW")) return;
      (map[r.roomId] ||= days.map(()=>({cnt:0,h:0})));
      map[r.roomId][i].cnt++; map[r.roomId][i].h += (r.eh-r.sh);
    });
    const rows=[];
    D.branches.forEach(b=>b.rooms.forEach(room=>{
      const cells=(map[room.id]||days.map(()=>({cnt:0,h:0}))).map(c=>({cnt:c.cnt, ratio:Math.min(1,c.h/13)}));
      rows.push({ b, room, cells, tot:cells.reduce((a,c)=>a+c.cnt,0) });
    }));
    return { days, rows };
  }

  /* ── 취소 · 환불 분석 (운영 개선 자료) ── */
  function cancelAnalysis(from, to){
    const toEnd = D.addDays(to,1);
    const list = D.reservations.filter(r=>{
      if(r.status!=="CANCELLED") return false;
      const at=r.cancelAt||r.createdAt; return at>=from && at<toEnd;
    }).sort((a,b)=>(b.cancelAt||b.createdAt)-(a.cancelAt||a.createdAt));
    let amt=0, refundCnt=0, refundAmt=0, exceptCnt=0, exceptAmt=0;
    const reasonDist={}, byBranch={};
    list.forEach(r=>{
      amt+=r.amount;
      const tag=(r.cancelReason&&r.cancelReason.tag)||"기타";
      reasonDist[tag]=(reasonDist[tag]||0)+1;
      byBranch[r.branchId]=(byBranch[r.branchId]||0)+1;
      if(r.refund){ refundCnt++; refundAmt+=r.refund.amt;
        if((r.refund.kind||"").startsWith("예외")){ exceptCnt++; exceptAmt+=r.refund.amt; } }
    });
    const topBranch=Object.entries(byBranch).sort((a,b)=>b[1]-a[1]).slice(0,5)
      .map(([bid,c])=>({b:D.branchById[bid], c}));
    return { list, cnt:list.length, amt, refundCnt, refundAmt, exceptCnt, exceptAmt, reasonDist, topBranch };
  }

  /* ── 공간(파티룸) KPI — 기간 · 공간 · 낮/밤/기타 선택 ── */
  function spaceKpi(o){
    const toEnd = D.addDays(o.to,1);
    const inScope = r => {
      if(o.branchSet && o.branchSet.size && !o.branchSet.has(r.branchId)) return false;
      if(o.roomSet && o.roomSet.size && !o.roomSet.has(r.roomId)) return false;
      if(o.region && D.branchById[r.branchId].region!==o.region) return false;
      return true;
    };
    const slotOk = r => o.slot==="all" ? true
      : o.slot==="etc" ? (r.slot!=="day" && r.slot!=="night") : r.slot===o.slot;
    const per={}, phones={};
    let cnt=0, sales=0, people=0, cxl=0, cxlAmt=0;
    D.reservations.forEach(r=>{
      if(!(r.useDate>=o.from && r.useDate<toEnd)) return;
      if(!inScope(r) || !slotOk(r)) return;
      const b=D.branchById[r.branchId];
      per[r.roomId] ||= { b, room:b.rooms.find(x=>x.id===r.roomId)||{name:r.roomName},
        cnt:0, sales:0, people:0, cxl:0, cxlAmt:0, phones:{} };
      const m=per[r.roomId];
      if(r.status==="CANCELLED"){ cxl++; cxlAmt+=r.amount; m.cxl++; m.cxlAmt+=r.amount; return; }
      if(r.status==="HOLD") return;
      cnt++; sales+=r.amount; people+=r.base+r.extra;
      m.cnt++; m.sales+=r.amount; m.people+=r.base+r.extra;
      phones[r.phone]=(phones[r.phone]||0)+1;
      m.phones[r.phone]=(m.phones[r.phone]||0)+1;
    });
    const days=Math.max(1, Math.round((o.to-o.from)/D.dayMs)+1);
    const spaceCnt = o.roomSet && o.roomSet.size ? o.roomSet.size
      : o.branchSet && o.branchSet.size
      ? [...o.branchSet].reduce((a,bid)=>a+D.branchById[bid].rooms.length,0)
      : o.region ? D.branches.filter(b=>b.region===o.region).reduce((a,b)=>a+b.rooms.length,0)
      : D.branches.reduce((a,b)=>a+b.rooms.length,0);
    const slotsPerDay = o.slot==="all" ? 2 : o.slot==="etc" ? 0 : 1;
    const cap = days*spaceCnt*slotsPerDay;
    const uniq=Object.keys(phones).length;
    const rep=Object.values(phones).filter(v=>v>1).length;
    const rows=Object.values(per).map(m=>{
      const u=Object.keys(m.phones).length;
      return Object.assign(m,{
        rate: slotsPerDay? m.cnt/(days*slotsPerDay) : 0,
        cxlRate: (m.cnt+m.cxl)? m.cxl/(m.cnt+m.cxl) : 0,
        revisit: u? Object.values(m.phones).filter(v=>v>1).length/u : 0 });
    }).sort((a,b)=>b.sales-a.sales);
    return { cnt, sales, people, cxl, cxlAmt,
      cxlRate:(cnt+cxl)? cxl/(cnt+cxl) : 0,
      bookRate: cap? cnt/cap : 0, cap, days, spaceCnt,
      revisit: uniq? rep/uniq : 0, rows };
  }

  /* ── 호스트별 정산 — 총매출 − 수수료 + 기타수익 − 기타비용 = 정산금액 ── */
  function hostSettle(bid, ym){
    const key=bid+"-"+ym;
    const adj = D.hostAdj[key] ||= { other:0, cost:0, rate:null };
    const [y,m]=ym.split("-").map(Number);
    const items = D.reservations.filter(r=> r.branchId===bid &&
      (r.status==="COMPLETED"||r.status==="NO_SHOW") &&
      r.useDate.getFullYear()===y && r.useDate.getMonth()===m-1)
      .sort((a,b)=>a.useDate-b.useDate);
    const fixed = ym===D.settlement.month ? D.settlement.rows.find(r=>r.branchId===bid) : null;
    if (fixed) return { fixed:true, sales:fixed.sales, rate:0.20, fee:fixed.fee,
      refund:fixed.refund, adj:fixed.adj, payout:fixed.payout, state:fixed.state, items };
    const sales = items.reduce((a,r)=>a+r.amount,0);
    const rate = adj.rate!=null ? adj.rate : D.settings.feeRate;
    const fee = Math.round(sales*rate);
    const payout = sales - fee + adj.other - adj.cost;
    return { fixed:false, sales, rate, fee, other:adj.other, cost:adj.cost, payout, items, adjKey:key };
  }
  function hostMonths(){
    const cur=D.monthKey(T);
    return [ { ym:cur, label:`${T.getMonth()+1}월 (당월 · 추정)` },
             { ym:D.settlement.month, label:`${+D.settlement.month.split("-")[1]}월 (확정)` } ];
  }

  /* ── 메시지 발송 통계 ── */
  function msgStats(){
    const tk=D.keyOf(T);
    let today=0, okC=0, tot=0, fail=0;
    D.messages.forEach(m=>{
      tot++;
      if(D.keyOf(m.at)===tk) today++;
      if(m.status==="성공"||m.status==="재발송 완료") okC++;
      if(m.status==="실패") fail++;
    });
    return { today, rate: tot? okC/tot : 1, fail, tot };
  }

  return { kpis, trend28, tasks, signals, branchBoard, threeWayCheck,
           noshowCandidates, channelCloseReminders, branchKpiRows, channelStats,
           occupancyDay, occupancyRange, cancelAnalysis, spaceKpi, hostSettle, hostMonths,
           msgStats,
           daily, scope };
})();

/* ============================================================
   SSOPLE Dashboard — components.js
   ============================================================ */
SP.ui = (() => {
  const R = SP.rules;

  /* ── DOM ── */
  function el(tag, attrs={}, ...kids){
    const n = document.createElement(tag);
    for (const [k,v] of Object.entries(attrs||{})){
      if (k==="class") n.className=v;
      else if (k==="html") n.innerHTML=v;
      else if (k.startsWith("on") && typeof v==="function") n.addEventListener(k.slice(2), v);
      else if (v!==false && v!=null) n.setAttribute(k, v===true?"":v);
    }
    kids.flat(9).forEach(c=>{ if(c==null||c===false) return;
      n.appendChild(typeof c==="string"||typeof c==="number" ? document.createTextNode(c) : c); });
    return n;
  }
  const frag = (...kids)=>{ const f=document.createDocumentFragment(); kids.flat(9).forEach(k=>k&&f.appendChild(k)); return f; };

  /* ── 배지 ── */
  const stBadge = st => el("span",{class:"badge "+R.STATUS[st].cls}, R.STATUS[st].label);
  const chBadge = ch => el("span",{class:"chip ch-"+ch}, R.CHANNELS[ch].label);
  const refundBadge = () => el("span",{class:"badge st-refund"},"환불 처리 중");
  const dueBadge = () => el("span",{class:"badge st-due"},"차액 결제 대기");

  /* ── 토스트 ── */
  let toastBox;
  function toast(msg, kind){
    if(!toastBox || !toastBox.isConnected){ toastBox=el("div",{class:"toasts"}); document.body.appendChild(toastBox); }
    const t = el("div",{class:"toast"+(kind?" "+kind:"")}, msg);
    toastBox.appendChild(t);
    setTimeout(()=>{ t.classList.add("out"); setTimeout(()=>t.remove(),300); }, 2600);
  }

  /* ── 모달 ── */
  function modal(title, bodyNode, actions){
    const back = el("div",{class:"modal-back", onclick:e=>{ if(e.target===back) close(); }});
    const closeBtn = el("button",{class:"icon-btn", onclick:()=>close(), "aria-label":"닫기"},"✕");
    const foot = el("div",{class:"modal-foot"});
    (actions||[]).forEach(a=>{
      foot.appendChild(el("button",{class:"btn "+(a.kind||"ghost"),
        onclick:()=>{ if(a.onClick(close)!==false){} }}, a.label));
    });
    const box = el("div",{class:"modal", role:"dialog", "aria-modal":"true"},
      el("div",{class:"modal-head"}, el("h3",{},title), closeBtn),
      el("div",{class:"modal-body"}, bodyNode),
      actions&&actions.length? foot : null);
    back.appendChild(box); document.body.appendChild(back);
    function close(){ back.remove(); }
    return { close };
  }

  /* ── 우측 드로어 (예약 상세) ── */
  function drawer(titleNode, bodyNode){
    const back = el("div",{class:"drawer-back", onclick:e=>{ if(e.target===back) close(); }});
    const box = el("aside",{class:"drawer"},
      el("div",{class:"drawer-head"}, titleNode,
        el("button",{class:"icon-btn", onclick:()=>close(),"aria-label":"닫기"},"✕")),
      el("div",{class:"drawer-body"}, bodyNode));
    back.appendChild(box); document.body.appendChild(back);
    function close(){ back.remove(); }
    return { close, box };
  }

  /* ── 카드 ── */
  const card = (cls, ...kids) => el("section",{class:"card "+(cls||"")}, ...kids);
  const secHead = (t, sub, right) => el("div",{class:"sec-head"},
      el("div",{}, el("h2",{},t), sub?el("p",{class:"sub"},sub):null),
      right?el("div",{class:"sec-right"},right):null);

  /* ── SVG 콤보 차트 (막대=건수, 선=매출) ── */
  function comboChart(days, W=760, H=190){
    const padL=6, padR=6, padB=20, padT=8;
    const iw=W-padL-padR, ih=H-padT-padB;
    const maxC=Math.max(...days.map(d=>d.cnt),1), maxS=Math.max(...days.map(d=>d.sales),1);
    const bw = iw/days.length*0.62;
    const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.setAttribute("class","chart");
    const mk=(t,a)=>{ const n=document.createElementNS("http://www.w3.org/2000/svg",t);
      for(const[k,v]of Object.entries(a))n.setAttribute(k,v); return n; };
    days.forEach((d,i)=>{
      const x=padL+iw*(i+0.5)/days.length;
      const h=ih*(d.cnt/maxC);
      svg.appendChild(mk("rect",{x:x-bw/2,y:padT+ih-h,width:bw,height:Math.max(h,1),rx:2,class:"bar"+(d.today?" today":"")}));
      if(i%7===0||d.today) svg.appendChild(Object.assign(mk("text",{x, y:H-5, "text-anchor":"middle", class:"ax"}),{textContent:d.label}));
    });
    let path="";
    days.forEach((d,i)=>{
      const x=padL+iw*(i+0.5)/days.length, y=padT+ih*(1-d.sales/maxS);
      path += (i? " L":"M")+x.toFixed(1)+" "+y.toFixed(1);
    });
    svg.appendChild(mk("path",{d:path,class:"line"}));
    const last=days[days.length-1];
    const lx=padL+iw*(days.length-0.5)/days.length, ly=padT+ih*(1-last.sales/maxS);
    svg.appendChild(mk("circle",{cx:lx,cy:ly,r:3.4,class:"dot"}));
    return svg;
  }

  /* ── 미니 주간 막대 ── */
  function miniBars(vals, W=280, H=64){
    const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.setAttribute("class","mini");
    const max=Math.max(...vals,1), bw=W/vals.length*0.56;
    vals.forEach((v,i)=>{
      const x=W*(i+0.5)/vals.length, h=(H-14)*(v/max);
      const r=document.createElementNS("http://www.w3.org/2000/svg","rect");
      r.setAttribute("x",x-bw/2); r.setAttribute("y",H-h-2); r.setAttribute("width",bw);
      r.setAttribute("height",Math.max(h,1)); r.setAttribute("rx",2);
      r.setAttribute("class","bar"+(i===vals.length-1?" today":""));
      svg.appendChild(r);
    });
    return svg;
  }

  /* ── 히트 셀 ── */
  function heatCell(ratio, label){
    const a = Math.min(1, Math.max(0, ratio));
    const c = el("div",{class:"hcell", title:label||""});
    c.style.background = a===0 ? "var(--paper2)" :
      `color-mix(in srgb, var(--red) ${Math.round(8+a*80)}%, white)`;
    if(a>0.55) c.style.color="#fff";
    return c;
  }

  /* ── 페이지네이션 (50건 — 12.4) ── */
  function pager(total, page, per, onGo){
    const pages = Math.max(1, Math.ceil(total/per));
    const box = el("div",{class:"pager"},
      el("span",{class:"pinfo"},`${R.fmtNum(total)}건 · ${page+1}/${pages}`),
      el("button",{class:"btn tiny ghost", disabled:page===0, onclick:()=>onGo(page-1)},"이전"),
      el("button",{class:"btn tiny ghost", disabled:page>=pages-1, onclick:()=>onGo(page+1)},"다음"));
    return box;
  }

  /* ── CSV ── */
  function downloadCSV(name, rows){
    try{
      const csv = "\uFEFF"+rows.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\n");
      const url = URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
      const a = el("a",{href:url, download:name}); document.body.appendChild(a); a.click();
      setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },400);
      toast(name+" 내려받기 시작");
    }catch(e){ toast("이 환경에서는 파일 저장이 지원되지 않습니다","warn"); }
  }

  /* ── KPI 카드 ── */
  function kpi({label, value, sub, tip, onClick}){
    const c = el("button",{class:"kpi", onclick:onClick||null, title:tip||""},
      el("span",{class:"k-label"},label),
      el("strong",{class:"k-val num"},value),
      sub?el("span",{class:"k-sub"},sub):null);
    if(!onClick) c.disabled=true;
    return c;
  }

  function downloadText(name, text, mime){
    try{
      const b=new Blob([text],{type:mime||"text/javascript;charset=utf-8"});
      const u=URL.createObjectURL(b);
      const a=el("a",{href:u,download:name});
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(u),800);
    }catch(e){ toast("이 환경에서는 파일 내려받기가 제한됩니다","warn"); }
  }

  return { el, frag, stBadge, chBadge, refundBadge, dueBadge, toast, modal, drawer,
           card, secHead, comboChart, miniBars, heatCell, pager, downloadCSV, downloadText, kpi };
})();

  /* ═══════════════ AD-04 예약 통합 관리 ═══════════════ */
  const resState = {
    tab:"list", basis:"use", from:null, to:null, q:"",
    st:new Set(["HOLD","CONFIRMED","COMPLETED","CANCELLED","NO_SHOW"]),
    pay:new Set(), ch:new Set(), branch:null, page:0, linkOnly:false
  };
  SP.screens.applyResPreset = function(p){
    resState.page=0; resState.linkOnly=false; resState.branch=p.branch||null;
    if (p.basis) resState.basis=p.basis;
    const T=D.TODAY;
    if (p.preset==="today"){ resState.from=T; resState.to=T; }
    else if (p.preset==="week"){ const [f,t]=D.weekRange(T); resState.from=f; resState.to=t; }
    else if (p.preset==="month"){ resState.from=D.addDays(T,-30); resState.to=T; }
    if (p.preset==="links"){ resState.linkOnly=true; resState.basis="created";
      resState.from=D.addDays(T,-7); resState.to=T; resState.st=new Set(["HOLD"]); }
    else resState.st=new Set(["HOLD","CONFIRMED","COMPLETED","CANCELLED","NO_SHOW"]);
    if (p.fromD){ resState.from=p.fromD; resState.to=p.fromD; resState.basis="use"; }
    if (p.status){ resState.st=new Set(p.status); }
    if (p.id) resState.q=p.id; else resState.q="";
  };

  function filterRes(){
    const s=resState;
    const from = s.from || D.addDays(D.TODAY,-30);
    const to   = s.to   || D.addDays(D.TODAY, 30);
    const q = s.q.trim().toLowerCase();
    return D.reservations.filter(r=>{
      if (SP.state.role==="staff"){                     /* 스태프: 오늘 · 자기 지점만 (12.5) */
        if (r.branchId!==SP.state.branchId) return false;
        if (D.keyOf(r.useDate)!==D.keyOf(D.TODAY)) return false;
      }
      if (s.branch && r.branchId!==s.branch) return false;
      const base = s.basis==="use"? r.useDate : r.createdAt;
      if (base<from || base>=D.addDays(to,1)) return false;   // 종료일은 그날 끝까지 포함
      if (!s.st.has(r.status)) return false;
      if (s.pay.size && !s.pay.has(r.pay)) return false;
      if (s.ch.size && !s.ch.has(r.channel)) return false;
      if (s.linkOnly && !(r.status==="HOLD"&&r.linkAt&&(D.NOW-r.linkAt)>R.POLICY.linkTtlHours*3600000)) return false;
      if (q){
        const hay = (r.id+" "+r.name+" "+r.phone+" "+D.branchById[r.branchId].name+" "+r.roomName+" "+r.channelNo).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  function detailDrawer(r){
    const b=D.branchById[r.branchId];
    const money=perm("viewMoney");
    const canPhone = perm("viewPhoneFull") ||
      (SP.state.role==="owner" && SP.state.branchId===r.branchId && D.keyOf(r.useDate)===D.keyOf(D.TODAY));
    let phoneShown=false;

    const body = el("div",{});
    const dw = U.drawer(el("div",{}, el("h3",{}, r.id+" "), U.stBadge(r.status),
      r.refund&&r.refund.state==="처리 중"?U.refundBadge():null,
      r.amountDue>0?U.dueBadge():null), body);

    function line(k,v){ return el("div",{class:"d-line"}, el("span",{class:"d-k"},k), el("span",{class:"d-v"},v)); }
    const whoNow = () => (SP.auth && SP.auth.user) ? SP.auth.user.name : R.ROLES[SP.state.role].label;
    function audit(act){
      r.audit.push({at:new Date(), who:whoNow(), act});
      if (SP.persist) SP.persist.touch(r);
      D.logAudit("예약", r.id, act);
    }

    function paint(){
      body.innerHTML="";
      const phoneNode = el("span",{}, phoneShown? r.phone : R.maskPhone(r.phone), " ",
        canPhone && !phoneShown ? el("button",{class:"btn tiny ghost",onclick:()=>{
          phoneShown=true; audit("연락처 전체 열람"); paint(); U.toast("열람 기록이 감사 로그에 남았습니다");
        }},"전체 보기"):null);
      body.append(
        line("지점 · 공간", `${b.name} · ${r.roomName} (${r.slot==="day"?"낮":"밤"}타임)`),
        line("이용", `${R.fmtDateK(r.useDate)} ${R.fmtTime(r.sh)} ~ ${R.fmtTime(r.eh)}`),
        line("신청일", R.fmtDate(r.createdAt)),
        line("예약자", r.name), line("연락처", phoneNode),
        line("인원", R.fmtPeople(r.base,r.extra)),
        money? line("결제", `${R.fmtWon(r.amount)} · ${R.PAY[r.pay]}` + (r.amountDue>0? ` (차액 ${R.fmtWon(r.amountDue)} 결제 대기)`:"")):null,
        line("유입 채널", R.CHANNELS[r.channel].label + (r.channelNo? " · "+r.channelNo:"")),
        r.refund? line("환불", `${R.fmtWon(r.refund.amt)} · ${r.refund.state}` + (r.refund.state==="처리 중"?" — 카드사 사정에 따라 3~5영업일":"")) : null,
        line("보증금", r.deposit), r.options? line("옵션", r.options):null,
        (r.intIssue||r.ownIssue)? line("이슈", [r.intIssue&&"내부: "+r.intIssue, r.ownIssue&&"점주: "+r.ownIssue].filter(Boolean).join(" · ")):null
      );

      /* 액션 — 권한 매트릭스대로 (12.5) */
      const acts = el("div",{class:"d-acts"});
      const hq = perm("forceChange");
      if (r.status==="HOLD" && hq){
        acts.append(
          el("button",{class:"btn", onclick:()=>{
            const tr=D.setStatus(r,"CONFIRMED",{act:"수동 확정 (예외 건)"});
            if(!tr.ok){ U.toast(tr.reason,"warn"); return; }
            D.addLedger({refId:r.id, kind:"PAYMENT", amount:r.amount, memo:"수기 확정 — 결제 확인"});
            const bb=D.branchById[r.branchId];
            D.pushMsg({at:new Date(), tpl:"confirm", to:"customer", name:r.name, phone:r.phone, resId:r.id, branchId:r.branchId, by:whoNow()});
            D.pushMsg({at:new Date(), tpl:"host_new", to:"host", name:bb.owner, phone:D.hostPhone(bb), resId:r.id, branchId:r.branchId, by:whoNow()});
            U.toast(r.id+" 확정 — 고객 · 호스트 알림 발송"); refresh(); }},"수동 확정"),
          r.linkAt? el("button",{class:"btn ghost", onclick:()=>{ r.linkAt=new Date(); audit("결제링크 재발송");
            D.pushMsg({at:new Date(), tpl:"paylink", to:"customer", name:r.name, phone:r.phone, resId:r.id, branchId:r.branchId, by:whoNow()});
            U.toast("결제링크 재발송 — 유효 24시간"); paint(); }},"링크 재발송"):null,
          el("button",{class:"btn ghost", onclick:()=>{
            const tr=D.setStatus(r,"EXPIRED",{act:"홀드 만료 처리 — 슬롯 자동 반환"});

            U.toast("만료 처리 — 시간대 재개방"); refresh(); }},"만료 처리"));
      }
      if (r.status==="CONFIRMED" && hq){
        acts.append(
          el("button",{class:"btn ghost", onclick:()=>roomChange(r)},"방 · 시간 변경"),
          el("button",{class:"btn ghost", onclick:()=>peopleChange(r)},"인원 변경"),

      if (SP.state.role==="owner" && r.status==="CONFIRMED" && !r.checkin && D.keyOf(r.useDate)===D.keyOf(D.TODAY))
        acts.append(el("button",{class:"btn", onclick:()=>{ r.checkin=true; audit("체크인 확인"); U.toast("체크인 확인"); paint(); }},"체크인 확인"));
      body.append(acts,
        el("p",{class:"note"},"예약 삭제 기능은 없습니다 — 돈이 걸린 기록은 상태와 이력으로만 남깁니다 (6.3절)"));

      /* 타임라인 · 금전 원장 — 기획서 5.4~5.6 */
      const evs=D.events.filter(e=>e.refId===r.id).slice(0,8);
      const lgs=D.ledgerOf(r.id);
      body.append(el("h4",{class:"d-sub"},"타임라인 · 금전 원장"));
      body.append(el("ul",{class:"tl"},

  /* ── 수기 예약 등록 — 전화 · 카카오톡 상담 건 (담당자 이름으로 기록) ── */
  function manualModal(pre){
    let bid = pre? pre.branch.id : D.branches[0].id;
    const bSearch=el("input",{type:"search", placeholder:"지점 검색"});
    const bSel=el("select",{});
    const roomSel=el("select",{});
    const priceLine=el("p",{class:"note num"});
    function fillB(){
      const q=bSearch.value.trim(); bSel.innerHTML="";
      D.branches.filter(b=>!q||b.name.includes(q)).forEach(b=>
        bSel.appendChild(el("option",{value:b.id, selected:b.id===bid},`${b.region} · ${b.name}`)));
      if(![...bSel.options].some(o=>o.value===bid)) bid=bSel.value||D.branches[0].id;
      bSel.value=bid; fillRooms();
    }
    function fillRooms(){
      roomSel.innerHTML="";
      const b=D.branchById[bid];
      b.rooms.filter(rm=>rm.active!==false).forEach(rm=>
        roomSel.appendChild(el("option",{value:rm.id, selected:!!(pre&&pre.room&&pre.room.id===rm.id)},rm.name)));
      calc();
    }
    bSearch.oninput=fillB;
    bSel.onchange=()=>{ bid=bSel.value; fillRooms(); };
    const dIn=el("input",{type:"date", value:R.fmtDate(pre?pre.date:D.addDays(D.TODAY,1)), onchange:()=>calc()});
    const shSel=el("select",{onchange:()=>calc()},
      Array.from({length:13},(_,i)=>el("option",{value:11+i, selected:(pre?pre.s:18)===11+i},R.fmtTime(11+i))));
    const ehSel=el("select",{onchange:()=>calc()},
      Array.from({length:13},(_,i)=>el("option",{value:12+i, selected:(pre?Math.min(pre.e,24):23)===12+i},R.fmtTime(12+i))));
    const pplIn=el("input",{type:"number", min:"1", max:"40", value:(pre&&pre.people)||4, oninput:()=>calc()});
    const nameIn=el("input",{placeholder:"예약자 이름"});
    const phoneIn=el("input",{placeholder:"010-0000-0000"});
    let inflow="phone", payMode="link";
    const mkSeg=(opts, set, def)=>{ let cur=def; set(cur);
      return el("div",{class:"seg"}, opts.map(([v,t])=>el("button",{class:"seg-b"+(v===cur?" on":""),
        onclick:e=>{ cur=v; set(v);
          [...e.target.parentNode.children].forEach(x=>x.classList.remove("on")); e.target.classList.add("on"); }},t))); };
    const inflowSeg=mkSeg([["phone","전화 문의"],["etc","카카오톡 문의"]], v=>inflow=v, "phone");
    const paySeg=mkSeg([["link","결제링크 발송"],["transfer","계좌이체 확인"],["card","카드 결제 확인"]], v=>payMode=v, "link");
    const memoIn=el("textarea",{rows:"2", placeholder:"특이사항 메모 (선택) — 예: 생일파티, 케이크 반입"});
    const msg=el("div",{});
    function calc(){
      const b=D.branchById[bid]; const rm=b.rooms.find(x=>x.id===roomSel.value)||b.rooms[0];
      const sH=+shSel.value, eH=+ehSel.value;
      if(!rm || eH<=sH){ priceLine.textContent="종료가 시작보다 늦어야 합니다"; return 0; }
      const extra=Math.max(0,(+pplIn.value||4)-(rm.baseP||4));
      const amt=D.roomPrice(b, rm, sH<17?"day":"night", Math.min(eH-sH,5), extra);
      priceLine.textContent=`금액 자동 계산: ${R.fmtWon(amt)} — 기준 ${rm.baseP||4}인 + 추가 ${extra}인 (공간 관리의 요금표 기준)`;
      return amt;
    }
    fillB();
    U.modal("수기 예약 등록",
      el("div",{},
        el("div",{class:"form-grid"},
          el("label",{},"지점 검색", bSearch),
          el("label",{},"지점", bSel),
          el("label",{},"공간", roomSel),
          el("label",{},"이용일", dIn),
          el("label",{},"시작", shSel),
          el("label",{},"종료", ehSel),
          el("label",{},"총 인원", pplIn),
          el("label",{},"예약자", nameIn),
          el("label",{},"연락처", phoneIn),
          el("label",{class:"span2"},"문의 유입", inflowSeg),
          el("label",{class:"span2"},"결제 처리", paySeg),
          el("label",{class:"span2"},"특이사항 메모", memoIn)),
        priceLine, msg),
      [{label:"등록", kind:"btn", onClick:(close)=>{
        msg.innerHTML="";
        const b=D.branchById[bid]; const rm=b.rooms.find(x=>x.id===roomSel.value)||b.rooms[0];
        const date=dIn.value? new Date(dIn.value):null;
        const sH=+shSel.value, eH=+ehSel.value;
        if(!nameIn.value.trim()||!phoneIn.value.trim()||!date||eH<=sH){
          msg.appendChild(el("p",{class:"reject"},"예약자 · 연락처 · 이용일 · 시간을 확인해 주세요")); return false; }
        const hit=D.conflictAny(rm.id, date, sH, eH);
        if(hit){
          msg.appendChild(el("p",{class:"reject"},
            `이 시간대에 이미 ${hit.id} (${R.fmtTime(hit.sh)}~${R.fmtTime(hit.eh)})가 있어 서버가 저장을 거절했습니다`));
          return false; }
        if(D.isLockedSlot(rm.id, date, sH<17?"day":"night")){
          msg.appendChild(el("p",{class:"reject"},
            "긴급 잠금 슬롯 — 중복 확정 조사 중이라 신규 판매가 막혀 있습니다 (표 6-9①). 처리 대기함에서 해소 후 재개됩니다"));
          return false; }
        if(D.isFlagged(phoneIn.value)){
          if(!perm("settings")){
            msg.appendChild(el("p",{class:"reject"},
              "반복 위반 고객(차감 확정 2회 이상)입니다 — 예약 제한 대상. 마스터 승인으로만 등록할 수 있습니다 (9.3절)"));
            return false; }
          U.toast("반복 위반 고객 — 마스터 예외 승인으로 등록합니다","warn"); }
        const amt=calc();
        const who=(SP.auth&&SP.auth.user)?SP.auth.user.name:"운영팀";
        const paid = payMode!=="link";
        const memoT=memoIn.value.trim();
        const nr={ id:"R"+(200000+Math.floor(Math.random()*99999)),
          branchId:b.id, roomId:rm.id, roomName:rm.name,
          name:nameIn.value.trim(), phone:phoneIn.value.trim(),
          createdAt:new Date(), useDate:date, sh:sH, eh:eH, slot:sH<17?"day":"night",
          base:rm.baseP||4, extra:Math.max(0,(+pplIn.value||4)-(rm.baseP||4)), amount:amt,
          channel:inflow, pay: paid? payMode : "link",
          channelNo:"", status: paid? "CONFIRMED":"HOLD",
          deposit:"-", memo:memoT, intIssue:"", ownIssue:"", options:"",
          checkin:false, refund:null, amountDue:0,
          memos: memoT? [{at:new Date(), by:who, text:memoT}] : [],
          linkAt: paid? null : new Date(),
          audit:[{at:new Date(), who,
            act: paid? `수기 예약 등록 — ${payMode==="transfer"?"계좌이체 입금":"카드 결제"} 확인 후 확정`
                     : "수기 예약 등록 — 결제링크 발송 (유효 24시간)"}] };
        nr.quote = D.makeQuote(b, rm, nr.slot, eH-sH, nr.extra, date, amt);
        D.reservations.unshift(nr);
        if (SP.persist) SP.persist.addRes(nr.id);
        D.occInvalidate();
        D.logAudit("예약", nr.id, nr.audit[0].act);
        if (paid){
          D.logEvent("ReservationConfirmed", nr.id, "수기 등록 · 결제 확인");
          D.addLedger({refId:nr.id, kind:"PAYMENT", amount:amt,
            memo:`수기 예약 결제 (${payMode==="transfer"?"계좌이체":"카드"})`});
        } else {
          D.logEvent("HoldCreated", nr.id, "결제링크 발송 · 24시간 홀드");
        }
        if(paid){
          D.pushMsg({at:new Date(), tpl:"confirm", to:"customer", name:nr.name, phone:nr.phone, resId:nr.id, branchId:b.id, by:who});
          D.pushMsg({at:new Date(), tpl:"host_new", to:"host", name:b.owner, phone:D.hostPhone(b), resId:nr.id, branchId:b.id, by:who});
          U.toast("확정 등록 — 고객 · 호스트에게 알림을 보냈습니다");
        } else {
          D.pushMsg({at:new Date(), tpl:"paylink", to:"customer", name:nr.name, phone:nr.phone, resId:nr.id, branchId:b.id, by:who});
          U.toast("결제링크 발송 — 24시간 동안 시간대를 잡아둡니다");
        }
        close(); SP.app.go("res",{id:nr.id});
      }}]);
  }

  /* ── 네이버 예약 내역 가져오기 — 공식 연동 전 임시 파이프라인 ── */
  function ingestModal(){
    const ta=el("textarea",{rows:"7",
      placeholder:"네이버 파트너센터의 예약 목록을 드래그해 복사한 뒤 여기에 붙여넣으세요. 엑셀에서 복사해도 됩니다."});
    const hasHead=el("input",{type:"checkbox", checked:true});
    const prev=el("div",{});
    const result=el("div",{});
    let mapping=[], rows=[];
    const FIELDS=[["ignore","(무시)"],["branch","지점"],["date","이용일"],["sh","시작"],["eh","종료"],
      ["name","예약자"],["phone","연락처"],["people","인원"],["amount","금액"],["pkg","패키지"]];
    const GUESS=[[/지점|매장|공간|스토어/,"branch"],[/이용일|날짜|일자|이용 ?날/,"date"],[/시작/,"sh"],[/종료/,"eh"],
      [/예약자|이름|성함|고객/,"name"],[/연락처|전화|휴대/,"phone"],[/인원/,"people"],
      [/금액|결제|가격/,"amount"],[/패키지|상품|타임/,"pkg"]];
    const norm=s=>String(s??"").replace(/\s+/g,"");

    function parseRows(){
      const raw=ta.value.replace(/\r/g,"").split("\n").map(l=>l.replace(/^\s+|\s+$/g,"")).filter(Boolean);
      if(!raw.length) return {head:null, rows:[]};
      const delim = raw[0].includes("\t") ? "\t" : ",";
      const cells = raw.map(l=>l.split(delim).map(c=>c.trim()));
      const head = hasHead.checked ? cells.shift() : null;
      return {head, rows:cells};
    }
    function preview(){
      prev.innerHTML=""; result.innerHTML="";
      const p=parseRows(); rows=p.rows;
      if(!rows.length){ prev.appendChild(el("p",{class:"reject"},"붙여넣은 내용이 없습니다")); return; }
      const cols=Math.max(...rows.map(r=>r.length));
      mapping=Array.from({length:cols},(_,i)=>{
        if(p.head&&p.head[i]) for(const [re,f] of GUESS) if(re.test(p.head[i])) return f;
        return "ignore";
      });
      prev.append(
        el("p",{class:"sub"},`${rows.length}행 — 열마다 어떤 값인지 확인해 주세요`),
        el("div",{class:"f-row wrapseg"}, mapping.map((m,i)=>
          el("select",{onchange:e=>mapping[i]=e.target.value},
            FIELDS.map(([v,t])=>el("option",{value:v, selected:v===m},
              (p.head&&p.head[i]? p.head[i].slice(0,10)+" → ":"열"+(i+1)+" → ")+t))))),
        el("div",{style:"overflow-x:auto;margin-top:8px"},
          el("table",{class:"grid tight"}, el("tbody",{},
            rows.slice(0,5).map(r=>el("tr",{}, r.map(c=>el("td",{class:"clip"},c))))))));
    }
    function findBranch(t){
      const n=norm(t); if(!n) return null;
      return D.branches.find(b=>norm(b.name)===n||norm(b.shortName)===n||norm(b.code)===n)
        || D.branches.find(b=>n.includes(norm(b.area))&&n.includes(norm(b.shortName)))
        || D.branches.find(b=>n.includes(norm(b.name)))
        || D.branches.find(b=>norm(b.shortName).length>=3 && n.includes(norm(b.shortName)));
    }
    const pDate=s=>{ let m=String(s).match(/(20\d{2})[.\-\/년\s]+(\d{1,2})[.\-\/월\s]+(\d{1,2})/);
      if(m) return new Date(+m[1],+m[2]-1,+m[3]);
      m=String(s).match(/^(\d{1,2})[\/\.](\d{1,2})$/);
      return m? new Date(D.TODAY.getFullYear(),+m[1]-1,+m[2]) : null; };
    const pH=s=>{ const m=String(s).match(/(\d{1,2})\s*[:시]/); return m? +m[1] : null; };
    const pkgHours=t=>{ t=String(t||"");
      if(/올데이/.test(t)) return [12,22];
      if(/투나잇/.test(t)) return [19,24];
      if(/3\s*시간/.test(t)) return [14,17];
      if(/밤/.test(t)) return [18,23];
      if(/낮|오전/.test(t)) return [12,17];
      return null; };

    function commit(){
      result.innerHTML="";
      if(!rows.length) preview();
      if(!rows.length) return;
      const get=(row,f)=>{ const i=mapping.indexOf(f); return i>=0? (row[i]??""):""; };
      const who=(SP.auth&&SP.auth.user)?SP.auth.user.name:"운영팀";
      let okN=0, dup=0; const bad=[];
      rows.forEach((row,ri)=>{
        const b=findBranch(get(row,"branch"));
        if(!b){ bad.push([ri+1,"지점을 찾지 못함: "+(get(row,"branch")||"(빈칸)")]);
          D.addRecon({kind:"지점 미매칭", note:(get(row,"branch")||"(빈칸)")+" — "+ri+"행", src:"네이버 가져오기"}); return; }
        const date=pDate(get(row,"date"));
        if(!date){ bad.push([ri+1,"날짜 해석 실패: "+get(row,"date")]);
          D.addRecon({kind:"날짜 오류", note:String(get(row,"date"))+" — "+ri+"행", src:"네이버 가져오기"}); return; }
        const ph=pkgHours(get(row,"pkg"));
        let sh=pH(get(row,"sh")); if(sh==null) sh=ph? ph[0]:18;
        let eh=pH(get(row,"eh")); if(eh==null) eh=ph? ph[1]:Math.min(sh+5,24);
        if(eh<=sh) eh=Math.min(sh+5,24);
        const name=get(row,"name")||"네이버 고객";
        const dk=D.keyOf(date);
        if(D.reservations.some(x=>x.branchId===b.id && D.keyOf(x.useDate)===dk &&
            x.sh===sh && norm(x.name)===norm(name) && x.status!=="CANCELLED")){ dup++; return; }
        const hit=D.conflictAny(b.rooms[0].id, date, sh, eh);
        if(hit){ bad.push([ri+1,`시간 겹침 — 기존 ${hit.id}`]);
          D.addRecon({kind:"슬롯 충돌", refId:hit.id,
            note:`${b.name} ${R.fmtMD(date)} ${R.fmtTime(sh)} — 기존 ${hit.id}와 겹침`, src:"네이버 가져오기"}); return; }
        if(D.isFlagged(get(row,"phone"))){
          bad.push([ri+1,"반복 위반 고객 — 예약 제한, 대사함 확인"]);
          D.addRecon({kind:"반복 위반", note:`${name} ${get(row,"phone")} — ${b.name}`, src:"네이버 가져오기"}); return; }
        const people=parseInt(String(get(row,"people")).replace(/\D/g,""),10)||b.baseP;
        const extra=Math.max(0, people-b.baseP);
        const amtRaw=parseInt(String(get(row,"amount")).replace(/\D/g,""),10);
        const slot=sh<17?"day":"night";
        const nr={ id:"R"+(300000+Math.floor(Math.random()*99999)),
          branchId:b.id, roomId:b.rooms[0].id, roomName:b.rooms[0].name,
          name, phone:get(row,"phone")||"", createdAt:new Date(),
          useDate:date, sh, eh, slot, base:b.baseP, extra,
          amount: amtRaw>0? amtRaw : D.roomPrice(b, b.rooms[0], slot, Math.min(eh-sh,5), extra, date),
          channel:"naver", pay:"channel", channelNo:"", status:"CONFIRMED",
          deposit:"-", memo:"", intIssue:"", ownIssue:"", options:"",
          checkin:false, refund:null, amountDue:0, memos:[],
          audit:[{at:new Date(), who, act:"네이버 예약 내역 가져오기"}] };
        nr.quote = D.makeQuote(b, b.rooms[0], slot, eh-sh, extra, date, nr.amount);
        D.reservations.unshift(nr);
        D.logEvent("ExternalReservationImported", nr.id, `네이버 · ${b.name} ${R.fmtMD(date)}`);
        if(SP.persist) SP.persist.addRes(nr.id);
        okN++;
      });
      D.occInvalidate();
      D.logAudit("예약","네이버 가져오기",`등록 ${okN}건 · 중복 ${dup}건 · 실패 ${bad.length}건`);
      D.runTriggers();
      result.append(el("div",{class: okN? "accept":"reject"},
        el("b",{},`가져오기 완료 — 등록 ${okN}건 · 중복 건너뜀 ${dup}건 · 실패 ${bad.length}건${bad.length?` (대사 대기함 적재)`:``}`),
        bad.length? el("ul",{class:"plain"}, bad.slice(0,5).map(([n,m])=>el("li",{},`${n}행: ${m}`))) : null));
      if(okN) U.toast(`네이버 예약 ${okN}건 반영 — 원장 · 현황판 · 정산에 바로 잡힙니다`);
    }

    U.modal("네이버 예약 내역 가져오기",
      el("div",{},
        el("p",{class:"note"},"공식 연동 전 임시 절차입니다. 표를 복사해 붙여넣으면 원장에 반영되고, 같은 건을 다시 붙여넣어도 중복 등록되지 않습니다."),
        ta,
        el("div",{class:"f-row", style:"margin:8px 0"},
          el("label",{class:"sub"}, hasHead, " 첫 줄은 제목"),
          el("button",{class:"btn ghost tiny", onclick:preview},"미리보기"),
          el("span",{class:"grow"}),
          el("button",{class:"btn tiny", onclick:commit},"가져오기")),
        prev, result),
      [{label:"닫고 목록 보기", kind:"btn", onClick:(close)=>{ close(); SP.app.go("res"); }}]);
  }
