          {class:"seg-b"+(s.slot===v?" on":""), onclick:()=>{s.slot=v; s.page=0; SP.app.render();}},t))))));

    const res=Q.spaceKpi({ from:s.from, to:s.to, slot:s.slot,
      region: s.bid? "" : s.region,
      branchSet: s.bid? new Set([s.bid]) : null,
      roomSet: (s.bid && s.roomSet)? s.roomSet : null });

    root.appendChild(el("div",{class:"kpi-grid four"},
      U.kpi({label:"순매출", value:money()?R.fmtWon(res.sales):"—", sub:"취소 제외 · 이용 기준"}),
      U.kpi({label:"예약 건수", value:R.fmtNum(res.cnt)+"건"}),
      U.kpi({label:"예약률", value:R.fmtPct(res.bookRate,0), sub:`가용 ${R.fmtNum(res.cap)}슬롯 (${res.days}일 × ${res.spaceCnt}공간)`}),
      U.kpi({label:"이용 인원", value:R.fmtNum(res.people)+"명"})));
    root.appendChild(el("div",{class:"kpi-grid four"},
      U.kpi({label:"취소 건수", value:R.fmtNum(res.cxl)+"건"}),
      U.kpi({label:"취소 금액", value:money()?R.fmtWon(res.cxlAmt):"—"}),
      U.kpi({label:"취소율", value:R.fmtPct(res.cxlRate)}),
      U.kpi({label:"재방문율", value:R.fmtPct(res.revisit), sub:"기간 내 2회 이상 이용"})));
    if(s.slot==="etc")
      root.appendChild(el("p",{class:"note"},"현재 상품 구성은 낮 · 밤 패키지 두 가지입니다 — '기타' 매출은 향후 특수 상품 추가 시 여기로 집계됩니다"));

    const wrap=el("div",{});
    root.appendChild(U.card("table-card",
      U.secHead("공간별 상세", `${res.rows.length}개 공간 · 순매출순`,
        el("button",{class:"btn ghost tiny", onclick:()=>{
          U.downloadCSV("쏘플_공간KPI.csv",
            [["지점","공간","순매출","예약건수","예약률","이용인원","취소건수","취소금액","취소율","재방문율"]].concat(
              res.rows.map(m=>[m.b.name, m.room.name, m.sales, m.cnt, (m.rate*100).toFixed(1)+"%",
                m.people, m.cxl, m.cxlAmt, (m.cxlRate*100).toFixed(1)+"%", (m.revisit*100).toFixed(1)+"%"])));
        }},"엑셀 내려받기")), wrap));
    function draw(){
      wrap.innerHTML="";
      const per=12, page=Math.min(s.page, Math.max(0,Math.ceil(res.rows.length/per)-1));
      const slice=res.rows.slice(page*per,(page+1)*per);
      wrap.appendChild(el("table",{class:"grid"},
        el("thead",{},el("tr",{},["공간","순매출","건수","예약률","인원","취소","취소금액","취소율","재방문"].map(h=>el("th",{},h)))),
        el("tbody",{}, slice.map(m=>el("tr",{},
          el("td",{}, el("i",{class:"rdot", style:"background:"+((m.room&&m.room.hue)||"#C9C4BF")}),
            el("b",{},m.b.name), el("small",{class:"sub"}," "+m.room.name)),
          el("td",{class:"num"},money()?R.fmtWon(m.sales):"—"),
          el("td",{class:"num"},m.cnt),
          el("td",{class:"num"},R.fmtPct(m.rate,0)),
          el("td",{class:"num"},m.people),
          el("td",{class:"num"},m.cxl),
          el("td",{class:"num"},money()?R.fmtWon(m.cxlAmt):"—"),
          el("td",{class:"num"},R.fmtPct(m.cxlRate)),
          el("td",{class:"num"},R.fmtPct(m.revisit)))))));
      wrap.appendChild(U.pager(res.rows.length, page, per, p=>{s.page=p; draw();}));
    }
    draw();
  };

  /* ═══════════════ 호스트별 정산 ═══════════════ */
  const hsState={ ym:null, bid:null, q:"" };
  SP.screens.settleHost = function(root){
    const months=Q.hostMonths();
    hsState.ym ||= months[0].ym;
    hsState.bid ||= D.branches[0].id;
    const s=hsState;

    const list=()=>D.branches.filter(b=>!s.q || b.name.includes(s.q) || b.owner.includes(s.q));
    if(!list().some(b=>b.id===s.bid)) s.bid=(list()[0]||D.branches[0]).id;
    const hSel=el("select",{onchange:e=>{s.bid=e.target.value; SP.app.render();}});
    function fillH(){ hSel.innerHTML="";
      list().forEach(b=>hSel.appendChild(el("option",{value:b.id, selected:b.id===s.bid},
        `${b.region} · ${b.name} — ${b.owner} 호스트`))); }
    fillH();

    /* 수수료율 설정 */
    const rateIn=el("input",{type:"number", min:"0", max:"100", step:"0.5",
      value:(D.settings.feeRate*100).toFixed(1).replace(/\.0$/,""),
      disabled:!perm("settings"),
      title:perm("settings")?"":"수수료율 변경은 총괄 관리자만 (12.5절)"});
    rateIn.onchange=()=>{
      let v=parseFloat(rateIn.value);
      if(isNaN(v)||v<0||v>100){ U.toast("0~100 사이 값을 입력하세요","warn"); rateIn.value=(D.settings.feeRate*100); return; }
      const old=(D.settings.feeRate*100);
      if(v===old) return;
      D.settings.feeRate=v/100;
      D.logAudit("설정","수수료율",`기본 ${old}% → ${v}%`);
      U.toast(`수수료율 ${v}% 적용 — 당월 추정과 다음 정산부터`);
      SP.app.render();
    };

    root.appendChild(U.card("filter", el("div",{class:"f-row"},
      el("select",{onchange:e=>{s.ym=e.target.value; SP.app.render();}},
        months.map(m=>el("option",{value:m.ym, selected:s.ym===m.ym},m.label))),
      el("input",{type:"search", placeholder:"지점 · 호스트 검색", value:s.q,
        oninput:e=>{s.q=e.target.value; fillH();}}),
      hSel,
      el("span",{class:"grow"}),
      el("span",{class:"f-cap"},"기본 수수료율"), rateIn, el("span",{class:"sub"},"%"))));

    const b=D.branchById[s.bid];
    const r=Q.hostSettle(s.bid, s.ym);
    const rateShown=Math.round((r.rate)*1000)/10;

    const line=(k,v,cls,sub)=>el("div",{class:"stmt-line "+(cls||"")},
      el("span",{},k, sub?el("small",{class:"sub"}," · "+sub):null),
      el("span",{class:"num"},v));

    const card=U.card("",
      U.secHead(`${b.name} — ${b.owner} 호스트`,
        r.fixed? "확정 월 — 값이 잠겨 있습니다. 오류는 월 마감 보드의 조정(익월 조정분)으로 처리하세요"
               : "당월 추정 — 매일 새벽 집계로 갱신되며, 익월 1일 확정됩니다",
        el("span",{class:"badge "+(r.fixed? "st-done":"st-hold")}, r.fixed? (r.state||"확정") : "추정")),
      line("총매출", R.fmtWon(r.sales), "", `${r.items.length}건 이용`),
      line(`− 본사 수수료 (${rateShown}%)`, R.fmtWon(r.fee), "sub"),
      r.fixed? line("− 환불 차감", r.refund? R.fmtWon(r.refund):"—", "sub") : null,
      r.fixed? line("조정 (이의 반영)", r.adj? (r.adj>0?"+":"")+R.fmtWon(r.adj):"—", "sub") : null,
      !r.fixed? line("+ 기타수익", R.fmtWon(r.other||0), "sub", "가산") : null,
      !r.fixed? line("− 기타비용", R.fmtWon(r.cost||0), "sub", "차감") : null,
      line("정산금액", R.fmtWon(r.payout), "total"));
    root.appendChild(card);

    /* 조정 입력 (당월 추정만) */
    if(!r.fixed && perm("settleAdjust")){
      const adj=D.hostAdj[r.adjKey];
      const inO=el("input",{type:"number", step:"10000", value:adj.other||0});
      const inC=el("input",{type:"number", step:"10000", value:adj.cost||0});
      const inR=el("input",{type:"number", step:"0.5", placeholder:"기본",
        value: adj.rate!=null? (adj.rate*100):"" });
      const inM=el("input",{placeholder:"조정 사유 메모 — 예: 정수기 렌탈비 본사 대납분", value:adj.memo||""});
      root.appendChild(U.card("",
        U.secHead("이 호스트의 조정 항목","기타수익은 가산(+) · 기타비용은 차감(−) — 저장 시 담당자 이름으로 기록"),
        el("div",{class:"form-grid"},
          el("label",{},"기타수익 (원)", inO),
          el("label",{},"기타비용 (원)", inC),
          el("label",{},"개별 수수료율 (%)", inR),
          el("label",{class:"span2"},"메모", inM)),
        el("div",{class:"f-row"},
          el("button",{class:"btn", onclick:()=>{
            const tgt=`${D.monthLabel(s.ym)} · ${b.name}`;
            const diffs=[];
            const nO=+inO.value||0, nC=+inC.value||0;
            const nR=inR.value===""? null : Math.max(0,Math.min(100,parseFloat(inR.value)))/100;
            if(nO!==adj.other){ diffs.push(`기타수익 ${R.fmtNum(adj.other)} → ${R.fmtNum(nO)}`); adj.other=nO; }
            if(nC!==adj.cost){ diffs.push(`기타비용 ${R.fmtNum(adj.cost)} → ${R.fmtNum(nC)}`); adj.cost=nC; }
            if(nR!==adj.rate){ diffs.push(`개별 수수료율 ${adj.rate==null?"기본":(adj.rate*100)+"%"} → ${nR==null?"기본":(nR*100)+"%"}`); adj.rate=nR; }
            if(inM.value.trim()!==(adj.memo||"")){ adj.memo=inM.value.trim(); diffs.push("메모 수정"); }
            if(!diffs.length){ U.toast("변경된 항목이 없습니다"); return; }
            diffs.forEach(d=>D.logAudit("정산", tgt, d));
            U.toast(`조정 저장 (${diffs.length}건) — 담당 ${me().name}`);
            SP.app.render();
          }},"조정 저장"),
          el("span",{class:"sub"},"차감형 항목을 기타수익 칸에 넣어야 한다면 음수로 입력할 수 있습니다"))));
    }

    /* 예외 환불 참고 */
    const [yy,mm]=s.ym.split("-").map(Number);
    const exc=D.reservations.filter(x=>x.branchId===s.bid && x.status==="CANCELLED" &&
      x.refund && (x.refund.kind||"").startsWith("예외") && x.cancelAt &&
      x.cancelAt.getFullYear()===yy && x.cancelAt.getMonth()===mm-1);
    if(exc.length){
      const sum=exc.reduce((a,x)=>a+x.refund.amt,0);
      root.appendChild(el("p",{class:"note"},
        `참고 — 이 달 컴플레인 예외 환불 ${exc.length}건 · ${R.fmtWon(sum)}. 부담 주체 협의 후 기타비용 반영을 검토하세요 (취소 · 환불 화면에 상세).`));
    }

    /* 건별 내역 */
    let page=0; const wrap=el("div",{});
    root.appendChild(U.card("table-card",
      U.secHead("건별 내역", `${r.items.length}건 — 이용 완료 · 노쇼 포함`,
        el("button",{class:"btn ghost tiny", onclick:()=>{
          U.downloadCSV(`쏘플_호스트정산_${b.name}_${s.ym}.csv`,
            [["이용일","공간","인원","채널","금액","상태"]].concat(
              r.items.map(x=>[R.fmtDate(x.useDate), x.roomName, x.base+x.extra,
                R.CHANNELS[x.channel].label, x.amount, R.STATUS[x.status].label])));
        }},"명세 내려받기")), wrap));
    function draw(){
      wrap.innerHTML="";
      const per=10, slice=r.items.slice(page*per,(page+1)*per);
      wrap.appendChild(el("table",{class:"grid"},
        el("thead",{},el("tr",{},["이용일","공간","인원","채널","금액","상태"].map(h=>el("th",{},h)))),
        el("tbody",{}, slice.map(x=>el("tr",{tabindex:"0", onclick:()=>SP.screens.detailDrawer(x)},
          el("td",{class:"num"},R.fmtDate(x.useDate)),
          el("td",{},x.roomName),
          el("td",{},R.fmtPeople(x.base,x.extra)),
          el("td",{},U.chBadge(x.channel)),
          el("td",{class:"num"},R.fmtWon(x.amount)),
          el("td",{},U.stBadge(x.status)))))));
      wrap.appendChild(U.pager(r.items.length, page, 10, p=>{page=p; draw();}));
    }
    draw();
  };
})();


/* ===== app.js ===== */
/* ============================================================
   SSOPLE Dashboard — app.js
   로그인 게이트 · 상단바 · 데이터 출처 레일 · 라우터
   ============================================================ */
SP.state = { role:"hq_admin", branchId: SP.data.branches[0].id, screen:"dash", pre:null };

SP.app = (() => {
  const R=SP.rules, D=SP.data, Q=SP.q, U=SP.ui;
  const { el } = U;
  let rootEl, railEl, ident, built=false;

  const NAV = {
    hq:    [["dash","대시보드"],["res","예약"],["board","현황판"],["spaces","공간"],
            ["cancel","취소환불"],["msg","알림"],["settle","정산"],["stats","통계"],
            ["notes","노트"],["audit","이력"]],
    owner: [["ohome","내 대시보드"],["ospace","내 공간"],["ochan","채널 등록"],["osettle","정산 명세"]],
    staff: [["res","오늘 예약"]]
  };
  const navFor = () =>
    SP.state.role==="owner" ? NAV.owner : SP.state.role==="staff" ? NAV.staff : NAV.hq;

  function go(screen, pre){
    SP.state.screen=screen; SP.state.pre=pre||null;
    if (screen==="res" && pre) SP.screens.applyResPreset(pre);
    render();
    try{ window.scrollTo(0,0); }catch(e){}
  }

  /* 데모·테스트 심 — 해당 역할의 첫 계정으로 로그인 */
  function setRole(role){
    const a=D.accounts.find(x=>x.role===role);
    if(a) SP.auth.login(a.id, a.pw);
    SP.state.screen=navFor()[0][0];
    if(!built) buildChrome();
    render();
  }
  function loginAs(id){
    const a=D.accounts.find(x=>x.id===id);
    if(!a) return;
    SP.auth.login(a.id, a.pw);
    SP.state.screen=navFor()[0][0];
    render();
  }

  /* ── 로그인 화면 ── */
  function renderLogin(){
    built=false;
    document.body.innerHTML="";
    const idIn=el("input",{placeholder:"아이디", autocomplete:"username"});
    const pwIn=el("input",{type:"password", placeholder:"비밀번호", autocomplete:"current-password"});
    const errP=el("p",{class:"err"});
    const submit=()=>{
      if(SP.auth.login(idIn.value.trim(), pwIn.value)){
        buildChrome(); SP.state.screen=navFor()[0][0]; render();
      } else errP.textContent="아이디 또는 비밀번호가 맞지 않습니다";
    };
    idIn.onkeydown=e=>{ if(e.key==="Enter") pwIn.focus(); };
    pwIn.onkeydown=e=>{ if(e.key==="Enter") submit(); };
    document.body.appendChild(el("div",{class:"login-wrap"},
      el("div",{class:"card login"},
        el("p",{class:"logo"}, el("b",{},"SSOPLE")," 운영 대시보드"),
        el("p",{class:"sub"},"관리자 · 매니저 · 호스트는 각자의 계정으로 들어옵니다. 모든 입력과 변경은 로그인한 이름으로 기록됩니다."),
        el("label",{class:"f-cap"},"아이디"), idIn,
        el("label",{class:"f-cap"},"비밀번호"), pwIn,
        errP,
        el("button",{class:"btn", style:"width:100%", onclick:submit},"로그인"),
        el("table",{class:"demo"}, el("tbody",{},
          D.accounts.map(a=>el("tr",{onclick:()=>{ idIn.value=a.id; pwIn.value=a.pw; pwIn.focus(); }},
            el("td",{class:"num"},a.id),
            el("td",{}, el("b",{},a.name)),
            el("td",{class:"sub"},a.pos))))),
        el("p",{class:"sub"},"데모 계정 — 행을 누르면 자동 입력됩니다 · 비밀번호는 모두 1234 · 새로고침하면 다시 로그인합니다 (브라우저 저장 없음)"))));
    try{ idIn.focus(); }catch(e){}
  }

  /* ── 크롬 ── */
  function buildChrome(){
    document.body.innerHTML="";
    document.body.appendChild(el("header",{class:"topbar"}, ident=el("div",{class:"ident wrap-w"})));
    document.body.appendChild(el("div",{class:"rail"}, railEl=el("div",{class:"wrap-w rail-in"})));
    document.body.appendChild(rootEl=el("div",{class:"wrap wrap-w"}));
    document.body.appendChild(el("footer",{class:"foot"},
      el("span",{},"쏘플파티룸 운영 대시보드 — 기획서 Ver 1.1 + 확장 12기능 · 시드 130개 지점 · "+
        R.fmtNum(D.reservations.length)+"건"),
      el("span",{class:"mono sub"},"규정: 예약금 80,000 · 수수료 기본 20% · 1일 집계 → 5일 이의 → 10일 지급 · 7일 전 전액 환불")));
    built=true;
  }

  /* ── 시그니처: 데이터 출처 레일 ── */
  function rail(){
    railEl.innerHTML="";
    const stage=R.settlementStage(D.TODAY.getDate());
    const sig=Q.signals();
    const u=SP.auth.user;
    const isHq = u && (u.role==="hq_admin"||u.role==="hq_staff");
    railEl.append(
      el("span",{class:"src mono"},
        `집계 ${R.fmtDate(D.addDays(D.TODAY,-1))} 03:00`,
        el("i",{class:"dot-sep"}), "실시간 반영 중",
        el("i",{class:"dot-sep"}), "캐시 23초"),
      el("span",{class:"rail-item"},
        el("span",{class:"stage-mini"},
          [1,2,3,4,5].map(n=>el("i",{class:"sd"+(n<stage.no?" done":n===stage.no?" now":"")}))),
        `정산 ${stage.no}/5 · ${stage.label}`),
      el("button",{class:"rail-item sigbtn"+(sig.length?" hot":""),
        onclick:()=>{ if(!isHq) return;
          go("dash");
          setTimeout(()=>{ const t=document.getElementById("sig"); if(t&&t.scrollIntoView) try{t.scrollIntoView({behavior:"smooth"});}catch(e){} },30); }},
        sig.length? `신호 ${sig.length}건`:"신호 0건"));
    if(isHq){
      const nn=D.unreadNotesFor(u.id).length;
      railEl.append(el("button",{class:"rail-item sigbtn"+(nn?" hot":""),
        onclick:()=>go("notes")}, nn? `노트 ${nn}건`:"노트 0건"));
    }
  }

  function topbar(){
    ident.innerHTML="";
    const u=SP.auth.user;
    ident.append(
      el("span",{class:"logo"}, el("b",{},"SSOPLE")," 운영 대시보드"),
      el("nav",{class:"nav"}, navFor().map(([k,t])=>
        el("button",{class:"nav-b"+(SP.state.screen===k?" on":""), onclick:()=>go(k)},t))),
      el("span",{class:"grow"}),
      (SP.state.role==="owner"||SP.state.role==="staff") ?
        el("select",{class:"sel", "aria-label":"지점",
          onchange:e=>{SP.state.branchId=e.target.value; render();}},
          D.branches.map(x=>el("option",{value:x.id, selected:x.id===SP.state.branchId},x.region+" · "+x.name))) : null,
      u? el("span",{class:"u-chip"}, el("b",{},u.name), el("span",{class:"sub"},u.pos)) : null,
      el("select",{class:"sel role", "aria-label":"계정 전환 (데모)",
        onchange:e=>loginAs(e.target.value)},
        D.accounts.map(a=>el("option",{value:a.id, selected:!!(u&&u.id===a.id)},`${a.name} (${a.pos})`))),
      el("button",{class:"btn tiny ghost", onclick:()=>{ SP.auth.logout(); renderLogin(); }},"로그아웃"),
      el("span",{class:"asof mono"},
        D.NOW.getFullYear()+"."+R.pad2(D.NOW.getMonth()+1)+"."+R.pad2(D.NOW.getDate()))
    );
  }

  const ROUTES = {
    dash:v=>{ v.appendChild(el("div",{class:"page-head"},
        el("h1",{},"관리자 통합 대시보드"),
        el("p",{class:"sub"},"지금 어떤가 → 무엇을 해야 하나 → 어디가 문제인가 (5장)")));
      SP.screens.dashboard(v); },
    res:v=>SP.screens.reservations(v),
    board:v=>SP.screens.boardOcc(v),
    spaces:v=>SP.screens.spacesAdmin(v),
    cancel:v=>SP.screens.cancelsView(v),
    msg:v=>SP.screens.msgCenter(v),
    settle:v=>SP.screens.settlement(v),
    stats:v=>SP.screens.stats(v, SP.state.pre),
    notes:v=>SP.screens.notesBoard(v),
    audit:v=>SP.screens.auditView(v),
    ohome:v=>SP.screens.ownerHome(v),
    ospace:v=>SP.screens.ownerSpace(v),
    ochan:v=>SP.screens.ownerChannel(v),
    osettle:v=>SP.screens.ownerSettle(v)
  };

  function render(){
    if(!built) return;
    topbar(); rail();
    rootEl.innerHTML="";
    const view=el("main",{class:"view"});
    rootEl.appendChild(view);
    (ROUTES[SP.state.screen]||ROUTES.dash)(view);
  }

  function boot(){ renderLogin(); }

  return { go, render, boot, setRole, loginAs, renderLogin };
})();

document.addEventListener("DOMContentLoaded", SP.app.boot);
window.__SP = SP;

</script>
