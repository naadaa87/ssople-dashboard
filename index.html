/* ============================================================
   SSOPLE Dashboard — screens_admin4.js
   4단계: 데이터 반입 · 반출 통제 (기획서 8.2 다섯 단계)
   ============================================================ */
(() => {
  const R = SP.rules, D = SP.data, U = SP.ui;
  const el = U.el;
  const perm = f => R.PERM[f](SP.state.role);
  const dState = { open:null };

  SP.screens.dataCenter = function(root){
    root.appendChild(el("div",{class:"page-head"},
      el("h1",{},"데이터 반입 · 반출"),
      el("p",{class:"sub"},"대량 반입이 원장을 훼손하지 않도록, 반출이 개인정보 사고가 되지 않도록 — 절차를 시스템에 심었습니다 (8.2절)")));

    root.appendChild(el("div",{class:"stepline"},
      ["① 템플릿","② 스테이징","③ 드라이런","④ 승인 반영 · 롤백","⑤ 마스킹 반출"]
        .map(t=>el("span",{class:"stepchip"},t))));

    /* ── 반입 ── */
    const ta=el("textarea",{rows:"4",
      placeholder:"템플릿 그대로 붙여넣기 — 첫 줄은 반드시 열 이름 (지점, 이용일, …). 엑셀에서 복사하면 탭 구분도 인식합니다"});
    let fileName="";
    const fileIn=el("input",{type:"file", accept:".csv,.txt,.tsv", onchange:e=>{
      const f=e.target.files[0]; if(!f) return;
      fileName=f.name;
      const rd=new FileReader();
      rd.onload=()=>{ ta.value=String(rd.result||""); U.toast(f.name+" 읽음 — 아래에서 스테이징"); };
      rd.readAsText(f);
      e.target.value="";
    }});
    root.appendChild(U.card("", U.secHead("반입 (채널 예약 내역)","자유 양식은 받지 않습니다 — 고정 템플릿만 (8.2①)"),
      el("div",{class:"f-row", style:"margin-bottom:8px"},
        el("button",{class:"btn ghost", onclick:()=>{
          const t=D.buildImportTemplate();
          U.downloadText(t.name, t.text, "text/csv");
          U.toast("템플릿 내려받기 — 예시 두 줄을 지우고 채워 넣으세요");
        }},"템플릿 내려받기"),
        fileIn),
      ta,
      el("div",{class:"f-row", style:"margin-top:8px"},
        el("button",{class:"btn", onclick:()=>{
          const tr=D.stageBatch(ta.value, fileName||"붙여넣기");
          if(!tr.ok){ U.toast(tr.reason,"warn"); return; }
          ta.value=""; fileName=""; dState.open=tr.batch.id;
          U.toast(`${tr.batch.id} 스테이징 ${tr.batch.rows.length}행 — 운영 데이터는 아직 그대로입니다`);
          SP.app.render();
        }},"① 스테이징"),
        el("span",{class:"sub"},"스테이징 → 드라이런(검증 리포트) → 반영 순서로만 진행됩니다"))));

    /* ── 배치 목록 ── */
    const box=el("div",{});
    if(!D.batches.length) box.appendChild(el("div",{class:"empty"},"반입 이력이 없습니다"));
    D.batches.slice(0,10).forEach(bt=>{
      const rep=bt.report;
      const stBadge=el("span",{class:"badge "+(bt.state==="APPLIED"?"st-done":bt.state==="ROLLED"?"st-exp":"st-hold")},
        bt.state==="APPLIED"?"반영됨":bt.state==="ROLLED"?"롤백됨":"스테이징");
      const acts=el("span",{class:"gap"});
      if(bt.state==="STAGED"){
        acts.append(el("button",{class:"btn tiny ghost", onclick:()=>{
          const tr=D.dryRunBatch(bt.id);
          tr.ok? U.toast(`드라이런 — 신규 ${tr.report.okN} · 중복 ${tr.report.dupN} · 오류 ${tr.report.errN}`)
               : U.toast(tr.reason,"warn");
          dState.open=bt.id; SP.app.render();
        }},"② 드라이런"));
        acts.append(el("button",{class:"btn tiny", disabled:!rep,
          title:rep?"":"드라이런 없이 반영할 수 없습니다", onclick:()=>{
          const tr=D.applyBatch(bt.id);
          tr.ok? U.toast(`③ 승인 반영 — ${tr.okN}건 등록 (오류 행은 처리 대기함으로)`)
               : U.toast(tr.reason,"warn");
          SP.app.render();
        }},"③ 반영"));
      }
      if(bt.state==="APPLIED"){
        acts.append(el("button",{class:"btn tiny ghost", onclick:()=>{
          const lines=(bt.report&&bt.report.verdicts||[]).map(v=>
            [v.i+1, v.v, (v.reason||"").replace(/,/g," "), (v.name||"").replace(/,/g," ")].join(","));
          U.downloadText(`${bt.id}_검증리포트.csv`,
            "\uFEFF행,판정,사유,내용\n"+lines.join("\n")+"\n","text/csv");
        }},"리포트 CSV"));
        acts.append(el("button",{class:"btn tiny danger", onclick:()=>{
          U.modal("④ 배치 롤백 — "+bt.id,
            el("p",{},`${bt.appliedIds.length}건을 통째로 되돌립니다. 기록은 삭제되지 않고 취소로 보존되며, 결제 · 분쟁 이력이 붙은 건은 건너뜁니다.`),
            [{label:"롤백 실행", kind:"btn danger", onClick:(close)=>{
              const tr=D.rollbackBatch(bt.id);
              U.toast(tr.ok? `롤백 — ${tr.undone}건 취소 전환 · ${tr.skipped}건 제외` : tr.reason,"warn");
              close(); SP.app.render();
            }}]);
        }},"④ 롤백"));
      }
      const head=el("div",{class:"row-line"},
        el("span",{},
          el("b",{},bt.id), ` · ${bt.src} · ${bt.rows.length}행`,
          el("small",{class:"sub"},` · ${R.fmtDT(bt.at)} · ${bt.by}`),
          rep? el("span",{class:"num"},`  신규 ${rep.okN} · 중복 ${rep.dupN} · `,
            el("b",{style:rep.errN?"color:var(--red-deep)":""},`오류 ${rep.errN}`)):
            el("small",{class:"sub"}," · 검증 전"),
          " ", stBadge),
        acts);
      box.appendChild(head);
      if(dState.open===bt.id && rep && bt.state==="STAGED"){
        const bad=rep.verdicts.filter(v=>v.v!=="OK").slice(0,8);
        box.appendChild(el("div",{class:"note", style:"margin:0 0 8px"},
          el("b",{},"반영 시: "),`신규 예약 ${rep.okN}건이 채널(pay=channel)로 등록됩니다. `,
          bad.length? el("span",{}, "제외 행 — ",
            bad.map(v=>`${v.i+1}행 ${v.v==="DUP"?"중복":"오류"}(${v.reason})`).join(" · ")):"제외 행 없음"));
      }
    });
    root.appendChild(U.card("", U.secHead("반입 배치","묶음 단위 이력 — 무엇을 언제 누가 넣었고, 통째로 되돌릴 수 있는가 (8.2④)"), box));

    /* ── 반출 ── */
    const days=el("select",{}, [[7,"최근 7일"],[30,"최근 30일"],[90,"최근 90일"]].map(([v,t])=>el("option",{value:v},t)));
    days.value="30";
    const maskChk=el("input",{type:"checkbox", checked:true});
    const reasonIn=el("input",{placeholder:"원본 반출 목적 (마스킹 해제 시 필수)", style:"display:none"});
    maskChk.addEventListener("change",()=>{ reasonIn.style.display=maskChk.checked?"none":"block"; });
    root.appendChild(U.card("", U.secHead("반출 (예약 내역 CSV)","연락처 마스킹이 기본입니다 — 해제는 마스터 + 목적 기록 + 감사 로그 (8.2⑤ · 9.7)"),
      el("div",{class:"f-row"},
        days,
        el("label",{class:"f-row", style:"gap:6px"}, maskChk, el("span",{},"연락처 마스킹")),
        reasonIn,
        el("button",{class:"btn", onclick:()=>{
          const tr=D.buildExport({ days:+days.value, mask:maskChk.checked,
            master:perm("settings"), reason:reasonIn.value });
          if(!tr.ok){ U.toast(tr.reason,"warn"); return; }
          U.downloadText(tr.name, tr.text, "text/csv");
          U.toast("⑤ 반출 — 감사 로그에 기록되었습니다");
        }},"⑤ 내려받기")),
      el("p",{class:"sub", style:"font-size:12px"},
        "지점 정본(요금 · 링크 · 운영 정보)의 반출은 [공간] 화면의 내보내기를, 총괄표 반입은 시트 동기화를 그대로 씁니다 — 이 화면은 예약 내역 전용입니다.")));
  };

  /* ═══════════════ 창업 문의 파이프라인 — franchise_leads (6.3 P2 · 8.3) ═══════════════ */
  SP.screens.frCenter = function(root){
    root.appendChild(el("div",{class:"page-head"},
      el("h1",{},"창업 문의 파이프라인"),
      el("p",{class:"sub"},"접수 → 상담 → 실사 → 계약. 영업 자료는 광고가 아니라 45개 지점의 실거래 숫자입니다 (8.3)")));

    root.appendChild(el("div",{class:"kpis k4"},
      D.FR_STAGES.map(st=>U.kpi({label:st, value:D.leads.filter(L=>L.stage===st).length+"건",
        sub: st==="접수"?"신규 문의":st==="상담"?"자료 · 시뮬레이션 제공":st==="실사"?"현장 · 조건 검토":"오픈 준비"}))));

    /* 수익 시뮬레이터 — 실데이터 */
    const regions=[...new Set(D.branches.map(b=>b.region))];
    const regSel=el("select",{}, el("option",{value:""},"전국"),
      regions.map(r=>el("option",{value:r},r)));
    const simBox=el("div",{class:"daily-grid", style:"margin-top:8px"});
    function renderSim(){
      const sm=D.frSim(regSel.value);
      simBox.innerHTML="";
      [["표본", `${sm.region} ${sm.n}개 지점`, "최근 90일 완료 기준"],
       ["월평균 매출", R.fmtWon(Math.round(sm.avgMon)), `점주 몫 ${R.fmtWon(Math.round(sm.avgMon*0.8))} (8:2)`],
       ["상위 지점", `${sm.topName} ${R.fmtWon(Math.round(sm.topMon))}`, "같은 조건의 상단"],
       ["평균 가동률", R.fmtPct(sm.occAvg,0), "낮 · 밤 2슬롯 기준"]]
      .forEach(([k,v,n])=>simBox.append(el("div",{class:"daily-cell"},
        el("span",{class:"d-k"},k), el("b",{class:"d-v"},v), el("small",{class:"sub"},n))));
    }
    regSel.addEventListener("change",renderSim); renderSim();
    root.appendChild(U.card("", U.secHead("수익 시뮬레이터","실거래 기반 — 가맹 영업의 결정적 무기 (표 8-3)"),
      el("div",{class:"f-row"}, regSel,
        el("span",{class:"sub"},"상담 단계에서 이 화면을 그대로 보여주세요")),
      simBox,
      el("p",{class:"sub", style:"font-size:11.5px;margin-top:6px"},
        "시연 시드 기준 수치 — 실운영 전환 후에는 같은 산식이 실데이터로 계산됩니다.")));

    /* 리드 목록 */
    const box=el("div",{});
    D.leads.slice(0,20).forEach(L=>{
      const idx=D.FR_STAGES.indexOf(L.stage);
      box.appendChild(el("div",{class:"row-line"},
        el("span",{},
          el("b",{},L.name), " ", el("span",{class:"num sub"},R.maskPhone(L.phone)),
          el("span",{class:"evt-chip", style:"margin-left:6px"},L.region||"지역 미정"),
          " — ", L.memo,
          el("small",{class:"sub"},` · ${R.fmtMD(L.at)} 접수`)),
        el("span",{class:"gap"},
          el("span",{class:"badge "+(L.stage==="계약"?"st-done":L.stage==="실사"?"st-conf":L.stage==="상담"?"st-pre":"st-hold")},L.stage),
          idx<D.FR_STAGES.length-1?
            el("button",{class:"btn tiny", onclick:()=>{
              const tr=D.frAdvance(L.id);
              tr.ok? U.toast(`${L.name} → ${tr.stage}`) : U.toast(tr.reason,"warn");
              SP.app.render();
            }},"다음 단계 →"):null)));
    });
    const nmIn=el("input",{placeholder:"이름", style:"max-width:110px"});
    const phIn=el("input",{placeholder:"010-", style:"max-width:130px", class:"num"});
    const rgIn=el("select",{}, el("option",{value:""},"지역"),
      regions.map(r=>el("option",{value:r},r)));
    const mmIn=el("input",{placeholder:"메모 — 입지 · 예산 등"});
    root.appendChild(U.card("", U.secHead("가맹 문의", `${D.leads.length}건 — 과천 문원동 트랙 포함`),
      el("div",{class:"f-row", style:"margin-bottom:10px"},
        nmIn, phIn, rgIn, mmIn,
        el("button",{class:"btn tiny", onclick:()=>{
          const tr=D.frAdd({name:nmIn.value.trim(), phone:phIn.value.trim(),
            region:rgIn.value, memo:mmIn.value.trim()});
          if(!tr.ok){ U.toast(tr.reason,"warn"); return; }
          nmIn.value=phIn.value=mmIn.value="";
          U.toast("접수 — 파이프라인 합류"); SP.app.render();
        }},"문의 등록")),
      box));
  };

})();


/* ===== app.js ===== */
/* ============================================================
   SSOPLE Dashboard — app.js
   로그인 게이트 · 상단바 · 데이터 출처 레일 · 라우터
   ============================================================ */
SP.state = { role:"hq_admin", branchId: SP.data.branches[0].id, screen:"dash", pre:null };

SP.app = (() => {
  const R=SP.rules, D=SP.data, Q=SP.q, U=SP.ui;
  const { el } = U;
  let rootEl, railEl, ident, built=false;

  const NAV = {
    hq:    [["dash","대시보드"],["res","예약"],["board","현황판"],["spaces","공간"],
            ["cancel","취소환불"],["dispute","분쟁·보증금"],["msg","알림"],["settle","정산"],["stats","통계"],
            ["members","회원·리뷰"],["partner","제휴"],["fr","창업"],["data","데이터"],["policy","정책"],
            ["notes","노트"],["audit","이력"]],
    owner: [["ohome","내 대시보드"],["ospace","내 공간"],["ochan","채널 등록"],["osettle","정산 명세"]],
    staff: [["res","오늘 예약"]]
  };
  const navFor = () =>
    SP.state.role==="owner" ? NAV.owner : SP.state.role==="staff" ? NAV.staff : NAV.hq;

  function go(screen, pre){
    SP.state.screen=screen; SP.state.pre=pre||null;
    if (screen==="res" && pre) SP.screens.applyResPreset(pre);
    render();
    try{ window.scrollTo(0,0); }catch(e){}
  }

  /* 데모·테스트 심 — 해당 역할의 첫 계정으로 로그인 */
  function setRole(role){
    const a=D.accounts.find(x=>x.role===role);
    if(a) SP.auth.login(a.id, a.pw);
    SP.state.screen=navFor()[0][0];
    if(!built) buildChrome();
    render();
  }
  function loginAs(id){
    const a=D.accounts.find(x=>x.id===id);
    if(!a) return;
    SP.auth.login(a.id, a.pw);
    SP.state.screen=navFor()[0][0];
    render();
  }

  /* ── 로그인 화면 ── */
  function renderLogin(){
    built=false;
    document.body.innerHTML="";
    const idIn=el("input",{placeholder:"아이디", autocomplete:"username"});
    const pwIn=el("input",{type:"password", placeholder:"비밀번호", autocomplete:"current-password"});
    const errP=el("p",{class:"err"});
    const submit=()=>{
      if(SP.auth.login(idIn.value.trim(), pwIn.value)){
        buildChrome(); SP.state.screen=navFor()[0][0]; render();
      } else errP.textContent="아이디 또는 비밀번호가 맞지 않습니다";
    };
    idIn.onkeydown=e=>{ if(e.key==="Enter") pwIn.focus(); };
    pwIn.onkeydown=e=>{ if(e.key==="Enter") submit(); };
    document.body.appendChild(el("div",{class:"login-wrap"},
      el("div",{class:"card login"},
        el("p",{class:"logo"}, el("b",{},"SSOPLE")," 운영 대시보드"),
        el("p",{class:"sub"},"관리자 · 매니저 · 호스트는 각자의 계정으로 들어옵니다. 모든 입력과 변경은 로그인한 이름으로 기록됩니다."),
        el("label",{class:"f-cap"},"아이디"), idIn,
        el("label",{class:"f-cap"},"비밀번호"), pwIn,
        errP,
        el("button",{class:"btn", style:"width:100%", onclick:submit},"로그인"),
        el("table",{class:"demo"}, el("tbody",{},
          D.accounts.map(a=>el("tr",{onclick:()=>{ idIn.value=a.id; pwIn.value=a.pw; pwIn.focus(); }},
            el("td",{class:"num"},a.id),
            el("td",{}, el("b",{},a.name)),
            el("td",{class:"sub"},a.pos))))),
        el("p",{class:"sub"},"데모 계정 — 행을 누르면 자동 입력됩니다 · 비밀번호는 모두 1234"),
        el("button",{class:"reset-link", onclick:e=>{
          if(SP.persist) SP.persist.reset();
          e.target.textContent="비웠습니다 — 새로고침하면 초기 데이터로 시작합니다";
        }},"이 브라우저의 저장 데이터 초기화"))));
    try{ idIn.focus(); }catch(e){}
  }

  /* ── 크롬 ── */
  function buildChrome(){
    document.body.innerHTML="";
    document.body.appendChild(el("header",{class:"topbar"}, ident=el("div",{class:"ident wrap-w"})));
    document.body.appendChild(el("div",{class:"rail"}, railEl=el("div",{class:"wrap-w rail-in"})));
    document.body.appendChild(rootEl=el("div",{class:"wrap wrap-w"}));
    document.body.appendChild(el("footer",{class:"foot"},
      el("span",{},"쏘플파티룸 운영 대시보드 — 기획서 Ver 1.1 + 확장 12기능 · 시드 130개 지점 · "+
        R.fmtNum(D.reservations.length)+"건"),
      el("span",{class:"mono sub"},"규정: 예약금 80,000 · 수수료 기본 20% · 1일 집계 → 5일 이의 → 10일 지급 · 7일 전 전액 환불")));
    built=true;
  }

  /* ── 시그니처: 데이터 출처 레일 ── */
  function rail(){
    railEl.innerHTML="";
    const stage=R.settlementStage(D.TODAY.getDate());
    const sig=Q.signals();
    const u=SP.auth.user;
    const isHq = u && (u.role==="hq_admin"||u.role==="hq_staff");
    railEl.append(
      el("span",{class:"src mono"},
        `집계 ${R.fmtDate(D.addDays(D.TODAY,-1))} 03:00`,
        el("i",{class:"dot-sep"}), "실시간 반영 중",
        el("i",{class:"dot-sep"}), "캐시 23초"),
      el("span",{class:"rail-item"},
        el("span",{class:"stage-mini"},
          [1,2,3,4,5].map(n=>el("i",{class:"sd"+(n<stage.no?" done":n===stage.no?" now":"")}))),
        `정산 ${stage.no}/5 · ${stage.label}`),
      el("button",{class:"rail-item sigbtn"+(sig.length?" hot":""),
        onclick:()=>{ if(!isHq) return;
          go("dash");
          setTimeout(()=>{ const t=document.getElementById("sig"); if(t&&t.scrollIntoView) try{t.scrollIntoView({behavior:"smooth"});}catch(e){} },30); }},
        sig.length? `신호 ${sig.length}건`:"신호 0건"));
    if(isHq){
      const nn=D.unreadNotesFor(u.id).length;
      railEl.append(el("button",{class:"rail-item sigbtn"+(nn?" hot":""),
        onclick:()=>go("notes")}, nn? `노트 ${nn}건`:"노트 0건"));
    }
    railEl.append(el("span",{class:"rail-item"+(SP.persist&&SP.persist.mode==="remote"?" sync":"")},
      "저장 "+(SP.persist? (SP.persist.mode==="remote"?"공유(D1)"
        : SP.persist.mode==="local"?"이 브라우저":"세션(미리보기)"):"세션")));
  }

  function topbar(){
    ident.innerHTML="";
    const u=SP.auth.user;
    ident.append(
      el("span",{class:"logo"}, el("b",{},"SSOPLE")," 운영 대시보드"),
      el("nav",{class:"nav"}, navFor().map(([k,t])=>
        el("button",{class:"nav-b"+(SP.state.screen===k?" on":""), onclick:()=>go(k)},t))),
      el("span",{class:"grow"}),
      (SP.state.role==="owner"||SP.state.role==="staff") ?
        el("select",{class:"sel", "aria-label":"지점",
          onchange:e=>{SP.state.branchId=e.target.value; render();}},
          D.branches.map(x=>el("option",{value:x.id, selected:x.id===SP.state.branchId},x.region+" · "+x.name))) : null,
      u? el("span",{class:"u-chip"}, el("b",{},u.name), el("span",{class:"sub"},u.pos)) : null,
      el("select",{class:"sel role", "aria-label":"계정 전환 (데모)",
        onchange:e=>loginAs(e.target.value)},
        D.accounts.map(a=>el("option",{value:a.id, selected:!!(u&&u.id===a.id)},`${a.name} (${a.pos})`))),
      el("button",{class:"btn tiny ghost", onclick:()=>{ SP.auth.logout(); renderLogin(); }},"로그아웃"),
      el("span",{class:"asof mono"},
        D.NOW.getFullYear()+"."+R.pad2(D.NOW.getMonth()+1)+"."+R.pad2(D.NOW.getDate()))
    );
  }

  const ROUTES = {
    dash:v=>{ v.appendChild(el("div",{class:"page-head"},
        el("h1",{},"관리자 통합 대시보드"),
        el("p",{class:"sub"},"지금 어떤가 → 무엇을 해야 하나 → 어디가 문제인가 (5장)")));
      SP.screens.dashboard(v); },
    res:v=>SP.screens.reservations(v),
    board:v=>SP.screens.boardOcc(v),
    spaces:v=>SP.screens.spacesAdmin(v),
    cancel:v=>SP.screens.cancelsView(v),
    msg:v=>SP.screens.msgCenter(v),
    dispute:v=>SP.screens.disputeCenter(v),
    members:v=>SP.screens.membersHub(v),
    partner:v=>SP.screens.partnerCenter(v),
    policy:v=>SP.screens.policyScreen(v),
    data:v=>SP.screens.dataCenter(v),
    fr:v=>SP.screens.frCenter(v),
    settle:v=>SP.screens.settlement(v),
    stats:v=>SP.screens.stats(v, SP.state.pre),
    notes:v=>SP.screens.notesBoard(v),
    audit:v=>SP.screens.auditView(v),
    ohome:v=>SP.screens.ownerHome(v),
    ospace:v=>SP.screens.ownerSpace(v),
    ochan:v=>SP.screens.ownerChannel(v),
    osettle:v=>SP.screens.ownerSettle(v)
  };

  function render(){
    if(!built) return;
    topbar(); rail();
    rootEl.innerHTML="";
    const view=el("main",{class:"view"});
    rootEl.appendChild(view);
    (ROUTES[SP.state.screen]||ROUTES.dash)(view);
  }

  function boot(){ renderLogin(); }

  return { go, render, boot, setRole, loginAs, renderLogin };
})();

document.addEventListener("DOMContentLoaded", () => {
  const r = (SP.persist && SP.persist.ready) || Promise.resolve();
  r.then(() => { if(SP.data.runTriggers) SP.data.runTriggers(); SP.app.boot(); });
});
window.__SP = SP;

</script>
</body>
</html>
