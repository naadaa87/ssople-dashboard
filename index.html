  function statDaily(root){
    /* 월 캘린더 히트맵 */
    const T=D.TODAY, first=new Date(T.getFullYear(),T.getMonth(),1);
    const days=new Date(T.getFullYear(),T.getMonth()+1,0).getDate();
    let max=1; const vals=[];
    for(let d=1;d<=days;d++){
      const row=Q.daily(D.keyOf(new Date(T.getFullYear(),T.getMonth(),d))).tot;
      vals.push(row.useCnt); max=Math.max(max,row.useCnt);
    }
    const cal=el("div",{class:"cal"});
    R.WD.forEach(w=>cal.appendChild(el("div",{class:"cal-h"},w)));
    for(let i=0;i<first.getDay();i++) cal.appendChild(el("div",{}));
    for(let d=1;d<=days;d++){
      const v=vals[d-1];
      const c=U.heatCell(v/max, `${T.getMonth()+1}/${d} — ${v}건`);
      c.classList.add("cal-c"); c.textContent=d;
      c.onclick=()=>SP.app.go("res",{basis:"use",preset:null,fromD:new Date(T.getFullYear(),T.getMonth(),d)});
      if(d===T.getDate()) c.classList.add("today");
      cal.appendChild(c);
    }
    root.appendChild(U.card("wide", U.secHead(`${T.getMonth()+1}월 일별 예약`,"칸을 누르면 그날의 예약 목록으로"), cal));

    /* 요일×시간 히트맵 */
    const hm=el("div",{class:"hm"});
    hm.appendChild(el("div",{}));
    for(let h=11;h<24;h++) hm.appendChild(el("div",{class:"hm-h num"},String(h)));
    for(let wd=0;wd<7;wd++){
      hm.appendChild(el("div",{class:"hm-h"},R.WD[wd]));
      for(let h=0;h<13;h++){
        const sold=D.heat[wd][h], den=D.heatDen[wd][h]||1;
        hm.appendChild(U.heatCell(sold/den*2.2, `${R.WD[wd]} ${h+11}시 — 판매율 ${R.fmtPct(sold/den,0)}`));
      }
    }
    root.appendChild(U.card("wide",
      U.secHead("요일 × 시간대 판매율","최근 28일 — 비는 시간이 채널 배정의 근거입니다 (8.2절)"), hm));
  }

  function statKpi(root){
    let sort={key:"sales",dir:-1}, region="", page=0;
    const rowsAll=Q.branchKpiRows();
    const regions=[...new Set(D.branches.map(b=>b.region))];
    const wrap=el("div",{});
    const cols=[["b","지점",r=>r.b.name],["occ","가동률",r=>R.fmtPct(r.occ,0)],
      ["sales","이달 매출",r=>perm("viewMoney")?R.fmtWon(r.sales):"—"],
      ["avg","객단가",r=>perm("viewMoney")?R.fmtWon(r.avg):"—"],
      ["cxl","취소율",r=>R.fmtPct(r.cxl)],["ns","노쇼율",r=>R.fmtPct(r.ns)],
      ["chN","네이버 비중",r=>R.fmtPct(r.chN,0)],["chS","스클 비중",r=>R.fmtPct(r.chS,0)],
      ["lead","리드타임",r=>r.lead.toFixed(1)+"일"]];
    root.appendChild(U.card("filter", el("div",{class:"f-row"},
      el("select",{onchange:e=>{region=e.target.value;page=0;draw();}},
        el("option",{value:""},"전 지역"), regions.map(x=>el("option",{value:x},x))),
      el("span",{class:"sub grow"},"열 제목을 누르면 정렬 — 하위 지점 붉은 표시는 조정의 재료 (10.3절)"),
      el("button",{class:"btn ghost",onclick:()=>{
        U.downloadCSV("쏘플_지점KPI.csv",[cols.map(c=>c[1])].concat(
          rowsAll.map(r=>cols.map(c=> c[0]==="b"? r.b.name : typeof r[c[0]]==="number"? r[c[0]] : ""))));
      }},"엑셀 내려받기"))));
    root.appendChild(wrap);
    function draw(){
      wrap.innerHTML="";
      let rows=rowsAll.filter(r=>!region||r.b.region===region);
      rows.sort((a,b)=>{ const k=sort.key;
        const av=k==="b"?a.b.name:a[k], bv=k==="b"?b.b.name:b[k];
        return (av>bv?1:av<bv?-1:0)*sort.dir; });
      const occCut=[...rowsAll].sort((a,b)=>a.occ-b.occ)[Math.floor(rowsAll.length*0.1)].occ;
      const per=20, slice=rows.slice(page*per,(page+1)*per);
      wrap.appendChild(U.card("table-card", el("table",{class:"grid"},
        el("thead",{},el("tr",{},cols.map(c=>el("th",{class:"sortable",onclick:()=>{
          sort = sort.key===c[0]? {key:c[0],dir:-sort.dir}:{key:c[0],dir:-1}; draw();
        }}, c[1]+(sort.key===c[0]?(sort.dir<0?" ↓":" ↑"):""))))),
        el("tbody",{},slice.map(r=>el("tr",{class:r.occ<=occCut?"low":""},
          cols.map(c=>el("td",{class:c[0]==="b"?"":"num"}, c[2](r))))))),
        U.pager(rows.length,page,per,p=>{page=p;draw();})));
    }
    draw();
  }

  function statRevisit(root){
    const rv=D.revisit;
    root.appendChild(el("div",{class:"two-col"},
      U.card("", U.secHead("재방문율","첫 이용 후 다시 예약한 회원 — 회원 계정 기준 (10.4절)"),
        el("div",{class:"big-num num"},R.fmtPct(rv.rate)),
        el("p",{class:"sub"},"구 솔루션의 연락처 추정 방식보다 정확합니다")),
      U.card("", U.secHead("가입 월 코호트","가입 후 몇 달째까지 이용이 이어지는가"),
        el("table",{class:"grid tight"},
          el("thead",{},el("tr",{},["가입월","M+0","M+1","M+2","M+3"].map(h=>el("th",{},h)))),
          el("tbody",{},rv.cohort.map(c=>el("tr",{},
            el("td",{},`${c.month}개월 전`),
            c.row.map(v=>{ const td=el("td",{class:"num"},v+"%");
              td.style.background=`color-mix(in srgb, var(--red) ${Math.round(v*0.55)}%, white)`;
              if(v>60) td.style.color="#fff"; return td; }))))))));
  }

  function statReport(root){
    const pm=new Date(D.TODAY.getFullYear(),D.TODAY.getMonth()-1,1);
    const chk=Q.threeWayCheck();
    const done=D.reservations.filter(r=>(r.status==="COMPLETED"||r.status==="NO_SHOW")&&
      r.useDate.getFullYear()===pm.getFullYear()&&r.useDate.getMonth()===pm.getMonth());
    const cnt=done.length, sales=done.reduce((a,r)=>a+r.amount,0);
    const ch=Q.channelStats();
    const byB={}; done.forEach(r=>{byB[r.branchId]=(byB[r.branchId]||0)+r.amount;});
    const top=Object.entries(byB).sort((a,b)=>b[1]-a[1]).slice(0,5);
    root.appendChild(U.card("wide", U.secHead(`${pm.getMonth()+1}월 리포트`,"매월 1일 새벽, 정산 집계와 같은 배치가 생성 — 11장 규칙으로 자동 발송"),
      el("div",{class:"kpi-grid four"},
        U.kpi({label:"이용 완료",value:R.fmtNum(cnt)+"건"}),
        U.kpi({label:"확정 매출",value:perm("viewMoney")?R.fmtWon(sales):"—",sub:"정산 보드와 동일"}),
        U.kpi({label:"정산 검산",value:chk.ok?"일치 ✓":"불일치 ✕",sub:"9.4절 세 숫자"}),
        U.kpi({label:"채널 비중 (28일)",value:R.fmtPct((ch.naver.c+ch.spacecloud.c)/Math.max(1,Object.values(ch).reduce((a,x)=>a+x.c,0)),0),
          sub:`네이버 ${ch.naver.c} · 스클 ${ch.spacecloud.c}건`})),
      el("h4",{class:"d-sub"},"매출 상위 지점"),
      el("ol",{class:"rank"},top.map(([bid,v])=>el("li",{},
        el("span",{},D.branchById[bid].name), el("span",{class:"num"},perm("viewMoney")?R.fmtWon(v):"—"))))));
  }

  function statDict(root){
    const rows=[
      ["가동률","판매된 시간 ÷ 판매 가능 시간","판매 가능 = 운영시간 − 휴무 − 정비 버퍼. 채널 수기 예약 포함"],
      ["평균 객단가","이용 완료 매출 ÷ 이용 완료 건수","취소 · 노쇼 제외"],
      ["취소율","취소 ÷ (확정 + 취소)","신청일 기준 최근 30일 이동 집계"],
      ["노쇼율","노쇼 확정 ÷ 이용 예정","4.3절 판정 절차를 거친 건만"],
      ["채널 비중","채널 등록 ÷ 전체 판매","네이버예약 · 스페이스클라우드 구분"],
      ["재방문율","2회 이상 이용 회원 ÷ 이용 회원","회원 계정 기준"],
      ["후기 평점","노출 상태 후기의 평균","노출 제외 건 미포함"],
      ["리드타임","이용일 − 신청일의 평균","성수기 오픈 시점의 재료"]];
    root.appendChild(U.card("wide",
      U.secHead("지표 사전 (10.1절)","계산식 변경은 문서 개정과 개발 반영을 한 몸으로 — 분기 점검 (16.4절)"),
      el("table",{class:"grid"},
        el("thead",{},el("tr",{},["지표","계산식","기준 · 주의"].map(h=>el("th",{},h)))),
        el("tbody",{},rows.map(r=>el("tr",{},r.map((c,i)=>el("td",{class:i===1?"num-f":""},c))))))));
  }
})();


/* ===== screens_owner.js ===== */
/* ============================================================
   SSOPLE Dashboard — screens_owner.js
   OW-01 · OW-04 · OW-06 (기획서 7 · 8 · 9장)
   ============================================================ */
(() => {
  const R=SP.rules, D=SP.data, Q=SP.q, U=SP.ui;
  const { el } = U;
  const who = () => (SP.auth && SP.auth.user) ? SP.auth.user.name : "호스트";
  const feePct = () => Math.round(D.settings.feeRate*1000)/10;

  /* ═══════ OW-01 점주 대시보드 ═══════ */
  SP.screens.ownerHome = function(root){
    const bid=SP.state.branchId, b=D.branchById[bid];
    const kp=Q.kpis(bid);
    const share=1-D.settings.feeRate;

    root.appendChild(el("div",{class:"page-head"},
      el("h1",{},b.name+" 대시보드"),
      el("p",{class:"sub"},`자기 지점 것만 · 매출은 언제나 호스트 몫 기준 — 수수료 ${feePct()}% 차감 후 (7장)`)));

    /* 지표 4종 */
    root.appendChild(el("div",{class:"kpi-grid four"},
      U.kpi({label:"오늘 예약", value:R.fmtNum(kp.todayRes)+"건"}),
      U.kpi({label:"이번 주 예약", value:R.fmtNum(kp.weekRes)+"건", sub:"이용일 기준"}),
      U.kpi({label:"이달 매출", value:R.fmtWon(kp.monthSales*share), sub:`호스트 몫 (수수료 ${feePct()}%)`}),
      U.kpi({label:"다음 정산 예정액", value:R.fmtWon(kp.monthSales*share), sub:"확정 전 추정 · 익월 1일 집계 → 10일 지급"})));


    /* 처리할 일 — 노쇼 후보 · 채널 마감 · 반려 */
    const nos=Q.noshowCandidates(bid);
    const rem=Q.channelCloseReminders(bid).slice(0,4);
    const taskCard=U.card("", U.secHead("처리할 일",""), el("div",{class:"ow-tasks"}));
    const box=taskCard.querySelector(".ow-tasks");
    if(!nos.length && !rem.length) box.appendChild(el("p",{class:"sub"},"지금 처리할 일이 없습니다"));
    nos.forEach(r=>{
      box.appendChild(el("div",{class:"row-line hotline"},
        el("span",{}, el("b",{},"노쇼 후보")," ", `${r.roomName} ${R.fmtTime(r.sh)}~ · ${r.name} — 시작 후 ${R.POLICY.noshowWaitMin}분 미체크인 (4.3절)`),
        el("span",{class:"gap"},
          el("button",{class:"btn tiny",onclick:()=>{
            const tr=D.setStatus(r,"NO_SHOW",{act:"노쇼 확정 — 24시간 내 정정 가능"});
            if(!tr.ok){ U.toast(tr.reason,"warn"); return; }
            U.toast("노쇼 확정 — 매출은 유지되고 정산에 포함됩니다"); SP.app.render();
          }},"노쇼 확정"),
          el("button",{class:"btn tiny ghost",onclick:()=>{
            r.checkin=true; r.audit.push({at:new Date(),who:who(),act:"체크인 확인 (늦은 도착)"});
            D.logAudit("예약", r.id, "체크인 확인 (늦은 도착)"); if(SP.persist) SP.persist.touch(r);
            U.toast("체크인 확인"); SP.app.render();
          }},"도착함"))));
    });
    /* 노쇼 정정 (24시간 내) */
    D.reservations.filter(r=>r.branchId===bid && r.status==="NO_SHOW" && r.noshowAt &&
      (D.NOW-r.noshowAt)<86400000).slice(0,2).forEach(r=>{
      box.appendChild(el("div",{class:"row-line"},
        el("span",{},el("b",{},"노쇼 정정 가능")," ",`${r.id} · ${R.fmtDateK(r.useDate)} — 판정 후 24시간 이내`),
        el("button",{class:"btn tiny ghost",onclick:()=>{
          const tr=D.setStatus(r,"COMPLETED",{act:"노쇼 정정 → 이용 완료 (24시간 내)"});
          if(!tr.ok){ U.toast(tr.reason,"warn"); return; }
          r.checkin=true;
          U.toast("이용 완료로 정정했습니다"); SP.app.render();
        }},"이용 완료로 정정")));
    });
    rem.forEach(r=>{
      box.appendChild(el("div",{class:"row-line"},
        el("span",{},el("b",{},"채널 마감 확인")," ",
          `${R.fmtDateK(r.useDate)} ${R.fmtTime(r.sh)}~${R.fmtTime(r.eh)} 자사 판매 — 네이버 · 스클에서 내렸는지 (8.1절)`),
        el("button",{class:"btn tiny",onclick:()=>{ r.chClosed=true; U.toast("채널 마감 확인 완료"); SP.app.render(); }},"확인했습니다")));
    });

    /* 최근 완료 — 검수 시한 내 신고 */
    const doneRecent=D.reservations.filter(r=>r.branchId===bid && r.status==="COMPLETED" &&
      (D.NOW - (()=>{const e=new Date(r.useDate); e.setHours(r.eh,0,0,0); return e;})())/3600e3 < D.settings.inspectHours &&
      D.keyOf(r.useDate)!==D.keyOf(D.TODAY)).slice(0,3);
    doneRecent.forEach(r=>{
      box.appendChild(el("div",{class:"row-line"},
        el("span",{}, el("b",{},"검수 대기")," ",
          `${R.fmtMD(r.useDate)} ${r.roomName} ${R.fmtTime(r.sh)}~ · ${r.name} — 퇴실 후 ${D.settings.inspectHours}시간 내 신고 가능`),
        el("span",{class:"gap"},
          el("span",{class:"badge "+R.DEPOSIT[D.depositStateOf(r)].cls}, R.DEPOSIT[D.depositStateOf(r)].label),
          el("button",{class:"btn tiny ghost",onclick:()=>reportModal(r)},"신고"))));
    });

    /* 오늘 타임라인 */
    const todays=D.reservations.filter(r=>r.branchId===bid &&
      D.keyOf(r.useDate)===D.keyOf(D.TODAY) &&
      (r.status==="CONFIRMED"||r.status==="COMPLETED"||r.status==="NO_SHOW"))
      .sort((a,c)=>a.sh-c.sh);
    const tl=U.card("", U.secHead("오늘 타임라인", R.fmtDateK(D.TODAY)),
      todays.length? el("ul",{class:"tl"}, todays.map(r=>el("li",{onclick:()=>SP.screens.detailDrawer(r)},
        el("span",{class:"num tl-t"},`${R.fmtTime(r.sh)}~${R.fmtTime(r.eh)}`),
        el("span",{class:"tl-b"}, el("b",{},r.roomName)," · ",R.fmtPeople(r.base,r.extra)," · ",r.name,
          el("small",{class:"sub"}," · ",r.phone)),   /* 이용 당일 — 전체 표시 (7.1) */
        U.chBadge(r.channel),
        r.checkin? el("span",{class:"badge st-done"},"체크인"):U.stBadge(r.status),
        (r.status==="COMPLETED"||r.status==="NO_SHOW")?
          el("button",{class:"btn tiny ghost",onclick:e=>{e.stopPropagation(); reportModal(r);}},"신고"):null)))
      : el("div",{class:"empty"},"오늘 예약이 없습니다"));

    /* 빈 시간 알림 + 4주 매출 */
    const low=lowSlots(bid);
    const side=el("div",{},
      U.card("", U.secHead("빈 시간 알림","이번 주 가동이 낮은 시간대 — 채널 배정을 조정해 보세요 (7.1절)"),
        el("ul",{class:"plain"}, low.map(x=>el("li",{class:"row-line"},
          el("span",{},`${x.wd}요일 ${x.slot}`), el("span",{class:"num sub"},R.fmtPct(x.rate,0)))))),
      U.card("", U.secHead("최근 4주 매출",`주 단위 · 호스트 몫(${feePct()}% 차감 후)`),
        U.miniBars(week4(bid).map(v=>v*R.POLICY.ownerShare))));

    root.appendChild(el("div",{class:"two-col"}, el("div",{}, taskCard, tl), side));
  };


  /* 노쇼 · 분쟁 신고 — 기획서 6.7 P0 · 9.3 기준표 · 증빙 없이는 제안 불가 */
  function reportModal(r){
    const b=D.branchById[r.branchId];
    const kinds=Object.keys(D.settings.deduct);
    const kindSel=el("select",{}, kinds.map(k=>el("option",{value:k},k)));
    const amtIn=el("input",{type:"number", step:"5000", class:"num"});
    const guide=el("p",{class:"sub", style:"margin:4px 0 0"});
    function fillAmt(){
      const d=D.settings.deduct[kindSel.value];
      amtIn.value = d.min||"";
      guide.textContent = d.min===0&&d.max===0 ? "실비 — 구매가 증빙 금액을 입력"
        : d.min===d.max ? `기준 ${R.fmtWon(d.min)} · ${d.note}`
        : `기준 ${R.fmtWon(d.min)} ~ ${R.fmtWon(d.max)} · ${d.note}`;
    }
    kindSel.onchange=fillAmt; fillAmt();
    const noteIn=el("textarea",{rows:"2", placeholder:"현장 상황 — 고객 통지문에 인용됩니다"});
    const photoList=el("ul",{class:"plain photos"});
    const names=[];
    const fileIn=el("input",{type:"file", multiple:true, accept:"image/*", onchange:e=>{
      [...e.target.files].forEach(f=>{ if(names.length<6){ names.push(f.name);
        photoList.appendChild(el("li",{}, "📷 "+f.name)); } });
      e.target.value="";
    }});
    U.modal(`분쟁 신고 — ${b.name} · ${r.id}`,
      el("div",{},
        el("p",{class:"note"},`퇴실 후 ${D.settings.inspectHours}시간 안에 접수해야 합니다. 제안 등록 시 고객에게 사유 · 금액 · 이의 기한(${D.settings.disputeDays}일)이 통지됩니다.`),
        el("label",{class:"f-cap"},"사유 (9.3 기준표)"), kindSel, guide,
        el("label",{class:"f-cap"},"차감 제안 금액 (원)"), amtIn,
        el("label",{class:"f-cap"},"사진 증빙 — 최소 1장"), fileIn, photoList,
        el("p",{class:"sub", style:"font-size:11.5px"},"지금 단계에서는 파일 이름만 기록됩니다 — 원본은 본사 카톡으로 전달해 주세요 (사진 저장소 연동은 이후 단계)"),
        el("label",{class:"f-cap"},"상세"), noteIn),
      [{label:"차감 제안 등록", kind:"btn danger", onClick:(close)=>{
        const amt=+amtIn.value||0;
        if(!names.length){ U.toast("사진 증빙 없이는 접수할 수 없습니다 (9.7절)","warn"); return false; }
        if(amt<=0){ U.toast("차감 금액을 입력해 주세요","warn"); return false; }
        if(!noteIn.value.trim()){ U.toast("상세 내용은 필수입니다 — 통지문에 들어갑니다","warn"); return false; }
        D.addIncident({ resId:r.id, branchId:b.id, kind:kindSel.value,
          amount:amt, photos:names, note:noteIn.value.trim() });
        U.toast(`접수 완료 — 고객 통지 예약 · 이의 ${D.settings.disputeDays}일 후 본사 확정 절차`);
        close(); SP.app.render();
      }}]);
  }

  function lowSlots(bid){
    const agg={};
    D.reservations.forEach(r=>{
      if(r.branchId!==bid) return;
      const dd=Math.floor((D.TODAY-r.useDate)/D.dayMs);
      if(dd<0||dd>=28) return;
      if(!(r.status==="COMPLETED"||r.status==="CONFIRMED"||r.status==="NO_SHOW")) return;
      const key=r.useDate.getDay()+"-"+r.slot;
      agg[key]=(agg[key]||0)+1;
    });
    const b=D.branchById[bid], den=4*b.rooms.length;
    const out=[];
    for(let wd=0;wd<7;wd++) for(const slot of ["day","night"]){
      const v=(agg[wd+"-"+slot]||0)/den;
      out.push({wd:R.WD[wd], slot:slot==="day"?"낮타임":"밤타임", rate:v});
    }
    return out.sort((a,c)=>a.rate-c.rate).slice(0,3);
  }
  function week4(bid){
    const out=[0,0,0,0];
    D.reservations.forEach(r=>{
      if(r.branchId!==bid) return;
      if(!(r.status==="COMPLETED"||r.status==="NO_SHOW")) return;
      const dd=Math.floor((D.TODAY-r.useDate)/D.dayMs);
      if(dd<0||dd>=28) return;
      out[3-Math.floor(dd/7)]+=r.amount;
    });
    return out;
  }

  /* ═══════ OW-04 채널 등록 ═══════ */
  SP.screens.ownerChannel = function(root){
    const bid=SP.state.branchId, b=D.branchById[bid];
    root.appendChild(el("div",{class:"page-head"},
      el("h1",{},"외부 채널 예약 등록"),
      el("p",{class:"sub"},"네이버예약 · 스페이스클라우드 — 필수 입력 다섯 개, 30초면 끝 (8.1절)")));

    const ch=el("select",{}, el("option",{value:"naver"},"네이버예약"), el("option",{value:"spacecloud"},"스페이스클라우드"));
    const date=el("input",{type:"date", value:R.fmtDate(D.addDays(D.TODAY,1))});
    const sh=el("select",{}, Array.from({length:12},(_,i)=>el("option",{value:11+i},R.fmtTime(11+i))));
    const eh=el("select",{}, Array.from({length:12},(_,i)=>el("option",{value:12+i, selected:12+i===22},R.fmtTime(12+i))));
    sh.value="18";
    const ppl=el("input",{type:"number",min:"1",max:"30",value:"6"});
    const cno=el("input",{placeholder:"채널 예약번호 — 분쟁 시 1:1 대조 근거"});
    const msg=el("div",{class:"conf-msg"});

    const form=U.card("", U.secHead("새 등록",""),
      el("div",{class:"form-grid"},
        el("label",{},"채널", ch), el("label",{},"이용일", date),
        el("label",{},"시작", sh), el("label",{},"종료", eh),
        el("label",{},"인원", ppl), el("label",{},"채널 예약번호", cno)),
      msg,
      el("div",{class:"d-acts"},
        el("button",{class:"btn",onclick:()=>{
          msg.innerHTML="";
          const dt=new Date(date.value), s=+sh.value, e=+eh.value;
          if(!(e>s)){ msg.appendChild(el("p",{class:"reject"},"종료가 시작보다 늦어야 합니다")); return; }
          if(!cno.value.trim()){ msg.appendChild(el("p",{class:"reject"},"채널 예약번호는 필수입니다")); return; }
          const conflict=D.channelConflict(bid, dt, s, e);
          if(conflict){
            msg.appendChild(el("p",{class:"reject"},
              `저장할 수 없습니다 — 자사 예약 ${conflict.id} (${R.fmtTime(conflict.sh)}~${R.fmtTime(conflict.eh)})이 이 시간대를 선점하고 있습니다. 자사가 먼저입니다 (8.1절).`));
            D.conflictLog.push({ at:new Date(), branchId:bid, date:R.fmtDate(dt),
              range:`${R.fmtTime(s)}~${R.fmtTime(e)}`, channel:ch.value, refused:true, against:conflict.id });
            U.toast("충돌 — 저장 거절 · 관리자 신호로 전달됨","warn");
            return;
          }
          const room=b.rooms[0];
          const need=Math.max(0,(+ppl.value||4)-b.baseP);
          const r={ id:"R"+(300000+Math.floor(Math.random()*99999)),
            branchId:bid, roomId:room.id, roomName:room.name,
            name:"채널 고객", phone:"010-0000-0000",
            createdAt:new Date(), useDate:dt, sh:s, eh:e, slot:s<17?"day":"night",
            base:b.baseP, extra:need,
            amount:D.priceOf(b, s<17?"day":"night", Math.min(e-s,5), need),
            channel:ch.value, pay:"channel", channelNo:cno.value.trim(),
            status:"CONFIRMED", deposit:"-", memo:"", intIssue:"", ownIssue:"",
            options:"", checkin:false, refund:null, amountDue:0,
            audit:[{at:new Date(),who:who(),act:"외부 채널 예약 수기 등록"}]};
          r.quote=D.makeQuote(b, b.rooms[0], r.slot, r.eh-r.sh, r.extra, r.useDate, r.amount);
          D.reservations.unshift(r); D.occInvalidate();
          D.logEvent("ExternalReservationImported", r.id, `${ch.value==="naver"?"네이버":"스클"} · 호스트 등록`);
          D.logAudit("예약", r.id, `외부 채널 등록 — ${ch.value==="naver"?"네이버예약":"스페이스클라우드"}`);
          if(SP.persist) SP.persist.addRes(r.id);
          msg.appendChild(el("p",{class:"accept"},`등록 완료 — ${r.id}. 이 시간대의 자사 판매는 자동으로 막힙니다.`));
          U.toast("채널 예약 등록 완료");
          drawList();
        }},"등록"),
        el("span",{class:"sub"},"자사 확정이 있는 시간대는 서버가 저장을 거절합니다")));
    root.appendChild(form);

    const listWrap=el("div",{});
    root.appendChild(U.card("", U.secHead("내 채널 예약","최근 등록"), listWrap));
    function drawList(){
      listWrap.innerHTML="";
      const mine=D.reservations.filter(r=>r.branchId===bid &&
        (r.channel==="naver"||r.channel==="spacecloud") && r.status==="CONFIRMED" && r.useDate>=D.TODAY)
        .slice(0,8);
      if(!mine.length){ listWrap.appendChild(el("p",{class:"sub"},"다가오는 채널 예약이 없습니다")); return; }
      mine.forEach(r=>listWrap.appendChild(el("div",{class:"row-line"},
        el("span",{}, U.chBadge(r.channel)," ",
          `${R.fmtDateK(r.useDate)} ${R.fmtTime(r.sh)}~${R.fmtTime(r.eh)} · ${R.fmtPeople(r.base,r.extra)}`,
          el("small",{class:"sub"},` · ${r.channelNo}`)),
        el("button",{class:"btn tiny ghost",onclick:()=>{
          const tr=D.setStatus(r,"CANCELLED",{act:"채널 예약 취소 (채널 측 취소 반영)"});
          if(!tr.ok){ U.toast(tr.reason,"warn"); return; }
          r.cancelReason={tag:"일정 변경", note:"채널 측 취소 반영"};
          U.toast("취소 처리 — 시간대 재개방"); drawList();
        }},"취소"))));
    }
    drawList();
  };

  /* ═══════ OW-06 정산 명세 ═══════ */
  SP.screens.ownerSettle = function(root){
    const bid=SP.state.branchId, b=D.branchById[bid];
    const S=D.settlement, row=S.rows.find(r=>r.branchId===bid);
    const stage=R.settlementStage(D.TODAY.getDate());
    const [y,m]=S.month.split("-");
    const canDispute = stage.no<=2;

    root.appendChild(el("div",{class:"page-head"},
      el("h1",{},`정산 명세 — ${y}년 ${+m}월분`),
      el("p",{class:"sub"},`지금은 ${stage.label} 단계 (${stage.range}) — 익월 1일 집계 · 5일 이의신청 · 10일 지급`)));

    const line=(k,v,cls)=>el("div",{class:"stmt-line "+(cls||"")},
      el("span",{},k), el("span",{class:"num"},v));
    root.appendChild(U.card("stmt",
      line("총매출", R.fmtWon(row.sales)),
      line("본사 수수료 (20% · 확정월 기준)", "− "+R.fmtWon(row.fee), "sub"),
      line("환불 차감", row.refund? "− "+R.fmtWon(row.refund):"—", "sub"),
      line("조정", row.adj? (row.adj>0?"+":"")+R.fmtWon(row.adj):"—", "sub"),
      line("지급액", R.fmtWon(row.payout), "total"),
      el("div",{class:"d-acts"},
        el("button",{class:"btn"+(canDispute?"":" ghost"), disabled:!canDispute,
          title:canDispute?"":"이의신청은 매월 5일까지 — 이후는 일반 문의로 (9.3절)",
          onclick:()=>{
            const reason=el("textarea",{rows:"3",placeholder:"어느 건이 어떻게 다른지 적어 주세요"});
            const amt=el("input",{type:"number",step:"1000",placeholder:"차이 금액(원)"});
            U.modal("정산 이의신청",
              el("div",{}, el("label",{class:"f-cap"},"차이 금액"), amt,
                el("label",{class:"f-cap"},"내용"), reason),
              [{label:"접수",kind:"btn",onClick:(close)=>{
                if(!reason.value.trim()){ U.toast("내용 없이 접수할 수 없습니다","warn"); return false; }
                S.disputes.push({ id:"DP"+(200+S.disputes.length), branchId:bid,
                  amt:+amt.value||0, reason:reason.value.trim(), state:"접수", at:new Date() });
                row.state="이의 처리 중";
                U.toast("접수 완료 — 처리 결과는 알림톡으로 안내됩니다");
                close(); SP.app.render();
              }}]);
          }},"이의신청"),
        el("span",{class:"badge "+(row.state==="확정"?"st-done":row.state==="보류"?"st-nos":"st-hold")},row.state))));

    /* 건별 내역 */
    const pm=new Date(D.TODAY.getFullYear(),D.TODAY.getMonth()-1,1);
    const items=D.reservations.filter(r=>r.branchId===bid &&
      (r.status==="COMPLETED"||r.status==="NO_SHOW") &&
      r.useDate.getFullYear()===pm.getFullYear() && r.useDate.getMonth()===pm.getMonth())
      .sort((a,c)=>a.useDate-c.useDate);
    let page=0; const wrap=el("div",{});
    root.appendChild(U.card("table-card", U.secHead("건별 내역", `${items.length}건`), wrap));
    function draw(){
      wrap.innerHTML="";
      const per=12, slice=items.slice(page*per,(page+1)*per);
      wrap.appendChild(el("table",{class:"grid"},
        el("thead",{},el("tr",{},["이용일","공간","인원","채널","금액","상태"].map(h=>el("th",{},h)))),
        el("tbody",{},slice.map(r=>el("tr",{},
          el("td",{class:"num"},R.fmtDate(r.useDate)),
          el("td",{},r.roomName),
          el("td",{},R.fmtPeople(r.base,r.extra)),
          el("td",{},U.chBadge(r.channel)),
          el("td",{class:"num"},R.fmtWon(r.amount)),
          el("td",{},U.stBadge(r.status)))))));
      wrap.appendChild(U.pager(items.length,page,per,p=>{page=p;draw();}));
    }
    draw();
  };

  /* ═══════ OW-05 내 공간 정보 — 수정은 본사 승인 후 반영 ═══════ */
  SP.screens.ownerSpace = function(root){
    const bid=SP.state.branchId, b=D.branchById[bid];
    root.appendChild(el("div",{class:"page-head"},
      el("h1",{},"내 공간 정보"),
      el("p",{class:"sub"},"홈페이지에 노출되는 값입니다 — 수정 요청은 본사 승인 후 반영됩니다")));

    b.rooms.forEach(room=>{
      const target=`${b.name} · ${room.name}`;
      const pend=D.pendingChanges.filter(p=>p.roomId===room.id);
      const fields=[
        ["priceDay","낮타임 요금", room.priceDay, "number"],
        ["priceNight","밤타임 요금", room.priceNight, "number"],
        ["desc","소개글", room.desc, "text"]
      ];
      const fSel=el("select",{}, fields.map(f=>el("option",{value:f[0]},f[1])));
      const vIn=el("input",{value:String(fields[0][2])});
      fSel.onchange=()=>{ const f=fields.find(x=>x[0]===fSel.value); vIn.value=String(f[2]); };
      root.appendChild(U.card("space-card",
        U.secHead(target, `기준 ${room.baseP}인 · 최대 ${room.maxP}인 · ${room.active!==false?"노출 중":"숨김"}`),
        el("div",{class:"space-grid"},
          el("div",{class:"space-photo"},
            el("div",{class:"roomph", style:"background:"+(room.hue||"#C9C4BF")}),
            el("p",{class:"sub"},"대표 사진 교체는 본사 요청으로 진행합니다")),
          el("div",{},
            el("div",{class:"d-line"}, el("span",{class:"d-k"},"낮 요금"), el("span",{class:"d-v num"},R.fmtWon(room.priceDay))),
            el("div",{class:"d-line"}, el("span",{class:"d-k"},"밤 요금"), el("span",{class:"d-v num"},R.fmtWon(room.priceNight))),
            el("div",{class:"d-line"}, el("span",{class:"d-k"},"소개글"), el("span",{class:"d-v"},room.desc)),
            el("h4",{class:"d-sub"},"수정 요청"),
            el("div",{class:"f-row"}, fSel, vIn,
              el("button",{class:"btn tiny", onclick:()=>{
                const f=fields.find(x=>x[0]===fSel.value);
                const to = f[3]==="number" ? (+vIn.value||f[2]) : vIn.value.trim();
                if(String(to)===String(f[2])){ U.toast("현재 값과 같습니다","warn"); return; }
                D.pendingChanges.push({ id:"CH"+Math.floor(1000+Math.random()*9000),
                  branchId:bid, roomId:room.id,
                  kind: f[0]==="desc"? "공간 소개글 수정" : "요금표 변경",
                  payload:{ field:f[0], from:f[2], to, label:f[1] },
                  at:new Date(), over:false });
                D.logAudit("공간", target, `${f[1]} 변경 요청 — ${typeof f[2]==="number"?R.fmtNum(f[2]):String(f[2]).slice(0,12)} → ${typeof to==="number"?R.fmtNum(to):String(to).slice(0,12)}`);
                U.toast("요청 접수 — 본사 승인 대기 (관리자 대시보드 처리할 일)");
                SP.app.render();
              }},"승인 요청")),
            pend.length? el("p",{class:"note"},
              `승인 대기 ${pend.length}건 — ${pend.map(p=>p.kind).join(", ")}`):null))));
    });
  };
})();


/* ===== screens_admin2.js ===== */
/* ============================================================
   SSOPLE Dashboard — screens_admin2.js
   v2 신규 화면: 현황판 · 공간 관리 · 취소환불 · 알림 현황
   · 업무 노트 · 변경 이력 · 공간 KPI · 호스트별 정산 · 알림 모달
   ============================================================ */
(() => {
  const R=SP.rules, D=SP.data, Q=SP.q, U=SP.ui;
  const { el } = U;
  const perm = f => R.PERM[f](SP.state.role);
  const me = () => SP.auth.user || { id:"sys", name:"시스템" };
  const tFmt = at => `${at.getMonth()+1}/${at.getDate()} ${R.pad2(at.getHours())}:${R.pad2(at.getMinutes())}`;
  const money = () => perm("viewMoney");

  /* ═══════════════ 공간 현황판 ═══════════════ */
  const occState = { mode:"day", date:null, from:null, to:null, region:"", q:"", freeOnly:false, page:0 };
  SP.screens.boardOcc = function(root){
    occState.date ||= D.TODAY;
    occState.from ||= D.TODAY;
    occState.to   ||= D.addDays(D.TODAY, 6);
    const s = occState;

    root.appendChild(el("div",{class:"page-head"},
      el("h1",{},"공간 현황판"),
      el("p",{class:"sub"},"오늘 어디가 차 있고 어디가 비었는가 — 빈 칸을 누르면 바로 수기 예약이 시작됩니다")));

    const regions=[...new Set(D.branches.map(b=>b.region))];
    const modeSeg = el("div",{class:"seg"},
      [["day","일간"],["range","기간"]].map(([k,t])=>el("button",
        {class:"seg-b"+(s.mode===k?" on":""), onclick:()=>{s.mode=k; s.page=0; SP.app.render();}},t)));
    const dayNav = el("span",{class:"gap"},
      el("button",{class:"btn tiny ghost", onclick:()=>{s.date=D.addDays(s.date,-1); s.page=0; SP.app.render();}},"◀"),
      el("input",{type:"date", value:R.fmtDate(s.date),
        onchange:e=>{ if(e.target.value){ s.date=new Date(e.target.value); s.page=0; SP.app.render(); } }}),
      el("button",{class:"btn tiny ghost", onclick:()=>{s.date=D.TODAY; s.page=0; SP.app.render();}},"오늘"),
      el("button",{class:"btn tiny ghost", onclick:()=>{s.date=D.addDays(s.date,1); s.page=0; SP.app.render();}},"▶"));
    const rangeNav = el("span",{class:"gap"},
      el("input",{type:"date", value:R.fmtDate(s.from),
        onchange:e=>{ if(e.target.value){ s.from=new Date(e.target.value); s.page=0; SP.app.render(); } }}),
      el("span",{class:"sub"},"~"),
      el("input",{type:"date", value:R.fmtDate(s.to),
        onchange:e=>{ if(e.target.value){ s.to=new Date(e.target.value); s.page=0; SP.app.render(); } }}));

    root.appendChild(U.card("filter", el("div",{class:"f-row"},
      modeSeg, s.mode==="day"? dayNav : rangeNav,
      el("select",{onchange:e=>{s.region=e.target.value; s.page=0; SP.app.render();}},
        el("option",{value:""},"전 지역"),
        regions.map(x=>el("option",{value:x, selected:s.region===x},x))),
      el("input",{type:"search", placeholder:"지점 검색", value:s.q,
        oninput:e=>{s.q=e.target.value; s.page=0; draw();}}),
      el("button",{class:"chip f"+(s.freeOnly?" on":""),
        onclick:()=>{s.freeOnly=!s.freeOnly; s.page=0; draw();}},"완전 빈 공간만"))));

    const body = el("div",{});
    root.appendChild(body);

    function draw(){
      body.innerHTML="";
      s.mode==="day"? drawDay() : drawRange();
    }

    function drawDay(){
      let rows = Q.occupancyDay(s.date);
      const q=s.q.trim();
      rows = rows.filter(x=>(!s.region||x.b.region===s.region) &&
        (!q||x.b.name.includes(q)||x.room.name.includes(q)) &&
        (!s.freeOnly || (x.sold+x.hold)===0));
      const sold=rows.reduce((a,x)=>a+x.sold,0), hold=rows.reduce((a,x)=>a+x.hold,0);
      const capH=rows.length*13;
      body.appendChild(el("div",{class:"chips",style:"margin:2px 0 10px"},
        el("span",{class:"chip"},`공간 ${R.fmtNum(rows.length)}개`),
        el("span",{class:"chip ch-own"},`판매 ${sold}시간`),
        hold?el("span",{class:"chip"},`홀드 ${hold}시간`):null,
        el("span",{class:"chip"},`빈 시간 ${capH-sold-hold}시간`),
        el("span",{class:"chip"},`판매율 ${capH? Math.round(sold/capH*100):0}%`),
        el("span",{class:"sub"}, "  "+R.fmtDateK(s.date))));

      const per=16, page=Math.min(s.page, Math.max(0,Math.ceil(rows.length/per)-1));
      const slice=rows.slice(page*per,(page+1)*per);

      const grid=el("div",{class:"oc-wrap"});
      const head=el("div",{class:"oc-row oc-head"}, el("div",{class:"oc-label"},"공간"));
      for(let h=11;h<24;h++) head.appendChild(el("div",{class:"oc-h num"},String(h)));
      grid.appendChild(head);

      slice.forEach(x=>{
        const row=el("div",{class:"oc-row"});
        row.appendChild(el("div",{class:"oc-label"},
          el("i",{class:"rdot", style:"background:"+(x.room.hue||"#C9C4BF")}),
          el("b",{},x.b.name), el("small",{class:"sub"}," "+x.room.name+" · "+x.b.region)));
        x.cells.forEach((c,i)=>{
          if(c.r){
            const st=c.r.status;
            const cls = st==="HOLD"?"oc-hold": st==="COMPLETED"?"oc-done": st==="NO_SHOW"?"oc-nos":"oc-conf";
            const cell=el("button",{class:"oc-cell "+cls+(c.r.sh===c.h?" oc-start":""),
              title:`${c.r.id} · ${c.r.name} · ${R.fmtTime(c.r.sh)}~${R.fmtTime(c.r.eh)} · ${R.STATUS[st].label}`,
              onclick:()=>SP.screens.detailDrawer(c.r)});
            row.appendChild(cell);
          } else {
            const canBook = perm("proxyBooking");
            const cell=el("button",{class:"oc-cell oc-empty", disabled:!canBook,
              title: canBook? `${R.fmtTime(c.h)} 비어 있음 — 눌러서 수기 예약` : "비어 있음",
              onclick:()=>{
                let end=c.h+1;
                for(let j=i+1;j<x.cells.length && !x.cells[j].r && end<c.h+5;j++) end++;
                SP.screens.manualModal({ branch:x.b, room:x.room, date:s.date, s:c.h, e:Math.min(end, 24) });
              }});
            row.appendChild(cell);
          }
        });
        grid.appendChild(row);
      });
      body.appendChild(U.card("table-card", grid,
        U.pager(rows.length, page, per, p=>{s.page=p; draw();})));
      body.appendChild(el("div",{class:"chips legend"},
        el("span",{class:"chip"},el("i",{class:"lg oc-conf"})," 확정"),
        el("span",{class:"chip"},el("i",{class:"lg oc-hold"})," 홀드"),
        el("span",{class:"chip"},el("i",{class:"lg oc-done"})," 이용 완료"),
        el("span",{class:"chip"},el("i",{class:"lg oc-nos"})," 노쇼"),
        el("span",{class:"chip"},el("i",{class:"lg oc-empty"})," 빈 시간")));
    }

    function drawRange(){
      if((s.to-s.from)/D.dayMs>20){ s.to=D.addDays(s.from,20);
        body.appendChild(el("p",{class:"note"},"기간 보기는 한 번에 21일까지입니다 — 종료일을 맞췄습니다")); }
      if(s.to<s.from){ s.to=s.from; }
      const {days, rows:all}=Q.occupancyRange(s.from, s.to);
      const q=s.q.trim();
      const rows=all.filter(x=>(!s.region||x.b.region===s.region) &&
        (!q||x.b.name.includes(q)||x.room.name.includes(q)) &&
        (!s.freeOnly || x.tot===0));
      const per=14, page=Math.min(s.page, Math.max(0,Math.ceil(rows.length/per)-1));
      const slice=rows.slice(page*per,(page+1)*per);

      const grid=el("div",{class:"oc-wrap"});
      const head=el("div",{class:"oc-row oc-head", style:`grid-template-columns:200px repeat(${days.length},1fr)`},
        el("div",{class:"oc-label"},"공간"));
      days.forEach(d=>head.appendChild(el("div",{class:"oc-h num"},
        `${d.getMonth()+1}/${d.getDate()}`, el("small",{},R.WD[d.getDay()]))));
      grid.appendChild(head);
      slice.forEach(x=>{
        const row=el("div",{class:"oc-row", style:`grid-template-columns:200px repeat(${days.length},1fr)`});
        row.appendChild(el("div",{class:"oc-label"},
          el("i",{class:"rdot", style:"background:"+(x.room.hue||"#C9C4BF")}),
          el("b",{},x.b.name), el("small",{class:"sub"}," "+x.room.name)));
        x.cells.forEach((c,i)=>{
          const cell=U.heatCell(c.ratio, `${R.fmtDateK(days[i])} — ${c.cnt}건 · 점유 ${Math.round(c.ratio*100)}%`);
          cell.classList.add("oc-day");
          if(c.cnt) cell.textContent=String(c.cnt);
          cell.style.cursor="pointer";
          cell.onclick=()=>{ s.mode="day"; s.date=new Date(days[i]); s.q=x.b.name; s.page=0; SP.app.render(); };
          row.appendChild(cell);
        });
        grid.appendChild(row);
      });
      body.appendChild(U.card("table-card", grid,
        U.pager(rows.length, page, per, p=>{s.page=p; draw();})));
      body.appendChild(el("p",{class:"sub"},"칸을 누르면 그날 · 그 지점의 일간 현황으로 이동합니다"));
    }
    draw();
  };

  /* ═══════════════ 공간 정보 관리 · 프론트 연동 ═══════════════ */
  const spState = { q:"", region:"", bid:null };

  function siteMeta(){
    const st=D.SITE||{};
    return { tel:st.tel||"1544-3523", kakao:st.kakao||"http://pf.kakao.com/_mufLd",
      hours:st.hours||"월~목 10~19시 · 금~일 10~22시",
      regions:[...new Set(D.branches.map(b=>b.region))],
      count:D.branches.length,
      src:(st.src||"운영관리 총괄표")+" · 대시보드 내보내기 "+R.fmtDate(new Date()) };
  }
  function buildFrontData(){
    const rows=D.branches.filter(b=>b.rooms[0].active!==false).map(b=>{
      const room=b.rooms[0];
      return { code:b.code, region:b.region, area:b.area, name:b.shortName, disp:b.name,
        addr:b.addr, base:b.baseP, max:b.maxP, deposit:b.depositLabel, add:b.addFeeLabel,
        pet:b.pet, bbq:b.bbq, karaoke:b.karaoke, place:b.place, sc:b.sc,
        photo:room.photo||"",
        pkgs:b.pkgs.map(p=>({k:p.k, label:p.label, hrs:p.hrs, p:p.p,
          base:p.base, max:p.max, add:b.addFeeLabel, url:p.url})) };
    });
    const obj={ meta:siteMeta(), branches:rows };
    return { name:"data.public.js",
      text:"/* 고객용 지점 데이터 — 쏘플 대시보드에서 생성 ("+R.fmtDT(new Date())+")\n"+
           "   대외비 없음 · ssople 저장소 최상단에 이 파일명 그대로 업로드하면 자동 배포됩니다. */\n"+
           "window.SSOPLE="+JSON.stringify(obj)+";\n" };
  }
  function buildFullData(){
    const rows=D.branches.map(b=>{
      const room=b.rooms[0];
      return { code:b.code, region:b.region, area:b.area, name:b.shortName, disp:b.name,
        addr:b.addr, type:b.type, base:b.baseP, max:b.maxP,
        deposit:b.depositLabel, add:b.addFeeLabel,
        pet:b.pet, bbq:b.bbq, karaoke:b.karaoke, place:b.place, sc:b.sc,
        photo:room.photo||"", visible:room.active!==false,
        priceDay:b.priceDay, priceNight:b.priceNight, pkgs:b.pkgs, ops:b.ops };
    });
    const obj={ meta:siteMeta(), branches:rows };
    return { name:"ssople-data.js",
      text:"/* 전체 지점 데이터 — 대외비 포함(도어락·와이파이·점주 연락처)\n"+
           "   쏘플 대시보드에서 생성 ("+R.fmtDT(new Date())+") · 호스트 센터 전용, 외부 공유 금지 */\n"+
           "window.SSOPLE="+JSON.stringify(obj)+";\n" };
  }
  SP.screens.buildFrontData = buildFrontData;
  SP.screens.buildFullData  = buildFullData;

  SP.screens.spacesAdmin = function(root){
    if(!perm("forceChange")){ root.appendChild(el("div",{class:"empty"},"공간 정보 관리는 본사 권한입니다")); return; }
    root.appendChild(el("div",{class:"page-head"},
      el("h1",{},"공간 정보 관리"),
      el("p",{class:"sub"},"여기서 저장한 값이 그대로 고객 홈페이지 파일이 됩니다 — 전 항목 변경 이력 기록")));

    /* 프론트 연동 */
    const visCnt=D.branches.filter(b=>b.rooms[0].active!==false).length;
    root.appendChild(U.card("", U.secHead("프론트 연동",
        "수정 · 저장 → 고객용 파일 내려받기 → GitHub의 ssople 저장소에 업로드 → 1분 내 자동 배포"),
      el("div",{class:"f-row"},
        el("button",{class:"btn", onclick:()=>{
          const f=buildFrontData(); U.downloadText(f.name, f.text);
          D.logAudit("공간","프론트 연동","고객용 데이터 파일 내보내기 (data.public.js)");
          U.toast("고객용 파일 생성 — 대외비는 제외됩니다");
        }},"고객용 파일 내려받기"),
        el("button",{class:"btn ghost", onclick:()=>{
          const f=buildFullData(); U.downloadText(f.name, f.text);
          D.logAudit("공간","프론트 연동","전체 데이터 파일 내보내기 (대외비 포함)");
          U.toast("전체 파일 생성 — 호스트 센터 전용, 외부 공유 금지","warn");
        }},"호스트용 전체 파일"),
        el("span",{class:"sub"},`고객용에는 노출 중인 ${visCnt} / ${D.branches.length}개 지점이 담깁니다`))));

    const regions=[...new Set(D.branches.map(b=>b.region))];
    const list=()=>D.branches.filter(b=>(!spState.region||b.region===spState.region) &&
      (!spState.q || b.name.includes(spState.q) || b.code.includes(spState.q.toUpperCase())));
    if(!spState.bid || !list().some(b=>b.id===spState.bid)) spState.bid=(list()[0]||D.branches[0]).id;

    const bSel=el("select",{onchange:e=>{spState.bid=e.target.value; SP.app.render();}});
    function fillSel(){ bSel.innerHTML="";
      list().forEach(b=>bSel.appendChild(el("option",{value:b.id, selected:b.id===spState.bid},
        `${b.code} · ${b.name}${b.rooms[0].active===false?" (숨김)":""}`))); }
    fillSel();
    root.appendChild(U.card("filter", el("div",{class:"f-row"},
      el("select",{onchange:e=>{spState.region=e.target.value; spState.bid=null; SP.app.render();}},
        el("option",{value:""},"전 지역"),
        regions.map(x=>el("option",{value:x, selected:spState.region===x},x))),
      el("input",{type:"search", placeholder:"지점 · 코드 검색", value:spState.q,
        oninput:e=>{spState.q=e.target.value; fillSel();}}),
      bSel)));

    const b=D.branchById[spState.bid];
    const room=b.rooms[0];
    const target=b.name;
    const WDL=D.WD_LABEL;

    /* 호스트 변경 요청 승인 배너 */
    const pend=D.pendingChanges.filter(p=>p.branchId===b.id);
    if(pend.length){
      const box=el("div",{});
      const fv=v=>typeof v==="number"? R.fmtNum(v) : v===true?"노출":v===false?"숨김":String(v??"").slice(0,26);
      pend.forEach(p=>{
        const pl=p.payload||{};
        box.appendChild(el("div",{class:"row-line"+(p.over?" hotline":"")},
          el("span",{}, el("b",{},p.kind), ` — ${pl.label||""} `,
            el("small",{class:"sub"},`${fv(pl.from)} → ${fv(pl.to)}${p.over?" · 2영업일 초과":""}`)),
          el("span",{class:"gap"},
            el("button",{class:"btn tiny", onclick:()=>{
              if(pl.field){ room[pl.field]=pl.to;
                if(pl.field==="priceDay") b.priceDay[0]=pl.to;
                if(pl.field==="priceNight") b.priceNight[0]=pl.to; }
              if(SP.persist) SP.persist.branch(b.code);
              D.logAudit("공간", target, `${p.kind} 승인 적용 — ${fv(pl.from)} → ${fv(pl.to)}`);
              D.pendingChanges.splice(D.pendingChanges.indexOf(p),1);
              U.toast("승인 · 적용 — 다음 내보내기부터 프론트에 반영"); SP.app.render();
            }},"승인"),
            el("button",{class:"btn tiny ghost", onclick:()=>{
              D.logAudit("공간", target, `${p.kind} 반려`);
              D.pendingChanges.splice(D.pendingChanges.indexOf(p),1);
              U.toast("반려 처리"); SP.app.render();
            }},"반려"))));
      });
      root.appendChild(U.card("", U.secHead("호스트 변경 요청", `${pend.length}건 승인 대기`), box));
    }

    /* 편집 카드 */
    const phIn=el("input",{placeholder:"https:// 사진 주소 — 비우면 색상 카드로 표시", value:room.photo||"", "data-f":"photo"});
    const thumb=el("div",{class:"roomph", style:"background:"+(room.hue||"#C9C4CF")});
    function paintThumb(){
      thumb.innerHTML="";
      const u=phIn.value.trim();
      if(u){ const im=el("img",{src:u, alt:"", class:"thumb",
        onerror:()=>{ im.remove(); U.toast("사진 주소를 불러오지 못했습니다","warn"); }});
        thumb.appendChild(im); }
    }
    phIn.onchange=paintThumb; paintThumb();
    const descIn=el("textarea",{rows:"2", "data-f":"desc"}, room.desc||"");
    let active=room.active!==false;
    const actSeg=el("div",{class:"seg"},
      [[true,"노출"],[false,"숨김"]].map(([v,t])=>el("button",
        {class:"seg-b"+(active===v?" on":""), onclick:e=>{ active=v;
          [...e.target.parentNode.children].forEach(x=>x.classList.remove("on")); e.target.classList.add("on"); }},t)));

    /* 패키지 표 — 요일 4단 요금 + 예약 링크 */
    const pkTbl=el("table",{class:"grid tight pk-edit"},
      el("thead",{}, el("tr",{}, ["패키지","시간", ...WDL, "네이버 예약 링크"].map(h=>el("th",{},h)))),
      el("tbody",{}, b.pkgs.map(p=>el("tr",{},
        el("td",{}, el("i",{class:"rdot", style:"background:"+(room.hue||"#C9C4CF")}), el("b",{},p.label)),
        el("td",{class:"sub"}, p.hrs||"—"),
        p.p.map((v,i)=>el("td",{}, el("input",{type:"number", step:"5000", class:"pk-in num",
          value:v==null?"":v, placeholder:"—", "data-k":p.k, "data-i":String(i)}))),
        el("td",{}, el("input",{class:"url-in", placeholder:"없으면 비워두세요 — 프론트에서 카톡 문의로 안내",
          value:p.url||"", "data-k":p.k, "data-i":"url"}))))));

    root.appendChild(U.card("space-card",
      U.secHead(`${target} · ${b.code}`, `${b.type} · 기준 ${b.baseP}인 · 최대 ${b.maxP}인 · 보증금 ${b.depositLabel}`,
        el("span",{class:"gap"},
          el("a",{class:"btn tiny ghost", href:"https://ssople.pages.dev/#"+b.code, target:"_blank", rel:"noopener"},"프론트 미리보기 ↗"),
          el("button",{class:"btn tiny", onclick:save},"저장"))),
      el("div",{class:"space-grid"},
        el("div",{class:"space-photo"},
          thumb,
          el("label",{class:"f-cap"},"대표 사진 URL"), phIn,
          el("p",{class:"sub"},"사진을 올리면 고객 카드가 바로 사진으로 바뀝니다 — 파일로 주시면 일괄 등록해 드립니다")),
        el("div",{},
          el("label",{class:"f-cap"},"소개글 (고객 홈페이지 노출)"), descIn,
          el("div",{class:"f-row", style:"margin-top:10px"},
            el("span",{class:"f-cap"},"프론트 노출"), actSeg,
            el("span",{class:"sub"},"숨기면 고객용 파일에서 빠집니다")))),
      el("div",{style:"overflow-x:auto;margin-top:12px"}, pkTbl),
      el("p",{class:"note"},"요금 · 링크는 저장 즉시 수기 예약 계산과 내보내기에 반영됩니다. 기준 · 최대 인원과 보증금은 시트가 원천이라 여기서 바꾸지 않습니다.")));

    function save(){
      const diffs=[];
      const nPhoto=phIn.value.trim();
      if(nPhoto!==(room.photo||"")){ room.photo=nPhoto; diffs.push("대표 사진 "+(nPhoto?"등록":"제거")); }
      const nDesc=descIn.value.trim();
      if(nDesc && nDesc!==room.desc){ room.desc=nDesc; diffs.push("소개글 수정"); }
      const wasOn=room.active!==false;
      if(active!==wasOn){ room.active=active; diffs.push("프론트 노출 "+(active?"켬":"끔")); }
      let priceN=0;
      pkTbl.querySelectorAll("input[data-k]").forEach(inp=>{
        const k=inp.getAttribute("data-k"), i=inp.getAttribute("data-i");
        const p=b.pkgs.find(x=>x.k===k); if(!p) return;
        if(i==="url"){
          const nu=inp.value.trim();
          if(nu!==(p.url||"")){ p.url=nu; diffs.push(`${p.label} 예약 링크 ${nu?"변경":"제거"}`); }
          return;
        }
        const idx=+i;
        const nv=inp.value===""? null : (+inp.value||null);
        if(nv!==p.p[idx]){
          diffs.push(`${p.label} ${WDL[idx]} ${p.p[idx]==null?"—":R.fmtNum(p.p[idx])} → ${nv==null?"—":R.fmtNum(nv)}`);
          p.p[idx]=nv; priceN++;
          if(k==="day"&&nv!=null){ b.priceDay[idx]=nv; if(idx===0) room.priceDay=nv; }
          if(k==="night"&&nv!=null){ b.priceNight[idx]=nv; if(idx===0) room.priceNight=nv; }
        }
      });
      if(!diffs.length){ U.toast("변경된 항목이 없습니다"); return; }
      const logs = diffs.length>6 ? diffs.slice(0,4).concat([`외 ${diffs.length-4}건`]) : diffs;
      logs.forEach(d=>D.logAudit("공간", target, d));
      if(SP.persist) SP.persist.branch(b.code);
      U.toast(`저장 완료 (${diffs.length}건) — 담당 ${me().name} · 내보내기에 반영됩니다`);
      SP.app.render();
    }
  };

  /* ═══════════════ 취소 · 환불 내역 ═══════════════ */
  const cxState = { from:null, to:null, tag:"", page:0 };
  SP.screens.cancelsView = function(root){
    cxState.from ||= D.addDays(D.TODAY,-29);
    cxState.to   ||= D.TODAY;
    const s=cxState;
    root.appendChild(el("div",{class:"page-head"},
      el("h1",{},"취소 · 환불 내역"),
      el("p",{class:"sub"},"취소의 이유가 다음 달 운영을 바꿉니다 — 컴플레인 환불은 개선 과제의 출발점")));

    const quick=(n,t)=>el("button",{class:"btn tiny ghost",
      onclick:()=>{s.from=D.addDays(D.TODAY,-(n-1)); s.to=D.TODAY; s.page=0; SP.app.render();}},t);
    root.appendChild(U.card("filter", el("div",{class:"f-row"},
      quick(7,"7일"), quick(30,"30일"), quick(90,"90일"),
      el("input",{type:"date", value:R.fmtDate(s.from),
        onchange:e=>{ if(e.target.value){s.from=new Date(e.target.value); s.page=0; SP.app.render();} }}),
      el("span",{class:"sub"},"~"),
      el("input",{type:"date", value:R.fmtDate(s.to),
        onchange:e=>{ if(e.target.value){s.to=new Date(e.target.value); s.page=0; SP.app.render();} }}),
      el("span",{class:"f-cap"},"사유"),
      el("div",{class:"chips"}, D.CXL_TAGS.map(t=>el("button",
        {class:"chip f"+(s.tag===t?" on":""),
         onclick:()=>{s.tag=s.tag===t?"":t; s.page=0; SP.app.render();}},t))))));

    const A=Q.cancelAnalysis(s.from, s.to);
    root.appendChild(el("div",{class:"kpi-grid four"},
      U.kpi({label:"취소", value:R.fmtNum(A.cnt)+"건"}),
      U.kpi({label:"취소 금액", value:money()?R.fmtWon(A.amt):"—", sub:"취소된 예약의 결제액 합"}),
      U.kpi({label:"환불", value:`${A.refundCnt}건`, sub:money()?R.fmtWon(A.refundAmt):""}),
      U.kpi({label:"컴플레인 예외 환불", value:`${A.exceptCnt}건`, sub:money()?R.fmtWon(A.exceptAmt):"",
        tip:"규정 밖(이용 6일 전 이후)이지만 관리자 판단으로 환불한 건"})));

    /* 사유 분포 + 지점 최다 */
    const maxC=Math.max(1,...Object.values(A.reasonDist));
    const bars=el("div",{class:"bars"}, D.CXL_TAGS.map(t=>{
      const c=A.reasonDist[t]||0;
      return el("div",{class:"barline"},
        el("span",{class:"bl-k"},t),
        el("div",{class:"bl-track"}, el("i",{class:"bl-fill"+(t==="컴플레인"?" hot":""),
          style:`width:${Math.round(c/maxC*100)}%`})),
        el("span",{class:"bl-v num"},c+"건"));
    }));
    const topTag=Object.entries(A.reasonDist).sort((a,b)=>b[1]-a[1])[0];
    const insight = A.cnt
      ? `개선 포인트 — 이 기간 취소 1위는 '${topTag[0]}' (${Math.round(topTag[1]/A.cnt*100)}%). `+
        (A.exceptCnt? `컴플레인 예외 환불 ${A.exceptCnt}건의 상세 사유를 해당 지점 개선 과제로 전달하세요.`
                    : `컴플레인성 예외 환불은 없었습니다.`)
      : "이 기간 취소 건이 없습니다.";
    root.appendChild(el("div",{class:"two-col"},
      U.card("", U.secHead("취소 사유 분포",""), bars, el("p",{class:"note"},insight)),
      U.card("", U.secHead("취소 최다 지점","조사와 조정의 대상 — 문책의 근거가 아닙니다"),
        el("ol",{class:"rank"}, A.topBranch.map(x=>el("li",{},
          el("button",{class:"blink", onclick:()=>SP.app.go("res",{branch:x.b.id, basis:"use", preset:"month", status:["CANCELLED"]})},
            el("span",{},x.b.name), el("span",{class:"num sub"},x.c+"건"))))))));

    /* 컴플레인 예외 환불 목록 */
    const exList=A.list.filter(r=>r.refund && (r.refund.kind||"").startsWith("예외"));
    if(exList.length){
      root.appendChild(U.card("", U.secHead("컴플레인 예외 환불","규정 밖 환불 — 사유와 담당이 반드시 남는 건"),
        el("div",{}, exList.map(r=>el("div",{class:"row-line", style:"cursor:pointer",
            onclick:()=>SP.screens.detailDrawer(r)},
          el("span",{}, el("b",{},D.branchById[r.branchId].name), ` · ${R.fmtMD(r.useDate)} 이용분 — `,
            el("span",{},(r.cancelReason&&r.cancelReason.note)||"사유 미기재"),
            el("small",{class:"sub"},` · ${r.refund.kind}`)),
          el("span",{class:"num"}, money()?R.fmtWon(r.refund.amt):"—"))))));
    }

    const meName=me().name;

      acts.append(a? el("span",{class:"evt-chip"},"담당 "+a.who)

          }},"내가 맡기"));

        el("option",{value:""},"지정…"), OWNERS.map(o=>el("option",{value:o},o)));

      if(t.go) acts.append(el("button",{class:"btn tiny ghost", onclick:()=>SP.app.go(t.go)},"화면 이동"));

        el("span",{class:"evt-chip"},"해소"))))));

    let target="customer", channel="알림톡";
    const OPTS={
      customer:[["confirm","예약 확정 안내"],["remind","이용 전날 리마인더"],["change","예약 변경 안내"],

      both:[["pair_confirm","확정 안내 (고객) + 신규 알림 (호스트)"],["pair_cancel","취소 안내 (고객) + 취소 알림 (호스트)"],["custom","기타 안내 — 양쪽"]]
    };
    const tSel=el("select",{});
    function fillT(){ tSel.innerHTML=""; OPTS[target].forEach(([v,t])=>tSel.appendChild(el("option",{value:v},t))); }
    fillT();
    const tgSeg=el("div",{class:"seg"},
      [["customer","고객"],["host","호스트"],["both","모두"]].map(([v,t])=>el("button",

      [["알림톡","알림톡"],["문자","문자"]].map(([v,t])=>el("button",

          [...e.target.parentNode.children].forEach(x=>x.classList.remove("on")); e.target.classList.add("on"); }},t)));

      el("div",{},
        el("label",{class:"f-cap"},"받는 사람"), tgSeg,
        el("label",{class:"f-cap"},"채널"), chSeg,
        el("label",{class:"f-cap"},"템플릿 (승인 문구만 발송)"), tSel,
        el("p",{class:"note"},"자유 문구 발송은 광고 판정 위험이 있어 막습니다 — 템플릿은 알림 관리에서 승인 · 등록")),
      [{label:"발송", kind:"btn", onClick:(close)=>{
        const v=tSel.value; const sends=[];
        const cust = tpl => sends.push({tpl, to:"customer", name:r.name, phone:r.phone});
        const host = tpl => sends.push({tpl, to:"host", name:b.owner, phone:D.hostPhone(b)});
        if(target==="customer") cust(v);
        else if(target==="host") host(v);
        else { if(v==="pair_confirm"){ cust("confirm"); host("host_new"); }
               else if(v==="pair_cancel"){ cust("cancel"); host("host_cancel"); }
               else { cust("custom"); host("custom"); } }
        sends.forEach(x=>D.pushMsg({ at:new Date(), tpl:x.tpl, to:x.to, name:x.name, phone:x.phone,
          resId:r.id, branchId:r.branchId, status:"성공", method:channel, by:me().name }));
        const desc=[...new Set(sends.map(x=>(D.TPL[x.tpl]&&D.TPL[x.tpl].label)||x.tpl))].join(" · ");

    const uid=me().id;
    root.appendChild(el("div",{class:"page-head"},
      el("h1",{},"업무 노트"),
      el("p",{class:"sub"},"공지 · 인수인계 · 전달 — 태그된 사람이 확인할 때까지 남습니다")));

    /* 작성 */
    if(perm("manualNotify")){
      let kind="인수인계";
      const kSeg=el("div",{class:"seg"},
        ["공지","인수인계","전달"].map(t=>el("button",
          {class:"seg-b"+(kind===t?" on":""), onclick:e=>{ kind=t;
            [...e.target.parentNode.children].forEach(x=>x.classList.remove("on")); e.target.classList.add("on"); }},t)));
      const ta=el("textarea",{rows:"3", placeholder:"내용을 입력하세요 — 예: 부평점 소음 컴플레인 1차 통화 완료, 재발 시 부분 환불 검토"});
      let allSel=true; const picked=new Set();
      const allChip=el("button",{class:"chip f on", onclick:()=>{ allSel=true; picked.clear(); paintChips(); }},"전체");
      const mgrChips=SP.auth.managers().filter(a=>a.id!==uid).map(a=>
        el("button",{class:"chip f", "data-id":a.id, onclick:e=>{
          if(picked.has(a.id)) picked.delete(a.id); else picked.add(a.id);
          allSel = picked.size===0; paintChips();
        }},"@"+a.name));
      const chipRow=el("div",{class:"chips"}, allChip, mgrChips);
      function paintChips(){
        allChip.classList.toggle("on", allSel);
        mgrChips.forEach(c=>c.classList.toggle("on", picked.has(c.getAttribute("data-id"))));
      }
      root.appendChild(U.card("",
        U.secHead("새 노트","특정 매니저에게만 보내려면 @이름을 선택하세요 — 아무도 고르지 않으면 전체"),
        el("div",{class:"f-row"}, el("span",{class:"f-cap"},"유형"), kSeg),
        ta,
        el("div",{class:"f-row", style:"margin-top:8px"},
          el("span",{class:"f-cap"},"대상"), chipRow,
          el("span",{class:"grow"}),
          el("button",{class:"btn", onclick:()=>{
            const text=ta.value.trim();
            if(!text){ U.toast("내용이 필요합니다","warn"); return; }
            const tags = allSel? "all" : [...picked];
            D.addNote({kind, text, tags});
            ta.value=""; picked.clear(); allSel=true; paintChips();
            U.toast(`등록 — ${tags==="all"?"전체":"@"+tags.map(t=>(SP.auth.byId(t)||{name:t}).name).join(" @")}`);
            SP.app.render();
          }},"등록"))));
    }

    /* 목록 */
    const kindCls = k => k==="공지"?"st-refund": k==="인수인계"?"st-conf":"st-hold";
    const isTarget = n => n.tags==="all" || (Array.isArray(n.tags)&&n.tags.includes(uid));
    const sorted=[...D.notices].sort((a,b)=>{
      const pa=a.kind==="공지"?1:0, pb=b.kind==="공지"?1:0;
      return pb-pa || b.at-a.at;
    });
    sorted.forEach(n=>{
      const unreadMine = isTarget(n) && n.author!==uid && !n.reads[uid];
      const readers=Object.keys(n.reads).map(id=>(SP.auth.byId(id)||{name:id}).name);
      root.appendChild(el("section",{class:"card note-card"+(unreadMine?" mine":"")},
        el("div",{class:"note-head"},
          el("span",{class:"badge "+kindCls(n.kind)},n.kind),
          el("b",{},n.authorName),
          el("span",{class:"sub num"},tFmt(n.at)),
          el("span",{class:"grow"}),
          el("span",{class:"chips"},
            n.tags==="all"? el("span",{class:"chip"},"전체")
            : n.tags.map(t=>el("span",{class:"chip ch-own"},"@"+((SP.auth.byId(t)||{name:t}).name))))),
        el("p",{class:"note-text"},n.text),
        el("div",{class:"note-foot"},
          el("span",{class:"sub"},`확인 ${readers.length}명${readers.length? " — "+readers.join(", "):""}`),
          unreadMine? el("button",{class:"btn tiny", onclick:()=>{
            n.reads[uid]=new Date(); if(SP.persist) SP.persist.ping();
            U.toast("확인 처리 — 이름이 기록됩니다"); SP.app.render();
          }},"확인했습니다") : null)));
    });
  };

    const list=()=>D.branches.filter(b=>!s.q || b.name.includes(s.q) || b.owner.includes(s.q));

      list().forEach(b=>hSel.appendChild(el("option",{value:b.id, selected:b.id===s.bid},
        `${b.region} · ${b.name} — ${b.owner} 호스트`))); }
    fillH();

    /* 수수료율 설정 */
    const rateIn=el("input",{type:"number", min:"0", max:"100", step:"0.5",
      value:(D.settings.feeRate*100).toFixed(1).replace(/\.0$/,""),
      disabled:!perm("settings"),
      title:perm("settings")?"":"수수료율 변경은 총괄 관리자만 (12.5절)"});
    rateIn.onchange=()=>{
      let v=parseFloat(rateIn.value);
      if(isNaN(v)||v<0||v>100){ U.toast("0~100 사이 값을 입력하세요","warn"); rateIn.value=(D.settings.feeRate*100); return; }
      const old=(D.settings.feeRate*100);
      if(v===old) return;
      D.settings.feeRate=v/100;
      D.logAudit("설정","수수료율",`기본 ${old}% → ${v}%`);
      U.toast(`수수료율 ${v}% 적용 — 당월 추정과 다음 정산부터`);
      SP.app.render();
    };

    root.appendChild(U.card("filter", el("div",{class:"f-row"},
      el("select",{onchange:e=>{s.ym=e.target.value; SP.app.render();}},
        months.map(m=>el("option",{value:m.ym, selected:s.ym===m.ym},m.label))),
      el("input",{type:"search", placeholder:"지점 · 호스트 검색", value:s.q,
        oninput:e=>{s.q=e.target.value; fillH();}}),
      hSel,
      el("span",{class:"grow"}),
      el("span",{class:"f-cap"},"기본 수수료율"), rateIn, el("span",{class:"sub"},"%"))));

    const b=D.branchById[s.bid];
    const r=Q.hostSettle(s.bid, s.ym);
    const rateShown=Math.round((r.rate)*1000)/10;

    const line=(k,v,cls,sub)=>el("div",{class:"stmt-line "+(cls||"")},
      el("span",{},k, sub?el("small",{class:"sub"}," · "+sub):null),
      el("span",{class:"num"},v));

    const card=U.card("",
      U.secHead(`${b.name} — ${b.owner} 호스트`,
        r.fixed? "확정 월 — 값이 잠겨 있습니다. 오류는 월 마감 보드의 조정(익월 조정분)으로 처리하세요"
               : "당월 추정 — 매일 새벽 집계로 갱신되며, 익월 1일 확정됩니다",
        el("span",{class:"badge "+(r.fixed? "st-done":"st-hold")}, r.fixed? (r.state||"확정") : "추정")),
      line("총매출", R.fmtWon(r.sales), "", `${r.items.length}건 이용`),
      line(`− 본사 수수료 (${rateShown}%)`, R.fmtWon(r.fee), "sub"),
      r.fixed? line("− 환불 차감", r.refund? R.fmtWon(r.refund):"—", "sub") : null,
      r.fixed? line("조정 (이의 반영)", r.adj? (r.adj>0?"+":"")+R.fmtWon(r.adj):"—", "sub") : null,
      !r.fixed? line("+ 기타수익", R.fmtWon(r.other||0), "sub", "가산") : null,
      !r.fixed? line("− 기타비용", R.fmtWon(r.cost||0), "sub", "차감") : null,
      line("정산금액", R.fmtWon(r.payout), "total"));
    root.appendChild(card);

    /* 조정 입력 (당월 추정만) */
    if(!r.fixed && perm("settleAdjust")){
      const adj=D.hostAdj[r.adjKey];
      const inO=el("input",{type:"number", step:"10000", value:adj.other||0});
      const inC=el("input",{type:"number", step:"10000", value:adj.cost||0});
      const inR=el("input",{type:"number", step:"0.5", placeholder:"기본",
        value: adj.rate!=null? (adj.rate*100):"" });
      const inM=el("input",{placeholder:"조정 사유 메모 — 예: 정수기 렌탈비 본사 대납분", value:adj.memo||""});
      root.appendChild(U.card("",
        U.secHead("이 호스트의 조정 항목","기타수익은 가산(+) · 기타비용은 차감(−) — 저장 시 담당자 이름으로 기록"),
        el("div",{class:"form-grid"},
          el("label",{},"기타수익 (원)", inO),
          el("label",{},"기타비용 (원)", inC),
          el("label",{},"개별 수수료율 (%)", inR),
          el("label",{class:"span2"},"메모", inM)),
        el("div",{class:"f-row"},
          el("button",{class:"btn", onclick:()=>{
            const tgt=`${D.monthLabel(s.ym)} · ${b.name}`;
            const diffs=[];
            const nO=+inO.value||0, nC=+inC.value||0;
            const nR=inR.value===""? null : Math.max(0,Math.min(100,parseFloat(inR.value)))/100;
            if(nO!==adj.other){ diffs.push(`기타수익 ${R.fmtNum(adj.other)} → ${R.fmtNum(nO)}`); adj.other=nO; }
            if(nC!==adj.cost){ diffs.push(`기타비용 ${R.fmtNum(adj.cost)} → ${R.fmtNum(nC)}`); adj.cost=nC; }
            if(nR!==adj.rate){ diffs.push(`개별 수수료율 ${adj.rate==null?"기본":(adj.rate*100)+"%"} → ${nR==null?"기본":(nR*100)+"%"}`); adj.rate=nR; }
            if(inM.value.trim()!==(adj.memo||"")){ adj.memo=inM.value.trim(); diffs.push("메모 수정"); }
            if(!diffs.length){ U.toast("변경된 항목이 없습니다"); return; }
            diffs.forEach(d=>D.logAudit("정산", tgt, d));
            U.toast(`조정 저장 (${diffs.length}건) — 담당 ${me().name}`);
            SP.app.render();
          }},"조정 저장"),
          el("span",{class:"sub"},"차감형 항목을 기타수익 칸에 넣어야 한다면 음수로 입력할 수 있습니다"))));
    }

    /* 예외 환불 참고 */
    const [yy,mm]=s.ym.split("-").map(Number);
    const exc=D.reservations.filter(x=>x.branchId===s.bid && x.status==="CANCELLED" &&
      x.refund && (x.refund.kind||"").startsWith("예외") && x.cancelAt &&
      x.cancelAt.getFullYear()===yy && x.cancelAt.getMonth()===mm-1);
    if(exc.length){
      const sum=exc.reduce((a,x)=>a+x.refund.amt,0);
      root.appendChild(el("p",{class:"note"},
        `참고 — 이 달 컴플레인 예외 환불 ${exc.length}건 · ${R.fmtWon(sum)}. 부담 주체 협의 후 기타비용 반영을 검토하세요 (취소 · 환불 화면에 상세).`));
    }

    /* 건별 내역 */
    let page=0; const wrap=el("div",{});
    root.appendChild(U.card("table-card",
      U.secHead("건별 내역", `${r.items.length}건 — 이용 완료 · 노쇼 포함`,
        el("button",{class:"btn ghost tiny", onclick:()=>{
          U.downloadCSV(`쏘플_호스트정산_${b.name}_${s.ym}.csv`,
            [["이용일","공간","인원","채널","금액","상태"]].concat(
              r.items.map(x=>[R.fmtDate(x.useDate), x.roomName, x.base+x.extra,
                R.CHANNELS[x.channel].label, x.amount, R.STATUS[x.status].label])));
        }},"명세 내려받기")), wrap));
    function draw(){
      wrap.innerHTML="";
      const per=10, slice=r.items.slice(page*per,(page+1)*per);
      wrap.appendChild(el("table",{class:"grid"},
        el("thead",{},el("tr",{},["이용일","공간","인원","채널","금액","상태"].map(h=>el("th",{},h)))),
        el("tbody",{}, slice.map(x=>el("tr",{tabindex:"0", onclick:()=>SP.screens.detailDrawer(x)},
          el("td",{class:"num"},R.fmtDate(x.useDate)),
          el("td",{},x.roomName),
          el("td",{},R.fmtPeople(x.base,x.extra)),
          el("td",{},U.chBadge(x.channel)),
          el("td",{class:"num"},R.fmtWon(x.amount)),
          el("td",{},U.stBadge(x.status)))))));
      wrap.appendChild(U.pager(r.items.length, page, 10, p=>{page=p; draw();}));
    }
    draw();
  };
})();


/* ===== screens_admin3.js ===== */
/* ============================================================
   SSOPLE Dashboard — screens_admin3.js
   3단계: 정책 설정(web_settings) · 회원/리뷰/문의 · 제휴 관리
   ============================================================ */
(() => {
  const R = SP.rules, D = SP.data, U = SP.ui;
  const el = U.el;
  const perm = f => R.PERM[f](SP.state.role);
  const me = () => SP.auth.user || { name:"—" };

  /* ═══════════════ 정책 설정 — web_settings 전면 (9.1~9.5 · 9.7) ═══════════════ */
  SP.screens.policyScreen = function(root){
    const master = perm("settings");
    const S = D.settings;
    root.appendChild(el("div",{class:"page-head"},
      el("h1",{},"정책 설정 (web_settings)"),
      el("p",{class:"sub"},"모든 수치는 코드가 아니라 여기서 삽니다 — 표준가 · 정책 개정은 분기 점주 협의체 의결 후 반영 (9.5절)")));

    const inp = (v,step)=>el("input",{type:"number", step:step||"1", class:"num", value:v,
      disabled:!master, "data-pol":"1"});
    const row = (label, node, hint)=>el("div",{class:"pol-sec"},
      el("span",{class:"f-cap", style:"margin:0"},label),
      el("span",{class:"f-row"}, node, hint? el("span",{class:"sub"},hint):null));

    /* 기본 · 정산 · 분쟁 */
    const fDeposit=inp(S.deposit,"10000"), fRefund=inp(S.refundFullDays),
          fInspect=inp(S.inspectHours), fDispute=inp(S.disputeDays),
          fFee=inp(Math.round(S.feeRate*100));
    root.appendChild(U.card("", U.secHead("기본 정책 (9.1 · 9.2)","이미 결제된 예약은 견적 스냅샷 금액이 유지됩니다 (5.5절) — 정책 변경은 앞으로의 예약에만"),
      row("보증금 (원)", fDeposit, "결제 시 함께 수납"),
      row("전액 환불 기한 (일 전)", fRefund, "그 이후는 환불 불가 — 시스템 자동 판정"),
      row("검수 신고 시한 (시간)", fInspect, "퇴실 후 분쟁 신고 가능 시간"),
      row("차감 이의제기 (일)", fDispute, "제안 통지 후 고객 이의 기간"),
      row("본사 수수료 (%)", fFee, "점주 8 : 본사 2 기준 = 20%")));

    /* 차감 기준표 */
    const dedNodes={};
    root.appendChild(U.card("", U.secHead("보증금 차감 기준표 (9.3)","금액은 시행 전 점주 협의체에서 확정 — 파손은 실비(증빙 금액)"),
      el("div",{}, Object.entries(S.deduct).map(([k,v])=>{
        if(k==="비품 파손") return row(k, el("span",{class:"sub"},"실비 — 구매가 증빙 금액"), v.note);
        const a=inp(v.min,"10000"), b=inp(v.max,"10000");
        dedNodes[k]=[a,b];
        return row(k, el("span",{class:"f-row"}, a, el("span",{class:"sub"},"~"), b), v.note);
      }))));

    /* 포인트 · 클럽 */
    const fRate=inp(S.point.rate), fPlus=inp(S.point.plusRate), fVip=inp(S.point.vipRate),
          fPc=inp(S.point.plusCount), fVc=inp(S.point.vipCount), fExp=inp(S.point.expireMonths);
    root.appendChild(U.card("", U.secHead("포인트 · 쏘플 클럽 (9.4)","적립형(무상)만 운영 — 충전형은 법무 검토 후. 현금 환급 불가는 약관 명시"),
      row("기본 적립률 (%)", fRate, "자체예약 결제액 기준 · 본사 마케팅비 회계"),
      row("플러스 적립률 (%)", fPlus, `완료 ${S.point.plusCount}회 이상`),
      row("VIP 적립률 (%)", fVip, `완료 ${S.point.vipCount}회 이상`),
      row("플러스 승급 기준 (완료 횟수)", fPc, ""),
      row("VIP 승급 기준 (완료 횟수)", fVc, ""),
      row("유효기간 (개월)", fExp, "소멸 30일 전 알림톡 (알림톡 연동 단계)")));

    const An=S.anomaly;
    const fAn1=inp(An.resDrop), fAn2=inp(An.noshowX), fAn3=inp(An.revDrop,"0.1"), fAn4=inp(An.settleDrop);
    root.appendChild(U.card("", U.secHead("이상 탐지 임계값 (6.3)","45개 지점을 소수 인력으로 보는 방법 — 신호는 처리 대기함 상단에 뜹니다"),
      row("예약 급감 (%↓)", fAn1, "최근 7일 vs 직전 7일"),
      row("노쇼 급증 (배수)", fAn2, "지점 · 14일 vs 직전 14일"),
      row("리뷰 급락 (점수차)", fAn3, "지점 · 최근 14일 평균"),
      row("정산 이상치 (%↓)", fAn4, "지점 · 월 진도 대비")));

    if(!master){
      root.appendChild(el("p",{class:"note"},"정책값 변경은 마스터 권한입니다 — 값은 조회만 가능합니다 (9.7절)."));
      return;
    }
    const reason=el("input",{placeholder:"변경 사유 — 협의체 의결일 · 안건 번호 등 (필수, 감사 로그에 남습니다)"});
    root.appendChild(U.card("",
      el("div",{class:"f-row"},
        reason,
        el("button",{class:"btn", onclick:()=>{
          if(!reason.value.trim()){ U.toast("변경 사유 없이 저장할 수 없습니다 (9.5절)","warn"); return; }
          const diffs=[];
          const setN=(obj,key,node,label,scale)=>{
            const nv=scale? (+node.value||0)/scale : (+node.value||0);
            if(nv!==obj[key] && nv>0){ diffs.push(`${label} ${scale?Math.round(obj[key]*scale):obj[key]} → ${node.value}`); obj[key]=nv; }
          };
          setN(S,"deposit",fDeposit,"보증금");
          setN(S,"refundFullDays",fRefund,"전액 환불 기한");
          setN(S,"inspectHours",fInspect,"검수 시한");
          setN(S,"disputeDays",fDispute,"이의 기간");
          setN(S,"feeRate",fFee,"수수료(%)",100);
          Object.entries(dedNodes).forEach(([k,[a,b]])=>{
            const d=S.deduct[k];
            if(+a.value!==d.min||+b.value!==d.max){
              diffs.push(`차감 [${k}] ${d.min/10000}~${d.max/10000}만 → ${(+a.value)/10000}~${(+b.value)/10000}만`);
              d.min=+a.value; d.max=+b.value;
            }
          });
          setN(S.point,"rate",fRate,"적립률(%)");
          setN(S.point,"plusRate",fPlus,"플러스 적립률(%)");
          setN(S.point,"vipRate",fVip,"VIP 적립률(%)");
          setN(S.point,"plusCount",fPc,"플러스 기준");
          setN(S.point,"vipCount",fVc,"VIP 기준");
          setN(S.point,"expireMonths",fExp,"포인트 유효기간");
          setN(S.anomaly,"resDrop",fAn1,"이상 · 예약 급감(%)");
          setN(S.anomaly,"noshowX",fAn2,"이상 · 노쇼 배수");
          if(+fAn3.value>0 && +fAn3.value!==S.anomaly.revDrop){ diffs.push(`이상 · 리뷰 급락 ${S.anomaly.revDrop} → ${fAn3.value}`); S.anomaly.revDrop=+fAn3.value; }
          setN(S.anomaly,"settleDrop",fAn4,"이상 · 정산(%)");
          if(!diffs.length){ U.toast("변경된 값이 없습니다"); return; }
          const logs = diffs.length>5? diffs.slice(0,4).concat([`외 ${diffs.length-4}건`]) : diffs;
          logs.forEach(d=>D.logAudit("정책", "web_settings", d+` — 사유: ${reason.value.trim()}`));
          D.logEvent("PolicyUpdated","",`${diffs.length}개 항목 — ${reason.value.trim().slice(0,30)}`);
          U.toast(`정책 ${diffs.length}건 반영 — 전 화면 즉시 적용 · 기예약 금액 불변`);
          SP.app.render();
        }},"협의 결과 반영")),
      el("p",{class:"note"},"저장 즉시 분쟁 기준표 · 정산 수수료 · 회원 등급이 같은 값을 씁니다. 법령 등 긴급 건은 선반영 후 협의체 보고 (9.5절).")));
  };

  /* ═══════════════ 회원 · 리뷰 · 문의 허브 (6.3 P0) ═══════════════ */
  const mState = { tab:"member", q:"", grade:"", page:0, rvStar:"", rvState:"", iqState:"" };

  SP.screens.membersHub = function(root){
    const s=mState;
    const waitInq=D.inquiries.filter(q=>q.state!=="완료").length;
    const noReply=D.reviews.filter(v=>v.state==="게시"&&!v.reply).length;
    root.appendChild(el("div",{class:"page-head"},
      el("h1",{},"회원 · 리뷰 · 문의"),
      el("p",{class:"sub"},"고객이 남긴 모든 흔적 — 예약 원장에서 파생되므로 별도 입력이 없습니다"),
      el("div",{class:"tabs"},
        [["member","회원"],["review",`리뷰${noReply?` (미답글 ${noReply})`:""}`],["inq",`문의${waitInq?` (${waitInq})`:""}`]]
          .map(([k,t])=>el("button",{class:"tab"+(s.tab===k?" on":""),
            onclick:()=>{s.tab=k; s.page=0; SP.app.render();}},t)))));
    ({member:memberTab, review:reviewTab, inq:inqTab})[s.tab](root);
  };

  function gradeBadge(g){
    return el("span",{class:"badge "+(g.key==="VIP"?"grade-v":g.key==="PLUS"?"grade-p":"grade-b")},
      `${g.label} ${g.rate}%`);
  }

  function memberTab(root){
    const s=mState;
    const all=D.memberIndex();
    const vip=all.filter(m=>D.gradeOf(m.doneCnt).key==="VIP").length;
    root.appendChild(el("div",{class:"kpis k4"},
      U.kpi({label:"전체 회원", value:R.fmtNum(all.length)+"명", sub:"예약 이력 보유 · 전화번호 기준"}),
      U.kpi({label:"VIP", value:vip+"명", sub:`완료 ${D.settings.point.vipCount}회 이상 · 적립 ${D.settings.point.vipRate}%`}),
      U.kpi({label:"반복 위반", value:D.flaggedList().length+"명", sub:"예약 제한 (분쟁 화면 연동)"}),
      U.kpi({label:"포인트 발행 잔액", value:R.fmtNum(D.points.reduce((a,t)=>a+t.amount,0))+"P",
        sub:"본사 마케팅비 — 지점 정산과 분리 (9.4)"})));

    const q=s.q.trim();
    let rows=all.filter(m=>!q || m.name.includes(q) || m.phone.includes(q));
    if(s.grade) rows=rows.filter(m=>D.gradeOf(m.doneCnt).key===s.grade);
    rows.sort((a,b)=>b.sales-a.sales);
    const PAGE=15, pages=Math.max(1,Math.ceil(rows.length/PAGE));
    if(s.page>=pages) s.page=pages-1;

    root.appendChild(U.card("filter", el("div",{class:"f-row"},
      el("input",{type:"search", placeholder:"이름 · 연락처 검색", value:s.q,
        oninput:e=>{s.q=e.target.value; s.page=0; SP.app.render();}}),
      el("div",{class:"chips"}, [["","전체"],["VIP","VIP"],["PLUS","플러스"],["BASIC","베이직"]].map(([v,t])=>
        el("button",{class:"chip f"+(s.grade===v?" on":""),
          onclick:()=>{s.grade=v; s.page=0; SP.app.render();}},t))),

  function memberDrawer(m){
    const g=D.gradeOf(m.doneCnt);
    const hist=D.reservations.filter(r=>r.phone===m.phone)
      .sort((a,b)=>b.useDate-a.useDate).slice(0,12);
    const pts=D.pointsOf(m.phone).slice(0,8);
    const body=el("div",{});
    body.append(el("div",{class:"f-row"},
      gradeBadge(g),
      D.isFlagged(m.phone)? el("span",{class:"badge st-cxl"},"반복 위반 — 예약 제한"):null,
      el("span",{class:"sub"},`첫 이용 ${R.fmtMD(m.first)} · 완료 ${m.doneCnt}회 · 누적 ${perm("viewMoney")? R.fmtWon(m.sales):"—"}`)));

    body.append(el("h4",{class:"d-sub"},"예약 이력"));
    body.append(el("ul",{class:"tl"}, hist.map(r=>el("li",{onclick:()=>SP.screens.detailDrawer(r)},
      el("span",{class:"tl-t num"},R.fmtMD(r.useDate)),
      el("span",{}, D.branchById[r.branchId].name, " · ", R.fmtTime(r.sh),"~",R.fmtTime(r.eh)),
      U.stBadge(r.status)))));

    body.append(el("h4",{class:"d-sub"},`포인트 — 잔액 ${R.fmtNum(D.pointBalance(m.phone))}P`));
    body.append(el("div",{},
      pts.length? pts.map(t=>el("div",{class:"lg-line"},
        el("span",{class:"num sub"},R.fmtMD(t.at)),
        el("span",{}, el("b",{},t.kind)," ",t.memo, el("small",{class:"sub"}," · "+t.by)),
        el("span",{class:"num", style:t.amount<0?"color:var(--red-deep)":""},
          (t.amount>0?"+":"")+R.fmtNum(t.amount)+"P")))
      : el("p",{class:"sub"},"포인트 기록 없음")));
    if(perm("settings")){
      const amt=el("input",{type:"number", step:"1000", placeholder:"± 금액", class:"num", style:"max-width:110px"});
      const why=el("input",{placeholder:"사유 (필수 — 감사 로그)"});
      body.append(el("div",{class:"f-row", style:"margin-top:8px"}, amt, why,

        }},"조정")));

    }
    U.drawer(`${m.name} · ${perm("viewPhoneFull")? m.phone : R.maskPhone(m.phone)}`, body);
  }

          !v.reply? el("button",{class:"btn tiny ghost", onclick:()=>{

            U.modal(`답글 — ${b.name} ★${v.rating}`, el("div",{}, el("p",{class:"sub"},v.text), ta),

  function inqTab(root){
    const s=mState;

      el("span",{class:"grow"}),
      el("span",{class:"sub"},"응대 시간 월~목 10~19 · 금~일 10~22 — 24시간 넘긴 대기는 붉게"))));

          q.state!=="완료"? el("button",{class:"btn tiny", onclick:()=>{

            U.modal("문의 완료 처리 — "+q.subject, el("div",{}, el("p",{class:"sub"},q.body), ta),
              [{label:"완료", kind:"btn", onClick:(close)=>{

              }}]);
          }},"완료"):null)));

  SP.screens.partnerCenter = function(root){

    root.appendChild(el("div",{class:"page-head"},
      el("h1",{},"제휴 관리"),

    /* 패키지 */
    root.appendChild(U.card("", U.secHead("파티 패키지 (표 6-6)","가격은 인원 구간별 정가 · 워크샵은 1인당 단가(B2B)"),

          const pt=D.partners.find(x=>x.id===pid);
          return `${nm}(${pt.name})`;
        }).join(" + ")),
        el("b",{class:"num"}, pk.id==="K3"? "1인 15,000원"

    /* 주문 */
    const obox=el("div",{});
    D.orders.slice(0,18).forEach(o=>{
      const r=D.reservations.find(x=>x.id===o.resId);
      const b=D.branchById[o.branchId];
      obox.appendChild(el("div",{class:"row-line"+(o.state==="지연"?" hotline":"")},
        el("span",{},
          el("b",{},o.pkgName), " · ", b? b.name:"—", " · ",
          r? el("button",{class:"btn tiny ghost", onclick:()=>SP.screens.detailDrawer(r)}, o.resId) : o.resId,

        el("span",{class:"gap"},
          el("span",{class:"badge "+(o.state==="완료"?"st-done":o.state==="지연"?"st-cxl":o.state==="수락"?"st-conf":"st-hold")},o.state),
          o.state==="신규"? el("button",{class:"btn tiny ghost", onclick:()=>{
            D.orderSetState(o.id,"수락"); U.toast("제휴사 수락 — 이행 추적 시작"); SP.app.render(); }},"수락"):null,
          ["수락","지연"].includes(o.state)? el("button",{class:"btn tiny", onclick:()=>{
            D.orderSetState(o.id,"완료"); U.toast("이행 완료 — 제휴 정산 라인은 실결제 단계에서 자동 생성"); SP.app.render(); }},"완료"):null)));

      el("div",{class:"f-row", style:"margin-bottom:10px"},
        ridIn, pkSel,
        el("button",{class:"btn tiny", onclick:()=>{
          const tr=D.addOrder(ridIn.value.trim().toUpperCase(), pkSel.value);

               : U.toast(tr.reason,"warn");
        }},"수기 주문 등록")),
      obox));

    /* 파트너 */
    root.appendChild(U.card("", U.secHead("제휴사","클레임이 쌓이면 노출을 줄이고, 반복되면 퇴출 — 소수 검증 업체 원칙 (12.1절 6위)"),
      el("div",{style:"overflow-x:auto"}, el("table",{class:"grid tight"},
        el("thead",{},el("tr",{},["제휴사","카테고리","수수료","리드타임","클레임","상태",""].map(h=>el("th",{},h)))),
        el("tbody",{}, D.partners.map(pt=>el("tr",{},
          el("td",{},el("b",{},pt.name)),
          el("td",{},pt.cat),
          el("td",{class:"num"},Math.round(pt.fee*100)+"%"),
          el("td",{},pt.lead),
          el("td",{class:"num"+(pt.claims>=2?" sla-over":"")},pt.claims),
          el("td",{}, el("span",{class:"badge "+(pt.state==="운영"?"st-done":"st-exp")},pt.state)),
          el("td",{}, el("button",{class:"btn tiny ghost", onclick:()=>{
            D.partnerToggle(pt.id);
            U.toast(pt.state==="운영"? `${pt.name} 운영 재개`:`${pt.name} 일시중지 — 고객 노출 제외`);
            SP.app.render(); }}, pt.state==="운영"?"일시중지":"재개")))))))));
  };
})();
