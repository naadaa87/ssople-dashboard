  /* ═══════════════ AD-04 예약 통합 관리 ═══════════════ */
  const resState = {
    tab:"list", basis:"use", from:null, to:null, q:"",
    st:new Set(["HOLD","CONFIRMED","COMPLETED","CANCELLED","NO_SHOW"]),
    pay:new Set(), ch:new Set(), branch:null, page:0, linkOnly:false
  };
  SP.screens.applyResPreset = function(p){
    resState.page=0; resState.linkOnly=false; resState.branch=p.branch||null;
    if (p.basis) resState.basis=p.basis;
    const T=D.TODAY;
    if (p.preset==="today"){ resState.from=T; resState.to=T; }
    else if (p.preset==="week"){ const [f,t]=D.weekRange(T); resState.from=f; resState.to=t; }
    else if (p.preset==="month"){ resState.from=D.addDays(T,-30); resState.to=T; }
    if (p.preset==="links"){ resState.linkOnly=true; resState.basis="created";
      resState.from=D.addDays(T,-7); resState.to=T; resState.st=new Set(["HOLD"]); }
    else resState.st=new Set(["HOLD","CONFIRMED","COMPLETED","CANCELLED","NO_SHOW"]);
    if (p.fromD){ resState.from=p.fromD; resState.to=p.fromD; resState.basis="use"; }
    if (p.status){ resState.st=new Set(p.status); }
    if (p.id) resState.q=p.id; else resState.q="";
  };

  function filterRes(){
    const s=resState;
    const from = s.from || D.addDays(D.TODAY,-30);
    const to   = s.to   || D.addDays(D.TODAY, 30);
    const q = s.q.trim().toLowerCase();
    return D.reservations.filter(r=>{
      if (SP.state.role==="staff"){                     /* 스태프: 오늘 · 자기 지점만 (12.5) */
        if (r.branchId!==SP.state.branchId) return false;
        if (D.keyOf(r.useDate)!==D.keyOf(D.TODAY)) return false;
      }
      if (s.branch && r.branchId!==s.branch) return false;
      const base = s.basis==="use"? r.useDate : r.createdAt;
      if (base<from || base>=D.addDays(to,1)) return false;   // 종료일은 그날 끝까지 포함
      if (!s.st.has(r.status)) return false;
      if (s.pay.size && !s.pay.has(r.pay)) return false;
      if (s.ch.size && !s.ch.has(r.channel)) return false;
      if (s.linkOnly && !(r.status==="HOLD"&&r.linkAt&&(D.NOW-r.linkAt)>R.POLICY.linkTtlHours*3600000)) return false;
      if (q){
        const hay = (r.id+" "+r.name+" "+r.phone+" "+D.branchById[r.branchId].name+" "+r.roomName+" "+r.channelNo).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  SP.screens.reservations = function(root){
    const staff = SP.state.role==="staff";
    const tabs = el("div",{class:"tabs"},
      [["list","예약 목록"],["vac","빈 시간 찾기"],["refund","취소 · 환불"]].map(([k,t])=>
        el("button",{class:"tab"+(resState.tab===k?" on":""),
          onclick:()=>{ resState.tab=k;
            if(k==="refund"){ resState.st=new Set(["CANCELLED"]); resState.page=0; }
            SP.app.render(); }},t)));
    if (staff) tabs.querySelectorAll(".tab")[1].disabled = tabs.querySelectorAll(".tab")[2].disabled = true;

    root.appendChild(el("div",{class:"page-head"},
      el("h1",{},"예약 통합 관리"),
      el("p",{class:"sub"}, staff? "스태프 화면 — 오늘 예약만, 금액은 표시되지 않습니다"
        : "검색부터 처리까지 화면 이동 없이 — 구 예약 검색의 계승 (6장)"), tabs));

    if (resState.tab==="vac" && !staff) return vacancyTab(root);
    listTab(root, resState.tab==="refund");
  };

  function listTab(root, refundView){
    const s = resState, staff = SP.state.role==="staff";
    const money = perm("viewMoney");

    /* ── 필터 바 ── */
    const basisSeg = el("div",{class:"seg"},
      [["created","신청일"],["use","이용일"]].map(([k,t])=>el("button",
        {class:"seg-b"+(s.basis===k?" on":""), onclick:()=>{s.basis=k;s.page=0;SP.app.render();}},t)));
    const quicks = el("div",{class:"quick"},
      [["today","오늘"],["week","1주일"],["month","1개월"]].map(([k,t])=>el("button",
        {class:"btn tiny ghost", onclick:()=>{SP.screens.applyResPreset({preset:k,basis:s.basis}); SP.app.render();}},t)));
    const dFrom = el("input",{type:"date", value:s.from?R.fmtDate(s.from):"",
      onchange:e=>{s.from=e.target.value?new Date(e.target.value):null; s.page=0; SP.app.render();}});
    const dTo = el("input",{type:"date", value:s.to?R.fmtDate(s.to):"",
      onchange:e=>{s.to=e.target.value?new Date(e.target.value):null; s.page=0; SP.app.render();}});
    const qIn = el("input",{type:"search", class:"grow", placeholder:"예약번호 · 이름 · 연락처 · 지점 · 채널 예약번호",
      value:s.q, oninput:e=>{s.q=e.target.value; s.page=0; renderTable();}});

    const stChips = el("div",{class:"chips"}, Object.values(R.STATUS).map(st=>
      el("button",{class:"chip f"+(s.st.has(st.key)?" on":""),
        onclick:()=>{ s.st.has(st.key)?s.st.delete(st.key):s.st.add(st.key); s.page=0; renderTable(); }}, st.label)));
    const payChips = el("div",{class:"chips"}, [["card","카드"],["kakao","카카오페이"],["naverpay","네이버페이"],["transfer","계좌이체"],["link","결제링크"],["channel","채널 결제"]].map(([k,t])=>
      el("button",{class:"chip f"+(s.pay.has(k)?" on":""),
        onclick:()=>{ s.pay.has(k)?s.pay.delete(k):s.pay.add(k); s.page=0; renderTable(); }},t)));
    const chChips = el("div",{class:"chips"}, Object.values(R.CHANNELS).map(c=>
      el("button",{class:"chip f"+(s.ch.has(c.key)?" on":""),
        onclick:()=>{ s.ch.has(c.key)?s.ch.delete(c.key):s.ch.add(c.key); s.page=0; renderTable(); }}, c.label)));

    const filter = U.card("filter",
      el("div",{class:"f-row"}, basisSeg, quicks, dFrom, el("span",{class:"sub"},"~"), dTo, qIn,
        s.branch? el("button",{class:"chip on",onclick:()=>{s.branch=null;SP.app.render();}},
          D.branchById[s.branch].name+" ✕"):null,
        perm("proxyBooking")? el("button",{class:"btn", onclick:()=>manualModal()},"+ 수기 예약"):null),
      staff? null : el("div",{class:"f-row wrap"},
        el("span",{class:"f-cap"},"상태"), stChips,
        el("span",{class:"f-cap"},"결제"), payChips,
        el("span",{class:"f-cap"},"채널"), chChips));
    root.appendChild(filter);

    const tblWrap = el("div",{});
    root.appendChild(tblWrap);

    function renderTable(){
      tblWrap.innerHTML="";
      const rows = filterRes();
      const per=50, page=Math.min(s.page, Math.max(0,Math.ceil(rows.length/per)-1));
      const slice = rows.slice(page*per,(page+1)*per);
      const head = ["상태","지점 · 공간","예약자","신청일","이용","연락처","인원",
                    money?"결제 금액":"","결제","채널","메모 · 이슈","보증금","옵션"].filter(Boolean);
      const table = el("table",{class:"grid"},
        el("thead",{}, el("tr",{}, head.map(h=>el("th",{},h)))),
        el("tbody",{}, slice.map(r=>{
          const b=D.branchById[r.branchId];
          const issues=[r.intIssue&&("내부:"+r.intIssue), r.ownIssue&&("점주:"+r.ownIssue)].filter(Boolean).join(" · ");
          return el("tr",{onclick:()=>detailDrawer(r), tabindex:"0",
              onkeydown:e=>{if(e.key==="Enter")detailDrawer(r);}},
            el("td",{}, U.stBadge(r.status),
              r.refund&&r.refund.state==="처리 중"? U.refundBadge():null,
              r.amountDue>0? U.dueBadge():null),
            el("td",{}, el("b",{},b.name), el("small",{class:"sub"}," "+r.roomName+"("+(r.slot==="day"?"낮":"밤")+")")),
            el("td",{}, r.name),
            el("td",{class:"num"}, R.fmtDate(r.createdAt)),
            el("td",{class:"num"}, `${R.fmtMD(r.useDate)} ${R.fmtTime(r.sh)}~${R.fmtTime(r.eh)}`),
            el("td",{class:"num"}, R.maskPhone(r.phone)),
            el("td",{}, R.fmtPeople(r.base,r.extra)),
            money? el("td",{class:"num"}, R.fmtWon(r.amount)) : null,
            el("td",{}, R.PAY[r.pay]),
            el("td",{}, U.chBadge(r.channel)),
            el("td",{class:"clip"}, issues||r.memo||""),
            el("td",{}, r.deposit),
            el("td",{class:"clip"}, r.options));
        })));
      if (!slice.length) tblWrap.appendChild(el("div",{class:"empty"},"조건에 맞는 예약이 없습니다 — 필터를 넓혀 보세요"));
      else tblWrap.appendChild(U.card("table-card", table,
        U.pager(rows.length, page, per, p=>{ s.page=p; renderTable(); })));
      if (refundView) tblWrap.prepend(el("p",{class:"note"},
        "즉시 환불 구조(4.5절) — 취소 성립과 동시에 PG 취소를 호출하므로 별도의 환불 작업 목록은 없습니다. 진행 상태만 건별로 추적합니다."));
    }
    renderTable();
  }

  /* ── 예약 상세 드로어 + 액션 12종 (6.3) ── */
  function detailDrawer(r){
    const b=D.branchById[r.branchId];
    const money=perm("viewMoney");
    const canPhone = perm("viewPhoneFull") ||
      (SP.state.role==="owner" && SP.state.branchId===r.branchId && D.keyOf(r.useDate)===D.keyOf(D.TODAY));
    let phoneShown=false;

    const body = el("div",{});
    const dw = U.drawer(el("div",{}, el("h3",{}, r.id+" "), U.stBadge(r.status),
      r.refund&&r.refund.state==="처리 중"?U.refundBadge():null,
      r.amountDue>0?U.dueBadge():null), body);

    function line(k,v){ return el("div",{class:"d-line"}, el("span",{class:"d-k"},k), el("span",{class:"d-v"},v)); }
    const whoNow = () => (SP.auth && SP.auth.user) ? SP.auth.user.name : R.ROLES[SP.state.role].label;
    function audit(act){
      r.audit.push({at:new Date(), who:whoNow(), act});
      D.logAudit("예약", r.id, act);
    }

    function paint(){
      body.innerHTML="";
      const phoneNode = el("span",{}, phoneShown? r.phone : R.maskPhone(r.phone), " ",
        canPhone && !phoneShown ? el("button",{class:"btn tiny ghost",onclick:()=>{
          phoneShown=true; audit("연락처 전체 열람"); paint(); U.toast("열람 기록이 감사 로그에 남았습니다");
        }},"전체 보기"):null);
      body.append(
        line("지점 · 공간", `${b.name} · ${r.roomName} (${r.slot==="day"?"낮":"밤"}타임)`),
        line("이용", `${R.fmtDateK(r.useDate)} ${R.fmtTime(r.sh)} ~ ${R.fmtTime(r.eh)}`),
        line("신청일", R.fmtDate(r.createdAt)),
        line("예약자", r.name), line("연락처", phoneNode),
        line("인원", R.fmtPeople(r.base,r.extra)),
        money? line("결제", `${R.fmtWon(r.amount)} · ${R.PAY[r.pay]}` + (r.amountDue>0? ` (차액 ${R.fmtWon(r.amountDue)} 결제 대기)`:"")):null,
        line("유입 채널", R.CHANNELS[r.channel].label + (r.channelNo? " · "+r.channelNo:"")),
        r.refund? line("환불", `${R.fmtWon(r.refund.amt)} · ${r.refund.state}` + (r.refund.state==="처리 중"?" — 카드사 사정에 따라 3~5영업일":"")) : null,
        line("보증금", r.deposit), r.options? line("옵션", r.options):null,
        (r.intIssue||r.ownIssue)? line("이슈", [r.intIssue&&"내부: "+r.intIssue, r.ownIssue&&"점주: "+r.ownIssue].filter(Boolean).join(" · ")):null
      );

      /* 액션 — 권한 매트릭스대로 (12.5) */
      const acts = el("div",{class:"d-acts"});
      const hq = perm("forceChange");
      if (r.status==="HOLD" && hq){
        acts.append(
          el("button",{class:"btn", onclick:()=>{ r.status="CONFIRMED"; audit("수동 확정 (예외 건)");
            const bb=D.branchById[r.branchId];
            D.pushMsg({at:new Date(), tpl:"confirm", to:"customer", name:r.name, phone:r.phone, resId:r.id, branchId:r.branchId, by:whoNow()});
            D.pushMsg({at:new Date(), tpl:"host_new", to:"host", name:bb.owner, phone:D.hostPhone(bb), resId:r.id, branchId:r.branchId, by:whoNow()});
            D.occInvalidate();
            U.toast(r.id+" 확정 — 고객 · 호스트 알림 발송"); refresh(); }},"수동 확정"),
          r.linkAt? el("button",{class:"btn ghost", onclick:()=>{ r.linkAt=new Date(); audit("결제링크 재발송");
            D.pushMsg({at:new Date(), tpl:"paylink", to:"customer", name:r.name, phone:r.phone, resId:r.id, branchId:r.branchId, by:whoNow()});
            U.toast("결제링크 재발송 — 유효 24시간"); paint(); }},"링크 재발송"):null,
          el("button",{class:"btn ghost", onclick:()=>{ r.status="CANCELLED"; r.cancelAt=new Date();

            audit("홀드 해제"); D.occInvalidate(); U.toast("홀드 해제 — 시간대 재개방"); refresh(); }},"홀드 해제"));
      }
      if (r.status==="CONFIRMED" && hq){
        acts.append(

          el("button",{class:"btn ghost", onclick:()=>peopleChange(r)},"인원 변경"),
          el("button",{class:"btn ghost", onclick:()=>optionChange(r)},"옵션 변경"),
          el("button",{class:"btn danger-ghost", onclick:()=>forceCancel(r)},"강제 취소"));
      }
      if (hq) acts.append(
        el("button",{class:"btn ghost", onclick:()=>{ 
          U.modal("보증금 상태", el("div",{class:"seg"},["수취","반환","-"].map(v=>
            el("button",{class:"seg-b"+(r.deposit===v?" on":""),onclick:(e)=>{ r.deposit=v; audit("보증금 → "+v); U.toast("보증금: "+v); e.target.closest(".modal-back").remove(); paint(); }},v))),[]);
        }},"보증금"),
        el("button",{class:"btn ghost", onclick:()=>issueModal(r)},"이슈 태그"),
        perm("manualNotify")? el("button",{class:"btn ghost", onclick:()=>SP.screens.notifyModal(r, paint)},"알림 보내기"):null);
      if (SP.state.role==="owner" && r.status==="CONFIRMED" && !r.checkin && D.keyOf(r.useDate)===D.keyOf(D.TODAY))
        acts.append(el("button",{class:"btn", onclick:()=>{ r.checkin=true; audit("체크인 확인"); U.toast("체크인 확인"); paint(); }},"체크인 확인"));
      body.append(acts,
        el("p",{class:"note"},"예약 삭제 기능은 없습니다 — 돈이 걸린 기록은 상태와 이력으로만 남깁니다 (6.3절)"));

      /* 특이사항 메모 스레드 — 담당자 이름과 함께 기록 */
      body.append(el("h4",{class:"d-sub"},"특이사항 메모"));
      body.append(el("ul",{class:"memos"},
        (r.memos && r.memos.length)
          ? r.memos.map(m=>el("li",{},
              el("span",{class:"num sub"},`${m.at.getMonth()+1}/${m.at.getDate()} ${R.pad2(m.at.getHours())}:${R.pad2(m.at.getMinutes())}`),
              el("b",{}," "+m.by+" — "), m.text))
          : [el("li",{class:"sub"},"기록 없음")]));
      const memoIn=el("input",{placeholder:"특이사항 입력 — 담당자 이름과 함께 기록됩니다"});
      body.append(el("div",{class:"f-row"}, memoIn,
        el("button",{class:"btn tiny", onclick:()=>{
          const t=memoIn.value.trim();
          if(!t){ U.toast("내용이 필요합니다","warn"); return; }
          (r.memos ||= []).push({at:new Date(), by:whoNow(), text:t});
          r.memo=t;
          audit(`메모 추가 — ${t.slice(0,24)}${t.length>24?"…":""}`);
          U.toast("메모 저장"); refresh();
        }},"추가")));

      /* 감사 로그 */
      body.append(el("h4",{class:"d-sub"},"감사 로그"),
        r.audit.length? el("ul",{class:"audit"}, [...r.audit].reverse().map(a=>
          el("li",{}, el("span",{class:"num sub"},a.at.toTimeString().slice(0,5)), ` ${a.who} — ${a.act}`)))
        : el("p",{class:"sub"},"기록 없음"));
    }
    function refresh(){ paint(); SP.app.render(); }

    function roomChange(r){
      const list = D.vacancy({date:r.useDate, region:b.region}).filter(v=>v.branch.id===b.id);
      U.modal("방 · 시간 변경 — 서버가 가용성을 재검사합니다",
        list.length? el("ul",{class:"plain"}, list.map(v=>el("li",{class:"row-line"},
          el("span",{},`${v.room.name} · ${R.fmtTime(v.s)}~${R.fmtTime(v.e)}`),
          el("button",{class:"btn tiny",onclick:e=>{
            const before=`${r.roomName} ${R.fmtTime(r.sh)}~${R.fmtTime(r.eh)}`;
            r.roomId=v.room.id; r.roomName=v.room.name; r.sh=v.s; r.eh=Math.min(v.s+ (r.eh-r.sh), v.e);
            audit(`방 변경: ${before} → ${r.roomName} ${R.fmtTime(r.sh)}~${R.fmtTime(r.eh)}`);
            D.occInvalidate();
            U.toast("변경 완료 — 전 · 후가 감사 로그에 남았습니다");
            e.target.closest(".modal-back").remove(); refresh();
          }},"이 시간으로")))) : el("p",{},"오늘 해당 지점에 이동 가능한 빈 시간이 없습니다"), []);
    }
    function peopleChange(r){
      let extra=r.extra;
      const val=el("b",{class:"num"},R.fmtPeople(r.base,extra));
      U.modal("인원 변경 — 금액은 서버가 재계산합니다",
        el("div",{class:"stepper"},
          el("button",{class:"btn ghost",onclick:()=>{extra=Math.max(0,extra-1);val.textContent=R.fmtPeople(r.base,extra);}},"−"),
          val,
          el("button",{class:"btn ghost",onclick:()=>{extra=Math.min(12,extra+1);val.textContent=R.fmtPeople(r.base,extra);}},"+")),
        [{label:"적용",kind:"btn",onClick:(close)=>{
          const diff=(extra-r.extra)*R.POLICY.extraFee;
          r.extra=extra;
          if(diff>0){ r.amountDue=diff; audit(`인원 변경 +${diff/R.POLICY.extraFee}명 — 차액 ${R.fmtWon(diff)} 결제링크 발송`); U.toast("차액 결제링크를 보냈습니다 — 결제 후 금액 반영"); }
          else if(diff<0){ r.amount+=diff; audit(`인원 변경 — 부분 환불 ${R.fmtWon(-diff)} 즉시 처리`); U.toast("부분 환불을 처리했습니다"); }
          close(); refresh();
        }}]);
    }
    function optionChange(r){
      const opts=["","빔프로젝터","생일 세트","노래방 마이크","보드게임"];
      U.modal("옵션 변경", el("div",{class:"seg wrapseg"}, opts.map(o=>
        el("button",{class:"seg-b"+(r.options===o?" on":""),onclick:e=>{
          audit(`옵션: ${r.options||"없음"} → ${o||"없음"}`); r.options=o;
          U.toast("옵션 변경 완료"); e.target.closest(".modal-back").remove(); refresh();
        }}, o||"없음"))), []);
    }
    function forceCancel(r){
      const reason=el("textarea",{placeholder:"사유는 필수입니다 — 감사 로그에 남습니다", rows:"3"});
      const tagSel=el("select",{}, D.CXL_TAGS.map(t=>el("option",{value:t, selected:t==="컴플레인"},t)));
      const ok=R.refundable(r.useDate, D.NOW);
      const sel=el("select",{},
        el("option",{value:"full"}, "전액 환불"+(ok?" (규정: 7일 전 취소)":" (규정 외 — 예외 승인)")),
        el("option",{value:"half"}, "부분 환불 50% (예외 승인)"),
        el("option",{value:"none", selected:!ok},"환불 없음"+(ok?"":" (규정: 6일 전부터 환불 불가)")));
      U.modal("강제 취소 — 예외 상황에만",
        el("div",{}, el("label",{class:"f-cap"},"사유 분류"), tagSel,
          el("label",{class:"f-cap"},"상세 사유"), reason,
          el("label",{class:"f-cap"},"환불 처리"), sel),
        [{label:"취소 확정",kind:"btn danger",onClick:(close)=>{
          if(!reason.value.trim()){ U.toast("사유 없이 진행할 수 없습니다","warn"); return false; }
          r.status="CANCELLED"; r.cancelAt=new Date();
          r.cancelReason={ tag:tagSel.value, note:reason.value.trim() };
          if(sel.value==="full") r.refund={amt:r.amount, state:"완료", at:new Date(), kind: ok? "규정":"예외(전액)"};
          else if(sel.value==="half") r.refund={amt:Math.round(r.amount*0.5), state:"완료", at:new Date(), kind:"예외(부분)"};
          const bb=D.branchById[r.branchId];
          D.pushMsg({at:new Date(), tpl:"cancel", to:"customer", name:r.name, phone:r.phone, resId:r.id, branchId:r.branchId, by:whoNow()});
          D.pushMsg({at:new Date(), tpl:"host_cancel", to:"host", name:bb.owner, phone:D.hostPhone(bb), resId:r.id, branchId:r.branchId, by:whoNow()});
          D.occInvalidate();
          audit(`강제 취소 — [${tagSel.value}] ${reason.value.trim()} · ${sel.value==="full"?"전액 환불":sel.value==="half"?"부분 환불 50%":"환불 없음"}`);
          U.toast("취소 처리 — PG 즉시 취소 호출, 고객 · 호스트 알림 발송"); close(); refresh();
        }}]);
    }
    function issueModal(r){
      const tags=["","클레임","분쟁","시설","기타"];
      const tagSeg=el("div",{class:"seg"},tags.map(t=>el("button",
        {class:"seg-b"+(r.intIssue===t?" on":""),onclick:e=>{ r.intIssue=t;
          [...e.target.parentNode.children].forEach(c=>c.classList.remove("on")); e.target.classList.add("on"); }},t||"없음")));
      U.modal("내부이슈 태그 [확정 필요 — 18장 2번]", tagSeg,
        [{label:"저장",kind:"btn",onClick:(close)=>{ audit(`이슈 태그 → ${r.intIssue||"없음"}`); U.toast("저장했습니다"); close(); refresh(); }}]);
    }

    paint();
  }
  SP.screens.detailDrawer = detailDrawer;

  /* ── 수기 예약 등록 — 전화 · 카카오톡 상담 건 (담당자 이름으로 기록) ── */
  function manualModal(pre){
    let bid = pre? pre.branch.id : D.branches[0].id;
    const bSearch=el("input",{type:"search", placeholder:"지점 검색"});
    const bSel=el("select",{});
    const roomSel=el("select",{});
    const priceLine=el("p",{class:"note num"});
    function fillB(){
      const q=bSearch.value.trim(); bSel.innerHTML="";
      D.branches.filter(b=>!q||b.name.includes(q)).forEach(b=>
        bSel.appendChild(el("option",{value:b.id, selected:b.id===bid},`${b.region} · ${b.name}`)));
      if(![...bSel.options].some(o=>o.value===bid)) bid=bSel.value||D.branches[0].id;
      bSel.value=bid; fillRooms();
    }
    function fillRooms(){
      roomSel.innerHTML="";
      const b=D.branchById[bid];
      b.rooms.filter(rm=>rm.active!==false).forEach(rm=>
        roomSel.appendChild(el("option",{value:rm.id, selected:!!(pre&&pre.room&&pre.room.id===rm.id)},rm.name)));
      calc();
    }
    bSearch.oninput=fillB;
    bSel.onchange=()=>{ bid=bSel.value; fillRooms(); };
    const dIn=el("input",{type:"date", value:R.fmtDate(pre?pre.date:D.addDays(D.TODAY,1)), onchange:()=>calc()});
    const shSel=el("select",{onchange:()=>calc()},
      Array.from({length:13},(_,i)=>el("option",{value:11+i, selected:(pre?pre.s:18)===11+i},R.fmtTime(11+i))));
    const ehSel=el("select",{onchange:()=>calc()},
      Array.from({length:13},(_,i)=>el("option",{value:12+i, selected:(pre?Math.min(pre.e,24):23)===12+i},R.fmtTime(12+i))));
    const pplIn=el("input",{type:"number", min:"1", max:"40", value:(pre&&pre.people)||4, oninput:()=>calc()});
    const nameIn=el("input",{placeholder:"예약자 이름"});
    const phoneIn=el("input",{placeholder:"010-0000-0000"});
    let inflow="phone", payMode="link";
    const mkSeg=(opts, set, def)=>{ let cur=def; set(cur);
      return el("div",{class:"seg"}, opts.map(([v,t])=>el("button",{class:"seg-b"+(v===cur?" on":""),
        onclick:e=>{ cur=v; set(v);
          [...e.target.parentNode.children].forEach(x=>x.classList.remove("on")); e.target.classList.add("on"); }},t))); };
    const inflowSeg=mkSeg([["phone","전화 문의"],["etc","카카오톡 문의"]], v=>inflow=v, "phone");
    const paySeg=mkSeg([["link","결제링크 발송"],["transfer","계좌이체 확인"],["card","카드 결제 확인"]], v=>payMode=v, "link");
    const memoIn=el("textarea",{rows:"2", placeholder:"특이사항 메모 (선택) — 예: 생일파티, 케이크 반입"});
    const msg=el("div",{});
    function calc(){
      const b=D.branchById[bid]; const rm=b.rooms.find(x=>x.id===roomSel.value)||b.rooms[0];
      const sH=+shSel.value, eH=+ehSel.value;
      if(!rm || eH<=sH){ priceLine.textContent="종료가 시작보다 늦어야 합니다"; return 0; }
      const extra=Math.max(0,(+pplIn.value||4)-(rm.baseP||4));
      const amt=D.roomPrice(b, rm, sH<17?"day":"night", Math.min(eH-sH,5), extra);
      priceLine.textContent=`금액 자동 계산: ${R.fmtWon(amt)} — 기준 ${rm.baseP||4}인 + 추가 ${extra}인 (공간 관리의 요금표 기준)`;
      return amt;
    }
    fillB();
    U.modal("수기 예약 등록",
      el("div",{},
        el("div",{class:"form-grid"},
          el("label",{},"지점 검색", bSearch),
          el("label",{},"지점", bSel),
          el("label",{},"공간", roomSel),
          el("label",{},"이용일", dIn),
          el("label",{},"시작", shSel),
          el("label",{},"종료", ehSel),
          el("label",{},"총 인원", pplIn),
          el("label",{},"예약자", nameIn),
          el("label",{},"연락처", phoneIn),
          el("label",{class:"span2"},"문의 유입", inflowSeg),
          el("label",{class:"span2"},"결제 처리", paySeg),
          el("label",{class:"span2"},"특이사항 메모", memoIn)),
        priceLine, msg),
      [{label:"등록", kind:"btn", onClick:(close)=>{
        msg.innerHTML="";
        const b=D.branchById[bid]; const rm=b.rooms.find(x=>x.id===roomSel.value)||b.rooms[0];
        const date=dIn.value? new Date(dIn.value):null;
        const sH=+shSel.value, eH=+ehSel.value;
        if(!nameIn.value.trim()||!phoneIn.value.trim()||!date||eH<=sH){
          msg.appendChild(el("p",{class:"reject"},"예약자 · 연락처 · 이용일 · 시간을 확인해 주세요")); return false; }
        const hit=D.conflictAny(rm.id, date, sH, eH);
        if(hit){
          msg.appendChild(el("p",{class:"reject"},
            `이 시간대에 이미 ${hit.id} (${R.fmtTime(hit.sh)}~${R.fmtTime(hit.eh)})가 있어 서버가 저장을 거절했습니다`));
          return false; }
        const amt=calc();
        const who=(SP.auth&&SP.auth.user)?SP.auth.user.name:"운영팀";
        const paid = payMode!=="link";
        const memoT=memoIn.value.trim();
        const nr={ id:"R"+(200000+Math.floor(Math.random()*99999)),
          branchId:b.id, roomId:rm.id, roomName:rm.name,
          name:nameIn.value.trim(), phone:phoneIn.value.trim(),
          createdAt:new Date(), useDate:date, sh:sH, eh:eH, slot:sH<17?"day":"night",
          base:rm.baseP||4, extra:Math.max(0,(+pplIn.value||4)-(rm.baseP||4)), amount:amt,
          channel:inflow, pay: paid? payMode : "link",
          channelNo:"", status: paid? "CONFIRMED":"HOLD",
          deposit:"-", memo:memoT, intIssue:"", ownIssue:"", options:"",
          checkin:false, refund:null, amountDue:0,
          memos: memoT? [{at:new Date(), by:who, text:memoT}] : [],
          linkAt: paid? null : new Date(),
          audit:[{at:new Date(), who,
            act: paid? `수기 예약 등록 — ${payMode==="transfer"?"계좌이체 입금":"카드 결제"} 확인 후 확정`
                     : "수기 예약 등록 — 결제링크 발송 (유효 24시간)"}] };
        D.reservations.unshift(nr);
        D.occInvalidate();
        D.logAudit("예약", nr.id, nr.audit[0].act);
        if(paid){
          D.pushMsg({at:new Date(), tpl:"confirm", to:"customer", name:nr.name, phone:nr.phone, resId:nr.id, branchId:b.id, by:who});
          D.pushMsg({at:new Date(), tpl:"host_new", to:"host", name:b.owner, phone:D.hostPhone(b), resId:nr.id, branchId:b.id, by:who});
          U.toast("확정 등록 — 고객 · 호스트에게 알림을 보냈습니다");
        } else {
          D.pushMsg({at:new Date(), tpl:"paylink", to:"customer", name:nr.name, phone:nr.phone, resId:nr.id, branchId:b.id, by:who});
          U.toast("결제링크 발송 — 24시간 동안 시간대를 잡아둡니다");
        }
        close(); SP.app.go("res",{id:nr.id});
      }}]);
  }
  SP.screens.manualModal = manualModal;

  /* ── 빈 시간 찾기 탭 (6.4) ── */
  const vacState = { date:null, region:"", people:4 };
  function vacancyTab(root){
    vacState.date ||= D.addDays(D.TODAY,1);
    const dIn=el("input",{type:"date", value:R.fmtDate(vacState.date),
      onchange:e=>{vacState.date=new Date(e.target.value); draw();}});
    const regions=[...new Set(D.branches.map(b=>b.region))];
    const rSel=el("select",{onchange:e=>{vacState.region=e.target.value; draw();}},
      el("option",{value:""},"전 지역"), regions.map(x=>el("option",{value:x, selected:vacState.region===x},x)));
    const pIn=el("input",{type:"number",min:"2",max:"30",value:vacState.people,
      onchange:e=>{vacState.people=+e.target.value||4; draw();}});
    root.appendChild(U.card("filter", el("div",{class:"f-row"},
      el("span",{class:"f-cap"},"이용일"), dIn,
      el("span",{class:"f-cap"},"지역"), rSel,
      el("span",{class:"f-cap"},"인원"), pIn,
      el("span",{class:"sub grow"},"고객 화면과 같은 가용성 계산 — 두 화면의 답이 다를 수 없습니다 (6.4절)"))));
    const grid=el("div",{class:"vac-grid"});
    root.appendChild(grid);
    function draw(){
      grid.innerHTML="";
      const t0=performance.now();
      const list=D.vacancy({date:vacState.date, region:vacState.region||null, people:vacState.people});
      const ms=(performance.now()-t0);
      grid.appendChild(el("p",{class:"sub full"},`${list.length}개 빈 시간 · ${ms.toFixed(0)}ms 응답 (기준 500ms)`));
      list.slice(0,60).forEach(v=>{
        grid.appendChild(el("div",{class:"vac-card"},
          el("b",{},`${v.branch.name}`), el("span",{class:"sub"},` ${v.branch.region}`),
          el("div",{},`${v.room.name} · `, el("span",{class:"num"},`${R.fmtTime(v.s)}~${R.fmtTime(v.e)}`)),
          el("div",{class:"num sub"}, R.fmtWon(v.price)+" 기준"),
          perm("proxyBooking")? el("button",{class:"btn tiny",onclick:()=>manualModal({branch:v.branch, room:v.room, date:vacState.date, s:v.s, e:v.e, people:vacState.people})},"수기 예약 시작"):null));
      });
      if(!list.length) grid.appendChild(el("div",{class:"empty"},"조건에 맞는 빈 시간이 없습니다 — 날짜나 지역을 바꿔 보세요"));
    }
    draw();
  }

  /* ═══════════════ AD-06 정산 (월 마감 보드 · 호스트별) ═══════════════ */
  let settleTab="board";
  SP.screens.settlement = function(root){
    if(!perm("settleBoard")){ root.appendChild(el("div",{class:"empty"},"정산 보드는 본사 권한입니다")); return; }
    const S=D.settlement, stage=R.settlementStage(D.TODAY.getDate());
    const [y,m]=S.month.split("-");
    const tabs=el("div",{class:"tabs"},
      [["board","월 마감 보드"],["host","호스트별 정산"]].map(([k,t])=>el("button",
        {class:"tab"+(settleTab===k?" on":""), onclick:()=>{settleTab=k; SP.app.render();}},t)));
    root.appendChild(el("div",{class:"page-head"},
      el("h1",{}, settleTab==="board"? `정산 현황 보드 — ${y}년 ${+m}월분` : "호스트별 정산"),
      el("p",{class:"sub"}, settleTab==="board"
        ? "1일 집계 · 5일 이의신청 · 10일 지급 — 규정을 그대로 화면으로 (9장)"
        : "총매출 − 수수료 + 기타수익 − 기타비용 = 정산금액 · 수수료율 기본 20%, 관리자가 변경"),
      tabs));
    if(settleTab==="host"){ SP.screens.settleHost(root); return; }

    /* 5단계 트래커 */
    const track=el("ol",{class:"stage-track"}, R.STAGE_SEQ.map((t,i)=>
      el("li",{class: i+1<stage.no?"done": i+1===stage.no?"now":""},
        el("b",{},String(i+1)), el("span",{},t))));
    root.appendChild(U.card("", track,
      el("p",{class:"sub center"},`오늘은 ${D.TODAY.getDate()}일 — ${stage.label} 단계 (${stage.range})`)));

    /* 분포 + 세 숫자 검산 */
    const cnt = s=>S.rows.filter(r=>r.state===s).length;
    const chk = Q.threeWayCheck();
    root.appendChild(el("div",{class:"two-col"},
      U.card("", U.secHead("지점 분포",""),
        el("div",{class:"dist"},
          el("div",{class:"dist-i"}, el("b",{class:"num"},String(cnt("확정"))), el("span",{},"확정")),
          el("div",{class:"dist-i warn"}, el("b",{class:"num"},String(cnt("이의 처리 중"))), el("span",{},"이의 처리 중")),
          el("div",{class:"dist-i hot"}, el("b",{class:"num"},String(cnt("보류"))), el("span",{},"보류")))),
      U.card("", U.secHead("세 숫자의 일치 (9.4절)","정산 = 월 리포트 = 이달 매출"),
        el("div",{class:"check "+(chk.ok?"ok":"hot")},
          el("span",{},chk.ok?"✓ 일치":"✕ 불일치 — 지급 보류"),
          el("span",{class:"num"},R.fmtWon(chk.settleSum))))));

    /* 이의신청 */
    const dspWrap=el("div",{});
    root.appendChild(U.card("", U.secHead("이의신청","조정에는 사유가 필수이며 감사 로그에 남습니다"), dspWrap));
    function drawDisputes(){
      dspWrap.innerHTML="";
      const open=S.disputes.filter(d=>d.state!=="조정 완료");
      const doneL=S.disputes.filter(d=>d.state==="조정 완료");
      if(!open.length) dspWrap.appendChild(el("p",{class:"sub"},"접수된 이의신청이 없습니다"));
      open.forEach(d=>{
        dspWrap.appendChild(el("div",{class:"row-line"},
          el("span",{}, el("b",{},D.branchById[d.branchId].name), ` — ${d.reason}`,
            el("small",{class:"sub"},` · 주장액 ${R.fmtWon(d.amt)}`)),
          el("span",{class:"gap"},
            el("button",{class:"btn tiny ghost",onclick:()=>{
              const row=S.rows.find(x=>x.branchId===d.branchId);
              SP.app.go("res",{branch:d.branchId, basis:"use"});
            }},"원인 예약 보기"),
            perm("settleAdjust")? el("button",{class:"btn tiny",onclick:()=>adjustModal(d)},"조정"):null)));
      });
      if(doneL.length) dspWrap.appendChild(el("p",{class:"sub"},`조정 완료 ${doneL.length}건`));
    }
    function adjustModal(d){
      const amt=el("input",{type:"number", value:d.amt, step:"1000"});
      const reason=el("textarea",{rows:"2",placeholder:"조정 사유 (필수)"});
      U.modal("정산 조정 — "+D.branchById[d.branchId].name,
        el("div",{}, el("label",{class:"f-cap"},"조정 금액 (±원)"), amt,
          el("label",{class:"f-cap"},"사유"), reason,
          stage.no>=4? el("p",{class:"note"},"확정 이후 단계입니다 — 당월 숫자를 고치지 않고 익월 조정분으로 반영됩니다 (9.2절)"):null),
        [{label:"조정 반영",kind:"btn",onClick:(close)=>{
          if(!reason.value.trim()){ U.toast("사유 없이 조정할 수 없습니다","warn"); return false; }
          const row=S.rows.find(x=>x.branchId===d.branchId);
          const v=+amt.value||0;
          if(stage.no>=4){ d.state="조정 완료"; d.nextMonth=v; U.toast(`익월 조정분 ${R.fmtWon(v)} 등록`); }
          else { row.adj+=v; row.payout=row.sales-row.fee-row.refund+row.adj; row.state="확정"; d.state="조정 완료";
            U.toast(`조정 반영 — 지급액 ${R.fmtWon(row.payout)}`); }
          close(); SP.app.render();
        }}]);
    }
    drawDisputes();

    /* 지점별 명세 */
    const stWrap=el("div",{}); let page=0;
    const canFile=perm("payoutFile");
    root.appendChild(U.card("table-card",
      U.secHead("지점별 명세","총매출 → 수수료 20% → 환불 → 조정 → 지급액",
        el("button",{class:"btn"+(canFile?"":" ghost"), disabled:!canFile,
          title:canFile?"":"지급 파일 생성은 총괄 관리자만 (12.5절)",
          onclick:()=>{ if(!canFile) return;
            U.downloadCSV(`쏘플_지급파일_${S.month}.csv`,
              [["지점","점주","지급액","상태","계좌(마스킹)"]].concat(
                S.rows.filter(r=>r.state==="확정").map(r=>{
                  const b=D.branchById[r.branchId];
                  return [b.name,b.owner,r.payout,r.state,"***-**-"+String(100000+Math.floor(Math.random()*899999))];
                })));
          }},"지급 파일 내보내기")), stWrap));
    function drawStatement(){
      stWrap.innerHTML="";
      const rows=[...S.rows].sort((a,b)=>b.payout-a.payout);
      const per=15, slice=rows.slice(page*per,(page+1)*per);
      stWrap.appendChild(el("table",{class:"grid"},
        el("thead",{},el("tr",{},["지점","총매출","수수료 20%","환불 차감","조정","지급액","상태"].map(h=>el("th",{},h)))),
        el("tbody",{},slice.map(r=>{
          const b=D.branchById[r.branchId];
          return el("tr",{},
            el("td",{},el("b",{},b.name),el("small",{class:"sub"}," "+b.owner+" 점주")),
            el("td",{class:"num"},R.fmtWon(r.sales)),
            el("td",{class:"num sub"},"− "+R.fmtWon(r.fee)),
            el("td",{class:"num sub"},r.refund?("− "+R.fmtWon(r.refund)):"—"),
            el("td",{class:"num"},r.adj? (r.adj>0?"+":"")+R.fmtWon(r.adj):"—"),
            el("td",{class:"num strong"},R.fmtWon(r.payout)),
            el("td",{},el("span",{class:"badge "+(r.state==="확정"?"st-done":r.state==="보류"?"st-nos":"st-hold")},r.state)));
        }))));
      stWrap.appendChild(U.pager(rows.length,page,per,p=>{page=p;drawStatement();}));
    }
    drawStatement();
  };

  /* ═══════════════ AD-11 통계 ═══════════════ */
  const statTab={tab:"daily"};
  SP.screens.stats = function(root, pre){
    if(pre&&pre.tab) statTab.tab=pre.tab;
    root.appendChild(el("div",{class:"page-head"}, el("h1",{},"실적 · 통계"),
      el("p",{class:"sub"},"계산식이 합의된 지표만 화면에 올립니다 (10장)"),
      el("div",{class:"tabs"}, [["daily","일별 현황"],["kpi","지점 KPI"],["space","공간 KPI"],["revisit","재방문"],["report","월 리포트"],["dict","지표 사전"]]
        .map(([k,t])=>el("button",{class:"tab"+(statTab.tab===k?" on":""),
          onclick:()=>{statTab.tab=k;SP.app.render();}},t)))));
    ({daily:statDaily,kpi:statKpi,space:(rt)=>SP.screens.statsSpace(rt),revisit:statRevisit,report:statReport,dict:statDict})[statTab.tab](root);
  };

  function statDaily(root){
    /* 월 캘린더 히트맵 */
    const T=D.TODAY, first=new Date(T.getFullYear(),T.getMonth(),1);
    const days=new Date(T.getFullYear(),T.getMonth()+1,0).getDate();
    let max=1; const vals=[];
    for(let d=1;d<=days;d++){
      const row=Q.daily(D.keyOf(new Date(T.getFullYear(),T.getMonth(),d))).tot;
      vals.push(row.useCnt); max=Math.max(max,row.useCnt);
    }
    const cal=el("div",{class:"cal"});
    R.WD.forEach(w=>cal.appendChild(el("div",{class:"cal-h"},w)));
    for(let i=0;i<first.getDay();i++) cal.appendChild(el("div",{}));
    for(let d=1;d<=days;d++){
      const v=vals[d-1];
      const c=U.heatCell(v/max, `${T.getMonth()+1}/${d} — ${v}건`);
      c.classList.add("cal-c"); c.textContent=d;
      c.onclick=()=>SP.app.go("res",{basis:"use",preset:null,fromD:new Date(T.getFullYear(),T.getMonth(),d)});
      if(d===T.getDate()) c.classList.add("today");
      cal.appendChild(c);
    }
    root.appendChild(U.card("wide", U.secHead(`${T.getMonth()+1}월 일별 예약`,"칸을 누르면 그날의 예약 목록으로"), cal));

    /* 요일×시간 히트맵 */
    const hm=el("div",{class:"hm"});
    hm.appendChild(el("div",{}));
    for(let h=11;h<24;h++) hm.appendChild(el("div",{class:"hm-h num"},String(h)));
    for(let wd=0;wd<7;wd++){
      hm.appendChild(el("div",{class:"hm-h"},R.WD[wd]));
      for(let h=0;h<13;h++){
        const sold=D.heat[wd][h], den=D.heatDen[wd][h]||1;
        hm.appendChild(U.heatCell(sold/den*2.2, `${R.WD[wd]} ${h+11}시 — 판매율 ${R.fmtPct(sold/den,0)}`));
      }
    }
    root.appendChild(U.card("wide",
      U.secHead("요일 × 시간대 판매율","최근 28일 — 비는 시간이 채널 배정의 근거입니다 (8.2절)"), hm));
  }

  function statKpi(root){
    let sort={key:"sales",dir:-1}, region="", page=0;
    const rowsAll=Q.branchKpiRows();
    const regions=[...new Set(D.branches.map(b=>b.region))];
    const wrap=el("div",{});
    const cols=[["b","지점",r=>r.b.name],["occ","가동률",r=>R.fmtPct(r.occ,0)],
      ["sales","이달 매출",r=>perm("viewMoney")?R.fmtWon(r.sales):"—"],
      ["avg","객단가",r=>perm("viewMoney")?R.fmtWon(r.avg):"—"],
      ["cxl","취소율",r=>R.fmtPct(r.cxl)],["ns","노쇼율",r=>R.fmtPct(r.ns)],
      ["chN","네이버 비중",r=>R.fmtPct(r.chN,0)],["chS","스클 비중",r=>R.fmtPct(r.chS,0)],
      ["lead","리드타임",r=>r.lead.toFixed(1)+"일"]];
    root.appendChild(U.card("filter", el("div",{class:"f-row"},
      el("select",{onchange:e=>{region=e.target.value;page=0;draw();}},
        el("option",{value:""},"전 지역"), regions.map(x=>el("option",{value:x},x))),
      el("span",{class:"sub grow"},"열 제목을 누르면 정렬 — 하위 지점 붉은 표시는 조정의 재료 (10.3절)"),
      el("button",{class:"btn ghost",onclick:()=>{
        U.downloadCSV("쏘플_지점KPI.csv",[cols.map(c=>c[1])].concat(
          rowsAll.map(r=>cols.map(c=> c[0]==="b"? r.b.name : typeof r[c[0]]==="number"? r[c[0]] : ""))));
      }},"엑셀 내려받기"))));
    root.appendChild(wrap);
    function draw(){
      wrap.innerHTML="";
      let rows=rowsAll.filter(r=>!region||r.b.region===region);
      rows.sort((a,b)=>{ const k=sort.key;
        const av=k==="b"?a.b.name:a[k], bv=k==="b"?b.b.name:b[k];
        return (av>bv?1:av<bv?-1:0)*sort.dir; });
      const occCut=[...rowsAll].sort((a,b)=>a.occ-b.occ)[Math.floor(rowsAll.length*0.1)].occ;
      const per=20, slice=rows.slice(page*per,(page+1)*per);
      wrap.appendChild(U.card("table-card", el("table",{class:"grid"},
        el("thead",{},el("tr",{},cols.map(c=>el("th",{class:"sortable",onclick:()=>{
          sort = sort.key===c[0]? {key:c[0],dir:-sort.dir}:{key:c[0],dir:-1}; draw();
        }}, c[1]+(sort.key===c[0]?(sort.dir<0?" ↓":" ↑"):""))))),
        el("tbody",{},slice.map(r=>el("tr",{class:r.occ<=occCut?"low":""},
          cols.map(c=>el("td",{class:c[0]==="b"?"":"num"}, c[2](r))))))),
        U.pager(rows.length,page,per,p=>{page=p;draw();})));
    }
    draw();
  }

  function statRevisit(root){
    const rv=D.revisit;
    root.appendChild(el("div",{class:"two-col"},
      U.card("", U.secHead("재방문율","첫 이용 후 다시 예약한 회원 — 회원 계정 기준 (10.4절)"),
        el("div",{class:"big-num num"},R.fmtPct(rv.rate)),
        el("p",{class:"sub"},"구 솔루션의 연락처 추정 방식보다 정확합니다")),
      U.card("", U.secHead("가입 월 코호트","가입 후 몇 달째까지 이용이 이어지는가"),
        el("table",{class:"grid tight"},
          el("thead",{},el("tr",{},["가입월","M+0","M+1","M+2","M+3"].map(h=>el("th",{},h)))),
          el("tbody",{},rv.cohort.map(c=>el("tr",{},
            el("td",{},`${c.month}개월 전`),
            c.row.map(v=>{ const td=el("td",{class:"num"},v+"%");
              td.style.background=`color-mix(in srgb, var(--red) ${Math.round(v*0.55)}%, white)`;
              if(v>60) td.style.color="#fff"; return td; }))))))));
  }

  function statReport(root){
    const pm=new Date(D.TODAY.getFullYear(),D.TODAY.getMonth()-1,1);
    const chk=Q.threeWayCheck();
    const done=D.reservations.filter(r=>(r.status==="COMPLETED"||r.status==="NO_SHOW")&&
      r.useDate.getFullYear()===pm.getFullYear()&&r.useDate.getMonth()===pm.getMonth());
    const cnt=done.length, sales=done.reduce((a,r)=>a+r.amount,0);
    const ch=Q.channelStats();
    const byB={}; done.forEach(r=>{byB[r.branchId]=(byB[r.branchId]||0)+r.amount;});
    const top=Object.entries(byB).sort((a,b)=>b[1]-a[1]).slice(0,5);
    root.appendChild(U.card("wide", U.secHead(`${pm.getMonth()+1}월 리포트`,"매월 1일 새벽, 정산 집계와 같은 배치가 생성 — 11장 규칙으로 자동 발송"),
      el("div",{class:"kpi-grid four"},
        U.kpi({label:"이용 완료",value:R.fmtNum(cnt)+"건"}),
        U.kpi({label:"확정 매출",value:perm("viewMoney")?R.fmtWon(sales):"—",sub:"정산 보드와 동일"}),
        U.kpi({label:"정산 검산",value:chk.ok?"일치 ✓":"불일치 ✕",sub:"9.4절 세 숫자"}),
        U.kpi({label:"채널 비중 (28일)",value:R.fmtPct((ch.naver.c+ch.spacecloud.c)/Math.max(1,Object.values(ch).reduce((a,x)=>a+x.c,0)),0),
          sub:`네이버 ${ch.naver.c} · 스클 ${ch.spacecloud.c}건`})),
      el("h4",{class:"d-sub"},"매출 상위 지점"),
      el("ol",{class:"rank"},top.map(([bid,v])=>el("li",{},
        el("span",{},D.branchById[bid].name), el("span",{class:"num"},perm("viewMoney")?R.fmtWon(v):"—"))))));
  }

  function statDict(root){
    const rows=[
      ["가동률","판매된 시간 ÷ 판매 가능 시간","판매 가능 = 운영시간 − 휴무 − 정비 버퍼. 채널 수기 예약 포함"],
      ["평균 객단가","이용 완료 매출 ÷ 이용 완료 건수","취소 · 노쇼 제외"],
      ["취소율","취소 ÷ (확정 + 취소)","신청일 기준 최근 30일 이동 집계"],
      ["노쇼율","노쇼 확정 ÷ 이용 예정","4.3절 판정 절차를 거친 건만"],
      ["채널 비중","채널 등록 ÷ 전체 판매","네이버예약 · 스페이스클라우드 구분"],
      ["재방문율","2회 이상 이용 회원 ÷ 이용 회원","회원 계정 기준"],
      ["후기 평점","노출 상태 후기의 평균","노출 제외 건 미포함"],
      ["리드타임","이용일 − 신청일의 평균","성수기 오픈 시점의 재료"]];
    root.appendChild(U.card("wide",
      U.secHead("지표 사전 (10.1절)","계산식 변경은 문서 개정과 개발 반영을 한 몸으로 — 분기 점검 (16.4절)"),
      el("table",{class:"grid"},
        el("thead",{},el("tr",{},["지표","계산식","기준 · 주의"].map(h=>el("th",{},h)))),
        el("tbody",{},rows.map(r=>el("tr",{},r.map((c,i)=>el("td",{class:i===1?"num-f":""},c))))))));
  }
})();


/* ===== screens_owner.js ===== */
/* ============================================================
   SSOPLE Dashboard — screens_owner.js
   OW-01 · OW-04 · OW-06 (기획서 7 · 8 · 9장)
   ============================================================ */
(() => {
  const R=SP.rules, D=SP.data, Q=SP.q, U=SP.ui;
  const { el } = U;
  const who = () => (SP.auth && SP.auth.user) ? SP.auth.user.name : "호스트";
  const feePct = () => Math.round(D.settings.feeRate*1000)/10;

  /* ═══════ OW-01 점주 대시보드 ═══════ */
  SP.screens.ownerHome = function(root){
    const bid=SP.state.branchId, b=D.branchById[bid];
    const kp=Q.kpis(bid);
    const share=1-D.settings.feeRate;

    root.appendChild(el("div",{class:"page-head"},
      el("h1",{},b.name+" 대시보드"),
      el("p",{class:"sub"},`자기 지점 것만 · 매출은 언제나 호스트 몫 기준 — 수수료 ${feePct()}% 차감 후 (7장)`)));

    /* 지표 4종 */
    root.appendChild(el("div",{class:"kpi-grid four"},
      U.kpi({label:"오늘 예약", value:R.fmtNum(kp.todayRes)+"건"}),
      U.kpi({label:"이번 주 예약", value:R.fmtNum(kp.weekRes)+"건", sub:"이용일 기준"}),
      U.kpi({label:"이달 매출", value:R.fmtWon(kp.monthSales*share), sub:`호스트 몫 (수수료 ${feePct()}%)`}),
      U.kpi({label:"다음 정산 예정액", value:R.fmtWon(kp.monthSales*share), sub:"확정 전 추정 · 익월 1일 집계 → 10일 지급"})));


    /* 처리할 일 — 노쇼 후보 · 채널 마감 · 반려 */
    const nos=Q.noshowCandidates(bid);
    const rem=Q.channelCloseReminders(bid).slice(0,4);
    const taskCard=U.card("", U.secHead("처리할 일",""), el("div",{class:"ow-tasks"}));
    const box=taskCard.querySelector(".ow-tasks");
    if(!nos.length && !rem.length) box.appendChild(el("p",{class:"sub"},"지금 처리할 일이 없습니다"));
    nos.forEach(r=>{
      box.appendChild(el("div",{class:"row-line hotline"},
        el("span",{}, el("b",{},"노쇼 후보")," ", `${r.roomName} ${R.fmtTime(r.sh)}~ · ${r.name} — 시작 후 ${R.POLICY.noshowWaitMin}분 미체크인 (4.3절)`),
        el("span",{class:"gap"},
          el("button",{class:"btn tiny",onclick:()=>{
            r.status="NO_SHOW"; r.noshowAt=new Date();
            r.audit.push({at:new Date(),who:who(),act:"노쇼 확정 — 24시간 내 정정 가능"});
            D.logAudit("예약", r.id, "노쇼 확정");
            U.toast("노쇼 확정 — 매출은 유지되고 정산에 포함됩니다"); SP.app.render();
          }},"노쇼 확정"),
          el("button",{class:"btn tiny ghost",onclick:()=>{
            r.checkin=true; r.audit.push({at:new Date(),who:who(),act:"체크인 확인 (늦은 도착)"});
            D.logAudit("예약", r.id, "체크인 확인 (늦은 도착)");
            U.toast("체크인 확인"); SP.app.render();
          }},"도착함"))));
    });
    /* 노쇼 정정 (24시간 내) */
    D.reservations.filter(r=>r.branchId===bid && r.status==="NO_SHOW" && r.noshowAt &&
      (D.NOW-r.noshowAt)<86400000).slice(0,2).forEach(r=>{
      box.appendChild(el("div",{class:"row-line"},
        el("span",{},el("b",{},"노쇼 정정 가능")," ",`${r.id} · ${R.fmtDateK(r.useDate)} — 판정 후 24시간 이내`),
        el("button",{class:"btn tiny ghost",onclick:()=>{
          r.status="COMPLETED"; r.checkin=true;
          r.audit.push({at:new Date(),who:who(),act:"노쇼 정정 → 이용 완료"});
          D.logAudit("예약", r.id, "노쇼 정정 → 이용 완료");
          U.toast("이용 완료로 정정했습니다"); SP.app.render();
        }},"이용 완료로 정정")));
    });
    rem.forEach(r=>{
      box.appendChild(el("div",{class:"row-line"},
        el("span",{},el("b",{},"채널 마감 확인")," ",
          `${R.fmtDateK(r.useDate)} ${R.fmtTime(r.sh)}~${R.fmtTime(r.eh)} 자사 판매 — 네이버 · 스클에서 내렸는지 (8.1절)`),
        el("button",{class:"btn tiny",onclick:()=>{ r.chClosed=true; U.toast("채널 마감 확인 완료"); SP.app.render(); }},"확인했습니다")));
    });

    /* 오늘 타임라인 */
    const todays=D.reservations.filter(r=>r.branchId===bid &&
      D.keyOf(r.useDate)===D.keyOf(D.TODAY) &&
      (r.status==="CONFIRMED"||r.status==="COMPLETED"||r.status==="NO_SHOW"))
      .sort((a,c)=>a.sh-c.sh);
    const tl=U.card("", U.secHead("오늘 타임라인", R.fmtDateK(D.TODAY)),
      todays.length? el("ul",{class:"tl"}, todays.map(r=>el("li",{onclick:()=>SP.screens.detailDrawer(r)},
        el("span",{class:"num tl-t"},`${R.fmtTime(r.sh)}~${R.fmtTime(r.eh)}`),
        el("span",{class:"tl-b"}, el("b",{},r.roomName)," · ",R.fmtPeople(r.base,r.extra)," · ",r.name,
          el("small",{class:"sub"}," · ",r.phone)),   /* 이용 당일 — 전체 표시 (7.1) */
        U.chBadge(r.channel),
        r.checkin? el("span",{class:"badge st-done"},"체크인"):U.stBadge(r.status))))
      : el("div",{class:"empty"},"오늘 예약이 없습니다"));

    /* 빈 시간 알림 + 4주 매출 */
    const low=lowSlots(bid);
    const side=el("div",{},
      U.card("", U.secHead("빈 시간 알림","이번 주 가동이 낮은 시간대 — 채널 배정을 조정해 보세요 (7.1절)"),
        el("ul",{class:"plain"}, low.map(x=>el("li",{class:"row-line"},
          el("span",{},`${x.wd}요일 ${x.slot}`), el("span",{class:"num sub"},R.fmtPct(x.rate,0)))))),
      U.card("", U.secHead("최근 4주 매출",`주 단위 · 호스트 몫(${feePct()}% 차감 후)`),
        U.miniBars(week4(bid).map(v=>v*R.POLICY.ownerShare))));

    root.appendChild(el("div",{class:"two-col"}, el("div",{}, taskCard, tl), side));
  };

  function lowSlots(bid){
    const agg={};
    D.reservations.forEach(r=>{
      if(r.branchId!==bid) return;
      const dd=Math.floor((D.TODAY-r.useDate)/D.dayMs);
      if(dd<0||dd>=28) return;
      if(!(r.status==="COMPLETED"||r.status==="CONFIRMED"||r.status==="NO_SHOW")) return;
      const key=r.useDate.getDay()+"-"+r.slot;
      agg[key]=(agg[key]||0)+1;
    });
    const b=D.branchById[bid], den=4*b.rooms.length;
    const out=[];
    for(let wd=0;wd<7;wd++) for(const slot of ["day","night"]){
      const v=(agg[wd+"-"+slot]||0)/den;
      out.push({wd:R.WD[wd], slot:slot==="day"?"낮타임":"밤타임", rate:v});
    }
    return out.sort((a,c)=>a.rate-c.rate).slice(0,3);
  }
  function week4(bid){
    const out=[0,0,0,0];
    D.reservations.forEach(r=>{
      if(r.branchId!==bid) return;
      if(!(r.status==="COMPLETED"||r.status==="NO_SHOW")) return;
      const dd=Math.floor((D.TODAY-r.useDate)/D.dayMs);
      if(dd<0||dd>=28) return;
      out[3-Math.floor(dd/7)]+=r.amount;
    });
    return out;
  }

            D.conflictLog.push({ at:new Date(), branchId:bid, date:R.fmtDate(dt),
              range:`${R.fmtTime(s)}~${R.fmtTime(e)}`, channel:ch.value, refused:true, against:conflict.id });
            U.toast("충돌 — 저장 거절 · 관리자 신호로 전달됨","warn");
            return;
          }
          const room=b.rooms[0];
          const need=Math.max(0,(+ppl.value||4)-R.POLICY.basePeople);

            channel:ch.value, pay:"channel", channelNo:cno.value.trim(),

  SP.screens.ownerSettle = function(root){

    root.appendChild(el("div",{class:"page-head"},
      el("h1",{},"공간 현황판"),
      el("p",{class:"sub"},"오늘 어디가 차 있고 어디가 비었는가 — 빈 칸을 누르면 바로 수기 예약이 시작됩니다")));

    const regions=[...new Set(D.branches.map(b=>b.region))];
    const modeSeg = el("div",{class:"seg"},
      [["day","일간"],["range","기간"]].map(([k,t])=>el("button",
        {class:"seg-b"+(s.mode===k?" on":""), onclick:()=>{s.mode=k; s.page=0; SP.app.render();}},t)));
    const dayNav = el("span",{class:"gap"},
      el("button",{class:"btn tiny ghost", onclick:()=>{s.date=D.addDays(s.date,-1); s.page=0; SP.app.render();}},"◀"),
      el("input",{type:"date", value:R.fmtDate(s.date),
        onchange:e=>{ if(e.target.value){ s.date=new Date(e.target.value); s.page=0; SP.app.render(); } }}),
      el("button",{class:"btn tiny ghost", onclick:()=>{s.date=D.TODAY; s.page=0; SP.app.render();}},"오늘"),
      el("button",{class:"btn tiny ghost", onclick:()=>{s.date=D.addDays(s.date,1); s.page=0; SP.app.render();}},"▶"));
    const rangeNav = el("span",{class:"gap"},
      el("input",{type:"date", value:R.fmtDate(s.from),
        onchange:e=>{ if(e.target.value){ s.from=new Date(e.target.value); s.page=0; SP.app.render(); } }}),
      el("span",{class:"sub"},"~"),
      el("input",{type:"date", value:R.fmtDate(s.to),
        onchange:e=>{ if(e.target.value){ s.to=new Date(e.target.value); s.page=0; SP.app.render(); } }}));

    root.appendChild(U.card("filter", el("div",{class:"f-row"},
      modeSeg, s.mode==="day"? dayNav : rangeNav,
      el("select",{onchange:e=>{s.region=e.target.value; s.page=0; SP.app.render();}},
        el("option",{value:""},"전 지역"),
        regions.map(x=>el("option",{value:x, selected:s.region===x},x))),
      el("input",{type:"search", placeholder:"지점 검색", value:s.q,
        oninput:e=>{s.q=e.target.value; s.page=0; draw();}}),
      el("button",{class:"chip f"+(s.freeOnly?" on":""),
        onclick:()=>{s.freeOnly=!s.freeOnly; s.page=0; draw();}},"완전 빈 공간만"))));

    const body = el("div",{});
    root.appendChild(body);

    function draw(){
      body.innerHTML="";
      s.mode==="day"? drawDay() : drawRange();
    }

    function drawDay(){
      let rows = Q.occupancyDay(s.date);
      const q=s.q.trim();
      rows = rows.filter(x=>(!s.region||x.b.region===s.region) &&
        (!q||x.b.name.includes(q)||x.room.name.includes(q)) &&
        (!s.freeOnly || (x.sold+x.hold)===0));
      const sold=rows.reduce((a,x)=>a+x.sold,0), hold=rows.reduce((a,x)=>a+x.hold,0);
      const capH=rows.length*13;
      body.appendChild(el("div",{class:"chips",style:"margin:2px 0 10px"},
        el("span",{class:"chip"},`공간 ${R.fmtNum(rows.length)}개`),
        el("span",{class:"chip ch-own"},`판매 ${sold}시간`),
        hold?el("span",{class:"chip"},`홀드 ${hold}시간`):null,
        el("span",{class:"chip"},`빈 시간 ${capH-sold-hold}시간`),
        el("span",{class:"chip"},`판매율 ${capH? Math.round(sold/capH*100):0}%`),
        el("span",{class:"sub"}, "  "+R.fmtDateK(s.date))));

      const per=16, page=Math.min(s.page, Math.max(0,Math.ceil(rows.length/per)-1));
      const slice=rows.slice(page*per,(page+1)*per);

      const grid=el("div",{class:"oc-wrap"});
      const head=el("div",{class:"oc-row oc-head"}, el("div",{class:"oc-label"},"공간"));
      for(let h=11;h<24;h++) head.appendChild(el("div",{class:"oc-h num"},String(h)));
      grid.appendChild(head);

      slice.forEach(x=>{
        const row=el("div",{class:"oc-row"});
        row.appendChild(el("div",{class:"oc-label"},
          el("i",{class:"rdot", style:"background:"+(x.room.hue||"#C9C4BF")}),
          el("b",{},x.b.name), el("small",{class:"sub"}," "+x.room.name+" · "+x.b.region)));
        x.cells.forEach((c,i)=>{
          if(c.r){
            const st=c.r.status;
            const cls = st==="HOLD"?"oc-hold": st==="COMPLETED"?"oc-done": st==="NO_SHOW"?"oc-nos":"oc-conf";
            const cell=el("button",{class:"oc-cell "+cls+(c.r.sh===c.h?" oc-start":""),
              title:`${c.r.id} · ${c.r.name} · ${R.fmtTime(c.r.sh)}~${R.fmtTime(c.r.eh)} · ${R.STATUS[st].label}`,
              onclick:()=>SP.screens.detailDrawer(c.r)});
            row.appendChild(cell);
          } else {
            const canBook = perm("proxyBooking");
            const cell=el("button",{class:"oc-cell oc-empty", disabled:!canBook,
              title: canBook? `${R.fmtTime(c.h)} 비어 있음 — 눌러서 수기 예약` : "비어 있음",
              onclick:()=>{
                let end=c.h+1;
                for(let j=i+1;j<x.cells.length && !x.cells[j].r && end<c.h+5;j++) end++;
                SP.screens.manualModal({ branch:x.b, room:x.room, date:s.date, s:c.h, e:Math.min(end, 24) });
              }});
            row.appendChild(cell);
          }
        });
        grid.appendChild(row);
      });
      body.appendChild(U.card("table-card", grid,
        U.pager(rows.length, page, per, p=>{s.page=p; draw();})));
      body.appendChild(el("div",{class:"chips legend"},
        el("span",{class:"chip"},el("i",{class:"lg oc-conf"})," 확정"),
        el("span",{class:"chip"},el("i",{class:"lg oc-hold"})," 홀드"),
        el("span",{class:"chip"},el("i",{class:"lg oc-done"})," 이용 완료"),
        el("span",{class:"chip"},el("i",{class:"lg oc-nos"})," 노쇼"),
        el("span",{class:"chip"},el("i",{class:"lg oc-empty"})," 빈 시간")));
    }

    function drawRange(){
      if((s.to-s.from)/D.dayMs>20){ s.to=D.addDays(s.from,20);
        body.appendChild(el("p",{class:"note"},"기간 보기는 한 번에 21일까지입니다 — 종료일을 맞췄습니다")); }
      if(s.to<s.from){ s.to=s.from; }
      const {days, rows:all}=Q.occupancyRange(s.from, s.to);
      const q=s.q.trim();
      const rows=all.filter(x=>(!s.region||x.b.region===s.region) &&
        (!q||x.b.name.includes(q)||x.room.name.includes(q)) &&
        (!s.freeOnly || x.tot===0));
      const per=14, page=Math.min(s.page, Math.max(0,Math.ceil(rows.length/per)-1));
      const slice=rows.slice(page*per,(page+1)*per);

      const grid=el("div",{class:"oc-wrap"});
      const head=el("div",{class:"oc-row oc-head", style:`grid-template-columns:200px repeat(${days.length},1fr)`},
        el("div",{class:"oc-label"},"공간"));
      days.forEach(d=>head.appendChild(el("div",{class:"oc-h num"},
        `${d.getMonth()+1}/${d.getDate()}`, el("small",{},R.WD[d.getDay()]))));
      grid.appendChild(head);
      slice.forEach(x=>{
        const row=el("div",{class:"oc-row", style:`grid-template-columns:200px repeat(${days.length},1fr)`});
        row.appendChild(el("div",{class:"oc-label"},
          el("i",{class:"rdot", style:"background:"+(x.room.hue||"#C9C4BF")}),
          el("b",{},x.b.name), el("small",{class:"sub"}," "+x.room.name)));
        x.cells.forEach((c,i)=>{
          const cell=U.heatCell(c.ratio, `${R.fmtDateK(days[i])} — ${c.cnt}건 · 점유 ${Math.round(c.ratio*100)}%`);
          cell.classList.add("oc-day");
          if(c.cnt) cell.textContent=String(c.cnt);
          cell.style.cursor="pointer";
          cell.onclick=()=>{ s.mode="day"; s.date=new Date(days[i]); s.q=x.b.name; s.page=0; SP.app.render(); };
          row.appendChild(cell);
        });
        grid.appendChild(row);
      });
      body.appendChild(U.card("table-card", grid,
        U.pager(rows.length, page, per, p=>{s.page=p; draw();})));
      body.appendChild(el("p",{class:"sub"},"칸을 누르면 그날 · 그 지점의 일간 현황으로 이동합니다"));
    }
    draw();
  };

  /* ═══════════════ 공간 정보 관리 ═══════════════ */
  const spState = { q:"", region:"", bid:null };
  SP.screens.spacesAdmin = function(root){
    if(!perm("forceChange")){ root.appendChild(el("div",{class:"empty"},"공간 정보 관리는 본사 권한입니다")); return; }
    root.appendChild(el("div",{class:"page-head"},
      el("h1",{},"공간 정보 관리"),
      el("p",{class:"sub"},"홈페이지에 노출되는 사진 · 가격 · 소개를 바꿉니다 — 저장 즉시 반영되고, 전 항목이 변경 이력에 남습니다")));

    const regions=[...new Set(D.branches.map(b=>b.region))];
    const list = () => D.branches.filter(b=>(!spState.region||b.region===spState.region) &&
      (!spState.q||b.name.includes(spState.q)));
    if(!spState.bid || !list().some(b=>b.id===spState.bid)) spState.bid = (list()[0]||D.branches[0]).id;

    const bSel = el("select",{onchange:e=>{spState.bid=e.target.value; SP.app.render();}});
    function fillSel(){ bSel.innerHTML="";
      list().forEach(b=>bSel.appendChild(el("option",{value:b.id, selected:b.id===spState.bid},`${b.region} · ${b.name}`))); }
    fillSel();
    root.appendChild(U.card("filter", el("div",{class:"f-row"},
      el("select",{onchange:e=>{spState.region=e.target.value; spState.bid=null; SP.app.render();}},
        el("option",{value:""},"전 지역"), regions.map(x=>el("option",{value:x, selected:spState.region===x},x))),
      el("input",{type:"search", placeholder:"지점 검색", value:spState.q,
        oninput:e=>{spState.q=e.target.value; fillSel();}}),
      bSel)));

    const b = D.branchById[spState.bid];

    /* 호스트 변경 요청 승인 배너 */
    const pend = D.pendingChanges.filter(p=>p.branchId===b.id);
    if(pend.length){
      const box=el("div",{});
      pend.forEach(p=>{
        const room=b.rooms.find(r=>r.id===p.roomId)||b.rooms[0];
        const pl=p.payload||{};
        const fv = v => typeof v==="number"? R.fmtNum(v) : v===true?"노출":v===false?"숨김":String(v??"").slice(0,26);
        box.appendChild(el("div",{class:"row-line"+(p.over?" hotline":"")},
          el("span",{}, el("b",{},p.kind), ` — ${room.name} · ${pl.label||""} `,
            el("small",{class:"sub"},`${fv(pl.from)} → ${fv(pl.to)}${p.over?" · 2영업일 초과":""}`)),
          el("span",{class:"gap"},
            el("button",{class:"btn tiny", onclick:()=>{
              if(pl.field) room[pl.field]=pl.to;
              D.logAudit("공간", `${b.name} · ${room.name}`, `${p.kind} 승인 적용 — ${fv(pl.from)} → ${fv(pl.to)}`);
              D.pendingChanges.splice(D.pendingChanges.indexOf(p),1);
              U.toast("승인 · 적용 — 호스트에게 알림 발송"); SP.app.render();
            }},"승인"),
            el("button",{class:"btn tiny ghost", onclick:()=>{
              D.logAudit("공간", `${b.name} · ${room.name}`, `${p.kind} 반려`);
              D.pendingChanges.splice(D.pendingChanges.indexOf(p),1);
              U.toast("반려 — 사유 입력 알림 발송"); SP.app.render();
            }},"반려"))));
      });
      root.appendChild(U.card("", U.secHead("호스트 변경 요청", `${pend.length}건 승인 대기`), box));
    }

    /* 룸 편집 카드 */
    b.rooms.forEach(room=>{
      const target=`${b.name} · ${room.name}`;
      let hue=room.hue;
      const ph=el("div",{class:"roomph", style:"background:"+hue});
      const palette=el("div",{class:"palette"},
        [...new Set(Object.values(D.ROOM_HUE))].map(c=>el("button",
          {class:"sw"+(c===hue?" on":""), style:"background:"+c, "aria-label":"색상 "+c,
           onclick:e=>{ hue=c; ph.style.background=c;
             [...e.target.parentNode.children].forEach(x=>x.classList.remove("on")); e.target.classList.add("on"); }})));
      const inD=el("input",{type:"number", step:"1000", value:room.priceDay});
      const inN=el("input",{type:"number", step:"1000", value:room.priceNight});
      const inB=el("input",{type:"number", min:"1", value:room.baseP});
      const inM=el("input",{type:"number", min:"1", value:room.maxP});
      const inDesc=el("textarea",{rows:"2"}, room.desc);
      let active=room.active!==false;
      const actSeg=el("div",{class:"seg"},
        [[true,"노출"],[false,"숨김"]].map(([v,t])=>el("button",
          {class:"seg-b"+(active===v?" on":""), onclick:e=>{ active=v;
            [...e.target.parentNode.children].forEach(x=>x.classList.remove("on")); e.target.classList.add("on"); }},t)));

      root.appendChild(U.card("space-card",
        U.secHead(target, `기준 ${room.baseP}인 · 최대 ${room.maxP}인`,
          el("button",{class:"btn", onclick:()=>{
            const diffs=[];
            const put=(label, oldV, newV, apply, fmt)=>{ if(String(oldV)!==String(newV)){ apply();
              diffs.push(`${label} ${fmt?fmt(oldV):oldV} → ${fmt?fmt(newV):newV}`); } };
            put("낮 요금", room.priceDay, +inD.value||room.priceDay, ()=>room.priceDay=+inD.value, R.fmtNum);
            put("밤 요금", room.priceNight, +inN.value||room.priceNight, ()=>room.priceNight=+inN.value, R.fmtNum);
            put("기준 인원", room.baseP, +inB.value||room.baseP, ()=>room.baseP=+inB.value);
            put("최대 인원", room.maxP, +inM.value||room.maxP, ()=>room.maxP=+inM.value);
            put("소개글", room.desc, inDesc.value.trim()||room.desc, ()=>room.desc=inDesc.value.trim(),
              v=>String(v).slice(0,14)+"…");
            put("대표 사진", room.hue, hue, ()=>room.hue=hue);
            put("노출 상태", room.active!==false, active, ()=>room.active=active, v=>v?"노출":"숨김");
            if(!diffs.length){ U.toast("변경된 항목이 없습니다"); return; }
            diffs.forEach(d=>D.logAudit("공간", target, d));
            U.toast(`저장 완료 (${diffs.length}건) — 담당 ${me().name}`);
            SP.app.render();
          }},"저장")),
        el("div",{class:"space-grid"},
          el("div",{class:"space-photo"},
            ph, palette,
            el("p",{class:"sub"},"대표 사진 — 데모에서는 색상 시드로 대신합니다. 실서비스는 이미지 업로드 · 순서 변경")),
          el("div",{class:"form-grid"},
            el("label",{},"낮타임 요금 (12~17시)", inD),
            el("label",{},"밤타임 요금 (18~23시)", inN),
            el("label",{},"기준 인원", inB),
            el("label",{},"최대 인원", inM),
            el("label",{class:"span2"},"소개글 (홈페이지 노출)", inDesc),
            el("label",{},"운영 노출", actSeg))),
        el("p",{class:"note"},"요금 변경은 이후의 신규 · 수기 예약부터 적용됩니다 — 이미 결제된 예약의 금액은 바뀌지 않습니다")));
    });
  };

  /* ═══════════════ 취소 · 환불 내역 ═══════════════ */
  const cxState = { from:null, to:null, tag:"", page:0 };
  SP.screens.cancelsView = function(root){
    cxState.from ||= D.addDays(D.TODAY,-29);
    cxState.to   ||= D.TODAY;
    const s=cxState;
    root.appendChild(el("div",{class:"page-head"},
      el("h1",{},"취소 · 환불 내역"),
      el("p",{class:"sub"},"취소의 이유가 다음 달 운영을 바꿉니다 — 컴플레인 환불은 개선 과제의 출발점")));

    const quick=(n,t)=>el("button",{class:"btn tiny ghost",
      onclick:()=>{s.from=D.addDays(D.TODAY,-(n-1)); s.to=D.TODAY; s.page=0; SP.app.render();}},t);
    root.appendChild(U.card("filter", el("div",{class:"f-row"},
      quick(7,"7일"), quick(30,"30일"), quick(90,"90일"),
      el("input",{type:"date", value:R.fmtDate(s.from),
        onchange:e=>{ if(e.target.value){s.from=new Date(e.target.value); s.page=0; SP.app.render();} }}),
      el("span",{class:"sub"},"~"),
      el("input",{type:"date", value:R.fmtDate(s.to),
        onchange:e=>{ if(e.target.value){s.to=new Date(e.target.value); s.page=0; SP.app.render();} }}),
      el("span",{class:"f-cap"},"사유"),
      el("div",{class:"chips"}, D.CXL_TAGS.map(t=>el("button",
        {class:"chip f"+(s.tag===t?" on":""),
         onclick:()=>{s.tag=s.tag===t?"":t; s.page=0; SP.app.render();}},t))))));

    const A=Q.cancelAnalysis(s.from, s.to);
    root.appendChild(el("div",{class:"kpi-grid four"},
      U.kpi({label:"취소", value:R.fmtNum(A.cnt)+"건"}),
      U.kpi({label:"취소 금액", value:money()?R.fmtWon(A.amt):"—", sub:"취소된 예약의 결제액 합"}),
      U.kpi({label:"환불", value:`${A.refundCnt}건`, sub:money()?R.fmtWon(A.refundAmt):""}),
      U.kpi({label:"컴플레인 예외 환불", value:`${A.exceptCnt}건`, sub:money()?R.fmtWon(A.exceptAmt):"",
        tip:"규정 밖(이용 6일 전 이후)이지만 관리자 판단으로 환불한 건"})));

    /* 사유 분포 + 지점 최다 */
    const maxC=Math.max(1,...Object.values(A.reasonDist));
    const bars=el("div",{class:"bars"}, D.CXL_TAGS.map(t=>{
      const c=A.reasonDist[t]||0;
      return el("div",{class:"barline"},
        el("span",{class:"bl-k"},t),
        el("div",{class:"bl-track"}, el("i",{class:"bl-fill"+(t==="컴플레인"?" hot":""),
          style:`width:${Math.round(c/maxC*100)}%`})),
        el("span",{class:"bl-v num"},c+"건"));
    }));
    const topTag=Object.entries(A.reasonDist).sort((a,b)=>b[1]-a[1])[0];
    const insight = A.cnt
      ? `개선 포인트 — 이 기간 취소 1위는 '${topTag[0]}' (${Math.round(topTag[1]/A.cnt*100)}%). `+
        (A.exceptCnt? `컴플레인 예외 환불 ${A.exceptCnt}건의 상세 사유를 해당 지점 개선 과제로 전달하세요.`
                    : `컴플레인성 예외 환불은 없었습니다.`)
      : "이 기간 취소 건이 없습니다.";
    root.appendChild(el("div",{class:"two-col"},
      U.card("", U.secHead("취소 사유 분포",""), bars, el("p",{class:"note"},insight)),
      U.card("", U.secHead("취소 최다 지점","조사와 조정의 대상 — 문책의 근거가 아닙니다"),
        el("ol",{class:"rank"}, A.topBranch.map(x=>el("li",{},
          el("button",{class:"blink", onclick:()=>SP.app.go("res",{branch:x.b.id, basis:"use", preset:"month", status:["CANCELLED"]})},
            el("span",{},x.b.name), el("span",{class:"num sub"},x.c+"건"))))))));

    /* 컴플레인 예외 환불 목록 */
    const exList=A.list.filter(r=>r.refund && (r.refund.kind||"").startsWith("예외"));
    if(exList.length){
      root.appendChild(U.card("", U.secHead("컴플레인 예외 환불","규정 밖 환불 — 사유와 담당이 반드시 남는 건"),
        el("div",{}, exList.map(r=>el("div",{class:"row-line", style:"cursor:pointer",
            onclick:()=>SP.screens.detailDrawer(r)},
          el("span",{}, el("b",{},D.branchById[r.branchId].name), ` · ${R.fmtMD(r.useDate)} 이용분 — `,
            el("span",{},(r.cancelReason&&r.cancelReason.note)||"사유 미기재"),
            el("small",{class:"sub"},` · ${r.refund.kind}`)),
          el("span",{class:"num"}, money()?R.fmtWon(r.refund.amt):"—"))))));
    }

    /* 전체 목록 */
    const rows = s.tag? A.list.filter(r=>((r.cancelReason&&r.cancelReason.tag)||"기타")===s.tag) : A.list;
    const wrap=el("div",{});
    root.appendChild(U.card("table-card",

  SP.screens.notifyModal = function(r, onDone){
    const b=D.branchById[r.branchId];
    let target="customer", channel="알림톡";
    const OPTS={
      customer:[["confirm","예약 확정 안내"],["remind","이용 전날 리마인더"],["change","예약 변경 안내"],
                ["cancel","취소 · 환불 완료 안내"],["paylink","결제링크 안내"],["custom","기타 안내 (승인 문구)"]],
      host:[["host_new","신규 예약 알림"],["host_today","오늘 예약 브리핑"],["host_cancel","예약 취소 알림"],["custom","기타 안내 (승인 문구)"]],
      both:[["pair_confirm","확정 안내 (고객) + 신규 알림 (호스트)"],["pair_cancel","취소 안내 (고객) + 취소 알림 (호스트)"],["custom","기타 안내 — 양쪽"]]
    };
    const tSel=el("select",{});
    function fillT(){ tSel.innerHTML=""; OPTS[target].forEach(([v,t])=>tSel.appendChild(el("option",{value:v},t))); }
    fillT();
    const tgSeg=el("div",{class:"seg"},
      [["customer","고객"],["host","호스트"],["both","모두"]].map(([v,t])=>el("button",
        {class:"seg-b"+(target===v?" on":""), onclick:e=>{ target=v; fillT();
          [...e.target.parentNode.children].forEach(x=>x.classList.remove("on")); e.target.classList.add("on"); }},t)));
    const chSeg=el("div",{class:"seg"},
      [["알림톡","알림톡"],["문자","문자"]].map(([v,t])=>el("button",
        {class:"seg-b"+(channel===v?" on":""), onclick:e=>{ channel=v;
          [...e.target.parentNode.children].forEach(x=>x.classList.remove("on")); e.target.classList.add("on"); }},t)));
    U.modal("알림 보내기 — "+r.id,
      el("div",{},
        el("label",{class:"f-cap"},"받는 사람"), tgSeg,
        el("label",{class:"f-cap"},"채널"), chSeg,
        el("label",{class:"f-cap"},"템플릿 (승인 문구만 발송)"), tSel,
        el("p",{class:"note"},"자유 문구 발송은 광고 판정 위험이 있어 막습니다 — 템플릿은 알림 관리에서 승인 · 등록")),
      [{label:"발송", kind:"btn", onClick:(close)=>{
        const v=tSel.value; const sends=[];
        const cust = tpl => sends.push({tpl, to:"customer", name:r.name, phone:r.phone});
        const host = tpl => sends.push({tpl, to:"host", name:b.owner, phone:D.hostPhone(b)});
        if(target==="customer") cust(v);
        else if(target==="host") host(v);
        else { if(v==="pair_confirm"){ cust("confirm"); host("host_new"); }
               else if(v==="pair_cancel"){ cust("cancel"); host("host_cancel"); }
               else { cust("custom"); host("custom"); } }
        sends.forEach(x=>D.pushMsg({ at:new Date(), tpl:x.tpl, to:x.to, name:x.name, phone:x.phone,
          resId:r.id, branchId:r.branchId, status:"성공", method:channel, by:me().name }));
        const desc=[...new Set(sends.map(x=>(D.TPL[x.tpl]&&D.TPL[x.tpl].label)||x.tpl))].join(" · ");
        r.audit.push({at:new Date(), who:me().name, act:`알림 발송 — ${desc} (${channel})`});
        D.logAudit("알림", r.id, `${desc} 발송 (${channel})`);
        U.toast(`발송 완료 — ${sends.length}건, 발송 현황에 기록`);
        close(); if(onDone) onDone();
      }}]);
  };

  SP.screens.notesBoard = function(root){
    const uid=me().id;
    root.appendChild(el("div",{class:"page-head"},
      el("h1",{},"업무 노트"),
      el("p",{class:"sub"},"공지 · 인수인계 · 전달 — 태그된 사람이 확인할 때까지 남습니다")));

    /* 작성 */
    if(perm("manualNotify")){
      let kind="인수인계";
      const kSeg=el("div",{class:"seg"},
        ["공지","인수인계","전달"].map(t=>el("button",
          {class:"seg-b"+(kind===t?" on":""), onclick:e=>{ kind=t;
            [...e.target.parentNode.children].forEach(x=>x.classList.remove("on")); e.target.classList.add("on"); }},t)));
      const ta=el("textarea",{rows:"3", placeholder:"내용을 입력하세요 — 예: 부평점 소음 컴플레인 1차 통화 완료, 재발 시 부분 환불 검토"});
      let allSel=true; const picked=new Set();
      const allChip=el("button",{class:"chip f on", onclick:()=>{ allSel=true; picked.clear(); paintChips(); }},"전체");
      const mgrChips=SP.auth.managers().filter(a=>a.id!==uid).map(a=>
        el("button",{class:"chip f", "data-id":a.id, onclick:e=>{
          if(picked.has(a.id)) picked.delete(a.id); else picked.add(a.id);
          allSel = picked.size===0; paintChips();
        }},"@"+a.name));
      const chipRow=el("div",{class:"chips"}, allChip, mgrChips);
      function paintChips(){
        allChip.classList.toggle("on", allSel);
        mgrChips.forEach(c=>c.classList.toggle("on", picked.has(c.getAttribute("data-id"))));
      }
      root.appendChild(U.card("",
        U.secHead("새 노트","특정 매니저에게만 보내려면 @이름을 선택하세요 — 아무도 고르지 않으면 전체"),
        el("div",{class:"f-row"}, el("span",{class:"f-cap"},"유형"), kSeg),
        ta,
        el("div",{class:"f-row", style:"margin-top:8px"},
          el("span",{class:"f-cap"},"대상"), chipRow,
          el("span",{class:"grow"}),
          el("button",{class:"btn", onclick:()=>{
            const text=ta.value.trim();
            if(!text){ U.toast("내용이 필요합니다","warn"); return; }
            const tags = allSel? "all" : [...picked];
            D.addNote({kind, text, tags});
            ta.value=""; picked.clear(); allSel=true; paintChips();
            U.toast(`등록 — ${tags==="all"?"전체":"@"+tags.map(t=>(SP.auth.byId(t)||{name:t}).name).join(" @")}`);
            SP.app.render();
          }},"등록"))));
    }

    /* 목록 */
    const kindCls = k => k==="공지"?"st-refund": k==="인수인계"?"st-conf":"st-hold";
    const isTarget = n => n.tags==="all" || (Array.isArray(n.tags)&&n.tags.includes(uid));
    const sorted=[...D.notices].sort((a,b)=>{
      const pa=a.kind==="공지"?1:0, pb=b.kind==="공지"?1:0;
      return pb-pa || b.at-a.at;
    });
    sorted.forEach(n=>{
      const unreadMine = isTarget(n) && n.author!==uid && !n.reads[uid];
      const readers=Object.keys(n.reads).map(id=>(SP.auth.byId(id)||{name:id}).name);
      root.appendChild(el("section",{class:"card note-card"+(unreadMine?" mine":"")},
        el("div",{class:"note-head"},
          el("span",{class:"badge "+kindCls(n.kind)},n.kind),
          el("b",{},n.authorName),
          el("span",{class:"sub num"},tFmt(n.at)),
          el("span",{class:"grow"}),
          el("span",{class:"chips"},
            n.tags==="all"? el("span",{class:"chip"},"전체")
            : n.tags.map(t=>el("span",{class:"chip ch-own"},"@"+((SP.auth.byId(t)||{name:t}).name))))),
        el("p",{class:"note-text"},n.text),
        el("div",{class:"note-foot"},
          el("span",{class:"sub"},`확인 ${readers.length}명${readers.length? " — "+readers.join(", "):""}`),
          unreadMine? el("button",{class:"btn tiny", onclick:()=>{
            n.reads[uid]=new Date(); U.toast("확인 처리 — 이름이 기록됩니다"); SP.app.render();
          }},"확인했습니다") : null)));
    });
  };
