<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쏘플파티룸 운영 대시보드</title>
<meta name="description" content="쏘플파티룸 백엔드·대시보드 구축 기획서 Ver 1.1 구현 — 130개 지점 운영 관제">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>

/* ============================================================
   SSOPLE Dashboard — style.css
   배경: 연한 무채색(#F6F5F3) · 카드: 흰색 · 포인트: 브랜드 레드 #E83217
   버튼 radius 12 · 카드 radius 16 · 숫자는 전부 tabular-nums
   ============================================================ */
:root{
  --paper:#F6F5F3; --paper2:#EFEDEA; --card:#FFFFFF;
  --ink:#221D1A; --sub:#6B6560; --line:#E7E3DF;
  --red:#E83217; --red-deep:#B92408; --red-soft:#FDECE7;
  --ok:#157A45; --ok-soft:#E9F4EE;
  --warn:#C2410C; --warn-soft:#FBEADF;
  --hold:#8A857F;
  --r-btn:12px; --r-card:16px;
  --shadow:0 1px 2px rgba(34,29,26,.05), 0 8px 24px -18px rgba(34,29,26,.25);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.mono,.num{font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.mono{font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Malgun Gothic",monospace; font-size:.92em}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
input,select,textarea{
  font:inherit; color:var(--ink); background:#fff;
  border:1px solid var(--line); border-radius:10px; padding:8px 10px;
}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{
  outline:2px solid var(--red); outline-offset:2px; border-radius:10px;
}
textarea{width:100%; resize:vertical}
a{color:inherit; text-decoration:none}
h1,h2,h3,h4{margin:0; font-weight:700; letter-spacing:-.02em}
.sub{color:var(--sub); font-size:12.5px}
.center{text-align:center}
.grow{flex:1}
.gap{display:inline-flex; gap:6px}
.full{grid-column:1/-1}

/* ── 상단바 ── */
.wrap-w{max-width:1240px; margin:0 auto; padding:0 20px}
.topbar{position:sticky; top:0; z-index:40; background:#fff; border-bottom:1px solid var(--line)}
.ident{display:flex; align-items:center; gap:14px; height:56px}
.logo{font-size:15px; letter-spacing:-.01em; white-space:nowrap}
.logo b{color:var(--red); font-weight:800; letter-spacing:.04em}
.nav{display:flex; gap:2px; overflow-x:auto}
.nav-b{padding:8px 12px; border-radius:var(--r-btn); font-weight:600; color:var(--sub); white-space:nowrap}
.nav-b:hover{background:var(--paper)}
.nav-b.on{color:var(--red-deep); background:var(--red-soft)}
.sel{border-radius:var(--r-btn); padding:7px 10px; max-width:220px; font-size:13px}
.asof{color:var(--sub); font-size:12px; white-space:nowrap}

/* ── 시그니처: 데이터 출처 레일 (12.3 source) ── */
.rail{background:#FFFDFC; border-bottom:1px solid var(--line)}
.rail-in{display:flex; align-items:center; gap:18px; height:34px; font-size:12px; color:var(--sub); overflow-x:auto; white-space:nowrap}
.src{display:inline-flex; align-items:center; gap:8px}
.dot-sep{width:3px; height:3px; border-radius:50%; background:var(--line); display:inline-block}
.rail-item{display:inline-flex; align-items:center; gap:8px}
.stage-mini{display:inline-flex; gap:3px}
.stage-mini .sd{width:7px; height:7px; border-radius:50%; background:var(--line); display:inline-block}
.stage-mini .sd.done{background:#C9C4BF}
.stage-mini .sd.now{background:var(--red)}
.sigbtn{padding:3px 10px; border-radius:999px; border:1px solid var(--line); font-weight:600}
.sigbtn.hot{background:var(--red-soft); border-color:var(--red); color:var(--red-deep)}
.sigbtn.hot::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--red); display:inline-block; margin-right:6px}

/* ── 본문 ── */
.wrap{padding:22px 20px 40px}
.view{display:flex; flex-direction:column; gap:16px}
.page-head h1{font-size:21px}
.page-head .sub{margin:4px 0 0}
.foot{border-top:1px solid var(--line); margin-top:30px; padding:14px 20px 26px;
  display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--sub)}

/* ── 아침 루틴 스트립 (16.1 — 순서가 실제 절차) ── */
.routine{display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  background:#fff; border:1px solid var(--line); border-radius:var(--r-card); padding:10px 14px}
.r-step{display:inline-flex; align-items:center; gap:7px; padding:5px 11px 5px 6px;
  border-radius:999px; font-size:12.5px; font-weight:600; color:var(--sub)}
.r-step:hover{background:var(--paper)}
.r-step b{width:19px; height:19px; border-radius:50%; background:var(--red); color:#fff;
  display:inline-flex; align-items:center; justify-content:center; font-size:11px}
.r-cap{margin-left:auto; font-size:12px; color:var(--sub)}

/* ── KPI ── */
.kpi-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:10px}
.kpi-grid.four{grid-template-columns:repeat(4,1fr)}
.kpi{background:var(--card); border:1px solid var(--line); border-radius:var(--r-card);
  padding:14px 16px; text-align:left; display:flex; flex-direction:column; gap:4px;
  box-shadow:var(--shadow); transition:border-color .15s, transform .15s}
.kpi:not(:disabled):hover{border-color:var(--red); transform:translateY(-1px)}
.kpi:disabled{cursor:default}
.k-label{font-size:12px; color:var(--sub); font-weight:600}
.k-val{font-size:21px; letter-spacing:-.02em}
.k-sub{font-size:11.5px; color:var(--sub)}

/* ── 카드 ── */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-card);
  padding:16px 18px; box-shadow:var(--shadow)}
.card.wide{overflow-x:auto}
.card.filter{padding:12px 14px}
.card.table-card{padding:6px 6px 10px; overflow-x:auto}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start}
.sec-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:10px}
.sec-head h2{font-size:15px}
.sec-head .sub{margin-top:2px}

/* ── 처리할 일 ── */
.task-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.task{width:100%; display:flex; align-items:center; gap:12px; padding:10px 6px;
  border-radius:10px; text-align:left}
.task:hover{background:var(--paper)}
.task + .task, .task-list li + li{border-top:1px solid var(--line)}
.t-n{min-width:34px; font-size:19px; text-align:center; color:var(--ink)}
.t-n.hot{color:var(--red-deep)}
.t-body{display:flex; flex-direction:column}
.t-body small{color:var(--sub); font-size:11.5px}
.t-go{margin-left:auto; color:var(--sub); font-size:18px}

/* ── 신호 ── */
.sig-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.sig{border-left:3px solid var(--warn); background:var(--warn-soft);
  border-radius:10px; padding:9px 12px; display:flex; flex-direction:column; gap:2px}
.sig.hot{border-left-color:var(--red); background:var(--red-soft)}
.sig-kind{font-weight:700; font-size:12.5px}
.sig.hot .sig-kind{color:var(--red-deep)}
.sig.warn .sig-kind{color:var(--warn)}
.sig-text{font-size:12.5px; color:var(--ink)}
.empty{padding:26px 10px; text-align:center; color:var(--sub); font-size:13px}
.empty.ok{color:var(--ok); font-weight:700}

/* ── 차트 ── */
.chart{width:100%; height:auto; min-width:560px}
.chart .bar{fill:#E4DFDA}
.chart .bar.today{fill:var(--red)}
.chart .line{fill:none; stroke:var(--red-deep); stroke-width:2}
.chart .dot{fill:var(--red-deep)}
.chart .ax{fill:var(--sub); font-size:10px}
.mini{width:100%; height:auto}
.mini .bar{fill:#E4DFDA}
.mini .bar.today{fill:var(--red)}
.big-num{font-size:42px; font-weight:800; letter-spacing:-.03em; padding:6px 0 2px}

/* ── 지점 현황 ── */
.bb-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px}
.bb-col h4{font-size:12.5px; color:var(--sub); margin-bottom:6px}
.bb-col ol{margin:0; padding:0 0 0 18px; display:flex; flex-direction:column; gap:2px}
.blink{width:100%; display:flex; justify-content:space-between; gap:8px; padding:4px 6px; border-radius:8px; text-align:left}
.blink:hover{background:var(--paper); color:var(--red-deep)}

/* ── 필터 ── */
.f-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.f-row + .f-row{margin-top:10px}
.f-cap{font-size:12px; color:var(--sub); font-weight:600; margin:0 2px 0 6px; display:inline-block}
label > .f-cap{display:block; margin:0 0 4px}
.seg{display:inline-flex; background:var(--paper2); border-radius:var(--r-btn); padding:3px; gap:2px; flex-wrap:wrap}
.seg-b{padding:6px 12px; border-radius:9px; font-weight:600; font-size:12.5px; color:var(--sub)}
.seg-b.on{background:#fff; color:var(--red-deep); box-shadow:0 1px 2px rgba(34,29,26,.12)}
.quick{display:inline-flex; gap:4px}
.chips{display:inline-flex; gap:6px; flex-wrap:wrap}
.chip{display:inline-flex; align-items:center; padding:3px 10px; border-radius:999px;
  font-size:12px; font-weight:600; background:var(--paper2); color:var(--sub)}
.chip.f{border:1px solid var(--line); background:#fff}
.chip.f.on,.chip.on{background:var(--red-soft); color:var(--red-deep); border:1px solid var(--red)}
.ch-own{background:var(--red-soft); color:var(--red-deep)}
.ch-naver{background:#E7F5EC; color:#0B7A3E}
.ch-spacecloud{background:#EAF0FB; color:#2B5FB8}
.ch-phone,.ch-etc{background:var(--paper2); color:var(--sub)}

/* ── 버튼 ── */
.btn{background:var(--red); color:#fff; font-weight:700; padding:8px 14px;
  border-radius:var(--r-btn); font-size:13px; transition:background .15s}
.btn:hover{background:var(--red-deep)}
.btn.ghost{background:#fff; color:var(--ink); border:1px solid var(--line); font-weight:600}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger{background:var(--red-deep)}
.btn.danger-ghost{background:#fff; color:var(--red-deep); border:1px solid var(--red)}
.btn.danger-ghost:hover{background:var(--red-soft)}
.btn.tiny{padding:4px 10px; font-size:12px; border-radius:9px}
.btn:disabled{opacity:.45; cursor:not-allowed}
.icon-btn{width:30px; height:30px; border-radius:9px; color:var(--sub); font-size:14px}
.icon-btn:hover{background:var(--paper)}

/* ── 테이블 ── */
table.grid{width:100%; border-collapse:collapse; font-size:13px}
.grid th{position:sticky; top:0; background:#fff; text-align:left; font-size:11.5px; color:var(--sub);
  font-weight:700; padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap}
.grid td{padding:9px 10px; border-bottom:1px solid var(--paper2); vertical-align:middle; white-space:nowrap}
.grid tbody tr:hover{background:#FBFAF8}
.grid tbody tr[tabindex]{cursor:pointer}
.grid tr.low{background:color-mix(in srgb, var(--red) 5%, #fff)}
.grid tr.total td{border-top:2px solid var(--ink); font-weight:800; font-size:14px}
.grid.tight td,.grid.tight th{padding:6px 8px}
td.clip{max-width:150px; overflow:hidden; text-overflow:ellipsis}
td.strong{font-weight:800}
.sortable{cursor:pointer; user-select:none}
.sortable:hover{color:var(--red-deep)}
.num-f{font-family:ui-monospace,Consolas,monospace; font-size:12px}
.pager{display:flex; align-items:center; gap:8px; justify-content:flex-end; padding:10px 8px 2px}
.pinfo{font-size:12px; color:var(--sub); margin-right:auto}

/* ── 배지 ── */
.badge{display:inline-flex; align-items:center; padding:2px 9px; border-radius:999px;
  font-size:11.5px; font-weight:700; white-space:nowrap; margin-right:4px}
.st-hold{background:var(--paper2); color:var(--hold)}
.st-conf{background:var(--ok-soft); color:var(--ok)}
.st-done{background:#ECEAE7; color:var(--ink)}
.st-cxl{background:#F4F2F0; color:#A29B94}
.st-nos{background:var(--warn-soft); color:var(--warn)}
.st-refund{background:var(--red-soft); color:var(--red-deep); border:1px solid var(--red)}
.st-due{background:#FFF6E8; color:#9A6008; border:1px dashed #D9A441}

/* ── 행 라인 ── */
.row-line{display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:9px 4px; border-bottom:1px solid var(--paper2); font-size:13px}
.row-line:last-child{border-bottom:0}
.row-line.hot,.row-line.hotline{background:var(--red-soft); border-radius:10px; padding:9px 10px; border-bottom:0; margin-bottom:4px}
.plain{list-style:none; margin:0; padding:0}
.rank{margin:0; padding:0 0 0 20px; display:flex; flex-direction:column; gap:4px}
.rank li{display:flex; justify-content:space-between; gap:10px}
.note{font-size:12px; color:var(--sub); background:var(--paper);
  border-radius:10px; padding:8px 11px; margin:10px 0 0}
.reject{background:var(--red-soft); border:1px solid var(--red); color:var(--red-deep);
  border-radius:10px; padding:10px 12px; font-size:13px; margin-top:10px}
.reject b{display:block; margin-bottom:2px}
.reject p{margin:2px 0}
.accept,.okmsg{background:var(--ok-soft); color:var(--ok); border-radius:10px; padding:10px 12px; font-size:13px; margin-top:10px}
.conf-msg:empty{display:none}

/* ── 모달 · 드로어 ── */
.modal-back,.drawer-back{position:fixed; inset:0; background:rgba(34,29,26,.34); z-index:60;
  display:flex; align-items:center; justify-content:center; padding:20px}
.drawer-back{justify-content:flex-end; padding:0}
.modal{background:#fff; border-radius:var(--r-card); width:min(480px,100%);
  max-height:88vh; overflow:auto; box-shadow:0 24px 60px -20px rgba(34,29,26,.4)}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line)}
.modal-head h3{font-size:15px}
.modal-body{padding:16px}
.modal-body label{display:block; margin-bottom:10px}
.modal-foot{display:flex; justify-content:flex-end; gap:8px; padding:12px 16px; border-top:1px solid var(--line)}
.drawer{background:#fff; width:min(460px,94vw); height:100%; overflow:auto;
  box-shadow:-16px 0 44px -22px rgba(34,29,26,.4); animation:slidein .2s ease}
@keyframes slidein{from{transform:translateX(24px); opacity:.4} to{transform:none; opacity:1}}
.drawer-head{display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:14px 16px; border-bottom:1px solid var(--line); position:sticky; top:0; background:#fff}
.drawer-head h3{font-size:15px; display:inline}
.drawer-body{padding:14px 16px 24px}
.d-line{display:flex; gap:12px; padding:6px 0; font-size:13px}
.d-k{width:86px; flex:none; color:var(--sub); font-size:12px; padding-top:1px}
.d-v{flex:1}
.d-acts{display:flex; gap:6px; flex-wrap:wrap; margin:14px 0 4px}
.d-sub{font-size:12.5px; color:var(--sub); margin:16px 0 6px}
.audit{list-style:none; margin:0; padding:0; font-size:12px; display:flex; flex-direction:column; gap:4px}
.stepper{display:flex; align-items:center; gap:14px; justify-content:center; padding:8px 0}
.stepper b{font-size:18px; min-width:110px; text-align:center}
.wrapseg{flex-wrap:wrap}

/* ── 토스트 ── */
.toasts{position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
  display:flex; flex-direction:column; gap:8px; z-index:80; align-items:center}
.toast{background:var(--ink); color:#fff; padding:9px 16px; border-radius:999px;
  font-size:13px; font-weight:600; box-shadow:0 10px 30px -10px rgba(34,29,26,.5);
  animation:pop .18s ease; max-width:90vw}
.toast.warn{background:var(--red-deep)}
.toast.out{opacity:0; transition:opacity .3s}
@keyframes pop{from{transform:translateY(8px); opacity:0} to{transform:none; opacity:1}}

/* ── 빈 시간 찾기 ── */
.vac-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px}
.vac-card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 14px;
  display:flex; flex-direction:column; gap:5px; box-shadow:var(--shadow)}
.vac-card .btn{align-self:flex-start; margin-top:4px}

/* ── 정산 보드 ── */
.stage-track{list-style:none; margin:4px 0 10px; padding:0; display:flex; gap:0}
.stage-track li{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; position:relative; color:var(--sub); font-size:12px}
.stage-track li::before{content:""; position:absolute; top:13px; left:-50%; width:100%; height:2px; background:var(--line); z-index:0}
.stage-track li:first-child::before{display:none}
.stage-track li b{width:27px; height:27px; border-radius:50%; background:#fff; border:2px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:12px; z-index:1}
.stage-track li.done b{background:var(--paper2); border-color:#C9C4BF; color:var(--sub)}
.stage-track li.done::before{background:#C9C4BF}
.stage-track li.now b{background:var(--red); border-color:var(--red); color:#fff}
.stage-track li.now{color:var(--red-deep); font-weight:700}
.dist{display:flex; gap:10px}
.dist-i{flex:1; background:var(--paper); border-radius:12px; padding:12px; text-align:center}
.dist-i b{display:block; font-size:22px}
.dist-i.warn{background:var(--warn-soft); color:var(--warn)}
.dist-i.hot{background:var(--red-soft); color:var(--red-deep)}
.check{display:flex; align-items:center; justify-content:space-between; border-radius:12px; padding:14px 16px; font-weight:800}
.check.ok{background:var(--ok-soft); color:var(--ok)}
.check.hot{background:var(--red-soft); color:var(--red-deep)}
.stmt-line{display:flex; justify-content:space-between; padding:9px 2px; border-bottom:1px solid var(--paper2); font-size:14px}
.stmt-line.sub{color:var(--sub); font-size:13px}
.stmt-line.total{border-top:2px solid var(--ink); border-bottom:0; font-weight:800; font-size:16px; margin-top:2px}

/* ── 통계 ── */
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; min-width:560px}
.cal-h{text-align:center; font-size:11.5px; color:var(--sub); padding-bottom:2px}
.hcell{border-radius:8px; min-height:26px; display:flex; align-items:center; justify-content:center;
  font-size:11.5px; font-weight:600}
.cal-c{min-height:44px; cursor:pointer}
.cal-c:hover{outline:2px solid var(--red); outline-offset:-2px}
.cal-c.today{box-shadow:inset 0 0 0 2px var(--red-deep)}
.hm{display:grid; grid-template-columns:40px repeat(13,1fr); gap:4px; min-width:640px}
.hm-h{font-size:11px; color:var(--sub); display:flex; align-items:center; justify-content:center}

/* ── 점주 ── */
.form-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.form-grid label{display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--sub); font-weight:600}
.form-grid .span2{grid-column:span 2}
.ow-tasks{display:flex; flex-direction:column}
.tl,.tline{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.tl li,.tline li{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--paper2); cursor:pointer; flex-wrap:wrap}
.tl li:hover,.tline li:hover{background:var(--paper)}
.tl-t,.t-time{color:var(--sub); font-size:12.5px; min-width:96px}
.tl-b,.t-main{flex:1; min-width:160px}

/* ── 반응형 ── */
@media (max-width:1080px){
  .kpi-grid{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:860px){
  .two-col{grid-template-columns:1fr}
  .kpi-grid,.kpi-grid.four{grid-template-columns:repeat(2,1fr)}
  .bb-grid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr 1fr}
  .ident{height:auto; padding:8px 0; flex-wrap:wrap}
  .d-k{width:72px}
}

<body>
<noscript><p style="padding:24px;font-family:sans-serif">이 대시보드는 자바스크립트가 필요합니다.</p></noscript>
<script>

/* ===== rules.js ===== */
/* ============================================================
   SSOPLE Dashboard — rules.js
   기획서 4장(상태), 9장(정산 단계), 12.5장(권한)의 규칙 계층
   ============================================================ */
window.SP = window.SP || {};

SP.rules = (() => {
  /* ── 상태 5종 (기획서 4.1) ── */
  /* 기획서 5.1 — 예약 상태 10종. 화면·알림·정산이 같은 이름을 쓴다 */
  const STATUS = {
    HOLD:            { key:"HOLD",            label:"홀드",       cls:"st-hold" },
    PENDING_PAYMENT: { key:"PENDING_PAYMENT", label:"결제 진행",  cls:"st-pend" },
    CONFIRMED:       { key:"CONFIRMED",       label:"확정",       cls:"st-conf" },
    PRE_USE:         { key:"PRE_USE",         label:"입실 임박",  cls:"st-pre"  },
    IN_USE:          { key:"IN_USE",          label:"이용 중",    cls:"st-in"   },
    COMPLETED:       { key:"COMPLETED",       label:"이용 완료",  cls:"st-done" },
    CANCELLED:       { key:"CANCELLED",       label:"취소",       cls:"st-cxl"  },
    NO_SHOW:         { key:"NO_SHOW",         label:"노쇼",       cls:"st-nos"  },
    EXPIRED:         { key:"EXPIRED",         label:"만료",       cls:"st-exp"  },
    CLOSED:          { key:"CLOSED",          label:"정산 종결",  cls:"st-closed" }
  };

  /* 기획서 5.1 허용 전이 + 운영 예외 2종(*) — 이 표 밖의 전이는 서버(코드)가 거절한다
     * CONFIRMED→NO_SHOW/COMPLETED : 배치 부재 단계의 스킵 전이 (PRE_USE·IN_USE는 시각으로 파생 표시)
     * NO_SHOW→COMPLETED           : 24시간 내 노쇼 정정 (9.3절 운영 규칙)                       */
  const TRANSITIONS = {
    HOLD:            ["PENDING_PAYMENT","EXPIRED","CONFIRMED"],
    PENDING_PAYMENT: ["CONFIRMED","EXPIRED"],
    CONFIRMED:       ["PRE_USE","CANCELLED","NO_SHOW","COMPLETED"],
    PRE_USE:         ["IN_USE","NO_SHOW"],
    IN_USE:          ["COMPLETED"],
    COMPLETED:       ["CLOSED"],
    CANCELLED:       ["CLOSED"],
    NO_SHOW:         ["CLOSED","COMPLETED"],
    EXPIRED:         [],
    CLOSED:          []
  };
  const canGo = (from, to) => (TRANSITIONS[from]||[]).includes(to);

  /* 기획서 5.3 — 보증금 상태 (검수→환급/차감→이의→확정) */
  const DEPOSIT = {
    NONE:               { label:"채널 관리",  cls:"st-exp"  },
    RECEIVED:           { label:"수납",       cls:"st-conf" },
    INSPECTION_PENDING: { label:"검수 중",    cls:"st-pre"  },
    REFUND_SCHEDULED:   { label:"환급 예정",  cls:"st-pend" },
    CLAIM_PROPOSED:     { label:"차감 제안",  cls:"st-nos"  },
    DISPUTED:           { label:"이의 접수",  cls:"st-hold" },
    PARTIAL_DEDUCTED:   { label:"일부 차감",  cls:"st-nos"  },
    FULL_DEDUCTED:      { label:"전액 차감",  cls:"st-cxl"  },
    REFUNDED:           { label:"환급 완료",  cls:"st-done" }
  };

  const CHANNELS = {
    own:        { key:"own",        label:"자사" },
    naver:      { key:"naver",      label:"네이버예약" },
    spacecloud: { key:"spacecloud", label:"스페이스클라우드" },
    phone:      { key:"phone",      label:"전화" },
    etc:        { key:"etc",        label:"기타" }
  };

  const PAY = {
    card:     "신용카드",
    kakao:    "카카오페이",
    naverpay: "네이버페이",
    transfer: "계좌이체",
    link:     "결제링크",
    channel:  "채널 결제",
    /* 이관 전용 코드 (기획서 14.2) — 신규 예약에는 나타나지 않음 */
    legacy_bank:  "무통장입금(이관)",
    legacy_site:  "현장결제(이관)"
  };

  /* ── 운영 정책 (전 화면 공통) ── */
  const POLICY = {
    deposit: 80000,                 // 예약금
    ownerShare: 0.8,                // 점주 80 / 본사 20
    refundFreeDays: 7,              // 이용 7일 전까지 전액 환불
    noshowWaitMin: 60,              // 노쇼 판정 대기 [확정 필요 8번 — 60분 권장]
    linkTtlHours: 24,               // 결제링크 수명 (4.4절)
    holdTtlMin: 10,                 // 일반 홀드 수명
    extraFee: 10000,                // 추가 인원 1인당
    basePeople: 4
  };

  /* ── 정산 5단계 (기획서 9.1) — 일자로 판정 ── */
  function settlementStage(dayOfMonth){
    if (dayOfMonth === 1)  return { no:1, key:"aggregating", label:"집계 중",       range:"1일 새벽" };
    if (dayOfMonth <= 5)   return { no:2, key:"dispute",     label:"이의신청 접수", range:"1일 ~ 5일" };
    if (dayOfMonth <= 9)   return { no:3, key:"adjust",      label:"조정 · 확정",   range:"6일 ~ 9일" };
    if (dayOfMonth === 10) return { no:4, key:"payout",      label:"지급",          range:"10일" };
    return                 { no:5, key:"closed",      label:"마감",          range:"지급 후" };
  }
  const STAGE_SEQ = ["집계 중","이의신청 접수","조정 · 확정","지급","마감"];

  /* ── 권한 매트릭스 (기획서 12.5) ──
     role: hq_admin(총괄) · hq_staff(운영팀) · owner(점주) · staff(스태프) */
  const ROLES = {
    hq_admin: { key:"hq_admin", label:"총괄 관리자" },
    hq_staff: { key:"hq_staff", label:"운영팀" },
    owner:    { key:"owner",    label:"점주" },
    staff:    { key:"staff",    label:"스태프" }
  };
  const PERM = {
    viewStats:      r => r==="hq_admin"||r==="hq_staff"||r==="owner",
    scopeAll:       r => r==="hq_admin"||r==="hq_staff",
    viewMoney:      r => r!=="staff",                      // 스태프: 금액 비노출 (API 단계 차단을 모사)
    viewPhoneFull:  r => r==="hq_admin"||r==="hq_staff",   // 점주는 이용 당일 건만 (별도 검사)
    proxyBooking:   r => r==="hq_admin"||r==="hq_staff",
    forceChange:    r => r==="hq_admin"||r==="hq_staff",
    noshowJudge:    r => r==="owner",
    settleBoard:    r => r==="hq_admin"||r==="hq_staff",
    settleAdjust:   r => r==="hq_admin"||r==="hq_staff",
    payoutFile:     r => r==="hq_admin",                   // 지급 파일은 총괄만
    manualNotify:   r => r==="hq_admin"||r==="hq_staff",
    settings:       r => r==="hq_admin",
    spaceEdit:      r => r==="hq_admin"||r==="hq_staff",   // 공간 정보 수정
    msgView:        r => r==="hq_admin"||r==="hq_staff",   // 메시지 발송현황
    notes:          r => r==="hq_admin"||r==="hq_staff",   // 업무 노트
    feeRate:        r => r==="hq_admin"                    // 수수료율 기본값 변경
  };

  /* ── 취소 사유 분류 (취소·환불 분석의 축) ── */
  const CANCEL_REASONS = ["단순 변심","일정 변경","컴플레인","시설 문제","기타"];

  /* ── 알림 메시지 템플릿 (11장 — 승인 템플릿만 사용) ── */
  const MSG_TPL = {
    confirm:     { label:"예약 확정 안내",        to:"customer" },
    remind:      { label:"이용 전일 리마인드",     to:"customer" },
    paylink:     { label:"결제링크 안내",          to:"customer" },
    change:      { label:"예약 변경 안내",         to:"customer" },
    cancel:      { label:"취소 · 환불 안내",       to:"customer" },
    noshow:      { label:"노쇼 처리 안내",         to:"customer" },
    host_new:    { label:"[호스트] 신규 예약",     to:"host" },
    host_cancel: { label:"[호스트] 예약 취소",     to:"host" },
    host_settle: { label:"[호스트] 정산 지급 완료", to:"host" }
  };

  /* ── 포맷터 ── */
  const fmtWon = n => (n==null ? "—" : "₩" + Math.round(n).toLocaleString("ko-KR"));
  const fmtNum = n => (n==null ? "—" : Math.round(n).toLocaleString("ko-KR"));
  const fmtPct = (n,d=1) => (n==null ? "—" : (n*100).toFixed(d) + "%");
  const pad2 = n => String(n).padStart(2,"0");
  const fmtDate = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  const fmtMD   = d => `${d.getMonth()+1}/${d.getDate()}`;
  const fmtTime = h => `${pad2(h)}:00`;
  const WD = ["일","월","화","수","목","금","토"];
  const fmtDateK = d => `${d.getMonth()+1}월 ${d.getDate()}일(${WD[d.getDay()]})`;

  /* 인원 병기 — 구 솔루션 표기 습관 계승 (기획서 6.2) */
  const fmtPeople = (base, extra) => extra>0 ? `${base}명(+${extra}명)` : `${base}명`;

  /* 연락처 마스킹 (기획서 6.2) */
  const maskPhone = p => p.replace(/(\d{3})-(\d{3,4})-(\d{4})/, "$1-****-$3");

  /* 환불 규정 판정 — 이용 7일 전까지 전액 (4.5절) */
  function refundable(useDate, whenDate){
    const diff = Math.floor((useDate - whenDate) / 86400000);
    return diff >= POLICY.refundFreeDays;
  }

  const fmtDT = d => `${d.getMonth()+1}/${d.getDate()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;

  return { STATUS, TRANSITIONS, canGo, DEPOSIT, CHANNELS, PAY, POLICY, ROLES, PERM, CANCEL_REASONS, MSG_TPL,
           settlementStage, STAGE_SEQ,
           fmtWon, fmtNum, fmtPct, fmtDate, fmtMD, fmtTime, fmtDateK, fmtDT,
           fmtPeople, maskPhone, refundable, pad2, WD };
})();


/* ===== data.js ===== */
/* ============================================================
   SSOPLE Dashboard — data.js
   원장 생성(130개 지점, 약 120일) → 요약 테이블 집계
   기획서 12.1의 파이프라인을 브라우저 안에서 그대로 재현:
   화면은 원장을 훑지 않고 요약(statsDaily·statsSlots)만 읽는다.
   ============================================================ */
SP.data = (() => {
  const R = SP.rules, P = R.POLICY;

  /* ── 결정적 난수 ── */
  function mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0;
    let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296; }; }
  const rnd = mulberry32(20260801);

  /* ═══════ 통합 Core — 기획서 5장 (상태·이벤트·원장) ═══════ */
  let evSeq=1, lgSeq=1, rqSeq=1;
  const events=[];        // 5.6 이벤트 로그 — 상태 변화의 불변 기록
  const ledger=[];        // 5.4 금전 원장 — 덮어쓰지 않는다, 조정은 반대 라인 추가
  const reconQueue=[];    // 7.3·7.5 대사 대기함 — 채널·결제 불일치를 사람이 해소

  const _by = () => (SP.auth && SP.auth.user && SP.auth.user.name) || "시스템";

  function logEvent(type, refId, detail){
    events.unshift({ id:"E"+String(evSeq++).padStart(4,"0"), at:new Date(),
      type, refId:refId||"", detail:detail||"", by:_by() });
    if (events.length>400) events.length=400;
  }
  function addLedger(o){
    const row={ id:"L"+String(lgSeq++).padStart(4,"0"), at:new Date(),
      refId:o.refId||"", kind:o.kind, amount:Math.round(o.amount||0),
      memo:o.memo||"", by:_by() };
    ledger.unshift(row);
    if (ledger.length>600) ledger.length=600;
    return row;                                     // 수정·삭제 API는 만들지 않는다 (원장 제1원칙)
  }
  const ledgerOf = refId => ledger.filter(l=>l.refId===refId);
  const ledgerSum = refId => ledgerOf(refId).reduce((a,l)=>a+l.amount,0);

  function addRecon(o){
    const q={ id:"Q"+String(rqSeq++).padStart(3,"0"), at:new Date(),
      kind:o.kind, refId:o.refId||"", note:o.note||"", src:o.src||"",
      branchId:o.branchId||"", lockKey:o.lockKey||"", state:"OPEN", by:_by() };
    reconQueue.unshift(q);
    logEvent("ReconOpened", q.refId, `[${o.kind}] ${o.note||""}`.trim());
    return q;
  }
  function resolveRecon(id, memo){
    const q=reconQueue.find(x=>x.id===id); if(!q||q.state!=="OPEN") return false;
    q.state="RESOLVED"; q.resolvedAt=new Date(); q.resolvedBy=_by(); q.resolveMemo=memo||"";
    logEvent("ReconResolved", q.refId, `${q.kind} 해소${memo?" — "+memo:""}`);
    return true;
  }

  const EV_OF = { CONFIRMED:"ReservationConfirmed", CANCELLED:"ReservationCancelled",
    NO_SHOW:"NoShowMarked", COMPLETED:"CheckOutCompleted", EXPIRED:"HoldExpired",
    CLOSED:"ReservationClosed", PRE_USE:"PreUseEntered", IN_USE:"InUseEntered",
    PENDING_PAYMENT:"PaymentStarted" };

  /* 5.1 두 가지 강제 규칙의 구현 — 표에 없는 전이는 여기서 거절된다 */
  function setStatus(r, to, opt){
    opt=opt||{};
    const from=r.status;
    if (from===to) return { ok:true, noop:true };
    if (!R.canGo(from, to))
      return { ok:false, reason:`${R.STATUS[from].label} → ${R.STATUS[to]?R.STATUS[to].label:to} 전이는 허용되지 않습니다 (5.1절)` };
    r.status=to;
    const now=new Date();
    if (to==="CANCELLED") r.cancelAt=now;
    if (to==="NO_SHOW")   r.noshowAt=now;
    if (to==="EXPIRED")   r.expiredAt=now;
    if (to==="COMPLETED" && from==="NO_SHOW") r.noshowAt=null;   // 정정
    const act = opt.act || `상태 ${R.STATUS[from].label} → ${R.STATUS[to].label}${opt.note?" — "+opt.note:""}`;
    (r.audit ||= []).push({ at:now, who:_by(), act });
    logAudit("예약", r.id, act);
    logEvent(EV_OF[to]||"StatusChanged", r.id, `${R.STATUS[from].label} → ${R.STATUS[to].label}`);
    if (SP.persist) SP.persist.touch(r);
    if (["CANCELLED","EXPIRED"].includes(to) || from==="HOLD") occInvalidate();
    return { ok:true, from };
  }

  /* PRE_USE·IN_USE는 배치 전 단계에선 시각으로 파생해 보여준다 (저장 상태는 CONFIRMED 유지) */
  function effStatus(r){
    if (r.status!=="CONFIRMED") return r.status;
    if (keyOf(r.useDate)!==keyOf(NOW)) return "CONFIRMED";
    const h=NOW.getHours()+NOW.getMinutes()/60;
    if (h>=r.sh && h<r.eh) return "IN_USE";
    if (h>=r.sh-3 && h<r.sh) return "PRE_USE";
    return "CONFIRMED";
  }

  /* 5.5 견적 스냅샷 — 결제한 가격은 요금표가 바뀌어도 그대로 재현된다 */
  function makeQuote(b, room, slot, hours, extra, date, total){
    return { at:new Date(), slot, hours,
      unit: total - extra*(b.addFee||15000),
      extra, addFee:(b.addFee||15000), extraAmt: extra*(b.addFee||15000),
      deposit: b.depositLabel||"-",
      policy: "이용 7일 전까지 전액 환불 · 6일 이내 환불 불가",
      total };
  }


  /* ═══════ 노쇼 · 분쟁 · 보증금 — 기획서 5.3 · 6.7 · 9.3 · 9.7 ═══════ */
  let icSeq=1;
  const incidents=[];
  const IC_RANK={ PROPOSED:1, DISPUTED:2, WITHDRAWN:3, CONFIRMED:3 };

  function addIncident(o){
    const ic={ id:"D"+String(icSeq++).padStart(3,"0"), at:new Date(),
      resId:o.resId, branchId:o.branchId, kind:o.kind, note:o.note||"",
      photos:(o.photos||[]).slice(0,6), amount:Math.round(o.amount||0),
      state:"PROPOSED", by:_by(),
      disputeUntil: addDays(NOW, settings.disputeDays) };
    incidents.unshift(ic);
    logEvent("DepositClaimProposed", ic.resId,
      `[${ic.kind}] ${ic.amount.toLocaleString("ko-KR")}원 제안 — 고객 통지 · 이의 ${settings.disputeDays}일`);
    logAudit("분쟁", ic.resId, `차감 제안 등록 — [${ic.kind}] ${ic.amount.toLocaleString("ko-KR")}원`);
    return ic;
  }
  function disputeIncident(id, note){
    const ic=incidents.find(x=>x.id===id);
    if(!ic || ic.state!=="PROPOSED") return { ok:false, reason:"이의는 차감 제안 상태에서만 접수됩니다" };
    ic.state="DISPUTED"; ic.disputedAt=new Date(); ic.disputeNote=note||"";
    logEvent("DepositDisputed", ic.resId, `[${ic.kind}] 고객 이의 접수 — 환급 · 차감 보류`);
    logAudit("분쟁", ic.resId, "이의 접수 — 본사 중립 검토 시작");
    return { ok:true };
  }
  /* 9.7 — 차감 확정은 증빙 · 기준표 · 통지 · 이의 기간 없이는 불가 */
  function confirmDeduct(id, opt){
    opt=opt||{};
    const ic=incidents.find(x=>x.id===id);
    if(!ic) return { ok:false, reason:"대상 없음" };
    if(ic.state==="CONFIRMED"||ic.state==="WITHDRAWN") return { ok:false, reason:"이미 종결된 건입니다" };
    if(!(ic.photos&&ic.photos.length)) return { ok:false, reason:"사진 증빙 없이는 확정할 수 없습니다 (9.7절)" };
    if(!(ic.amount>0)) return { ok:false, reason:"차감 금액이 없습니다" };
    if(ic.state==="DISPUTED" && !opt.master)
      return { ok:false, reason:"이의가 접수된 건의 확정은 마스터만 가능합니다 (9.7절)" };
    if(NOW < ic.disputeUntil && !opt.master)
      return { ok:false, reason:`이의 기간(${settings.disputeDays}일) 경과 전 확정은 마스터만 가능합니다` };
    ic.state="CONFIRMED"; ic.confirmedAt=new Date(); ic.confirmedBy=_by();
    addLedger({ refId:ic.resId, kind:"DEPOSIT_DEDUCT", amount:-ic.amount,
      memo:`[${ic.kind}] 보증금 차감 확정${opt.master&&NOW<ic.disputeUntil?" (마스터 예외 승인)":""}` });
    logEvent("DepositDeducted", ic.resId,
      `[${ic.kind}] ${ic.amount.toLocaleString("ko-KR")}원 차감 — 결과 통지 · 정산 라인 반영`);
    logAudit("분쟁", ic.resId, `차감 확정 — ${ic.amount.toLocaleString("ko-KR")}원`);
    return { ok:true };
  }
  function withdrawIncident(id, memo){
    const ic=incidents.find(x=>x.id===id);
    if(!ic || ic.state==="CONFIRMED"||ic.state==="WITHDRAWN") return { ok:false, reason:"철회할 수 없는 상태" };
    ic.state="WITHDRAWN"; ic.withdrawnAt=new Date(); ic.withdrawMemo=memo||"";
    logEvent("DepositRefundScheduled", ic.resId, `[${ic.kind}] 차감 철회 — 환급 예정 전환`);
    logAudit("분쟁", ic.resId, "차감 제안 철회");
    return { ok:true };
  }
  const incidentsOf = resId => incidents.filter(i=>i.resId===resId);

  /* 5.3 보증금 상태 파생 — 분쟁이 있으면 분쟁이, 없으면 시간이 결정한다 */
  function depositStateOf(r){
    const ics=incidentsOf(r.id);
    const conf=ics.filter(i=>i.state==="CONFIRMED");
    if(conf.length){
      const sum=conf.reduce((a,i)=>a+i.amount,0);
      return sum>=settings.deposit? "FULL_DEDUCTED":"PARTIAL_DEDUCTED";
    }
    if(ics.some(i=>i.state==="DISPUTED")) return "DISPUTED";
    if(ics.some(i=>i.state==="PROPOSED")) return "CLAIM_PROPOSED";
    if(r.pay==="channel") return "NONE";
    if(r.status==="CANCELLED"||r.status==="EXPIRED") return r.refund? "REFUNDED":"NONE";
    if(r.status==="NO_SHOW") return "INSPECTION_PENDING";
    if(r.status==="COMPLETED"||r.status==="CLOSED"){
      const end=new Date(r.useDate); end.setHours(r.eh,0,0,0);
      const hrs=(NOW-end)/3600e3;
      if(hrs < settings.inspectHours) return "INSPECTION_PENDING";
      if(hrs < 72) return "REFUND_SCHEDULED";
      return "REFUNDED";
    }
    return "RECEIVED";
  }

  /* 반복 위반 고객 — 차감 확정 2회부터 예약 제한 (9.3) */
  function isFlagged(phone){
    if(!phone) return false;
    const n=String(phone).replace(/\D/g,"");
    let cnt=0;
    incidents.forEach(i=>{
      if(i.state!=="CONFIRMED") return;
      const rr=reservations.find(x=>x.id===i.resId);
      if(rr && String(rr.phone).replace(/\D/g,"")===n) cnt++;
    });
    return cnt>=2;
  }
  function flaggedList(){
    const map={};
    incidents.forEach(i=>{
      if(i.state!=="CONFIRMED") return;
      const rr=reservations.find(x=>x.id===i.resId); if(!rr||!rr.phone) return;
      const k=String(rr.phone).replace(/\D/g,"");
      (map[k] ||= { phone:rr.phone, name:rr.name, cnt:0, last:i.kind }).cnt++;
      map[k].last=i.kind;
    });
    return Object.values(map).filter(x=>x.cnt>=2);
  }


  const hostPhone = b => {
    const m=(b.ownerRaw||"").match(/01[016-9][\s\-]?\d{3,4}[\s\-]?\d{4}/);
    return m ? m[0].replace(/\s/g,"-") : "010-2254-9580";     // 본사 예약팀
  };

  /* ── 이름·연락처 ── */
  const LAST=["김","이","박","최","정","강","조","윤","장","임","한","오","서","신","권","황","안","송","류","홍"];
  const FIRST=["서준","하윤","지호","민서","도현","수아","예준","지우","시윤","하린","은우","서아","준우","다은","건우","소율","유준","채원","현서","가은","지안","윤서","태오","나윤"];
  const mkName = () => pick(LAST)+pick(FIRST);
  const mkPhone = () => `010-${String(2000+Math.floor(rnd()*8000))}-${String(1000+Math.floor(rnd()*9000))}`;

  /* ── 원장 생성 ── */
  const reservations = [];
  let seq = 100001;
  const wdWeight = [1.5, .55, .6, .7, .85, 1.35, 1.7];   // 일~토 — 주말 파티 수요

  function makeRes(b, room, useDate, forceToday){
    const slot = weighted([["day",4],["night",6]]);
    let sh, eh;
    if (slot==="day"){ sh=weighted([[11,2],[12,5],[13,3]]); eh=Math.min(sh+weighted([[4,3],[5,6],[6,1]]),17); }
    else { sh=weighted([[17,2],[18,6],[19,3]]); eh=Math.min(sh+weighted([[4,2],[5,6],[6,2]]),24); }
    const extra = weighted([[0,5],[2,3],[4,2],[6,1],[8,.5]]);
    const amount = priceOf(b, slot, eh-sh, extra, useDate);
    const lead = weighted([[1,1],[2,2],[3,3],[5,3],[7,3],[10,2],[14,2],[21,1],[30,.6],[45,.3]]);
    let created = addDays(useDate, -lead);
    if (created > NOW) created = new Date(NOW.getTime() - (1 + Math.floor(rnd()*70)) * 3600000);   // 신청은 언제나 과거
    const channel = weighted([["own",55],["naver",18],["spacecloud",14],["phone",9],["etc",3]]);
    const pay = channel==="phone" ? "link"
              : channel==="naver"||channel==="spacecloud" ? "channel"
              : weighted([["card",46],["kakao",24],["naverpay",20],["transfer",10]]);
    const r = {
      id: "R" + (seq++),
      branchId: b.id, roomId: room.id, roomName: room.name,
      name: mkName(), phone: mkPhone(),
      createdAt: created, useDate, sh, eh, slot,
      base: b.baseP, extra, amount,
      channel, pay,
      channelNo: channel==="naver" ? "NV-"+(300000+Math.floor(rnd()*699999))
               : channel==="spacecloud" ? "SC-"+(100000+Math.floor(rnd()*899999)) : "",
      status: "CONFIRMED",
      deposit: chance(.5) ? "수취" : "-",     // 보증금 [확정 필요 1번] — 일부 지점만 운영 가정
      memo: "", intIssue:"", ownIssue:"",
      options: chance(.3) ? pick(["빔프로젝터","생일 세트","노래방 마이크","보드게임"]) : "",
      checkin: false, refund: null, noshowAt: null, amountDue: 0,
      audit: []
    };
    /* 상태 시나리오 */
    const past = useDate < TODAY;
    if (past){
      if (chance(.055) && !forceToday){                      // 규정 내 취소 (7일 전)
        r.status="CANCELLED";
        const cAt = addDays(useDate, -(P.refundFreeDays + Math.floor(rnd()*6)));
        r.cancelAt = cAt < created ? created : cAt;
        r.cancelReason = { tag: weighted([["단순 변심",5],["일정 변경",3],["컴플레인",1],["시설 문제",.6],["기타",.6]]), note:"" };
        r.refund = { amt:r.amount, state:"완료", at:r.cancelAt, kind:"규정" };
      } else if (chance(.014)){                              // 노쇼 (환불 불가 구간 — 매출 유지)
        r.status="NO_SHOW"; r.noshowAt = new Date(useDate.getTime()+(r.sh+2)*3600000);
      } else { r.status="COMPLETED"; r.checkin=true; }
    }
    return r;
  }

  branches.forEach(b => {
    for (let d=-PAST_DAYS; d<=FUTURE_DAYS; d++){
      const date = addDays(TODAY, d);
      const season = 1 + 0.18*Math.sin((date.getMonth()+1)/12*Math.PI*2);   // 연중 계절성
      const lam = b.demand * wdWeight[date.getDay()] * b.rooms.length * season;
      let n = Math.floor(lam) + (chance(lam%1)?1:0);
      if (d>14) n = Math.round(n*0.45);                     // 먼 미래는 아직 덜 참
      const used = {};                                       // 방·시간 중복 방지(간이)
      for (let k=0;k<n;k++){
        const room = pick(b.rooms);
        const r = makeRes(b, room, date);
        const key = room.id + r.slot;
        if (used[key]) continue;
        used[key]=1; reservations.push(r);
      }
    }
  });

  /* ── 오늘의 살아있는 시나리오 주입 ── */
  const todays = reservations.filter(r=>keyOf(r.useDate)===keyOf(TODAY) && r.status==="CONFIRMED");
  const nowH = NOW.getHours() + NOW.getMinutes()/60;
  todays.forEach(r=>{
    if (r.sh + 1 <= nowH){                                   // 시작 후 60분 경과
      if (chance(.86)) r.checkin = true;                     // 나머지는 노쇼 후보 (4.3절)
    }
  });
  /* 환불 처리 중 배지 1건 (4.5절) */
  (function(){
    const c = reservations.find(r=>r.status==="CANCELLED" && r.refund);
    if (c){ c.refund.state="처리 중"; c.refund.at=NOW; }
  })();
  /* 컴플레인 예외 환불 — 규정 밖(7일 이내) 취소지만 관리자 승인으로 환불된 건 */
  for (let i=0;i<3;i++){
    const b = pick(branches), room = pick(b.rooms);
    const useDate = addDays(TODAY, -(3+i*5));
    const r = makeRes(b, room, useDate, true);
    r.status="CANCELLED"; r.checkin=false;
    r.cancelAt = addDays(useDate, -2);
    r.cancelReason = { tag:"컴플레인",
      note: ["에어컨 고장 사전 고지 누락","옆 호실 공사 소음 — 이용 불가 수준","예약 시간 중복 안내 착오"][i] };
    const partial = i===1;
    r.refund = { amt: partial? Math.round(r.amount*0.5) : r.amount, state:"완료", at:r.cancelAt,
      kind: partial? "예외(부분)" : "예외(전액)" };
    r.audit.push({ at:r.cancelAt, who:"운영팀", act:`강제 취소 — ${r.cancelReason.note} · ${r.refund.kind} 환불` });
    reservations.push(r);
  }
  /* 결제링크 — 대기 3건 + 24시간 초과 2건 (4.4절 → 처리할 일) */
  const links = [];
  for (let i=0;i<5;i++){
    const b = pick(branches), room = pick(b.rooms);
    const useDate = addDays(TODAY, 2+Math.floor(rnd()*6));
    const r = makeRes(b, room, useDate);
    r.status="HOLD"; r.channel="phone"; r.pay="link"; r.channelNo="";
    r.linkAt = new Date(NOW.getTime() - (i<2 ? (26+i*5) : (2+i))*3600000);
    r.audit.push({at:r.linkAt, who:"운영팀", act:"대리 예약 생성 · 결제링크 발송"});
    reservations.push(r); links.push(r);
  }
  /* 외부 채널 충돌 거절 이력 1건 (8.1절 → 신호) */
  const conflictLog = [];
  (function(){
    const t = todays.find(r=>r.channel==="own") || todays[0];
    if (t){ conflictLog.push({ at:new Date(NOW.getTime()-42*60000), branchId:t.branchId,
      date:keyOf(t.useDate), range:`${R.fmtTime(t.sh)}~${R.fmtTime(t.eh)}`,
      channel:"naver", refused:true, against:t.id }); }
  })();

  reservations.sort((a,b)=>b.createdAt - a.createdAt);

  /* ── 관리자 · 매니저 계정 (본인 ID 로그인 — 모든 입력·변경에 기록) ── */
  const accounts = [
    { id:"choi",    pw:"1234", name:"최시준", role:"hq_admin", pos:"총괄 관리자" },
    { id:"seoyeon", pw:"1234", name:"김서연", role:"hq_staff", pos:"매니저" },
    { id:"jihoon",  pw:"1234", name:"박지훈", role:"hq_staff", pos:"매니저" },
    { id:"haneul",  pw:"1234", name:"이하늘", role:"hq_staff", pos:"매니저" },
    { id:"host01",  pw:"1234", name:branches[0].owner, role:"owner", pos:branches[0].name+" 호스트", branchId:branches[0].id },
    { id:"staff01", pw:"1234", name:"조수아", role:"staff",  pos:branches[0].name+" 스태프", branchId:branches[0].id }
  ];

  /* ── 운영 설정 · 조정 저장소 · 전역 변경 이력 ── */
  /* web_settings — 정책 수치는 코드가 아니라 여기서 산다 (9.1·9.3·9.4) */
  const settings = {
    feeRate: 0.20,                                    // 본사 수수료 (점주 8 : 본사 2)
    deposit: 80000,                                   // 보증금
    refundFullDays: 7,                                // 7일 전 전액 환불
    disputeDays: 7,                                   // 차감 이의제기 기간

  function vacancy({date, region, people}){

        busy.forEach(([s,e])=>{ if(s-cur>=2) free.push([cur,s]); cur=Math.max(cur,e); });

    return out;
  }

  function settlementFor(mKey, branchId){
    const [y,m]=mKey.split("-").map(Number);
    let sales=0, cnt=0, excRefund=0; const items=[];
    reservations.forEach(r=>{
      if(r.branchId!==branchId) return;
      if((r.status==="COMPLETED"||r.status==="NO_SHOW") &&
         r.useDate.getFullYear()===y && r.useDate.getMonth()===m-1){
        sales+=r.amount; cnt++; items.push(r);

      if(r.status==="CANCELLED" && r.refund && r.refund.kind && r.refund.kind.startsWith("예외") &&
         r.cancelAt && r.cancelAt.getFullYear()===y && r.cancelAt.getMonth()===m-1){
        excRefund += r.refund.amt;
      }
    });
    return { sales, cnt, excRefund, items: items.sort((a,b)=>a.useDate-b.useDate) };
  }

  function reportPayMismatch(resId, pgAmt){
    const r=reservations.find(x=>x.id===resId); if(!r) return false;
    r.intIssue="결제 대사 차이 — 확정 보류";
    if(SP.persist) SP.persist.touch(r);
    addRecon({kind:"긴급 · 결제 불일치", refId:resId,
      note:`내부 ${r.amount.toLocaleString("ko-KR")}원 vs PG ${(+pgAmt||0).toLocaleString("ko-KR")}원 — 확정 보류 · 중복 결제 확인`,
      src:"긴급 트리거"});
    logEvent("PaymentMismatch", resId, "승인액 불일치 (표 6-9②)");
    return true;
  }
  function requestAccountChange(branchId, memo){
    const b=branchById[branchId]; if(!b) return false;
    payHold[branchId]=true;
    addRecon({kind:"긴급 · 계좌 변경", branchId,
      note:`${b.name} — 정산 계좌 변경 시도. 지급 보류 · 기존 연락처 본인 재확인 (9.7절)${memo?" · "+memo:""}`,
      src:"긴급 트리거"});
    logEvent("AccountChangeHeld", b.code, `${b.name} 계좌 변경 — 다음 지급 1회 보류`);
    return true;
  }

  /* ── 반입 5단계 (8.2) — 템플릿 → 스테이징 → 드라이런 → 승인 반영 · 롤백 ── */
  const batches=[]; let bSeq=1;
  const IMPORT_COLS=["지점","이용일","시작","종료","예약자","연락처","인원","금액","패키지","채널"];
  function buildImportTemplate(){
    const ex1=[branches[1].name,fmtD(addDays(TODAY,14)),"12:00","17:00","홍길동","010-1234-5678","8","","낮","naver"];
    const ex2=[branches[2].name,fmtD(addDays(TODAY,15)),"","","김파티","010-2345-6789","15","250,000","올데이","spacecloud"];
    return { name:"쏘플_예약반입_템플릿.csv",
      text:"\uFEFF"+IMPORT_COLS.join(",")+"\n"+ex1.join(",")+"\n"+ex2.join(",")+"\n"+
        "# 위 두 줄은 예시입니다 — 지우고 실제 내역을 붙여넣으세요. 이 양식 그대로만 반입됩니다 (8.2①)\n" };
  }
  const fmtD=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  function stageBatch(raw, srcName){
    const lines=String(raw||"").replace(/^\uFEFF/,"").replace(/\r/g,"").split("\n")
      .map(l=>l.trim()).filter(l=>l && !l.startsWith("#"));
    if(!lines.length) return { ok:false, reason:"내용이 없습니다" };
    const delim=lines[0].includes("\t")? "\t":",";
    const head=lines[0].split(delim).map(c=>c.trim());
    if(!head.includes("지점")||!head.includes("이용일"))
      return { ok:false, reason:"고정 템플릿 양식이 아닙니다 — [템플릿 내려받기] 파일로만 반입할 수 있습니다 (8.2①)" };
    const idx={}; IMPORT_COLS.forEach(c=>idx[c]=head.indexOf(c));
    const rows=lines.slice(1).map(l=>l.split(delim).map(c=>c.trim()));
    if(!rows.length) return { ok:false, reason:"자료 행이 없습니다" };
    const b={ id:"B"+String(bSeq++).padStart(3,"0"), at:new Date(), by:_by(),
      src:srcName||"붙여넣기", idx, rows, state:"STAGED", report:null, appliedIds:[], up:Date.now() };
    batches.unshift(b);
    logAudit("데이터", b.id, `스테이징 ${rows.length}행 — 운영 원장에는 아직 쓰지 않음 (8.2②)`);
    return { ok:true, batch:b };
  }
  function draftRow(bt, row){
    const g=c=>{ const i=bt.idx[c]; return i>=0? (row[i]??""):""; };
    const b=findBranchByName(g("지점"));
    if(!b) return { v:"ERR", reason:"지점 미매칭: "+(g("지점")||"(빈칸)") };
    const date=parseD4(g("이용일"));
    if(!date) return { v:"ERR", reason:"날짜 해석 실패: "+g("이용일") };
    const ph=pkgH4(g("패키지"));
    let sh=parseH4(g("시작")); if(sh==null) sh=ph? ph[0]:18;
    let eh=parseH4(g("종료")); if(eh==null) eh=ph? ph[1]:Math.min(sh+5,24);
    if(eh<=sh) eh=Math.min(sh+5,24);
    const name=g("예약자")||"채널 고객";
    const slot=sh<17? "day":"night";
    if(isFlagged(g("연락처"))) return { v:"ERR", reason:"반복 위반 고객 — 예약 제한 (9.3)" };
    if(isLockedSlot(b.rooms[0].id, date, slot)) return { v:"ERR", reason:"긴급 잠금 슬롯 — 중복 확정 조사 중" };
    const dk=keyOf(date);
    if(reservations.some(x=>x.branchId===b.id && keyOf(x.useDate)===dk &&
        x.sh===sh && normS(x.name)===normS(name) && x.status!=="CANCELLED"))
      return { v:"DUP", reason:"이미 등록된 건" };
    const hit=conflictAny(b.rooms[0].id, date, sh, eh);
    if(hit) return { v:"ERR", reason:`슬롯 충돌 — 기존 ${hit.id}` };
    const people=parseInt(String(g("인원")).replace(/\D/g,""),10)||b.baseP;
    const extra=Math.max(0, people-b.baseP);
    const amtRaw=parseInt(String(g("금액")).replace(/\D/g,""),10);
    const chRaw=(g("채널")||"naver").toLowerCase();
    return { v:"OK", draft:{ b, date, sh, eh, slot, name,
      phone:g("연락처")||"", extra,
      amount: amtRaw>0? amtRaw : roomPrice(b, b.rooms[0], slot, Math.min(eh-sh,5), extra, date),
      channel: chRaw.includes("space")||chRaw.includes("스클")? "spacecloud":"naver",
      key: b.id+"|"+dk+"|"+sh+"|"+normS(name) } };
  }
  function dryRunBatch(id){
    const bt=batches.find(x=>x.id===id);
    if(!bt || bt.state!=="STAGED") return { ok:false, reason:"스테이징 상태에서만 검증합니다" };
    const seen=new Set();
    const verdicts=bt.rows.map((row,i)=>{
      const d=draftRow(bt, row);
      if(d.v==="OK"){
        if(seen.has(d.draft.key)) return { i, v:"DUP", reason:"파일 안 중복 행" };
        seen.add(d.draft.key);
      }
      return { i, v:d.v, reason:d.reason||"", name:d.draft? `${d.draft.b.name} ${fmtD(d.draft.date)} ${d.draft.sh}시 · ${d.draft.name}`:"" };
    });
    const okN=verdicts.filter(x=>x.v==="OK").length;
    bt.report={ at:new Date(), okN,
      dupN:verdicts.filter(x=>x.v==="DUP").length,
      errN:verdicts.filter(x=>x.v==="ERR").length, verdicts };
    bt.up=Date.now();
    logAudit("데이터", bt.id, `드라이런 — 신규 ${okN} · 중복 ${bt.report.dupN} · 오류 ${bt.report.errN} (반영 전 미리보기 8.2③)`);
    return { ok:true, report:bt.report };
  }
  function applyBatch(id){
    const bt=batches.find(x=>x.id===id);
    if(!bt || bt.state!=="STAGED") return { ok:false, reason:"이미 처리된 배치입니다" };
    if(!bt.report) return { ok:false, reason:"드라이런(검증) 없이 반영할 수 없습니다 (8.2③→④)" };
    const who=_by();
    let okN=0;
    bt.report.verdicts.forEach(v=>{
      if(v.v!=="OK") {
        if(v.v==="ERR") addRecon({kind:"반입 오류", note:`${bt.id} ${v.i+1}행 — ${v.reason}`, src:"엑셀 반입"});
        return;
      }
      const d=draftRow(bt, bt.rows[v.i]);
      if(d.v!=="OK"){ addRecon({kind:"반입 오류", note:`${bt.id} ${v.i+1}행 — ${d.reason} (반영 시점 재검증)`, src:"엑셀 반입"}); return; }
      const {b,date,sh,eh,slot,name,phone,extra,amount,channel}=d.draft;
      const nr={ id:"R"+(400000+Math.floor(Math.random()*99999)),
        branchId:b.id, roomId:b.rooms[0].id, roomName:b.rooms[0].name,
        name, phone, createdAt:new Date(), useDate:date, sh, eh, slot,
        base:b.baseP, extra, amount, channel, pay:"channel", channelNo:"",
        status:"CONFIRMED", deposit:"-", memo:"", intIssue:"", ownIssue:"", options:"",
        checkin:false, refund:null, amountDue:0, memos:[],
        audit:[{at:new Date(), who, act:`엑셀 반입 (${bt.id})`}],
        batchId:bt.id };
      nr.quote=makeQuote(b, b.rooms[0], slot, eh-sh, extra, date, amount);
      reservations.unshift(nr);
      if(SP.persist) SP.persist.addRes(nr.id);
      bt.appliedIds.push(nr.id);
      okN++;
    });
    bt.state="APPLIED"; bt.up=Date.now();
    occInvalidate();
    logEvent("BatchApplied", bt.id, `엑셀 반입 승인 — ${okN}건 등록 · 중복 ${bt.report.dupN} · 오류 ${bt.report.errN}`);
    logAudit("데이터", bt.id, `승인 반영 ${okN}건 — 묶음 단위 롤백 가능 (8.2④)`);
    runTriggers();
    return { ok:true, okN };
  }
  function rollbackBatch(id){
    const bt=batches.find(x=>x.id===id);
    if(!bt || bt.state!=="APPLIED") return { ok:false, reason:"반영된 배치만 되돌릴 수 있습니다" };
    let undone=0, skipped=0;
    bt.appliedIds.forEach(rid=>{
      const r=reservations.find(x=>x.id===rid);
      if(!r){ skipped++; return; }
      if(r.status!=="CONFIRMED" || ledgerOf(rid).length || incidentsOf(rid).length){ skipped++; return; }
      const tr=setStatus(r,"CANCELLED",{act:`반입 롤백 (${bt.id})`});
      if(tr.ok){ r.cancelReason={tag:"기타", note:`엑셀 반입 롤백 — ${bt.id}`}; undone++; }
      else skipped++;
    });
    bt.state="ROLLED"; bt.up=Date.now();
    logEvent("BatchRolledBack", bt.id, `${undone}건 취소 전환 · ${skipped}건 제외(변경 이력 있음)`);
    logAudit("데이터", bt.id, `롤백 — ${undone}건 (기록은 취소로 보존, 삭제 없음)`);
    return { ok:true, undone, skipped };
  }
  function buildExport(opt){
    opt=opt||{};
    const mask=opt.mask!==false;
    if(!mask && !opt.master) return { ok:false, reason:"마스킹 해제 반출은 마스터만 가능합니다 (8.2⑤ · 9.7)" };
    if(!mask && !(opt.reason||"").trim()) return { ok:false, reason:"원본 반출은 목적(사유) 기록이 필수입니다" };
    const from=addDays(TODAY, -(opt.days||30));
    const rows=reservations.filter(r=>r.useDate>=from)
      .sort((a,b)=>b.useDate-a.useDate)
      .map(r=>[r.id, branchById[r.branchId].name, fmtD(r.useDate),
        r.sh+":00", r.eh+":00", R.STATUS[r.status].label, r.name,
        mask? R.maskPhone(r.phone): r.phone, (r.base+r.extra)+"명",
        r.amount, R.CHANNELS[r.channel]? R.CHANNELS[r.channel].label:r.channel].join(","));
    const meta=`${rows.length}건 · 최근 ${opt.days||30}일 · ${mask?"연락처 마스킹":"원본 — "+opt.reason.trim()}`;
    logAudit("데이터","반출",meta+" (감사 로그 8.2⑤)");
    logEvent("DataExported","",meta);
    return { ok:true, name:`쏘플_예약반출_${fmtD(TODAY)}${mask?"":"_원본"}.csv`,
      text:"\uFEFF예약번호,지점,이용일,시작,종료,상태,예약자,연락처,인원,금액,채널\n"+rows.join("\n")+"\n" };
  }

  /* ── 처리 대기함 — 흩어진 할 일을 담당자 큐로 (6.3 P1) ── */
  const taskAssign={};
  function assignTask(key, who){
    taskAssign[key]={ who, at:Date.now() };
    logAudit("대기함", key, "담당 지정 — "+who);
  }
  function taskQueue(){
    const q=[];
    reconQueue.filter(x=>x.state==="OPEN").forEach(x=>q.push({
      key:"recon:"+x.id, type:x.kind.startsWith("긴급")?"긴급":"대사",
      label:`[${x.kind}]`, detail:x.note, at:x.at, refId:x.refId,
      sev:x.kind.startsWith("긴급")?2:1, recon:x }));
    incidents.forEach(ic=>{
      if(ic.state==="DISPUTED") q.push({ key:"ic:"+ic.id, type:"분쟁", sev:2,
        label:"이의 검토 (3영업일)", detail:`[${ic.kind}] ${ic.amount.toLocaleString("ko-KR")}원 — 환급·차감 보류 중`,
        at:ic.disputedAt||ic.at, refId:ic.resId, go:"dispute" });
      else if(ic.state==="PROPOSED" && NOW>ic.disputeUntil) q.push({ key:"ic:"+ic.id, type:"분쟁", sev:1,
        label:"차감 확정 대기 (이의 기간 경과)", detail:`[${ic.kind}] ${ic.amount.toLocaleString("ko-KR")}원`,
        at:ic.disputeUntil, refId:ic.resId, go:"dispute" });
    });
    pendingChanges.forEach((p,i)=>q.push({ key:"pc:"+(p.id||i), type:"콘텐츠", sev:1,
      label:"호스트 수정 승인", detail:`${branchById[p.branchId]?branchById[p.branchId].name:""} — ${p.kind}${p.over?" · 2영업일 초과":""}`,
      at:p.at||NOW, sev:p.over?2:1, go:"spaces" }));
    inquiries.filter(i2=>i2.state!=="완료" && (NOW-i2.at)/36e5>24).forEach(i2=>q.push({
      key:"iq:"+i2.id, type:"CS", sev:1, label:"문의 SLA 초과",
      detail:`${i2.subject} — ${Math.floor((NOW-i2.at)/36e5)}시간 경과`, at:i2.at, go:"members" }));
    reviews.filter(v=>v.state==="신고").forEach(v=>q.push({
      key:"rv:"+v.id, type:"콘텐츠", sev:1, label:"리뷰 신고 검토",
      detail:`${branchById[v.branchId].name} ★${v.rating} — ${v.text.slice(0,20)}`, at:v.at, go:"members" }));
    orders.filter(o=>o.state==="지연").forEach(o=>q.push({
      key:"od:"+o.id, type:"제휴", sev:1, label:"제휴 이행 지연",
      detail:`${o.pkgName} · ${branchById[o.branchId].name}`, at:o.at, go:"partner" }));
    Object.keys(payHold).filter(k=>payHold[k]).forEach(bid=>q.push({
      key:"acct:"+bid, type:"긴급", sev:2, label:"정산 계좌 변경 검증",
      detail:`${branchById[bid]?branchById[bid].name:bid} — 지급 1회 보류 · 본인 재확인`, at:NOW, go:"settle" }));
    q.sort((a,b)=> b.sev-a.sev || a.at-b.at);
    return q;
  }

  /* ── 이상 탐지 (6.3 P1) — 임계값은 settings.anomaly ── */
  function anomalies(){
    const A=settings.anomaly, out=[];
    const between=(r,f,t)=>r.useDate>=f && r.useDate<t;
    const okSt=["CONFIRMED","COMPLETED"];
    const w0=addDays(TODAY,1), w7=addDays(TODAY,-7), w14=addDays(TODAY,-14), w28=addDays(TODAY,-28);
    const cur=reservations.filter(r=>okSt.includes(r.status)&&between(r,w7,w0)).length;
    const prev=reservations.filter(r=>okSt.includes(r.status)&&between(r,w14,w7)).length;
    if(prev>=20 && cur < prev*(1-A.resDrop/100))
      out.push({ sev:2, kind:"예약 급감",
        detail:`최근 7일 ${cur}건 — 직전 7일 ${prev}건 대비 ${Math.round((1-cur/prev)*100)}%↓ (임계 ${A.resDrop}%)` });
    branches.forEach(b=>{
      const ns=(f,t)=>reservations.filter(r=>r.branchId===b.id&&r.status==="NO_SHOW"&&between(r,f,t)).length;
      const c=ns(w14,w0), p2=ns(w28,w14);
      if(c>=3 && c >= Math.max(1,p2)*A.noshowX)
        out.push({ sev:2, kind:"노쇼 급증", branchId:b.id,
          detail:`${b.name} — 최근 14일 ${c}건 (직전 ${p2}건, 임계 ×${A.noshowX})` });
    });
    const pubAll=reviews.filter(v=>v.state==="게시");
    branches.forEach(b=>{
      const rs=pubAll.filter(v=>v.branchId===b.id);
      const recent=rs.filter(v=>v.at>=w14);
      if(rs.length>=4 && recent.length>=3){
        const avgAll=rs.reduce((a,v)=>a+v.rating,0)/rs.length;
        const avgR=recent.reduce((a,v)=>a+v.rating,0)/recent.length;
        if(avgAll-avgR>=A.revDrop)
          out.push({ sev:1, kind:"리뷰 급락", branchId:b.id,
            detail:`${b.name} — 최근 ★${avgR.toFixed(1)} (평소 ★${avgAll.toFixed(1)}, 임계 −${A.revDrop})` });
      }
    });
    const mk=d=>`${d.getFullYear()}-${d.getMonth()}`;
    const cm=mk(TODAY), pmD=new Date(TODAY.getFullYear(),TODAY.getMonth()-1,1), pm=mk(pmD);
    branches.forEach(b=>{
      const sum=key=>reservations.filter(r=>r.branchId===b.id&&r.status==="COMPLETED"&&mk(r.useDate)===key)
        .reduce((a,r)=>a+r.amount,0);
      const c=sum(cm), p2=sum(pm);
      const dayFrac=TODAY.getDate()/new Date(TODAY.getFullYear(),TODAY.getMonth()+1,0).getDate();
      if(p2>=500000 && dayFrac>0.5 && c < p2*dayFrac*(1-A.settleDrop/100))
        out.push({ sev:1, kind:"정산 이상치", branchId:b.id,
          detail:`${b.name} — 이번 달 ${Math.round(c/10000)}만 (지난달 ${Math.round(p2/10000)}만 · 진도 대비 ${A.settleDrop}%↓)` });
    });
    return out.slice(0,6);
  }


  /* ═══════ 5단계 — 지점 건강도(8.3) · 창업 파이프라인 · 북극성(11장) ═══════ */
  function branchHealth(){
    const from=addDays(TODAY,-28), to=addDays(TODAY,1);
    const pub=reviews.filter(v=>v.state==="게시");
    return branches.map(b=>{
      const rs=reservations.filter(r=>r.branchId===b.id && r.useDate>=from && r.useDate<to);
      const done=rs.filter(r=>r.status==="COMPLETED").length;
      const occ=Math.min(1, done/(28*2));
      const rv=pub.filter(v=>v.branchId===b.id);
      const rAvg=rv.length? rv.reduce((a,v)=>a+v.rating,0)/rv.length : 3.8;
      const ph={};
      reservations.forEach(r=>{ if(r.branchId===b.id&&r.status==="COMPLETED"&&r.phone)
        ph[r.phone]=(ph[r.phone]||0)+1; });
      const cust=Object.values(ph);
      const re=cust.length? cust.filter(c=>c>=2).length/cust.length : 0;
      const claims=incidents.filter(i=>i.branchId===b.id&&i.state==="CONFIRMED").length
                 + rs.filter(r=>r.status==="NO_SHOW").length*0.5;
      const clean=Math.max(0, 1-claims*0.25);
      const score=Math.round(occ*40 + (rAvg/5)*30 + re*15 + clean*15);
      return { b, score, occ, rAvg, re, claims, done };
    }).sort((a,c)=>a.score-c.score);
  }

  /* 북극성 — 월 무사고 완료 슬롯 (입실 실패 · 중대 분쟁 건 제외) */
  function northStar(){
    const mk=`${TODAY.getFullYear()}-${TODAY.getMonth()}`;
    const inM=r=>`${r.useDate.getFullYear()}-${r.useDate.getMonth()}`===mk;
    const doneM=reservations.filter(r=>r.status==="COMPLETED"&&inM(r));
    const clean=doneM.filter(r=>!incidents.some(i=>i.resId===r.id&&i.state==="CONFIRMED")).length;
    const cap=branches.length*2*TODAY.getDate();
    return { clean, done:doneM.length, cap, rate:cap? clean/cap:0 };
  }

  /* 창업 문의 파이프라인 (franchise_leads) */
  const FR_STAGES=["접수","상담","실사","계약"];
  const leads=[
    { id:"F001", at:addDays(TODAY,-2),  name:"신희상", phone:"010-3141-5926", region:"경기", memo:"과천 문원동 228-2 자가 건물 — 워크샵하우스 콘셉트 제안 중", stage:"상담", up:0 },
    { id:"F002", at:addDays(TODAY,-5),  name:"박경호", phone:"010-2718-2818", region:"부산", memo:"서면 상가 2층 40평 · 예산 8천", stage:"접수", up:0 },
    { id:"F003", at:addDays(TODAY,-9),  name:"이수민", phone:"010-1414-2135", region:"서울", memo:"홍대 인근 · 기존 스터디카페 전환 검토", stage:"상담", up:0 },
    { id:"F004", at:addDays(TODAY,-14), name:"정태윤", phone:"010-1732-0508", region:"대전", memo:"둔산동 · 실사 일정 조율", stage:"실사", up:0 },
    { id:"F005", at:addDays(TODAY,-21), name:"최은지", phone:"010-2236-0679", region:"서울", memo:"강동 · 조건 협의 마무리", stage:"계약", up:0 },
    { id:"F006", at:addDays(TODAY,-1),  name:"한도현", phone:"010-1123-5813", region:"인천", memo:"송도 · 자료 요청", stage:"접수", up:0 },
    { id:"F007", at:addDays(TODAY,-11), name:"오세라", phone:"010-3162-2777", region:"경기", memo:"수원 인계동 3호점 관심", stage:"상담", up:0 }
  ];
  function frAdd(o){
    if(!o.name||!o.phone) return { ok:false, reason:"이름과 연락처는 필수입니다" };
    const L={ id:"F"+String(100+leads.length+1), at:new Date(), name:o.name, phone:o.phone,
      region:o.region||"", memo:o.memo||"", stage:"접수", up:Date.now() };
    leads.unshift(L);
    logEvent("FranchiseLeadAdded","",`${L.name} · ${L.region||"지역 미정"}`);
    logAudit("창업", L.id, "문의 접수 — "+L.name);
    return { ok:true, lead:L };
  }
  function frAdvance(id){
    const L=leads.find(x=>x.id===id); if(!L) return { ok:false };
    const i=FR_STAGES.indexOf(L.stage);
    if(i>=FR_STAGES.length-1) return { ok:false, reason:"이미 계약 단계입니다" };
    L.stage=FR_STAGES[i+1]; L.up=Date.now();
    logEvent("FranchiseLeadAdvanced","",`${L.name} → ${L.stage}`);
    logAudit("창업", L.id, "단계 이동 — "+L.stage);
    return { ok:true, stage:L.stage };
  }
  /* 수익 시뮬레이터 — 실거래 90일 기반 (8.3 데이터 자산화) */
  function frSim(region){
    const bs=branches.filter(b=>!region||b.region===region);
    const from=addDays(TODAY,-90);
    const per=bs.map(b=>{
      const rs=reservations.filter(r=>r.branchId===b.id&&r.status==="COMPLETED"&&r.useDate>=from);
      return { name:b.shortName||b.name,
        mon: rs.reduce((a,r)=>a+r.amount,0)/3,
        occ: Math.min(1, rs.length/(90*2)) };
    }).sort((a,c)=>c.mon-a.mon);
    const n=per.length||1;
    return { region: region||"전국", n:per.length,
      avgMon: per.reduce((a,x)=>a+x.mon,0)/n,
      topMon: per.length? per[0].mon:0, topName: per.length? per[0].name:"",
      occAvg: per.reduce((a,x)=>a+x.occ,0)/n };
  }

  /* ── 회원 인덱스 — 예약 원장에서 파생 (별도 저장 없음) ── */
  function gradeOf(doneCnt){
    const c=settings.point;
    if(doneCnt>=c.vipCount)  return { key:"VIP",  label:"VIP",   rate:c.vipRate };
    if(doneCnt>=c.plusCount) return { key:"PLUS", label:"플러스", rate:c.plusRate };
    return { key:"BASIC", label:"베이직", rate:c.rate };
  }
  function memberIndex(){
    const map={};
    reservations.forEach(r=>{
      if(!r.phone) return;
      const k=String(r.phone).replace(/\D/g,""); if(k.length<9) return;
      const m=(map[k] ||= { phone:r.phone, name:r.name, resCnt:0, doneCnt:0,
        noshowCnt:0, cxlCnt:0, sales:0, first:r.useDate, last:r.useDate });
      m.resCnt++; m.name=r.name;
      if(r.status==="COMPLETED"){ m.doneCnt++; m.sales+=r.amount; }
      if(r.status==="NO_SHOW") m.noshowCnt++;
      if(r.status==="CANCELLED") m.cxlCnt++;
      if(r.useDate<m.first) m.first=r.useDate;
      if(r.useDate>m.last)  m.last=r.useDate;
    });
    return Object.values(map);
  }

  return { NOW, TODAY, wdIdx, WD_LABEL, SITE,
